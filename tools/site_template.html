<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>肥羊的聖誕禮物 · 裝備圖鑑</title>
<style>
/* ============================================================ tokens */
:root{
  --bg:#0a0c11; --bg-2:#0e1118; --surface:#141822; --surface-2:#1a1f2b;
  --line:#242a38; --line-2:#2f3646;
  --ink:#e8ebf2; --ink-2:#9aa3b8; --ink-3:#646d82;
  --accent:#ffb648; --accent-ink:#1a1205;
  --mat:#57d98a;      /* recipe material   */
  --into:#ffb648;     /* builds into       */
  --r:10px; --r-sm:7px;
  --shadow:0 18px 50px -12px rgba(0,0,0,.7);
  --tile:104px; --icon:56px;
  --dur:.16s; --ease:cubic-bezier(.22,.7,.3,1);
}
[data-density="compact"]{ --tile:82px; --icon:44px; }
[data-density="dense"]{ --tile:52px; --icon:44px; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.55 "Inter","Noto Sans TC","Microsoft JhengHei",-apple-system,
       BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body::before{ /* subtle depth so the dark ground isn't flat */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 18% -8%, rgba(88,116,255,.10), transparent 60%),
    radial-gradient(700px 420px at 88% 0%, rgba(255,140,60,.07), transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262d3c;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#333c4f}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ============================================================ shell */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:16px;padding:0 16px;height:56px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,24,34,.92),rgba(14,17,24,.92));
  backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--ink-3)}
.brand .sv{
  font:11px/1 ui-monospace,monospace;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:3px 8px;letter-spacing:.02em;
}

.search{position:relative;flex:1;max-width:420px}
.search input{
  width:100%;height:34px;padding:0 32px 0 34px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  transition:border-color var(--dur),background var(--dur);
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--line-2);background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search kbd{
  position:absolute;right:9px;top:8px;font:11px/18px ui-monospace,monospace;
  color:var(--ink-3);background:#1c212c;border:1px solid var(--line);
  border-radius:5px;padding:0 6px;pointer-events:none;
}
.search input:not(:placeholder-shown)~kbd{display:none}

.spacer{flex:1}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{
  padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--ink-2);
  transition:color var(--dur),background var(--dur);
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.tb-label{font-size:11px;color:var(--ink-3);margin-right:-8px}
.pick{
  height:34px;padding:0 30px 0 11px;border-radius:9px;appearance:none;
  background:var(--surface) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%238b93a7' stroke-width='1.6'/%3E%3C/svg%3E") no-repeat right 9px center/12px;
  border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;cursor:pointer;
  transition:border-color var(--dur),color var(--dur),background-color var(--dur);
}
.pick:hover{border-color:var(--line-2);color:var(--ink)}
.pick.on{border-color:var(--accent);color:var(--accent);background-color:var(--surface-2)}
.pick option{background:var(--surface);color:var(--ink)}

/* ============================================================ body */
.body{flex:1;display:flex;min-height:0}

/* -------- rail */
.rail{
  width:206px;flex:0 0 auto;border-right:1px solid var(--line);
  overflow-y:auto;padding:12px 8px 40px;background:var(--bg-2);
}
.rail h3{
  margin:14px 8px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.rail h3:first-child{margin-top:2px}
.tier{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;
  color:var(--ink-2);font-size:13px;text-align:left;
  transition:background var(--dur),color var(--dur);
}
.tier:hover{background:var(--surface);color:var(--ink)}
.tier[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.tier .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--ink-3);
  box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.tier .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier .ct{font:11px/1 ui-monospace,monospace;color:var(--ink-3)}
.tier[aria-pressed="true"] .ct{color:var(--ink-2)}

/* 取得管道分類：可收合，讓「拿不到的東西」不佔視覺份量 */
.cat{margin-top:10px}
.cat:first-of-type{margin-top:2px}
.cat-h{display:flex;align-items:center;gap:2px;width:100%}
.cat-t{
  flex:0 0 auto;width:20px;height:24px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-3);font-size:9px;transition:color var(--dur),background var(--dur),transform var(--dur);
}
.cat-t:hover{background:var(--surface);color:var(--ink)}
.cat[data-open="0"] .cat-t{transform:rotate(-90deg)}
.cat-n{
  flex:1;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:left;transition:color var(--dur),background var(--dur);
}
.cat-n:hover{background:var(--surface);color:var(--ink-2)}
.cat-n[aria-pressed="true"]{color:var(--accent)}
.cat-n .c{margin-left:auto;font:10px/1 ui-monospace,monospace;letter-spacing:0;
  text-transform:none;opacity:.8}
.cat-b{padding-left:12px}
.cat[data-open="0"] .cat-b{display:none}
.cat[data-dim="1"] .cat-n{opacity:.6}

.legend{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.9}
.meta{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);line-height:1.8}
.meta .ver{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:5px;padding:2px 8px;
  border-radius:99px;background:var(--surface);border:1px solid var(--line-2);
  color:var(--ink-2);font:11px/1.6 ui-monospace,monospace;
}
.meta .ver::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mat)}
.meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;
  vertical-align:-1px}

/* -------- grid */
.main{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth;padding:0 0 80px}
@media (prefers-reduced-motion:reduce){ .main{scroll-behavior:auto} }

.sec-head{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:14px 20px 9px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(10,12,17,0));
}
.sec-head h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.02em}
.sec-head .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-head .n{font:11px/1 ui-monospace,monospace;color:var(--ink-3)}
.sec-head .seq-tag{
  font-size:10.5px;color:var(--ink-3);padding:2px 7px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);white-space:nowrap;
}

.grid{display:grid;gap:8px;padding:2px 20px 16px;
  grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr))}

.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 6px 9px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);
  transition:transform var(--dur) var(--ease),border-color var(--dur),
             background var(--dur),opacity var(--dur),box-shadow var(--dur);
}
.tile:hover{transform:translateY(-2px);background:var(--surface-2);border-color:var(--line-2);z-index:2}
.tile .thumb{
  position:relative;width:var(--icon);height:var(--icon);border-radius:var(--r-sm);
  overflow:hidden;flex:0 0 auto;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c,#39415a);
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3);
  font:11px/1 ui-monospace,monospace}
.tile .lbl{
  font-size:11.5px;line-height:1.35;text-align:center;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
[data-density="dense"] .tile{padding:6px}
[data-density="dense"] .tile .lbl{display:none}
[data-density="compact"] .tile{padding:8px 5px 7px;gap:6px}
[data-density="compact"] .tile .lbl{font-size:11px}

/* 套裝件加一層底色。每組用遊戲裡該套裝自己的名稱顏色（由 builder 算出），
   所以五組各有固定色相，掃過去就認得出是哪一組。
   稀有度走的是圖示外框那圈光，底色走套裝 —— 兩個訊號分屬不同位置，不會打架，
   所以底色可以拉到看得清楚的濃度，再補一圈同色邊框讓輪廓自己跳出來。 */
.tile[data-set]{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc,var(--c)) 40%,transparent),
      color-mix(in srgb,var(--sc,var(--c)) 12%,transparent) 80%),
    var(--surface);
  border-color:color-mix(in srgb,var(--sc,var(--c)) 55%,var(--line));
}
.tile[data-set] .lbl{color:var(--ink)}
.tile[data-set]:hover{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc,var(--c)) 52%,transparent),
      color-mix(in srgb,var(--sc,var(--c)) 18%,transparent) 80%),
    var(--surface-2);
  border-color:color-mix(in srgb,var(--sc,var(--c)) 72%,var(--line));
}
/* 三位一體同時屬於三個套裝，底色就給三段，一眼看出它跟別人不一樣 */
.tile[data-multi],.tile[data-multi]:hover{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc) 46%,transparent),
      color-mix(in srgb,var(--sc2,var(--sc)) 36%,transparent) 48%,
      color-mix(in srgb,var(--sc3,var(--sc)) 26%,transparent)),
    var(--surface);
}
/* 左上角一道小三角，純圖模式下沒有名稱時也認得出來 */
.tile[data-set]::before{
  content:"";position:absolute;left:0;top:0;width:0;height:0;
  border-top:13px solid var(--sc,var(--c));border-right:13px solid transparent;
  border-top-left-radius:var(--r);
}

/* selection + relationship states */
.tile[data-sel="1"]{
  background:var(--surface-2);border-color:var(--c,var(--accent));
  box-shadow:0 0 0 1px var(--c,var(--accent)),0 10px 30px -10px var(--c,var(--accent));
  transform:translateY(-2px);
}
.tile[data-sel="1"] .lbl{color:var(--ink)}
.tile[data-rel="mat"]{border-color:var(--mat);box-shadow:0 0 0 1px rgba(87,217,138,.5)}
.tile[data-rel="into"]{border-color:var(--into);box-shadow:0 0 0 1px rgba(255,182,72,.45)}
.tile[data-rel] .lbl{color:var(--ink)}
.tile .flag{
  position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  display:grid;place-items:center;font:9px/1 ui-monospace,monospace;color:#06170d;
  border:2px solid var(--surface);
}
.tile[data-rel="mat"] .flag{background:var(--mat)}
.tile[data-rel="into"] .flag{background:var(--into);color:var(--accent-ink)}

/* dimming: keeps layout memory, drops noise */
.grid[data-focus="1"] .tile:not([data-sel]):not([data-rel]){opacity:.34;filter:saturate(.62)}
.grid[data-focus="1"] .tile:not([data-sel]):not([data-rel]):hover{opacity:.85;filter:none}

/* ---- 排行檢視：數值是主角，所以改成橫列＋長度條 ---- */
.rank{display:flex;flex-direction:column;gap:3px;padding:2px 20px 16px}
.rrow{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:7px 14px 7px 10px;border-radius:10px;text-align:left;
  background:var(--surface);border:1px solid transparent;overflow:hidden;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
/* 長度條：統一顏色。長度是唯一的比較變數，
   若讓長條也帶稀有度顏色，色相變化會干擾長度判讀。
   稀有度改由圖示外框與品質文字承載。 */
.rrow::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);
  background:linear-gradient(90deg,rgba(255,182,72,.16),rgba(255,182,72,.05));
  transition:width .45s var(--ease);
}
/* 右端一條實線，給眼睛一個清楚的比較邊緣 */
.rrow::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);
  border-right:2px solid var(--c,var(--accent));opacity:.85;
  transition:width .45s var(--ease);
}
.rrow.neg::before{background:linear-gradient(90deg,rgba(255,90,90,.16),rgba(255,90,90,.04))}
.rrow.neg::after{border-right-color:#ff6b6b}
.rrow:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateX(2px)}
.rrow[data-sel="1"]{border-color:var(--c,var(--accent));
  box-shadow:0 0 0 1px var(--c,var(--accent))}
.rrow > *{position:relative}
.rrow .no{
  width:26px;flex:0 0 auto;text-align:right;
  font:11.5px/1 ui-monospace,monospace;color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.rrow.top .no{color:var(--accent);font-weight:600}
.rrow .ic{width:34px;height:34px;border-radius:7px;flex:0 0 auto;overflow:hidden;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c,#39415a)}
.rrow .ic img{width:100%;height:100%;object-fit:cover;display:block}
.rrow .ic .ph{width:100%;height:100%;display:grid;place-items:center;
  font:9px/1 ui-monospace,monospace;color:var(--ink-3)}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{display:block;font-size:13px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rrow .nm span{font-size:11px;color:var(--c,var(--ink-3));opacity:.85}
.rrow .val{
  flex:0 0 auto;font:600 16px/1 ui-monospace,monospace;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.rrow.neg .val{color:#ff8f8f}
/* 前三名用顏色加重就好。放大字級會讓右側數字欄對不齊，
   反而破壞「一眼掃過去比大小」的能力。 */
.rrow.top .val{color:var(--accent)}
.rrow .unit{font-size:11px;color:var(--ink-3);margin-left:3px;font-weight:400}

.rank-head{
  display:flex;align-items:baseline;gap:10px;padding:14px 20px 10px;
  position:sticky;top:0;z-index:3;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(10,12,17,0));
}
.rank-head h2{margin:0;font-size:15px;font-weight:600}
.rank-head .sub{font-size:11.5px;color:var(--ink-3)}
.rank-head .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rank-note{padding:0 20px 12px;font-size:11.5px;color:var(--ink-3);line-height:1.6}

.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:6px;font-weight:500}

/* -------- panel */
.panel{
  position:relative;flex:0 0 auto;min-width:0;overflow:hidden;
  background:var(--bg-2);box-shadow:var(--shadow);
  width:0;border-left:0 solid var(--line);
  transition:width .22s var(--ease),border-left-width .22s var(--ease);
}
.panel[data-open="1"]{width:var(--pw,420px);border-left-width:1px}
/* 拖曳時要即時跟手，不能有過渡 */
.panel[data-drag="1"]{transition:none}
.panel[data-open="0"] .handle{opacity:0;pointer-events:none}

/* 內層固定寬度：外層收合時內容不會被擠壓變形，
   只是被裁切掉，看起來就像整片滑出去 */
.p-inner{
  width:var(--pw,420px);flex:0 0 auto;height:100%;
  display:flex;flex-direction:column;min-height:0;
  opacity:0;transform:translateX(18px);
  transition:opacity .2s var(--ease) .04s,transform .26s var(--ease) .04s;
}
.panel[data-open="1"] .p-inner{opacity:1;transform:none}
.panel[data-drag="1"] .p-inner{transition:none}

/* 換一件裝備時內容輕輕淡入，避免瞬間抽換 */
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel[data-swap="1"] .p-head,
.panel[data-swap="1"] .p-body{animation:swapIn .22s var(--ease) both}
.handle{
  position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:6;
  display:flex;align-items:center;justify-content:center;
}
.handle::before{content:"";width:2px;height:34px;border-radius:2px;background:var(--line-2);
  transition:background var(--dur),height var(--dur)}
.handle:hover::before,.handle[data-drag="1"]::before{background:var(--accent);height:64px}
body[data-resizing="1"]{cursor:col-resize;user-select:none}

.p-head{position:relative;padding:18px 18px 14px;border-bottom:1px solid var(--line);overflow:hidden}
.p-head::before{
  content:"";position:absolute;inset:-40% -20% auto;height:190px;pointer-events:none;
  background:radial-gradient(closest-side,var(--c,#5b6ee1),transparent 72%);opacity:.16;
}
.p-close{
  position:absolute;top:10px;right:10px;z-index:3;width:32px;height:32px;border-radius:9px;
  color:var(--ink-3);display:grid;place-items:center;font-size:15px;line-height:1;
  transition:background var(--dur),color var(--dur),transform var(--dur);
}
.p-close:hover{background:var(--surface-2);color:var(--ink);transform:rotate(90deg)}
.p-close:active{transform:rotate(90deg) scale(.92)}
.p-id{position:absolute;top:18px;right:50px;z-index:3;pointer-events:none;
  font:10.5px/1 ui-monospace,monospace;color:var(--ink-3)}

.p-top{position:relative;display:flex;gap:14px;align-items:flex-start}
.p-icon{width:76px;height:76px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:#0c0f15;
  box-shadow:0 0 0 2px var(--c,#39415a),0 12px 26px -10px var(--c,#000)}
.p-icon img{width:100%;height:100%;object-fit:cover;display:block}
.p-icon .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:11px}
.p-name{min-width:0;flex:1;padding:2px 44px 0 0}
.p-name h1{margin:0 0 3px;font-size:19px;line-height:1.3;font-weight:600;word-break:break-word}
.p-name .alt{font-size:12px;color:var(--ink-3);line-height:1.5;word-break:break-word}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  flex:0 0 auto;width:max-content;max-width:100%;
}
.chip code{font:11px/1 ui-monospace,monospace;opacity:.75}
.chip.tier{color:var(--c,var(--ink));border-color:color-mix(in srgb,var(--c,#39415a) 45%,transparent)}
/* 套裝加成：一組一段，左邊一條該套裝的色帶，件數做成圓標好掃 */
.sb{border-left:2px solid var(--sc);padding-left:10px;margin-top:12px}
.sb:first-of-type{margin-top:2px}
.sb-h{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.sb-h b{color:var(--sc);font-size:12.5px}
.sb-h code{font:10.5px/1 ui-monospace,monospace;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.sb-h .only{font-size:10.5px;color:var(--ink-3)}
.sb-r{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:12px;line-height:1.55}
.sb-r .n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;
  display:grid;place-items:center;font:10.5px/1 ui-monospace,monospace;color:var(--sc);
  background:color-mix(in srgb,var(--sc) 16%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 34%,transparent) inset}
.sb-r .x{color:var(--ink-2)}
.sb-r .q{font-size:10px;color:#e0a340;margin-left:5px;white-space:nowrap;
  border:1px solid rgba(224,163,64,.4);border-radius:4px;padding:0 4px}
.chip.set{
  border-color:color-mix(in srgb,var(--sc,#4b3a6b) 55%,transparent);
  color:var(--sc,#c4a6ff);
  background:color-mix(in srgb,var(--sc,#4b3a6b) 14%,var(--surface));
  cursor:pointer;
}
.chip.set:hover{background:color-mix(in srgb,var(--sc,#4b3a6b) 26%,var(--surface))}
.chip.shop{border-color:#3c5340;color:#8fd6a3}

.p-body{flex:1;overflow-y:auto;padding:16px 18px 40px;min-height:0}
.sect{margin-bottom:20px}
.sect:last-child{margin-bottom:0}
.sect > h4{
  margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.stats{
  display:flex;flex-wrap:wrap;gap:5px;
}
.stat{
  padding:4px 9px;border-radius:7px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);
}
.stat b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.eff{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.eff:first-of-type{border-top:0;padding-top:0}
.eff .tag{
  flex:0 0 auto;margin-top:1px;padding:2px 7px;border-radius:6px;font-size:10.5px;
  background:#1e2432;color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
}
.eff .txt{font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-line}
.eff .txt em{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}

.rel{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.rel button{
  display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);text-align:left;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.rel button:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateX(2px)}
.rel button.cur{border-color:var(--c2,var(--accent));box-shadow:0 0 0 1px var(--c2,var(--accent))}
.rel img,.rel .ph{width:34px;height:34px;border-radius:7px;flex:0 0 auto;object-fit:cover;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a)}
.rel .ph{display:grid;place-items:center;font-size:10px;color:var(--ink-3)}
.rel .t{min-width:0;flex:1}
.rel .t b{display:block;font-size:12.5px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rel .t span{font-size:11px;color:var(--ink-3)}
.rel .arrow{color:var(--ink-3);font-size:12px;flex:0 0 auto}

/* 順序條：用「一排會走動的圖示」表達序列，
   比兩行「上一件／下一件」更能讓人看出這是個連續的環 */
.seq{display:flex;align-items:flex-end;gap:6px;margin-top:2px}
.seq button{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 3px;border-radius:9px;border:1px solid transparent;background:none;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.seq button:hover{background:var(--surface);border-color:var(--line-2);transform:translateY(-2px)}
.seq .sq-img{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:0 0 auto;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a);opacity:.55;
  transition:opacity var(--dur),transform var(--dur)}
.seq button:hover .sq-img{opacity:1}
.seq .sq-img img{width:100%;height:100%;object-fit:cover;display:block}
.seq .sq-img .ph{width:100%;height:100%;display:grid;place-items:center;
  font:8px/1 ui-monospace,monospace;color:var(--ink-3)}
.seq .sq-n{font-size:10px;line-height:1.3;color:var(--ink-3);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
/* 目前這一件放大、全亮，其餘退到背景 */
.seq .cur .sq-img{width:46px;height:46px;opacity:1;
  box-shadow:0 0 0 2px var(--c2,var(--accent)),0 8px 20px -8px var(--c2,var(--accent))}
.seq .cur .sq-n{color:var(--ink);font-weight:600}
.seq .arw{flex:0 0 auto;color:var(--ink-3);font-size:11px;padding-bottom:18px}

.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.pool button{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
  border-radius:9px;border:1px solid var(--line);background:var(--surface);
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.pool button:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateY(-2px)}
.pool button.cur{border-color:var(--c2,var(--accent));
  box-shadow:0 0 0 1px var(--c2,var(--accent))}
.pool .sq-img{width:36px;height:36px;border-radius:7px;overflow:hidden;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a)}
.pool .sq-img img{width:100%;height:100%;object-fit:cover;display:block}
.pool .sq-img .ph{width:100%;height:100%;display:grid;place-items:center;
  font:8px/1 ui-monospace,monospace;color:var(--ink-3)}
.pool .sq-n{font-size:10.5px;line-height:1.3;text-align:center;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.pool button.cur .sq-n{color:var(--ink);font-weight:600}

.seq-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.seq-head .pos{font:11px/1 ui-monospace,monospace;color:var(--ink-2)}
.seq-head .pos b{color:var(--accent)}

.note{font-size:11.5px;color:var(--ink-3);line-height:1.7}

/* -------- toast / hint */
.hint{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:99px;
  background:rgba(20,24,34,.94);border:1px solid var(--line);backdrop-filter:blur(8px);
  font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);
  transition:opacity .4s,transform .4s;
}
.hint[hidden]{display:none}
.hint.gone{opacity:0;transform:translate(-50%,8px)}
.hint kbd{font:11px/16px ui-monospace,monospace;background:#1c212c;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--ink)}

/* -------- tooltip */
.tip{
  position:fixed;z-index:30;pointer-events:none;padding:6px 10px;border-radius:8px;
  background:rgba(12,15,21,.97);border:1px solid var(--line-2);box-shadow:var(--shadow);
  font-size:12px;max-width:250px;opacity:0;transition:opacity .12s;
}
.tip[data-on="1"]{opacity:1}
.tip b{display:block;font-weight:600;color:var(--ink)}
.tip span{color:var(--ink-3);font-size:11px}

/* -------- responsive */
@media (max-width:1100px){ .rail{width:172px} }
@media (max-width:860px){
  .rail{display:none}
  .panel{position:fixed;right:0;top:56px;bottom:0;z-index:15;width:0}
  .panel[data-open="1"]{width:min(92vw,var(--pw,420px))}
  .p-inner{width:min(92vw,var(--pw,420px))}
  .handle{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body data-density="comfortable">
<div class="app">

  <header class="topbar">
    <div class="brand">
      <b data-i="title">裝備圖鑑</b>
      <span class="sv" id="sv"></span>
      <span data-i="sub">肥羊的聖誕禮物 · Underground Defence</span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋裝備…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="spacer"></div>

    <span class="tb-label" data-i="rankL">排行</span>
    <select class="pick" id="rank"></select>

    <span class="tb-label" data-i="density">密度</span>
    <div class="seg" id="density">
      <button data-v="comfortable" aria-pressed="true" data-i="d1">寬鬆</button>
      <button data-v="compact" aria-pressed="false" data-i="d2">緊湊</button>
      <button data-v="dense" aria-pressed="false" data-i="d3">純圖</button>
    </div>

    <div class="seg" id="lang">
      <button data-v="zh" aria-pressed="true">中文</button>
      <button data-v="en" aria-pressed="false">EN</button>
      <button data-v="ru" aria-pressed="false">РУ</button>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="tiers"></nav>
    <main class="main" id="main"></main>

    <aside class="panel" id="panel" data-open="0" aria-live="polite">
      <div class="handle" id="handle" role="separator" aria-orientation="vertical"
           tabindex="0" title="拖曳調整寬度 · 雙擊重設"></div>
      <div class="p-inner" id="pinner">
        <div class="p-head" id="phead"></div>
        <div class="p-body" id="pbody"></div>
      </div>
    </aside>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="hint" id="hint">
  <span data-i="hint">點擊裝備看詳細 · 相關素材會在下方高亮</span>
  <kbd>/</kbd><span data-i="hint2">搜尋</span>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items, GROUPS = DATA.groups;
const IDS = Object.keys(ITEMS);
const LI = {zh:0, en:1, ru:2};

/* ---------------------------------------------------------------- i18n */
const UI = {
  zh:{title:'裝備圖鑑', sub:'肥羊的聖誕禮物 · Underground Defence', ph:'搜尋裝備…',
      density:'密度', d1:'寬鬆', d2:'緊湊', d3:'純圖', all:'全部裝備',
      tiers:'品質分類', legend:'圖例', sel:'已選取', mat:'合成素材', into:'可合成為',
      stats:'屬性', effects:'效果', recipe:'合成配方', usedin:'用於合成',
      alias:'舊表名稱', none:'沒有符合的裝備', tryOther:'換個關鍵字或清除篩選',
      hint:'點擊看詳細，再點一次收合 · 相關素材會在格子中高亮', hint2:'搜尋',
      shopL:'商店', setL:'套裝', setFilter:'只看這組套裝', close:'關閉', results:'搜尋結果',
      dataL:'資料', dateL:'擷取日', cntL:'道具', icoL:'圖示', verUnknown:'版本未知',
      siteL:'網站', builtL:'建置日', bySeq:'依循環順序',
      rankL:'排行', rankOff:'不排行（瀏覽）', rankBy:'依 %s 排行',
      rankNote:'只計算固定加成；「對英雄傷害」這類條件加成不列入比較',
      cycL:'扭曲循環', cycNote:'再用一次扭曲卷軸就會變成右邊那件，走完 29 件回到起點',
      ritL:'儀式循環', ritNote:'再轉一次就會變成右邊那件，走完 11 件回到起點',
      refL:'折射循環', refNote:'第一次由聖物隨機轉出，之後每用一次折射卷軸就往右走一件，4 件循環',
      fromRelic:'來源聖物', toPerfect:'完美階',
      legionNote:'從名單中帶幾件，就生效到第幾階',
      setB:'套裝加成', pcs:'%s 件', unsure:'待確認',
      setSrc:'加成數值取自遊戲內 -c1 ~ -c5，非地圖資料',
      chainL:'任務升級鏈', chainSplit:'聖物之後分兩條路：',
      qs1:'任務物品 1 階', qs2:'任務物品 2 階', qs3:'聖物',
      qs4:'折射卷軸 → 折射（4 件循環）', qs5:'鐵匠技能 → 完美'},
  en:{title:'Item Codex', sub:"Fat Sheep's Christmas Gift · Underground Defence",
      ph:'Search items…', density:'Density', d1:'Roomy', d2:'Compact', d3:'Icons',
      all:'All items', tiers:'Tiers', legend:'Legend', sel:'Selected',
      mat:'Component', into:'Builds into', stats:'Bonuses', effects:'Effects',
      recipe:'Recipe', usedin:'Used in', alias:'Old sheet name',
      none:'No items match', tryOther:'Try another keyword or clear the filter',
      hint:'Click for details, click again to close · related pieces light up',
      hint2:'search', shopL:'Shop', setL:'Set', setFilter:'Show only this set', close:'Close', results:'Results',
      dataL:'Data', dateL:'Extracted', cntL:'Items', icoL:'Icons', verUnknown:'version unknown',
      siteL:'Site', builtL:'Built', bySeq:'in cycle order',
      rankL:'Rank', rankOff:'Off (browse)', rankBy:'Ranked by %s',
      rankNote:'Flat bonuses only; conditional ones like "damage vs heroes" are excluded',
      cycL:'Distortion cycle', cycNote:'Another Scroll of Distortion turns it into the next one; 29 steps loop back',
      ritL:'Ritual cycle', ritNote:'Rerolling steps to the next one; 11 items loop back to the start',
      refL:'Refraction cycle', refNote:'The relic rolls a random one first; each further scroll steps to the next, looping through 4',
      fromRelic:'From relic', toPerfect:'Perfected',
      legionNote:'Bonuses unlock by how many listed items you carry',
      setB:'Set bonuses', pcs:'%s pcs', unsure:'unverified',
      setSrc:'Bonus values transcribed from -c1 ~ -c5 in game, not from map data',
      chainL:'Quest upgrade chain', chainSplit:'The relic branches two ways:',
      qs1:'Quest item, stage 1', qs2:'Quest item, stage 2', qs3:'Relic',
      qs4:'Scroll of Refraction → Refracted (4-item cycle)',
      qs5:'Blacksmith skill → Perfected'},
  ru:{title:'Кодекс предметов', sub:'Underground Defence', ph:'Поиск предметов…',
      density:'Плотность', d1:'Свободно', d2:'Плотно', d3:'Иконки',
      all:'Все предметы', tiers:'Классы', legend:'Легенда', sel:'Выбрано',
      mat:'Компонент', into:'Входит в', stats:'Бонусы', effects:'Эффекты',
      recipe:'Рецепт', usedin:'Используется в', alias:'Старое название',
      none:'Ничего не найдено', tryOther:'Измените запрос или сбросьте фильтр',
      hint:'Нажмите для деталей, ещё раз — закрыть · связанное подсветится',
      hint2:'поиск', shopL:'Магазин', setL:'Комплект', close:'Закрыть',
      setFilter:'Только этот комплект', results:'Результаты', dataL:'Данные', dateL:'Выгрузка', cntL:'Предметов',
      icoL:'Иконок', verUnknown:'версия неизвестна',
      siteL:'Сайт', builtL:'Сборка', bySeq:'по циклу',
      rankL:'Рейтинг', rankOff:'Выкл. (обзор)', rankBy:'Рейтинг по: %s',
      rankNote:'Только фиксированные бонусы; условные не участвуют',
      cycL:'Цикл искажения', cycNote:'Ещё один свиток искажения даёт следующий предмет; 29 шагов по кругу',
      ritL:'Ритуальный цикл', ritNote:'Следующий бросок даёт следующий предмет; цикл из 11',
      refL:'Цикл преломления', refNote:'Реликвия даёт случайный первый; далее каждый свиток — следующий по кругу из 4',
      fromRelic:'Реликвия', toPerfect:'Совершенный',
      legionNote:'Бонусы открываются по числу предметов из списка',
      setB:'Бонусы комплекта', pcs:'%s пр.', unsure:'не уточнено',
      setSrc:'Значения переписаны из -c1 ~ -c5 в игре, не из данных карты',
      chainL:'Цепочка квеста', chainSplit:'От реликвии два пути:',
      qs1:'Квестовый, 1 этап', qs2:'Квестовый, 2 этап', qs3:'Реликвия',
      qs4:'Свиток преломления → Преломленный (цикл из 4)',
      qs5:'Навык кузнеца → Совершенный'}
};

/* ---------------------------------------------------------------- state */
const S = {
  lang: localStorage.getItem('ud.lang') || 'zh',
  density: localStorage.getItem('ud.density') || 'comfortable',
  width: +(localStorage.getItem('ud.pw') || 420),
  tier: null,        // null = all
  cat: null,         // 取得管道分類
  set: null,         // 套裝（c1~c4）
  fold: JSON.parse(localStorage.getItem('ud.fold') || '{}'),
  q: '',
  sel: null,
  rank: localStorage.getItem('ud.rank') || '',   // '' = 不排行
};
const STATS = DATA.stats || [];
const STAT = k => STATS.find(s => s.k === k);
const t = k => UI[S.lang][k];
const li = () => LI[S.lang];
const nm = id => ITEMS[id].n[li()] || ITEMS[id].n[0];
const grpName = g => GROUPS[g][S.lang];

/* search index: all three languages + id */
const HAY = {};
for (const id of IDS){
  const it = ITEMS[id];
  HAY[id] = (it.n.join(' ') + ' ' + id + ' ' + (it.a||'') + ' ' +
             (it.s? it.s.join(' '):'') + ' ' +
             it.e.map(e=>e.t.join(' ')).join(' ')).toLowerCase();
}

/* ---------------------------------------------------------------- dom */
const $ = s => document.querySelector(s);
const main = $('#main'), rail = $('#rail'), panel = $('#panel');
const phead = $('#phead'), pbody = $('#pbody'), tip = $('#tip');
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* highlight numbers so values pop without extra chrome */
const num = s => esc(s).replace(/([+-]?\d[\d.,]*%?)/g, '<em>$1</em>');

const thumb = (id, cls) => {
  const it = ITEMS[id];
  return it.img
    ? `<img src="${it.img}" alt="" loading="lazy" decoding="async">`
    : `<div class="ph">${id}</div>`;
};

/* ---------------------------------------------------------------- render: rail */
function renderRail(){
  /* counts follow the search so the rail doubles as a result breakdown */
  const q = S.q.trim().toLowerCase();
  const counts = {}; let total = 0;
  for (const id of IDS){
    if (q && !HAY[id].includes(q)) continue;
    counts[ITEMS[id].g] = (counts[ITEMS[id].g]||0)+1; total++;
  }
  let h = `<h3>${esc(t('tiers'))}</h3>`;
  h += `<button class="tier" data-g="" aria-pressed="${S.tier===null && S.cat===null}">
          <i class="dot" style="background:#7a8398"></i>
          <span class="nm">${esc(t('all'))}</span>
          <span class="ct">${total}</span></button>`;
  if (S.set){
    const n = IDS.filter(i => setKeysOf(ITEMS[i]).includes(S.set)).length;
    h += `<button class="tier" data-g="" aria-pressed="true" style="margin-top:4px">
            <i class="dot" style="background:var(--accent)"></i>
            <span class="nm">${esc(t('setL'))} -${S.set}</span>
            <span class="ct">${n}</span></button>`;
  }
  (DATA.cats || []).forEach((cat, ci) => {
    const inCat = cat.g.filter(g => counts[g]);
    if (!inCat.length) return;
    const n = inCat.reduce((a, g) => a + counts[g], 0);
    const open = S.fold[ci] !== undefined ? S.fold[ci] : !cat.fold;
    h += `<div class="cat" data-open="${open ? 1 : 0}" data-dim="${cat.fold ? 1 : 0}" data-c="${ci}">
        <div class="cat-h">
          <button class="cat-t" data-tog="${ci}" aria-label="toggle">▼</button>
          <button class="cat-n" data-cat="${ci}" aria-pressed="${S.cat===ci}">
            ${esc(cat[S.lang] || cat.zh)}<span class="c">${n}</span>
          </button>
        </div>
        <div class="cat-b">`;
    inCat.forEach(g => {
      h += `<button class="tier" data-g="${g}" aria-pressed="${S.tier===g}">
              <i class="dot" style="background:${tierColour(g)}"></i>
              <span class="nm">${esc(GROUPS[g][S.lang])}</span>
              <span class="ct">${counts[g]}</span></button>`;
    });
    h += `</div></div>`;
  });
  h += `<h3>${esc(t('legend'))}</h3>
    <div class="legend">
      <div><i style="background:var(--accent)"></i>${esc(t('sel'))}</div>
      <div><i style="background:var(--mat)"></i>${esc(t('mat'))}</div>
      <div><i style="background:var(--into)"></i>${esc(t('into'))}</div>
    </div>`;
  const M = DATA.meta || {};
  h += `<h3>${esc(t('dataL'))}</h3>
    <div class="meta">
      <span class="ver">${esc(M.mapVersion || t('verUnknown'))}</span>
      <dl>
        <dt>${esc(t('siteL'))}</dt><dd>${esc(M.siteVersion || '—')}</dd>
        <dt>${esc(t('builtL'))}</dt><dd>${esc(M.builtAt || '—')}</dd>
        <dt>${esc(t('dateL'))}</dt><dd>${esc(M.dataDate || '—')}</dd>
        <dt>${esc(t('cntL'))}</dt><dd>${M.items ?? IDS.length}</dd>
        <dt>${esc(t('icoL'))}</dt><dd>${M.icons ?? ''}</dd>
      </dl>
    </div>`;
  rail.innerHTML = h;
}
/* a tier's colour = the colour the map itself gives its items */
const TC = {};
function tierColour(g){
  if (TC[g]) return TC[g];
  const tally = {};
  for (const id of IDS) if (ITEMS[id].g === g && ITEMS[id].k)
    tally[ITEMS[id].k] = (tally[ITEMS[id].k]||0)+1;
  const best = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return TC[g] = best ? best[0] : '#7a8398';
}

/* ---------------------------------------------------------------- render: grid */
function visible(){
  const q = S.q.trim().toLowerCase();
  return IDS.filter(id => {
    if (S.tier !== null && ITEMS[id].g !== S.tier) return false;
    if (S.cat !== null && !DATA.cats[S.cat].g.includes(ITEMS[id].g)) return false;
    if (S.set && !setKeysOf(ITEMS[id]).includes(S.set)) return false;
    if (q && !HAY[id].includes(q)) return false;
    return true;
  });
}

/* 扭曲・儀式・折射本身就是有序的序列，
   照名字排會讓相鄰的裝備跳來跳去，反而看不出順序。
   這裡建一份「循環順序」索引，這三類就照序列排。 */
const SEQORD = (() => {
  const o = {};
  (DATA.cycle || []).forEach((id, n) => { o[id] = n; });
  (DATA.ritual || []).forEach((id, n) => { o[id] = n; });
  (DATA.refract || []).forEach((chain, gi) => {
    (chain[3] || []).forEach((id, n) => { o[id] = gi * 100 + n; });
  });
  return o;
})();
/* 這些分類整組都有順序，標題要標示出來，否則會被誤認成沒排序 */
const SEQ_GROUPS = new Set();
for (const id in SEQORD) if (ITEMS[id]) SEQ_GROUPS.add(ITEMS[id].g);

const LEGION = DATA.legion || {items: [], colour: '#D9455C'};
const SETS = Object.assign({}, DATA.sets || {});
if (DATA.legion) SETS.c5 = {n: [LEGION.zh, LEGION.en, LEGION.ru],
                            c: LEGION.colour, items: LEGION.items,
                            b: LEGION.b || [], only: LEGION.only};
/* 一件裝備可能同時屬於好幾個套裝 —— 三位一體就同時算英勇＋深淵＋風暴。
   c1~c4 寫在道具說明裡（builder 解析成 sk），c5 是另外給的名單。 */
const setKeysOf = it => (it.sk || []).concat(it.legion != null ? ['c5'] : []);
const setColour = k => (SETS[k] || {}).c || '#8b93a7';
const setName = k => ((SETS[k] || {}).n || [])[li()] || k;

const tileHTML = id => {
  const it = ITEMS[id];
  const ks = setKeysOf(it);
  const tint = ks.length
    ? `;--sc:${setColour(ks[0])}` + (ks.length > 1
        ? `;--sc2:${setColour(ks[1])};--sc3:${setColour(ks[2] || ks[1])}` : '')
    : '';
  return `<button class="tile" data-id="${id}"${
      ks.length ? ` data-set="${ks[0]}"${ks.length > 1 ? ' data-multi="1"' : ''}` : ''}
      style="--c:${it.k||'#39415a'}${tint}">
            <span class="thumb">${thumb(id)}</span>
            <span class="lbl">${esc(nm(id))}</span>
            <span class="flag"></span>
          </button>`;
};

/* 排行檢視：數值變成主角，所以換成橫列 + 長度條，
   而不是只把格子重新排序 —— 網格看不出「差多少」。 */
function renderRank(ids){
  const k = S.rank, meta = STAT(k);
  const rows = ids.filter(i => ITEMS[i].v && ITEMS[i].v[k] != null)
                  .map(i => [i, ITEMS[i].v[k]])
                  .sort((a, b) => b[1] - a[1]);
  if (!rows.length){
    main.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('tryOther'))}</div>`;
    return;
  }
  const max = Math.max(...rows.map(r => Math.abs(r[1]))) || 1;
  const unit = meta.pct ? '%' : '';
  const label = meta[S.lang] || meta.zh;
  let h = `<div class="rank-head">
      <h2>${esc(t('rankBy').replace('%s', label))}</h2>
      <span class="bar"></span>
      <span class="sub">${rows.length}</span>
    </div>
    <div class="rank-note">${esc(t('rankNote'))}</div><div class="rank">`;
  rows.forEach(([id, v], n) => {
    const it = ITEMS[id];
    const w = Math.max(2, Math.abs(v) / max * 100);
    const cls = (v < 0 ? ' neg' : '') + (n < 3 && v > 0 ? ' top' : '');
    h += `<button class="rrow${cls}" data-id="${id}"
            style="--c:${it.k || '#5b6ee1'};--w:${w.toFixed(1)}%">
            <span class="no">${n + 1}</span>
            <span class="ic">${thumb(id)}</span>
            <span class="nm"><b>${esc(nm(id))}</b><span>${esc(it.c[li()])}</span></span>
            <span class="val">${v > 0 ? '+' : ''}${(+v.toFixed(2))}<span class="unit">${unit}</span></span>
          </button>`;
  });
  main.innerHTML = h + '</div>';
  paintRelations();
}

function renderGrid(){
  const ids = visible();
  if (S.rank && STAT(S.rank)){ renderRank(ids); return; }
  if (!ids.length){
    main.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('tryOther'))}</div>`;
    return;
  }
  /* While searching, sections would leave one tile per header and force a lot of
     scrolling for very few hits - so results collapse into one flat, dense grid.
     The tier is still readable from each tile's border colour and the rail counts. */
  if (S.q.trim()){
    ids.sort((a,b)=> ITEMS[a].g - ITEMS[b].g ||
      nm(a).localeCompare(nm(b), S.lang==='ru'?'ru':undefined));
    main.innerHTML = `<section class="sec">
        <div class="sec-head"><h2>${esc(t('results'))}</h2>
          <span class="bar"></span><span class="n">${ids.length}</span></div>
        <div class="grid">${ids.map(tileHTML).join('')}</div></section>`;
    paintRelations();
    return;
  }
  const by = new Map();
  for (const id of ids){ const g = ITEMS[id].g; (by.get(g) || by.set(g,[]).get(g)).push(id); }
  const order = [...by.keys()].sort((a,b)=>a-b);
  let h = '';
  for (const g of order){
    const list = by.get(g);
    list.sort((a, b) => {
      const oa = SEQORD[a], ob = SEQORD[b];
      if (oa != null && ob != null) return oa - ob;   // 兩個都有順序 -> 照順序
      if (oa != null) return -1;                      // 有順序的排前面
      if (ob != null) return 1;
      return nm(a).localeCompare(nm(b), S.lang === 'ru' ? 'ru' : undefined);
    });
    const seqTag = SEQ_GROUPS.has(g)
      ? `<span class="seq-tag">${esc(t('bySeq'))}</span>` : '';
    h += `<section class="sec" data-g="${g}">
            <div class="sec-head">
              <h2 style="color:${tierColour(g)}">${esc(grpName(g))}</h2>
              ${seqTag}
              <span class="bar"></span><span class="n">${list.length}</span>
            </div>
            <div class="grid">`;
    h += list.map(tileHTML).join('');
    h += `</div></section>`;
  }
  main.innerHTML = h;
  paintRelations();
}

/* relationship highlighting is what turns the grid into a crafting graph */
function paintRelations(){
  const sel = S.sel;
  const onScreen = !!(sel && main.querySelector(`.tile[data-id="${sel}"]`));
  const mats = sel ? new Set(ITEMS[sel].r) : null;
  const into = sel ? new Set(ITEMS[sel].u) : null;
  /* dimming is only meaningful when the anchor of the spotlight is visible */
  main.querySelectorAll('.grid').forEach(g =>
    g.setAttribute('data-focus', onScreen ? '1' : '0'));
  main.querySelectorAll('.rrow').forEach(el => {
    el.removeAttribute('data-sel');
    if (sel && el.dataset.id === sel) el.setAttribute('data-sel', '1');
  });
  main.querySelectorAll('.tile').forEach(el => {
    const id = el.dataset.id;
    el.removeAttribute('data-sel'); el.removeAttribute('data-rel');
    const f = el.querySelector('.flag'); f.textContent = '';
    if (!sel) return;
    if (id === sel) el.setAttribute('data-sel','1');
    else if (mats.has(id)){ el.setAttribute('data-rel','mat'); f.textContent='＋'; }
    else if (into.has(id)){ el.setAttribute('data-rel','into'); f.textContent='↑'; }
  });
}

/* 從面板點別的裝備時，那件很可能被目前的篩選擋在畫面外 ——
   面板開了、格子卻找不到，看起來就像壞掉。
   這時把擋住它的條件放掉，並把側欄鎖到它自己的分類。
   已經看得到的就完全不動篩選：使用者辛苦選的條件不該被無聲改掉。 */
function reveal(id){
  if (S.rank) return false;                                   // 排行是另一種檢視，不介入
  if (main.querySelector(`.tile[data-id="${id}"]`)) return false;
  const it = ITEMS[id];
  if (S.q && !HAY[id].includes(S.q.trim().toLowerCase())){
    S.q = '';
    const box = $('#q'); if (box) box.value = '';
  }
  if (S.set && !setKeysOf(it).includes(S.set)) S.set = null;
  S.tier = it.g; S.cat = null;
  /* 節日類與其他預設收合，落在裡面的話要先展開才看得到 */
  const ci = (DATA.cats || []).findIndex(c => c.g.includes(it.g));
  if (ci >= 0){
    S.fold[ci] = true;
    localStorage.setItem('ud.fold', JSON.stringify(S.fold));
  }
  renderRail(); renderGrid();
  return true;
}

/* ---------------------------------------------------------------- render: panel */
function openItem(id, scroll){
  S.sel = id;
  const it = ITEMS[id], L = li();
  document.documentElement.style.setProperty('--c', it.k || '#5b6ee1');

  const alt = [0,1,2].filter(i => i !== L).map(i => it.n[i]).join(' · ');
  phead.style.setProperty('--c', it.k || '#5b6ee1');
  phead.innerHTML = `
    <span class="p-id">${id}</span>
    <button class="p-close" id="pclose" title="${esc(t('close'))}" aria-label="${esc(t('close'))}">✕</button>
    <div class="p-top">
      <div class="p-icon" style="--c:${it.k||'#39415a'}">${thumb(id)}</div>
      <div class="p-name">
        <h1>${esc(nm(id))}</h1>
        <div class="alt">${esc(alt)}</div>
      </div>
    </div>
    <div class="chips">
      <span class="chip tier" style="--c:${it.k||'#8b93a7'}">${esc(it.c[L])}</span>
      ${setKeysOf(it).map(k => `<button class="chip set" data-setf="${k}"
            style="--sc:${setColour(k)}" title="${esc(t('setFilter'))}">${
            esc(t('setL'))} · ${esc(setName(k))} <code>-${k}</code></button>`).join('')}
      ${it.shop ? `<span class="chip shop">${esc(it.shop[L])}</span>`:''}
      ${it.a && S.lang==='zh' ? `<span class="chip">${esc(t('alias'))}：${esc(it.a)}</span>`:''}
    </div>`;

  let b = '';
  if (it.s && it.s[L]){
    const meta = S.rank ? STAT(S.rank) : null;
    const mine = meta && it.v ? it.v[S.rank] : null;
    b += `<div class="sect"><h4>${esc(t('stats'))}</h4><div class="stats">${
      it.s[L].split(/[，,]\s*/).filter(Boolean)
        .map(x => `<span class="stat">${num(x)}</span>`).join('')}</div>` +
      (mine != null
        ? `<div class="note" style="margin-top:8px">${
            esc(t('rankBy').replace('%s', meta[S.lang] || meta.zh))}：<b style="color:var(--accent)">#${
            rankOf(it.id)}</b> / ${rankTotal()}</div>`
        : '') + `</div>`;
  }
  if (it.e.length) b += `<div class="sect"><h4>${esc(t('effects'))}</h4>${
    it.e.map(e => `<div class="eff"><span class="tag">${esc(e.l[L])}</span>
      <span class="txt">${num(e.t[L])}</span></div>`).join('')}</div>`;
  b += setBonusBlock(it);
  if (it.legion != null) b += legionBlock(it);
  if (it.cyc != null) b += cycleBlock(it, DATA.cycle, 'cycL', 'cycNote');
  if (it.rit != null) b += cycleBlock(it, DATA.ritual, 'ritL', 'ritNote', 'rit');
  if (it.ref) b += refractBlock(it);
  if (it.chain) b += chainBlock(it);
  if (it.r.length) b += relBlock(t('recipe'), it.r, '＋');
  if (it.u.length) b += relBlock(t('usedin'), it.u, '↑');
  pbody.innerHTML = b || `<div class="note">—</div>`;
  pbody.scrollTop = 0;

  const wasClosed = panel.dataset.open !== '1';
  panel.dataset.open = '1';
  /* 已經開著時換裝備 -> 內容淡入；第一次開啟 -> 整片滑入就夠了 */
  if (!wasClosed){
    panel.dataset.swap = '0';
    void panel.offsetWidth;          // 強制重繪，讓動畫可以重播
    panel.dataset.swap = '1';
  }
  $('#pclose').onclick = closeItem;
  const moved = reveal(id);
  paintRelations();
  const el = main.querySelector(`.tile[data-id="${id}"]`);
  if (el && (scroll || wasClosed || moved)){
    const r = el.getBoundingClientRect(), m = main.getBoundingClientRect();
    if (scroll || moved || r.top < m.top + 8 || r.bottom > m.bottom - 8)
      el.scrollIntoView({block:'center', behavior:'smooth'});
  }
  history.replaceState(null,'','#'+id);
}

function rankedIds(){
  return IDS.filter(i => ITEMS[i].v && ITEMS[i].v[S.rank] != null)
            .sort((a, b) => ITEMS[b].v[S.rank] - ITEMS[a].v[S.rank]);
}
const rankOf = id => rankedIds().indexOf(id) + 1;
const rankTotal = () => rankedIds().length;

/* 扭曲：固定 29 件循環。顯示前後各兩件，目前這件放大置中，
   一眼就能回答「再轉一次會變成什麼」。 */
function cycleBlock(it, list, labelKey, noteKey, field){
  const C = list || [], L = C.length, at = field ? it[field] : it.cyc;
  const slot = n => {
    const id = C[((at + n) % L + L) % L];
    const cur = n === 0;
    return `<button data-goto="${id}" class="${cur ? 'cur' : ''}"
              style="--c2:${ITEMS[id].k || '#39415a'}" title="${esc(nm(id))}">
              <span class="sq-img">${thumb(id)}</span>
              <span class="sq-n">${esc(nm(id))}</span>
            </button>`;
  };
  return `<div class="sect">
      <div class="seq-head">
        <h4 style="margin:0">${esc(t(labelKey))}</h4>
        <span class="pos"><b>${at + 1}</b> / ${L}</span>
      </div>
      <div class="seq">
        ${L <= 6
          ? C.map((_, n) => slot(n - at)).join('<span class="arw">▶</span>')
          : `${slot(-2)}${slot(-1)}<span class="arw">▶</span>${slot(0)}<span class="arw">▶</span>${slot(1)}${slot(2)}`}
      </div>
      <div class="note" style="margin-top:8px">${esc(t(noteKey))}</div>
    </div>`;
}

/* 折射：跟扭曲同一套機制 —— 第一次由聖物隨機轉出，
   之後每次用折射卷軸都往下一件走，4 件走完回到起點。
   只有 4 件，所以整圈直接攤開比「前後各兩件」清楚。 */
function refractBlock(it){
  const R = it.ref, G = R.group;
  const one = (id, n) => `<button data-goto="${id}" class="${id === it.id ? 'cur' : ''}"
        style="--c2:${ITEMS[id].k || '#39415a'}" title="${esc(nm(id))}">
        <span class="sq-img">${thumb(id)}</span>
        <span class="sq-n">${esc(nm(id))}</span></button>`;
  const seq = G.map((id, n) => one(id, n))
               .join('<span class="arw">▶</span>');
  let h = `<div class="sect">
      <div class="seq-head"><h4 style="margin:0">${esc(t('refL'))}</h4>
        <span class="pos"><b>${R.n + 1}</b> / ${G.length}　↺</span></div>
      <div class="seq">${seq}</div>
      <div class="note" style="margin-top:8px">${esc(t('refNote'))}</div>`;
  const extra = [];
  if (ITEMS[R.relic]) extra.push([t('fromRelic'), R.relic, '↑']);
  if (extra.length){
    h += `<div class="rel" style="margin-top:8px">` + extra.map(([lab, id, ar]) =>
      `<button data-goto="${id}" style="--c2:${ITEMS[id].k || '#39415a'}">
         ${thumb(id)}
         <span class="t"><b>${esc(nm(id))}</b><span>${esc(lab)}</span></span>
         <span class="arrow">${ar}</span>
       </button>`).join('') + `</div>`;
  }
  return h + `</div>`;
}

/* 任務線。分岔點在「聖物」：
     任務物品1階 → 任務物品2階 → 聖物 ─┬─ 折射卷軸 → 折射（4 件循環）
                                       └─ 鐵匠技能 → 完美                     */
/* 套裝加成。這些數值地圖的物件資料裡完全沒有（效果寫在觸發腳本，匯不出來），
   是玩家在遊戲內輸入 -c1 ~ -c5 抄回來的，來源見 tools/set_bonus.json。
   一件裝備可能同時屬於好幾組（三位一體就屬於三組），所以一組列一段。 */
function setBonusBlock(it){
  const ks = setKeysOf(it).filter(k => ((SETS[k] || {}).b || []).length);
  if (!ks.length) return '';
  const L = li();
  return `<div class="sect"><h4>${esc(t('setB'))}</h4>` + ks.map(k => {
    const G = SETS[k], only = G.only ? (G.only[S.lang] || G.only.zh) : '';
    return `<div class="sb" style="--sc:${G.c}">
      <div class="sb-h"><b>${esc(G.n[L])}</b><code>-${k}</code>${
        only ? `<span class="only">${esc(only)}</span>` : ''}</div>
      ${G.b.map(r => `<div class="sb-r"><span class="n">${r.n}</span><span class="x">${
        num(r[S.lang] || r.zh)}${
        r.q ? `<span class="q">${esc(t('unsure'))}</span>` : ''}</span></div>`).join('')}
    </div>`;
  }).join('') + `<div class="note" style="margin-top:8px">${esc(t('setSrc'))}</div></div>`;
}

/* -c5「軍團遺產」。成員橫跨扭曲／折射／神器，湊齊條件是一份指定清單，
   所以直接把整份清單列出來 —— 使用者要的是「還差哪幾件」。 */
function legionBlock(it){
  const L = LEGION, LN = S.lang;
  const rows = L.items.map(id => ITEMS[id] ? `
    <button data-goto="${id}" class="${id === it.id ? 'cur' : ''}"
            style="--c2:${id === it.id ? L.colour : (ITEMS[id].k || '#39415a')}">
      ${thumb(id)}
      <span class="t"><b>${esc(nm(id))}</b><span>${esc(ITEMS[id].c[li()])}</span></span>
      <span class="arrow">${id === it.id ? '●' : ''}</span>
    </button>` : '').join('');
  return `<div class="sect">
      <div class="seq-head">
        <h4 style="margin:0;color:${L.colour}">${esc(L[LN] || L.zh)}</h4>
        <span class="pos"><b>${it.legion + 1}</b> / ${L.items.length}　<code>-${L.key}</code></span>
      </div>
      <div class="rel">${rows}</div>
      <div class="note" style="margin-top:8px">
        ＋ ${esc((L.anyOf && (L.anyOf[LN] || L.anyOf.zh)) || '')}<br>${esc(t('legionNote'))}
      </div>
    </div>`;
}

function chainBlock(it){
  const C = it.chain;
  const row = (id, lab, arrow) => ITEMS[id] ? `
    <button data-goto="${id}" style="--c2:${ITEMS[id].k || '#39415a'}"
            class="${id === it.id ? 'cur' : ''}">
      ${thumb(id)}
      <span class="t"><b>${esc(nm(id))}</b><span>${esc(lab)}</span></span>
      <span class="arrow">${arrow}</span>
    </button>` : '';
  return `<div class="sect">
      <h4>${esc(t('chainL'))}</h4>
      <div class="rel">
        ${row(C.q1, t('qs1'), '1')}
        ${row(C.q2, t('qs2'), '2')}
        ${row(C.relic, t('qs3'), '3')}
      </div>
      <div class="note" style="margin:8px 0 6px">${esc(t('chainSplit'))}</div>
      <div class="rel">
        ${row(C.group[0], t('qs4'), '↳')}
        ${row(C.perfect, t('qs5'), '↳')}
      </div>
    </div>`;
}

function relBlock(title, ids, arrow){
  return `<div class="sect"><h4>${esc(title)}</h4><div class="rel">${
    ids.map(x => ITEMS[x] ? `
      <button data-goto="${x}" style="--c2:${ITEMS[x].k||'#39415a'}">
        ${thumb(x)}
        <span class="t"><b>${esc(nm(x))}</b><span>${esc(ITEMS[x].c[li()])}</span></span>
        <span class="arrow">${arrow}</span>
      </button>` : '').join('')}</div></div>`;
}

function closeItem(){
  S.sel = null;
  panel.dataset.open = '0';
  panel.removeAttribute('data-swap');
  paintRelations();
  history.replaceState(null, '', location.pathname + location.search);
}

/* ---------------------------------------------------------------- events */
main.addEventListener('click', e => {
  const tile = e.target.closest('.tile,.rrow');
  if (!tile) return;
  /* toggle: clicking the already-selected tile closes the panel */
  if (tile.dataset.id === S.sel) closeItem();
  else openItem(tile.dataset.id);
});
pbody.addEventListener('click', e => {
  const b = e.target.closest('[data-goto]');
  if (b) openItem(b.dataset.goto, true);
});
phead.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]');
  if (g){ openItem(g.dataset.goto, true); return; }
  const sf = e.target.closest('[data-setf]');
  if (sf){                                   // 只看這組套裝
    S.set = (S.set === sf.dataset.setf) ? null : sf.dataset.setf;
    S.tier = null; S.cat = null;
    renderRail(); renderGrid(); main.scrollTop = 0;
  }
});
rail.addEventListener('click', e => {
  const tog = e.target.closest('[data-tog]');
  if (tog){                                   // 收合／展開，不影響篩選
    const ci = +tog.dataset.tog;
    const cat = DATA.cats[ci];
    const cur = S.fold[ci] !== undefined ? S.fold[ci] : !cat.fold;
    S.fold[ci] = !cur;
    localStorage.setItem('ud.fold', JSON.stringify(S.fold));
    rail.querySelector(`.cat[data-c="${ci}"]`).dataset.open = !cur ? 1 : 0;
    return;
  }
  const cb = e.target.closest('[data-cat]');
  if (cb){                                    // 篩選整個取得管道
    const ci = +cb.dataset.cat;
    S.cat = (S.cat === ci) ? null : ci;
    S.tier = null; S.set = null;
    renderRail(); renderGrid(); main.scrollTop = 0;
    return;
  }
  const b = e.target.closest('.tier');
  if (!b) return;
  const g = b.dataset.g === '' ? null : +b.dataset.g;
  if (g === null){ S.tier = null; S.cat = null; S.set = null; }
  else { S.tier = (S.tier === g) ? null : g; S.cat = null; S.set = null; }
  renderRail(); renderGrid();
  main.scrollTop = 0;
});

const q = $('#q');
let qT = null;
q.addEventListener('input', () => {
  S.q = q.value;
  renderGrid();
  clearTimeout(qT); qT = setTimeout(renderRail, 90);   /* rail is cheap but not free */
});

$('#lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.lang = b.dataset.v; localStorage.setItem('ud.lang', S.lang);
  applyLang(); fillRank(); renderRail(); renderGrid();
  if (S.sel) openItem(S.sel);
});
const rankSel = $('#rank');
function fillRank(){
  rankSel.innerHTML = `<option value="">${esc(t('rankOff'))}</option>` +
    STATS.map(m => `<option value="${m.k}">${esc(m[S.lang] || m.zh)}　(${m.n})</option>`).join('');
  rankSel.value = S.rank;
  rankSel.classList.toggle('on', !!S.rank);
}
rankSel.addEventListener('change', () => {
  S.rank = rankSel.value;
  localStorage.setItem('ud.rank', S.rank);
  rankSel.classList.toggle('on', !!S.rank);
  renderGrid();
  main.scrollTop = 0;
});

$('#density').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.density = b.dataset.v; localStorage.setItem('ud.density', S.density);
  applyDensity();
});

function applyLang(){
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hant' : S.lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  q.placeholder = t('ph');
  const M = DATA.meta || {};
  $('#sv').textContent = M.siteVersion || '';
  $('#sv').hidden = !M.siteVersion;
  document.title = t('title') + (M.siteVersion ? ' ' + M.siteVersion : '')
                 + (M.mapVersion ? ' · ' + M.mapVersion : '') + ' · ' + t('sub');
  $('#lang').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === S.lang)));
}
function applyDensity(){
  document.body.dataset.density = S.density;
  $('#density').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === S.density)));
}

/* -------- resizable panel */
const handle = $('#handle');
const clampW = w => Math.max(320, Math.min(760, w));
function setW(w){
  S.width = clampW(w);
  panel.style.setProperty('--pw', S.width+'px');
  localStorage.setItem('ud.pw', S.width);
}
handle.addEventListener('pointerdown', e => {
  e.preventDefault(); handle.setPointerCapture(e.pointerId);
  handle.dataset.drag = '1'; document.body.dataset.resizing = '1';
  panel.dataset.drag = '1';
  const move = ev => setW(window.innerWidth - ev.clientX);
  const up = () => {
    handle.removeAttribute('data-drag'); document.body.removeAttribute('data-resizing');
    panel.removeAttribute('data-drag');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});
handle.addEventListener('dblclick', () => setW(420));
handle.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { setW(S.width + 24); e.preventDefault(); }
  if (e.key === 'ArrowRight'){ setW(S.width - 24); e.preventDefault(); }
});

/* -------- hover tooltip (only useful when labels are hidden) */
let tipT = null;
main.addEventListener('pointerover', e => {
  const tile = e.target.closest('.tile'); if (!tile) return;
  clearTimeout(tipT);
  tipT = setTimeout(() => {
    const it = ITEMS[tile.dataset.id];
    tip.innerHTML = `<b>${esc(nm(tile.dataset.id))}</b><span>${esc(it.c[li()])}</span>`;
    const r = tile.getBoundingClientRect();
    tip.dataset.on = '1';
    const w = tip.offsetWidth;
    tip.style.left = Math.min(window.innerWidth - w - 10,
                              Math.max(10, r.left + r.width/2 - w/2)) + 'px';
    tip.style.top = (r.top - tip.offsetHeight - 8 < 8
                     ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + 'px';
  }, 260);
});
main.addEventListener('pointerout', () => { clearTimeout(tipT); tip.dataset.on = '0'; });
main.addEventListener('scroll', () => { clearTimeout(tipT); tip.dataset.on = '0'; });

/* -------- keyboard */
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === 'Escape'){
    if (document.activeElement === q && q.value){ q.value=''; S.q=''; renderGrid(); }
    else if (S.sel) closeItem();
    return;
  }
  if (document.activeElement === q) return;
  if (['1','2','3'].includes(e.key)){
    S.lang = ['zh','en','ru'][+e.key-1]; localStorage.setItem('ud.lang',S.lang);
    applyLang(); fillRank(); renderRail(); renderGrid();
    if (S.sel) openItem(S.sel); return;
  }
  if (!S.sel) return;
  const tiles = [...main.querySelectorAll('.tile')];
  const i = tiles.findIndex(x => x.dataset.id === S.sel);
  if (i < 0) return;
  const cols = countCols();
  let j = -1;
  if (e.key === 'ArrowRight') j = i+1;
  if (e.key === 'ArrowLeft')  j = i-1;
  if (e.key === 'ArrowDown')  j = i+cols;
  if (e.key === 'ArrowUp')    j = i-cols;
  if (j >= 0 && j < tiles.length){ e.preventDefault(); openItem(tiles[j].dataset.id, true); }
});
function countCols(){
  const g = main.querySelector('.grid'); if (!g) return 1;
  return getComputedStyle(g).gridTemplateColumns.split(' ').length;
}

/* -------- first-run hint */
const hint = $('#hint');
if (localStorage.getItem('ud.hint')) hint.hidden = true;
else setTimeout(() => {
  hint.classList.add('gone');
  setTimeout(()=>{hint.hidden=true;}, 500);
  localStorage.setItem('ud.hint','1');
}, 7000);

/* ---------------------------------------------------------------- boot */
applyLang(); applyDensity(); setW(S.width); fillRank();
renderRail(); renderGrid();
const start = location.hash.slice(1);
if (start && ITEMS[start]) openItem(start, true);
})();
</script>
</body>
</html>
