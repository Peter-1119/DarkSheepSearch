<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UD 圖鑑 · 英雄定位圖</title>
<style>
/* 沿用主站的深色 token，這頁之後要併回去時不用重調 */
:root{
  color-scheme:dark;
  --bg:#0a0c11; --bg-2:#0e1118; --surface:#141822; --surface-2:#1a1f2b;
  --line:#242a38; --line-2:#2f3646;
  --ink:#e8ebf2; --ink-2:#9aa3b8; --ink-3:#646d82;
  --accent:#ffb648;
  --str:#f2795b; --agi:#57d98a; --int:#54c6ec;   /* 主屬性：只當外環與圖例，不當填色 */
  /* 量的顏色一律單一色相（藍）深→淺，已用 dataviz 驗證器對深色底驗過 */
  --q1:#184f95; --q2:#1c5cab; --q3:#256abf; --q4:#2a78d6; --q5:#3987e5; --q6:#5598e7; --q7:#6da7ec; --q8:#86b6ef;
  --bar:#3987e5;
  --ease:cubic-bezier(.22,.7,.3,1); --dur:.16s;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--ink-2)}

.wrap{max-width:1480px;margin:0 auto;padding:18px 22px 60px}
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:20px;margin:0;letter-spacing:.02em}
header.top .sub{color:var(--ink-2)}
header.top .lang{margin-left:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
header.top .lang button{padding:4px 10px;border:0;background:none;border-radius:6px;color:var(--ink-2)}
header.top .lang button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* -------- 控制列：一列，左邊視角、右邊篩選 */
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.ctrl .lab{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ink-2);font-size:12.5px;
  transition:border-color var(--dur),color var(--dur),background var(--dur)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--accent)}
.chip.attr{padding-left:8px}
.chip.attr i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--sc);vertical-align:-2px;margin-right:6px;background:var(--surface)}
.chip.attr[aria-pressed="false"] i{opacity:.35}
select.ax{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;min-width:150px}
.ax-note{font-size:11.5px;color:var(--ink-3);max-width:300px}
input.q{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;width:160px}
input.q:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}

/* -------- 主體：散點 + 側欄 */
.viz{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1100px){.viz{grid-template-columns:1fr}}
.plot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;position:relative}
.plot h2{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:10px}
.plot h2 .cnt{color:var(--ink-3);font-weight:400;font-size:12px}
.plot h2 .how{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:400}
svg.sc{width:100%;height:auto;display:block;user-select:none}
svg.sc .grid line{stroke:var(--line);stroke-width:1}
svg.sc .mid line{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
svg.sc .axl{fill:var(--ink-2);font-size:12px}
svg.sc .tick{fill:var(--ink-3);font-size:10.5px}
svg.sc .quad{fill:var(--ink-3);font-size:11px;opacity:.85}
svg.sc .tail{stroke:var(--ink-3);stroke-width:1;opacity:.55}
svg.sc .mk{cursor:pointer}
svg.sc .mk circle.ring{fill:var(--surface-2);stroke-width:2.5;transition:r var(--dur),stroke-width var(--dur)}
svg.sc .mk.dim{opacity:.18}
svg.sc .mk.hot circle.ring{stroke-width:3.5}
svg.sc .mk.pin circle.ring{stroke:var(--accent) !important;stroke-width:3.5}
svg.sc .mk image{clip-path:circle(46% at 50% 50%);pointer-events:none}
svg.sc .mk text{fill:var(--ink);font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
svg.sc .hit{fill:transparent}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;
  padding:9px 11px;min-width:200px;max-width:280px;box-shadow:0 12px 40px -10px rgba(0,0,0,.8);font-size:12.5px}
.tip[hidden]{display:none}
.tip b{font-size:13.5px}
.tip .r{color:var(--ink-2)}
.tip table{border-collapse:collapse;margin-top:6px;width:100%}
.tip td{padding:1px 0;color:var(--ink-2)}
.tip td.v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .src{color:var(--ink-3);font-size:11px;margin-top:4px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink-2);padding:6px 4px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--sc);vertical-align:-1px;margin-right:5px;background:var(--surface-2)}
.legend .pin-i{border-color:var(--accent)}
.legend .hint{margin-left:auto;color:var(--ink-3)}

/* -------- 側欄：釘選的英雄輪廓 */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.empty{color:var(--ink-3);text-align:center;padding:26px 14px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card .hd img{width:40px;height:40px;border-radius:9px;border:2px solid var(--sc);object-fit:cover}
.card .hd b{font-size:14px;display:block}
.card .hd .r{color:var(--ink-2);font-size:12px}
.card .hd .x{margin-left:auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--ink-3)}
.card .hd .x:hover{color:var(--ink);border-color:var(--ink-3)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-2)}
.badge.on{color:var(--ink);border-color:var(--ink-3)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.bars .k{color:var(--ink-2);white-space:nowrap}
.bars .k.h{color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;grid-column:1/-1;margin-top:6px;text-transform:uppercase}
.bars .t{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line-2) 70%,transparent);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:4px;background:var(--bar);transition:width .25s var(--ease)}
.bars .t.na{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.bars .v{color:var(--ink);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.bars .v.na{color:var(--ink-3)}
.bars .src{grid-column:2/-1;color:var(--ink-3);font-size:10.5px;margin:-2px 0 2px}

/* -------- 排名：一個維度排序的長條清單 + 每列一條 11 根的指紋 */
.rank{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rank .rh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px 8px}
.rank .rh h2{margin:0;font-size:14px}
.rank .rh .how{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.rank .dims{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.rank .dims .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px;align-self:center}
.rank .dims .chip{padding:4px 9px;font-size:12px}
.rank .vt{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.rank .vt button{padding:3px 9px;border:0;background:none;border-radius:6px;color:var(--ink-2);font-size:12px}
.rank .vt button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.rl{display:grid;grid-template-columns:34px 118px minmax(120px,1fr) 42px auto;gap:0 10px;align-items:center;padding:0 14px 12px}
.rl > *{min-width:0}
.rl .hdr{grid-column:1/-1;display:grid;grid-template-columns:subgrid;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rl .hdr .fpl{display:flex;gap:2px}
.rl .hdr .fpl i{display:inline-block;width:8px;text-align:center;font-style:normal;font-size:9px;color:var(--ink-3);cursor:help}
.rl .hdr .fpl i.on{color:var(--ink)}
.rl .row{display:contents;cursor:pointer}
.rl .row > *{padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);transition:background var(--dur)}
.rl .row:hover > *{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.rl .row.pin > *{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.rl .row img{width:26px;height:26px;border-radius:7px;border:2px solid var(--sc);object-fit:cover;display:block}
.rl .row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .row .nm b{font-weight:600}
.rl .row .nm span{color:var(--ink-3);font-size:11px;margin-left:5px}
.rl .row .bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--line-2) 60%,transparent);overflow:hidden}
.rl .row .bar.na{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.rl .row .bar i{display:block;height:100%;border-radius:6px;background:var(--bar)}
.rl .row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rl .row .v.na{color:var(--ink-3)}
/* 指紋：11 根固定順序的小直條，被選的那根用深色跟主長條對上 */
.fp{display:flex;align-items:flex-end;gap:2px;height:26px}
.fp i{display:block;width:8px;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--q7) 45%,transparent);min-height:1px}
.fp i.on{background:var(--bar)}
.fp i.na{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 4px);height:26px !important;opacity:.6}
@media (max-width:760px){.rl{grid-template-columns:30px 96px 1fr 36px}.rl .fp,.rl .hdr .fpl{display:none}.rl .row .nm span{display:none}}

/* -------- 總表 */
.tbl{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl h2{margin:0;padding:12px 14px 8px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.tbl h2 .how{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:400}
.tbl .scroll{overflow-x:auto}
table.m{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.m th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:500;text-align:left;
  padding:8px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
table.m th.n{text-align:right}
table.m th:hover{color:var(--ink)}
table.m th[aria-sort]{color:var(--ink)}
table.m th[aria-sort="descending"]::after{content:" ↓";color:var(--accent)}
table.m th[aria-sort="ascending"]::after{content:" ↑";color:var(--accent)}
table.m td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.m td.n{text-align:right;color:var(--ink)}
table.m td.na{color:var(--ink-3);text-align:center}
table.m td.hero{display:flex;align-items:center;gap:8px;cursor:pointer}
table.m td.hero img{width:22px;height:22px;border-radius:6px;border:2px solid var(--sc);object-fit:cover}
table.m tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
table.m tr.pin td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
table.m td.c{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.foot{margin-top:18px;color:var(--ink-3);font-size:12px;line-height:1.7}
.foot b{color:var(--ink-2)}
.foot ul{padding-left:18px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1 data-i="title">英雄定位圖</h1>
  <span class="sub" data-i="sub">57 隻英雄靠什麼、站在哪 —— 每個維度都標明來源</span>
  <div class="lang" id="lang">
    <button data-v="zh" aria-pressed="true">中文</button>
    <button data-v="en" aria-pressed="false">EN</button>
    <button data-v="ru" aria-pressed="false">РУ</button>
  </div>
</header>

<section class="ctrl">
  <div class="grp"><span class="lab" data-i="view">視角</span><span id="presets"></span></div>
  <div class="grp"><span class="lab">X</span><select class="ax" id="ax"></select>
    <span class="lab">Y</span><select class="ax" id="ay"></select></div>
  <div class="grp"><span class="lab" data-i="attr">主屬性</span><span id="attrs"></span></div>
  <div class="grp"><span class="lab" data-i="role">定位</span><span id="roles"></span></div>
  <div class="grp"><input class="q" id="q" data-i-ph="search" placeholder="搜英雄名…"></div>
</section>

<section class="viz">
  <div class="plot">
    <h2><span id="ptitle"></span><span class="cnt" id="pcnt"></span><span class="how" data-i="how">滑過看數字 · 點一下釘選（最多 3 隻）</span></h2>
    <svg class="sc" id="sc" viewBox="0 0 960 620" role="img"></svg>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="side" id="side"></aside>
</section>

<section class="rank">
  <div class="rh"><h2 data-i="rank">全英雄排名</h2>
    <div class="vt" id="vt"><button data-vt="bars" aria-pressed="true" data-i="vtBars">長條</button><button data-vt="table" aria-pressed="false" data-i="vtTable">數字表</button></div>
    <span class="how" data-i="rankHow">選一個維度排序 · 右邊的指紋是同一隻在 11 個配裝傾向上的形狀</span></div>
  <div class="dims" id="dims"></div>
  <div class="rl" id="rl"></div>
  <div class="scroll" id="tblwrap" hidden><table class="m" id="m"></table></div>
</section>

<footer class="foot" id="foot"></footer>
</div>

function visible(h){

  if (S.q){
    const q = S.q.toLowerCase();
    if (!h.n.join(' ').toLowerCase().includes(q)) return false;
  }
  return true;
}
const val = (h, k) => h.p[k] == null ? null : h.p[k];

/* ---------------------------------------------------------------- 散點 */
const W = 960, Hh = 620, M = {l: 58, r: 26, t: 22, b: 48};
const PW = W - M.l - M.r, PH = Hh - M.t - M.b;
const R = 15;                                   // 頭像半徑

function scale(k){
  const a = AX[k];
  if (a.unit === 'ord') return {min: 0.5, max: 4.5, mid: 2.5, ticks: [1, 2, 3, 4].map((v, i) => [v, a.ticks[i]])};
  return {min: -4, max: 104, mid: 50, ticks: [0, 25, 50, 75, 100].map(v => [v, String(v)])};
}
const sx = (v, sc) => M.l + (v - sc.min) / (sc.max - sc.min) * PW;
const sy = (v, sc) => M.t + PH - (v - sc.min) / (sc.max - sc.min) * PH;

/* 把重疊的頭像推開。序數軸只有 4 個位置，不推開就是一疊看不見的臉。
   幾輪簡單的排斥就夠了；位移超過半徑時畫一條細線回真實位置。 */
function relax(pts){
  const it = 60, minD = R * 2 + 2;
  for (let n = 0; n < it; n++){
    let moved = false;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++){
      const a = pts[i], b = pts[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= minD) continue;
      if (d < 0.01){ dx = (Math.random() - .5); dy = (Math.random() - .5); d = Math.hypot(dx, dy); }
      const push = (minD - d) / 2 * 0.9;
      dx /= d; dy /= d;
      a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push;
      moved = true;
    }
    /* 拉回自己的真實位置一點點，免得整團漂走 */
    for (const p of pts){
      p.x += (p.x0 - p.x) * 0.05; p.y += (p.y0 - p.y) * 0.05;
      p.x = Math.max(M.l + R, Math.min(W - M.r - R, p.x));
      p.y = Math.max(M.t + R, Math.min(Hh - M.b - R, p.y));
    }
    if (!moved) break;
  }
}

let PTS = [];
function renderPlot(){
  const L = li(), scX = scale(S.x), scY = scale(S.y);
  const vis = H.filter(visible);
  const shown = vis.filter(h => val(h, S.x) != null && val(h, S.y) != null);
  const missing = vis.length - shown.length;
  $('#ptitle').textContent = `${axName(S.x)} × ${axName(S.y)}`;
  $('#pcnt').textContent = `${shown.length}/${H.length}` + (missing ? ` · ${missing} ${t('na')}` : '');

  PTS = shown.map(h => {
    const x0 = sx(val(h, S.x), scX), y0 = sy(val(h, S.y), scY);
    return {h, x0, y0, x: x0, y: y0};
  });
  relax(PTS);

  let g = `<g class="grid">${scX.ticks.map(([v]) => `<line x1="${sx(v, scX)}" x2="${sx(v, scX)}" y1="${M.t}" y2="${M.t + PH}"/>`).join('')}
    ${scY.ticks.map(([v]) => `<line y1="${sy(v, scY)}" y2="${sy(v, scY)}" x1="${M.l}" x2="${M.l + PW}"/>`).join('')}</g>`;
  g += `<g class="mid"><line x1="${sx(scX.mid, scX)}" x2="${sx(scX.mid, scX)}" y1="${M.t}" y2="${M.t + PH}"/>
        <line y1="${sy(scY.mid, scY)}" y2="${sy(scY.mid, scY)}" x1="${M.l}" x2="${M.l + PW}"/></g>`;
  g += scX.ticks.map(([v, lab]) => `<text class="tick" x="${sx(v, scX)}" y="${Hh - M.b + 16}" text-anchor="middle">${esc(lab)}</text>`).join('');
  g += scY.ticks.map(([v, lab]) => `<text class="tick" x="${M.l - 8}" y="${sy(v, scY) + 4}" text-anchor="end">${esc(lab)}</text>`).join('');
  g += `<text class="axl" x="${M.l + PW / 2}" y="${Hh - 10}" text-anchor="middle">${esc(axName(S.x))} →</text>`;
  g += `<text class="axl" transform="translate(14,${M.t + PH / 2}) rotate(-90)" text-anchor="middle">${esc(axName(S.y))} →</text>`;
  /* 四個角落的象限標籤 */
  const qx = (hi) => (hi ? t('hi') : t('lo')) + axName(S.x), qy = (hi) => (hi ? t('hi') : t('lo')) + axName(S.y);
  const sep = S.lang === 'zh' ? '・' : ' · ';
  g += `<text class="quad" x="${M.l + 8}" y="${M.t + 14}">${esc(qy(1) + sep + qx(0))}</text>
        <text class="quad" x="${M.l + PW - 8}" y="${M.t + 14}" text-anchor="end">${esc(qy(1) + sep + qx(1))}</text>
        <text class="quad" x="${M.l + 8}" y="${M.t + PH - 6}">${esc(qy(0) + sep + qx(0))}</text>
        <text class="quad" x="${M.l + PW - 8}" y="${M.t + PH - 6}" text-anchor="end">${esc(qy(0) + sep + qx(1))}</text>`;
  /* 位移的尾巴先畫，頭像蓋在上面 */
  g += `<g>${PTS.filter(p => Math.hypot(p.x - p.x0, p.y - p.y0) > R * 0.6).map(p =>
    `<line class="tail" x1="${p.x0}" y1="${p.y0}" x2="${p.x}" y2="${p.y}"/><circle cx="${p.x0}" cy="${p.y0}" r="1.6" fill="var(--ink-3)"/>`).join('')}</g>`;
  /* 頭像：釘選的最後畫，才不會被蓋住 */
  const order = PTS.slice().sort((a, b) => (S.pins.includes(a.h.id) ? 1 : 0) - (S.pins.includes(b.h.id) ? 1 : 0));
  g += order.map(p => {
    const h = p.h, pin = S.pins.includes(h.id);
    return `<g class="mk${pin ? ' pin' : ''}" data-id="${h.id}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">
      <circle class="hit" r="${R + 6}"/>
      <circle class="ring" r="${R}" stroke="${ATTR_C[h.attr]}"/>
      <image href="${h.icon}" x="${-R + 2}" y="${-R + 2}" width="${R * 2 - 4}" height="${R * 2 - 4}"/>
      ${pin ? `<text y="${R + 12}" text-anchor="middle">${esc(h.n[L])}</text>` : ''}</g>`;
  }).join('');
  $('#sc').innerHTML = g;
  $('#legend').innerHTML = ['str', 'agi', 'int'].map(a => `<span><i style="--sc:${ATTR_C[a]}"></i>${esc(t(a))}</span>`).join('') +
    `<span><i class="pin-i"></i>${esc(t('legPin'))}</span><span class="hint">${esc(t('pinHint'))}</span>`;
}

/* ---------------------------------------------------------------- tooltip */
function fmt(h, k){
  const a = AX[k], v = val(h, k);
  if (v == null) return t('na');
  if (a.unit === 'ord') return a.ticks[v - 1] || v;
  return v.toFixed(0);
}
function rawOf(h, k){
  const r = h.raw && h.raw[k];
  return r == null ? null : r;
}
function showTip(h, x, y){
  const L = li(), tip = $('#tip');
  const row = k => {
    const raw = rawOf(h, k), src = h.src && h.src[k];
    return `<tr><td>${esc(axName(k))}</td><td class="v">${esc(fmt(h, k))}${raw != null ? ` <span class="r">(${Math.round(raw)})</span>` : ''}</td></tr>` +
      (src ? `<tr><td colspan="2" class="src">${esc(t('src'))}${esc(src[L])}</td></tr>` : '');
  };
  tip.innerHTML = `<b>${esc(h.n[L])}</b> <span class="r">${esc(t(h.attr))} · ${h.roles.map(r => esc(r[L])).join('・')}</span>
    <table>${row(S.x)}${row(S.y)}
    <tr><td>${esc(t('tier'))} / ${esc(t('late'))}</td><td class="v">${esc((h.tierL || ['—'])[L])} / ${esc((h.lateL || ['—'])[L])}</td></tr></table>
    ${h.nb ? '' : `<div class="src">${esc(t('noBuild'))}</div>`}`;
  tip.hidden = false;
  const box = $('.plot').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let px = x - box.left + 16, py = y - box.top + 12;
  if (px + tw > box.width - 8) px = x - box.left - tw - 16;
  if (py + th > box.height - 8) py = y - box.top - th - 12;
  tip.style.left = px + 'px'; tip.style.top = py + 'px';
}

/* ---------------------------------------------------------------- 側欄 */
const PROFILE = [['gA', LAB.axes.filter(a => a.g === 'A').map(a => a.k)],

      ${h.lock ? `<span class="badge">🔒 ${esc(t('lock'))}</span>` : ''}
      ${h.nb ? '' : `<span class="badge">${esc(t('noBuild'))}</span>`}</div>
    <div class="bars">${PROFILE.map(([g, ks]) => `<span class="k h">${esc(t(g))}</span>` + ks.map(bar).join('')).join('')}</div>
  </div>`;
}
let hoverId = null;
function renderSide(){
  const ids = S.pins.length ? S.pins : (hoverId ? [hoverId] : []);
  const box = $('#side');
  if (!ids.length){ box.innerHTML = `<div class="card empty">${esc(t('pinHint'))}</div>`; return; }
  box.innerHTML = ids.map(id => card(H.find(h => h.id === id), S.pins.includes(id))).join('');
}

/* ---------------------------------------------------------------- 總表 */
const TCOLS = () => ['out', 'tank', 'skill', 'auto'].concat(LAB.axes.filter(a => a.g === 'A').map(a => a.k)).concat(['b_sum', 'nsp']);
/* 0～100 -> 藍色序列 8 階（深＝低、淺＝高，深色底上淺色更顯眼＝更大） */
const cellBg = v => v == null ? '' : `background:var(--q${Math.min(8, Math.max(1, Math.ceil(v / 12.5) || 1))})`;
function renderTable(){
  const L = li(), cols = TCOLS();
  let rows = H.filter(visible);
  if (S.sort){
    const k = S.sort;
    rows = rows.slice().sort((a, b) => {
      const va = k === 'name' ? a.n[L] : k === 'tier' || k === 'late' ? (a[k] || 0) : (val(a, k) == null ? -1 : val(a, k));
      const vb = k === 'name' ? b.n[L] : k === 'tier' || k === 'late' ? (b[k] || 0) : (val(b, k) == null ? -1 : val(b, k));
      return (va < vb ? -1 : va > vb ? 1 : 0) * S.sortDir;
    });
  }
  const th = (k, lab, num) => `<th data-sort="${k}" class="${num ? 'n' : ''}"${S.sort === k ? ` aria-sort="${S.sortDir < 0 ? 'descending' : 'ascending'}"` : ''} title="${esc(AX[k] ? AX[k].note : '')}">${esc(lab)}</th>`;
  $('#m').innerHTML = `<thead><tr>${th('name', t('hero'))}<th>${esc(t('attrH'))}</th><th>${esc(t('roleH'))}</th>${th('tier', t('tier'), 1)}${th('late', t('late'), 1)}${
    cols.map(k => th(k, axName(k), 1)).join('')}</tr></thead><tbody>${rows.map(h => `<tr class="${S.pins.includes(h.id) ? 'pin' : ''}" data-id="${h.id}">
      <td class="hero" data-pin="${h.id}"><img src="${h.icon}" alt="" style="--sc:${ATTR_C[h.attr]}">${esc(h.n[L])}</td>
      <td style="color:${ATTR_C[h.attr]}">${esc(t(h.attr))}</td>
      <td>${h.roles.map(r => esc(r[L])).join('・')}</td>
      <td class="n">${esc((h.tierL || ['—'])[L])}</td><td class="n">${esc((h.lateL || ['—'])[L])}</td>
      ${cols.map(k => { const v = val(h, k); return v == null ? `<td class="na">—</td>` : `<td class="n c" style="${cellBg(v)}">${v.toFixed(0)}</td>`; }).join('')}
    </tr>`).join('')}</tbody>`;
}

/* ---------------------------------------------------------------- 排名清單 */
const FP_DIMS = LAB.axes.filter(a => a.g === 'A').map(a => a.k);   // 指紋的 11 根，順序固定
/* 複合軸由哪幾根指紋撐起來：選它時把那幾根點亮，讀者就知道分數從哪來 */
const COMP_OF = {out: ['sp', 'pen', 'atk', 'stat'], tank: ['hp', 'armor', 'thorn', 'mres'],
                 skill: ['sp', 'mod', 'cd'], auto: ['atk', 'as', 'pen']};
const litDims = k => new Set(COMP_OF[k] || [k]);
const RANK_DIMS = [['X', LAB.axes.filter(a => a.g === 'X').map(a => a.k)],
                   ['A', FP_DIMS], ['B', ['b_sum', 'b_str', 'b_agi', 'b_int']], ['C', ['unlock']], ['D', ['nsp']]];
function renderRank(){
  const L = li();
  $('#dims').innerHTML = RANK_DIMS.map(([g, ks], i) => (i ? '<span class="sep"></span>' : '') +
    ks.map(k => `<button class="chip" data-rdim="${k}" aria-pressed="${S.rdim === k}" title="${esc(AX[k].note)}">${esc(axName(k))}</button>`).join('')).join('');
  $('#vt').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vt === S.vt)));
  $('#rl').hidden = S.vt !== 'bars';
  $('#tblwrap').hidden = S.vt !== 'table';
  if (S.vt !== 'bars') return;
  const k = S.rdim;
  const rows = H.filter(visible).slice().sort((a, b) => {
    const va = val(a, k), vb = val(b, k);
    if (va == null && vb == null) return 0;
    if (va == null) return 1; if (vb == null) return -1;
    return vb - va || a.n[L].localeCompare(b.n[L]);
  });
  const lit = litDims(k);
  const fp = h => `<span class="fp" title="${esc(FP_DIMS.map(d => axName(d) + ' ' + (val(h, d) == null ? '—' : val(h, d).toFixed(0))).join(' · '))}">${
    FP_DIMS.map(d => { const v = val(h, d);
      return v == null ? '<i class="na"></i>' : `<i class="${lit.has(d) ? 'on' : ''}" style="height:${Math.max(1, v * 0.26)}px"></i>`; }).join('')}</span>`;
  $('#rl').innerHTML = `<div class="hdr"><span></span><span>${esc(t('hero'))}</span><span>${esc(axName(k))}</span><span></span>
      <span class="fpl">${FP_DIMS.map(d => `<i class="${lit.has(d) ? 'on' : ''}" title="${esc(axName(d))}">${esc(axName(d).slice(0, 1))}</i>`).join('')}</span></div>` +
    rows.map(h => { const v = val(h, k), na = v == null;
      return `<div class="row${S.pins.includes(h.id) ? ' pin' : ''}" data-pin="${h.id}">
        <img src="${h.icon}" alt="" style="--sc:${ATTR_C[h.attr]}">
        <span class="nm"><b>${esc(h.n[L])}</b><span>${h.roles.map(r => esc(r[L])).join('・')}</span></span>
        <span class="bar${na ? ' na' : ''}"><i style="width:${na ? 0 : v}%"></i></span>
        <span class="v${na ? ' na' : ''}">${na ? '—' : v.toFixed(0)}</span>
        ${fp(h)}</div>`; }).join('');
}

function renderFoot(){
  $('#foot').innerHTML = `<b>${esc(t('foot1'))}</b> — ${esc(t('foot2'))}
    <ul><li><b>${esc(t('gA'))}</b>：${esc(t('fA'))}</li><li><b>${esc(t('gX'))}</b>：${esc(t('fX'))}</li>
    <li><b>${esc(t('gB'))}</b>：${esc(t('fB'))}</li><li><b>${esc(t('gC'))}</b>：${esc(t('fC'))}</li><li><b>${esc(t('gD'))}</b>：${esc(t('fD'))}</li></ul>
    ${esc(t('foot3'))}<br>${esc(t('foot4'))}<br><br>${esc(t('foot5'))}`;
}

function renderAll(){ renderCtrl(); renderPlot(); renderSide(); renderRank(); renderTable(); renderFoot(); }

/* ---------------------------------------------------------------- 事件 */
document.querySelector('.ctrl').addEventListener('click', e => {
  const p = e.target.closest('[data-px]');
  if (p){ if (p.dataset.px){ S.x = p.dataset.px; S.y = p.dataset.py; } renderAll(); return; }
  const a = e.target.closest('[data-attr]');
  if (a){ S.attr[a.dataset.attr] = !S.attr[a.dataset.attr]; renderAll(); return; }
  const r = e.target.closest('[data-role]');
  if (r){ const k = r.dataset.role; S.roles.has(k) ? S.roles.delete(k) : S.roles.add(k); renderAll(); }
});
$('#ax').addEventListener('change', e => { S.x = e.target.value; renderAll(); });
$('#ay').addEventListener('change', e => { S.y = e.target.value; renderAll(); });
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderPlot(); renderRank(); renderTable(); });
$('#lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.lang = b.dataset.v; localStorage.setItem('ud.lang', S.lang); renderAll();
});
const sc = $('#sc');
sc.addEventListener('pointermove', e => {
  const m = e.target.closest('.mk');
  sc.querySelectorAll('.mk.hot').forEach(x => x.classList.remove('hot'));
  if (!m){ $('#tip').hidden = true; if (hoverId && !S.pins.length){ hoverId = null; renderSide(); } return; }
  m.classList.add('hot');
  const h = H.find(x => x.id === m.dataset.id);
  showTip(h, e.clientX, e.clientY);
  if (hoverId !== h.id){ hoverId = h.id; if (!S.pins.length) renderSide(); }
});
sc.addEventListener('pointerleave', () => { $('#tip').hidden = true; hoverId = null; if (!S.pins.length) renderSide(); });
function togglePin(id){
  const i = S.pins.indexOf(id);
  if (i >= 0) S.pins.splice(i, 1);
  else { if (S.pins.length >= 3) S.pins.shift(); S.pins.push(id); }
  renderPlot(); renderSide(); renderRank(); renderTable();
}
sc.addEventListener('click', e => { const m = e.target.closest('.mk'); if (m) togglePin(m.dataset.id); });
$('#side').addEventListener('click', e => { const b = e.target.closest('[data-unpin]'); if (b) togglePin(b.dataset.unpin); });
document.querySelector('.rank').addEventListener('click', e => {
  const d = e.target.closest('[data-rdim]'); if (d){ S.rdim = d.dataset.rdim; renderRank(); return; }
  const v = e.target.closest('[data-vt]');   if (v){ S.vt = v.dataset.vt; renderRank(); return; }
  const p = e.target.closest('#rl [data-pin]'); if (p) togglePin(p.dataset.pin);
});
$('#m').addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (th){ const k = th.dataset.sort; if (S.sort === k) S.sortDir *= -1; else { S.sort = k; S.sortDir = k === 'name' ? 1 : -1; } renderTable(); return; }
  const p = e.target.closest('[data-pin]'); if (p) togglePin(p.dataset.pin);
});

renderAll();
})();
</script>
</body>
</html>
