<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UD 圖鑑 · 肥羊的聖誕禮物</title>
<style>
/* ============================================================ tokens */
:root{
  --bg:#0a0c11; --bg-2:#0e1118; --surface:#141822; --surface-2:#1a1f2b;
  --line:#242a38; --line-2:#2f3646;
  --ink:#e8ebf2; --ink-2:#9aa3b8; --ink-3:#646d82;
  --accent:#ffb648; --accent-ink:#1a1205;
  --mat:#57d98a;      /* recipe material   */
  --into:#ffb648;     /* builds into       */
  --r:10px; --r-sm:7px;
  --shadow:0 18px 50px -12px rgba(0,0,0,.7);
  --tile:104px; --icon:56px;
  /* 面板文字的三段刻度。原本有 59 處各自寫死 10~12px，
     所以同一層級的東西大小不一，看起來就亂。統一成三段之後
     只要調這三個值，整個面板的閱讀感就一起變。 */
  --fs-read:13px;    /* 可讀內文：說明、條列、屬性 */
  --fs-sub:12px;     /* 次要資訊：分類、單位、註記 */
  --fs-label:11px;   /* 小標與代碼（多為全大寫或等寬字） */
  --dur:.16s; --ease:cubic-bezier(.22,.7,.3,1);
}
[data-density="compact"]{ --tile:82px; --icon:44px; }
[data-density="dense"]{ --tile:52px; --icon:44px; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.55 "Inter","Noto Sans TC","Microsoft JhengHei",-apple-system,
       BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body::before{ /* subtle depth so the dark ground isn't flat */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 18% -8%, rgba(88,116,255,.10), transparent 60%),
    radial-gradient(700px 420px at 88% 0%, rgba(255,140,60,.07), transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262d3c;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#333c4f}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ============================================================ shell */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* backdrop-filter 會讓 .topbar 自成一個堆疊環境 —— 裡面的搜尋建議
   不管 z-index 多高，都只在這塊內部有效，整塊仍會被後面的 .body 蓋掉。
   所以 .topbar 本身要拿到一個高於面板／抽屜的層級。 */
.topbar{
  position:relative;z-index:25;
  display:flex;align-items:center;gap:16px;padding:0 16px;height:56px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,24,34,.92),rgba(14,17,24,.92));
  backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--ink-3)}
.brand .sv{
  font:11px/1 ui-monospace,monospace;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:3px 8px;letter-spacing:.02em;
}

.search{position:relative;flex:1;max-width:420px}
.search input{
  width:100%;height:34px;padding:0 32px 0 34px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  transition:border-color var(--dur),background var(--dur);
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--line-2);background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search kbd{
  position:absolute;right:9px;top:8px;font:11px/18px ui-monospace,monospace;
  color:var(--ink-3);background:#1c212c;border:1px solid var(--line);
  border-radius:5px;padding:0 6px;pointer-events:none;
}
.search input:not(:placeholder-shown)~kbd{display:none}

/* 搜尋建議：聚焦且空白時才浮出來 —— 那正好是「我可以打什麼」的時刻，
   平常完全不佔版面。分成關鍵字（填進搜尋框）與篩選（直接套條件）兩種，
   後者用不同底色區隔，因為它們的行為不一樣。 */
.sugg{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;
  max-height:min(62vh,420px);overflow-y:auto;
  padding:12px 13px 13px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line-2);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.85);
}
.sugg h6{
  margin:12px 0 7px;font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);
}
.sugg h6:first-child{margin-top:0}
.sugg .row{display:flex;flex-wrap:wrap;gap:6px}
.sg{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  padding:5px 10px;border-radius:99px;font-size:12px;white-space:nowrap;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  transition:border-color var(--dur),color var(--dur),background var(--dur);
}
.sg:hover{border-color:var(--line-2);color:var(--ink);background:var(--bg-2)}
.sg.tint{color:var(--sc)}
.sg.tint:hover{border-color:color-mix(in srgb,var(--sc) 55%,var(--line));
  background:color-mix(in srgb,var(--sc) 12%,var(--bg-2))}
.sg .n{font:10px/1 ui-monospace,monospace;color:var(--ink-3)}
/* 篩選型的（套裝／主動／排行）給一條左側色帶，跟純關鍵字區分開 */
.sg.f{border-color:color-mix(in srgb,var(--sc,var(--accent)) 40%,var(--line))}
.sg.f::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--sc,var(--accent))}
.sg[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.sugg .sg-note{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);line-height:1.6}
/* 清除鈕跟「/」提示共用同一格：沒字時提示快捷鍵，有字時換成 ✕ */
.search .clr{
  position:absolute;right:5px;top:5px;width:24px;height:24px;z-index:2;
  display:none;place-items:center;cursor:pointer;
  background:transparent;border:0;border-radius:6px;
  color:var(--ink-3);font-size:16px;line-height:1;
  transition:background var(--dur),color var(--dur);
}
.search .clr:hover{background:var(--surface-2);color:var(--ink)}
.search .clr:focus-visible{outline:1px solid var(--line-2);outline-offset:1px}
.search input:not(:placeholder-shown)~.clr{display:grid}
/* 有自己的就不要再冒出瀏覽器原生那顆 */
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

.spacer{flex:1}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{
  padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--ink-2);
  transition:color var(--dur),background var(--dur);
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.tb-label{font-size:11px;color:var(--ink-3);margin-right:-8px}
.pick{
  height:34px;padding:0 30px 0 11px;border-radius:9px;appearance:none;
  background:var(--surface) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%238b93a7' stroke-width='1.6'/%3E%3C/svg%3E") no-repeat right 9px center/12px;
  border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;cursor:pointer;
  transition:border-color var(--dur),color var(--dur),background-color var(--dur);
}
.pick:hover{border-color:var(--line-2);color:var(--ink)}
.pick.on{border-color:var(--accent);color:var(--accent);background-color:var(--surface-2)}
.pick option{background:var(--surface);color:var(--ink)}

/* ============================================================ body */
.body{flex:1;display:flex;min-height:0}

/* -------- rail
   .drawer 在桌機只是包住側欄的一層容器；手機版它會變成從左邊滑出的抽屜。
   工具列（模式／排行／密度／語言）要放在 .rail 外面 —— renderRail 每次都會
   整個換掉 .rail 的內容，放裡面會被清掉。 */
.drawer{
  display:flex;flex-direction:column;min-height:0;
  width:206px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg-2);
}
.rail{flex:1;min-height:0;overflow-y:auto;padding:12px 8px 40px}
.dr-head,.dr-tools{display:none}
.tools{display:flex;align-items:center;gap:16px}
#tbtools{display:contents}
.tb-menu{display:none}
.scrim{
  position:fixed;inset:0;z-index:18;background:rgba(6,8,12,.62);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
}
body[data-scrim="1"] .scrim{opacity:1;pointer-events:auto}
.lo-slot .ph{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;
  font:9px/1.1 ui-monospace,monospace;color:var(--ink-3);text-align:center;padding:2px}
.rail h3{
  margin:14px 8px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.rail h3:first-child{margin-top:2px}
.tier{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;
  color:var(--ink-2);font-size:13px;text-align:left;
  transition:background var(--dur),color var(--dur);
}
.tier:hover{background:var(--surface);color:var(--ink)}
.tier[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.tier .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--ink-3);
  box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.tier .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier .ct{font:11px/1 ui-monospace,monospace;color:var(--ink-3)}
.tier[aria-pressed="true"] .ct{color:var(--ink-2)}

/* 取得管道分類：可收合，讓「拿不到的東西」不佔視覺份量 */
.cat{margin-top:10px}
.cat:first-of-type{margin-top:2px}
.cat-h{display:flex;align-items:center;gap:2px;width:100%}
.cat-t{
  flex:0 0 auto;width:20px;height:24px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-3);font-size:9px;transition:color var(--dur),background var(--dur),transform var(--dur);
}
.cat-t:hover{background:var(--surface);color:var(--ink)}
.cat[data-open="0"] .cat-t{transform:rotate(-90deg)}
.cat-n{
  flex:1;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:left;transition:color var(--dur),background var(--dur);
}
.cat-n:hover{background:var(--surface);color:var(--ink-2)}
.cat-n[aria-pressed="true"]{color:var(--accent)}
.cat-n .c{margin-left:auto;font:10px/1 ui-monospace,monospace;letter-spacing:0;
  text-transform:none;opacity:.8}
.cat-b{padding-left:12px}
.cat[data-open="0"] .cat-b{display:none}
.cat[data-dim="1"] .cat-n{opacity:.6}

.legend{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.9}
.meta{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);line-height:1.8}
.meta .ver{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:5px;padding:2px 8px;
  border-radius:99px;background:var(--surface);border:1px solid var(--line-2);
  color:var(--ink-2);font:11px/1.6 ui-monospace,monospace;
}
.meta .ver::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mat)}
.meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;
  vertical-align:-1px}
/* 圖例直接用跟格子上一模一樣的角標，這樣圖示才會被學起來 */
.legend i.fl{width:16px;height:16px;border-radius:50%;margin-right:5px;
  display:inline-grid;place-items:center;vertical-align:-4px;color:#06170d}
.legend i.fl svg{width:10px;height:10px;display:block}
.legend i.fl.any{color:var(--mat);opacity:.9}
.legend i.fl.mat{background:var(--mat)}
.legend i.fl.into{background:var(--into);color:var(--accent-ink);
  font:9px/1 ui-monospace,monospace}

/* -------- grid */
.main{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth;padding:0 0 80px}
@media (prefers-reduced-motion:reduce){ .main{scroll-behavior:auto} }

.sec-head{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:14px 20px 9px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(10,12,17,0));
}
.sec-head h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.02em}
.sec-head .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-head .n{font:11px/1 ui-monospace,monospace;color:var(--ink-3)}
.sec-head .seq-tag{
  font-size:10.5px;color:var(--ink-3);padding:2px 7px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);white-space:nowrap;
}

.grid{display:grid;gap:8px;padding:2px 20px 16px;
  grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr))}

.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 6px 9px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);
  transition:transform var(--dur) var(--ease),border-color var(--dur),
             background var(--dur),opacity var(--dur),box-shadow var(--dur);
}
.tile:hover{transform:translateY(-2px);background:var(--surface-2);border-color:var(--line-2);z-index:2}
.tile .thumb{
  position:relative;width:var(--icon);height:var(--icon);border-radius:var(--r-sm);
  overflow:hidden;flex:0 0 auto;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c,#39415a);
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3);
  font:11px/1 ui-monospace,monospace}
.tile .lbl{
  font-size:11.5px;line-height:1.35;text-align:center;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
[data-density="dense"] .tile{padding:6px}
[data-density="dense"] .tile .lbl{display:none}
[data-density="compact"] .tile{padding:8px 5px 7px;gap:6px}
[data-density="compact"] .tile .lbl{font-size:11px}

/* 套裝件加一層底色。每組用遊戲裡該套裝自己的名稱顏色（由 builder 算出），
   所以五組各有固定色相，掃過去就認得出是哪一組。
   稀有度走的是圖示外框那圈光，底色走套裝 —— 兩個訊號分屬不同位置，不會打架，
   所以底色可以拉到看得清楚的濃度，再補一圈同色邊框讓輪廓自己跳出來。 */
.tile[data-set]{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc,var(--c)) 40%,transparent),
      color-mix(in srgb,var(--sc,var(--c)) 12%,transparent) 80%),
    var(--surface);
  border-color:color-mix(in srgb,var(--sc,var(--c)) 55%,var(--line));
}
.tile[data-set] .lbl{color:var(--ink)}
.tile[data-set]:hover{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc,var(--c)) 52%,transparent),
      color-mix(in srgb,var(--sc,var(--c)) 18%,transparent) 80%),
    var(--surface-2);
  border-color:color-mix(in srgb,var(--sc,var(--c)) 72%,var(--line));
}
/* 三位一體同時屬於三個套裝，底色就給三段，一眼看出它跟別人不一樣 */
.tile[data-multi],.tile[data-multi]:hover{
  background:
    linear-gradient(155deg,
      color-mix(in srgb,var(--sc) 46%,transparent),
      color-mix(in srgb,var(--sc2,var(--sc)) 36%,transparent) 48%,
      color-mix(in srgb,var(--sc3,var(--sc)) 26%,transparent)),
    var(--surface);
}
/* 左上角一道小三角，純圖模式下沒有名稱時也認得出來 */
.tile[data-set]::before{
  content:"";position:absolute;left:0;top:0;width:0;height:0;
  border-top:13px solid var(--sc,var(--c));border-right:13px solid transparent;
  border-top-left-radius:var(--r);
}

/* selection + relationship states */
.tile[data-sel="1"]{
  background:var(--surface-2);border-color:var(--c,var(--accent));
  box-shadow:0 0 0 1px var(--c,var(--accent)),0 10px 30px -10px var(--c,var(--accent));
  transform:translateY(-2px);
}
.tile[data-sel="1"] .lbl{color:var(--ink)}
.tile[data-rel="mat"]{border-color:var(--mat);box-shadow:0 0 0 1px rgba(87,217,138,.5)}
.tile[data-rel="into"]{border-color:var(--into);box-shadow:0 0 0 1px rgba(255,182,72,.45)}
.tile[data-rel] .lbl{color:var(--ink)}
/* 角標一律用鑄造槌，靠「強度」分兩種意思：
     淡的 = 這件本身可以拿去合成別的東西（103 件，道具的固有屬性）
     亮的 = 它是「目前選中那件」的素材（跟著選取變動）
   同一個圖示兩種強度，使用者只要學一次；如果換成兩個不同符號，
   反而要記兩件事。「可合成為」維持箭頭，那個本來就只有關聯時才出現。 */
.tile .flag{
  position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;font:9px/1 ui-monospace,monospace;
  color:var(--ink-3);border:2px solid transparent;
  transition:background var(--dur),color var(--dur),
             border-color var(--dur),opacity var(--dur);
}
.tile .flag svg{width:11px;height:11px;display:block}
/* 靜態＝綠色線稿、沒有底；關聯＝綠底填滿。
   兩者在「形態」上就不同（字形 vs 徽章），所以靜態這個可以夠亮，
   不必壓到看不見 —— 看不見就失去「快速找到素材」的意義了。 */
.tile:not([data-rel]) .flag{color:var(--mat);opacity:.9;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.85))}
.tile[data-rel="mat"] .flag{
  background:var(--mat);color:#06170d;border-color:var(--surface);opacity:1}
.tile[data-rel="into"] .flag{
  background:var(--into);color:var(--accent-ink);border-color:var(--surface);opacity:1}

/* dimming: keeps layout memory, drops noise */
.grid[data-focus="1"] .tile:not([data-sel]):not([data-rel]){opacity:.34;filter:saturate(.62)}
.grid[data-focus="1"] .tile:not([data-sel]):not([data-rel]):hover{opacity:.85;filter:none}

/* ---- 排行檢視：數值是主角，所以改成橫列＋長度條 ---- */
.rank{display:flex;flex-direction:column;gap:3px;padding:2px 20px 16px}
.rrow{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:7px 14px 7px 10px;border-radius:10px;text-align:left;
  background:var(--surface);border:1px solid transparent;overflow:hidden;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
/* 長度條：統一顏色。長度是唯一的比較變數，
   若讓長條也帶稀有度顏色，色相變化會干擾長度判讀。
   稀有度改由圖示外框與品質文字承載。 */
.rrow::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);
  background:linear-gradient(90deg,rgba(255,182,72,.16),rgba(255,182,72,.05));
  transition:width .45s var(--ease);
}
/* 右端一條實線，給眼睛一個清楚的比較邊緣 */
.rrow::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);
  border-right:2px solid var(--c,var(--accent));opacity:.85;
  transition:width .45s var(--ease);
}
.rrow.neg::before{background:linear-gradient(90deg,rgba(255,90,90,.16),rgba(255,90,90,.04))}
.rrow.neg::after{border-right-color:#ff6b6b}
.rrow:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateX(2px)}
.rrow[data-sel="1"]{border-color:var(--c,var(--accent));
  box-shadow:0 0 0 1px var(--c,var(--accent))}
.rrow > *{position:relative}
.rrow .no{
  width:26px;flex:0 0 auto;text-align:right;
  font:11.5px/1 ui-monospace,monospace;color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.rrow.top .no{color:var(--accent);font-weight:600}
.rrow .ic{width:34px;height:34px;border-radius:7px;flex:0 0 auto;overflow:hidden;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c,#39415a)}
.rrow .ic img{width:100%;height:100%;object-fit:cover;display:block}
.rrow .ic .ph{width:100%;height:100%;display:grid;place-items:center;
  font:9px/1 ui-monospace,monospace;color:var(--ink-3)}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{display:block;font-size:13px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rrow .nm span{font-size:11px;color:var(--c,var(--ink-3));opacity:.85}
.rrow .val{
  flex:0 0 auto;font:600 16px/1 ui-monospace,monospace;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.rrow.neg .val{color:#ff8f8f}
/* 前三名用顏色加重就好。放大字級會讓右側數字欄對不齊，
   反而破壞「一眼掃過去比大小」的能力。 */
.rrow.top .val{color:var(--accent)}
.rrow .unit{font-size:11px;color:var(--ink-3);margin-left:3px;font-weight:400}

.rank-head{
  display:flex;align-items:baseline;gap:10px;padding:14px 20px 10px;
  position:sticky;top:0;z-index:3;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(10,12,17,0));
}
.rank-head h2{margin:0;font-size:15px;font-weight:600}
.rank-head .sub{font-size:11.5px;color:var(--ink-3)}
.rank-head .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rank-note{padding:0 20px 12px;font-size:var(--fs-sub);color:var(--ink-3);line-height:1.7}

.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:6px;font-weight:500}

/* -------- panel */
.panel{
  position:relative;flex:0 0 auto;min-width:0;overflow:hidden;
  background:var(--bg-2);box-shadow:var(--shadow);
  width:0;border-left:0 solid var(--line);
  transition:width .22s var(--ease),border-left-width .22s var(--ease);
}
.panel[data-open="1"]{width:var(--pw,460px);border-left-width:1px}
/* 拖曳時要即時跟手，不能有過渡 */
.panel[data-drag="1"]{transition:none}
.panel[data-open="0"] .handle{opacity:0;pointer-events:none}

/* 內層固定寬度：外層收合時內容不會被擠壓變形，
   只是被裁切掉，看起來就像整片滑出去 */
.p-inner{
  width:var(--pw,460px);flex:0 0 auto;height:100%;
  display:flex;flex-direction:column;min-height:0;
  opacity:0;transform:translateX(18px);
  transition:opacity .2s var(--ease) .04s,transform .26s var(--ease) .04s;
}
.panel[data-open="1"] .p-inner{opacity:1;transform:none}
.panel[data-drag="1"] .p-inner{transition:none}

/* 換一件裝備時內容輕輕淡入，避免瞬間抽換 */
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel[data-swap="1"] .p-head,
.panel[data-swap="1"] .p-body{animation:swapIn .22s var(--ease) both}
.handle{
  position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:6;
  display:flex;align-items:center;justify-content:center;
}
.handle::before{content:"";width:2px;height:34px;border-radius:2px;background:var(--line-2);
  transition:background var(--dur),height var(--dur)}
.handle:hover::before,.handle[data-drag="1"]::before{background:var(--accent);height:64px}
body[data-resizing="1"]{cursor:col-resize;user-select:none}

.p-head{position:relative;padding:18px 18px 14px;border-bottom:1px solid var(--line);overflow:hidden}
.p-head::before{
  content:"";position:absolute;inset:-40% -20% auto;height:190px;pointer-events:none;
  background:radial-gradient(closest-side,var(--c,#5b6ee1),transparent 72%);opacity:.16;
}
.p-close{
  position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:9px;
  color:var(--ink-2);display:grid;place-items:center;font-size:20px;line-height:1;
  background:var(--surface);border:1px solid var(--line);
  transition:background var(--dur),color var(--dur),border-color var(--dur),transform var(--dur);
}
.p-close:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2);transform:rotate(90deg)}
.p-close:active{transform:rotate(90deg) scale(.92)}
.p-id{position:absolute;top:18px;right:52px;z-index:3;pointer-events:none;
  font:10.5px/1 ui-monospace,monospace;color:var(--ink-3)}

.p-top{position:relative;display:flex;gap:14px;align-items:flex-start}
.p-icon{width:76px;height:76px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:#0c0f15;
  box-shadow:0 0 0 2px var(--c,#39415a),0 12px 26px -10px var(--c,#000)}
.p-icon img{width:100%;height:100%;object-fit:cover;display:block}
.p-icon .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:11px}
.p-name{min-width:0;flex:1;padding:2px 44px 0 0}
.p-name h1{margin:0 0 3px;font-size:19px;line-height:1.3;font-weight:600;word-break:break-word}
.p-name .alt{font-size:12.5px;color:var(--ink-3);line-height:1.55;word-break:break-word}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:var(--fs-sub);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  flex:0 0 auto;width:max-content;max-width:100%;
}
.chip code{font:var(--fs-label)/1 ui-monospace,monospace;opacity:.75}
.chip.tier{color:var(--c,var(--ink));border-color:color-mix(in srgb,var(--c,#39415a) 45%,transparent)}
/* 套裝加成：一組一段，左邊一條該套裝的色帶，件數做成圓標好掃 */
.sb{border-left:2px solid var(--sc);padding-left:10px;margin-top:12px}
.sb:first-of-type{margin-top:2px}
.sb-h{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.sb-h b{color:var(--sc);font-size:13.5px}
.sb-h code{font:var(--fs-label)/1 ui-monospace,monospace;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.sb-h .only{font-size:var(--fs-sub);color:var(--ink-3)}
.sb-r{display:flex;gap:9px;align-items:flex-start;padding:4px 0;
  font-size:var(--fs-read);line-height:1.7}
.sb-r .n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;
  display:grid;place-items:center;font:var(--fs-label)/1 ui-monospace,monospace;color:var(--sc);
  background:color-mix(in srgb,var(--sc) 16%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 34%,transparent) inset}
.sb-r .x{color:var(--ink-2)}
.sb-r .q{font-size:10.5px;color:#e0a340;margin-left:5px;white-space:nowrap;
  border:1px solid rgba(224,163,64,.4);border-radius:4px;padding:0 4px}
.chip.set{
  border-color:color-mix(in srgb,var(--sc,#4b3a6b) 55%,transparent);
  color:var(--sc,#c4a6ff);
  background:color-mix(in srgb,var(--sc,#4b3a6b) 14%,var(--surface));
  cursor:pointer;
}
.chip.set:hover{background:color-mix(in srgb,var(--sc,#4b3a6b) 26%,var(--surface))}
.chip.shop{border-color:#3c5340;color:#8fd6a3}
/* 暫代圖示：標一下，之後拿到正式圖才知道要換哪幾件 */
.chip.tmp{border-color:rgba(224,163,64,.45);color:#e0a340;cursor:help}

.p-body{flex:1;overflow-y:auto;padding:16px 18px 40px;min-height:0}
.sect{margin-bottom:20px}
.sect:last-child{margin-bottom:0}
.sect > h4{
  margin:0 0 9px;font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.stats{
  display:flex;flex-wrap:wrap;gap:5px;
}
.stat{
  padding:4px 9px;border-radius:7px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);
}
.stat b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.eff{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.eff:first-of-type{border-top:0;padding-top:0}
.eff .tag{
  flex:0 0 auto;margin-top:1px;padding:2px 7px;border-radius:6px;font-size:10.5px;
  background:#1e2432;color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
}
.eff .txt{font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-line}
.eff .txt em{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}

.rel{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.rel button{
  display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);text-align:left;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.rel button:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateX(2px)}
.rel button.cur{border-color:var(--c2,var(--accent));box-shadow:0 0 0 1px var(--c2,var(--accent))}
.rel img,.rel .ph{width:34px;height:34px;border-radius:7px;flex:0 0 auto;object-fit:cover;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a)}
.rel .ph{display:grid;place-items:center;font-size:10px;color:var(--ink-3)}
.rel .t{min-width:0;flex:1}
.rel .t b{display:block;font-size:var(--fs-read);font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rel .t span{font-size:var(--fs-sub);color:var(--ink-3)}
.rel .arrow{color:var(--ink-3);font-size:12px;flex:0 0 auto}

/* 狀態說明。用 <details> 讓它預設收起 —— 大部分時候使用者只想確認
   「這件會上點燃」，需要細節時才展開，不必一直佔著面板。 */
.sts{display:flex;flex-direction:column;gap:5px}
/* 左側色帶 ＋ 標題上色 —— 跟套裝加成同一套做法，不另外發明語言。
   同一個抗性家族用相近色相（火焰橘紅系、詛咒紫系），
   所以顏色本身也在暗示「該用哪種抗性擋」。 */
.st{
  border:1px solid var(--line);border-left:3px solid var(--sc,var(--line-2));
  border-radius:9px;background:var(--surface);overflow:hidden;
}
.st > summary{
  list-style:none;cursor:pointer;padding:9px 12px;display:flex;
  flex-direction:column;align-items:stretch;gap:5px;
  transition:background var(--dur);
}
.st > summary::-webkit-details-marker{display:none}
/* 展開標示：放在標題那一行的最右邊，外面一圈框，一眼看得出可以按 */
.st-hd{display:flex;align-items:center;gap:8px;width:100%}
.st-hd .ic{width:26px;height:26px;border-radius:6px;flex:0 0 auto;object-fit:cover;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 55%,transparent)}

/* -------- 狀態頁 */
.spage{padding:6px 20px 60px;max-width:1000px}
.spage .sec{margin-bottom:30px}
.spage .note{margin:0 0 14px}
/* 圖比面板寬時讓它自己橫向捲，不要把整頁撐出橫向捲軸 */
.smap-wrap{overflow-x:auto;padding-bottom:6px}
.smap{width:100%;min-width:720px;height:auto;display:block}
.smap text{font-family:inherit}
.smap .mn{cursor:pointer}
.smap .mn:hover rect{stroke-width:2.6}
.smap-lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;
  font-size:var(--fs-sub);color:var(--ink-3)}
.smap-lg span{display:inline-flex;align-items:center;gap:7px}
.smap-lg i{display:inline-block;flex:0 0 auto}
.smap-lg i.bx{width:22px;height:13px;border:1.5px dashed #DE6BC6;border-radius:4px}
.smap-lg i.ar{width:22px;height:0;border-top:2px solid var(--ink-2);position:relative}
.smap-lg i.ar::after{content:"";position:absolute;right:-1px;top:-4px;
  border-left:6px solid var(--ink-2);border-top:4px solid transparent;
  border-bottom:4px solid transparent}
.stab{border-collapse:collapse;width:100%;max-width:720px}
.stab td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
.stab tr:first-child td{border-top:0}
.stab code{font:var(--fs-sub)/1.4 ui-monospace,monospace;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.stab td.v{text-align:right;font:var(--fs-read)/1 ui-monospace,monospace;color:#e0a340;
  white-space:nowrap}
.scz{
  display:inline-flex;align-items:center;gap:6px;margin:2px 4px 2px 0;cursor:pointer;
  padding:3px 10px 3px 3px;border-radius:99px;font-size:var(--fs-sub);
  background:var(--surface);color:var(--sc);
  border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line));
  transition:background var(--dur),border-color var(--dur);
}
.scz:hover{background:color-mix(in srgb,var(--sc) 14%,var(--surface));border-color:var(--sc)}
.scz img{width:22px;height:22px;border-radius:5px;flex:0 0 auto;object-fit:cover}
.st-hd .cv{
  margin-left:auto;flex:0 0 auto;width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-3);
  border:1px solid var(--line-2);background:var(--bg-2);
  transition:transform var(--dur),color var(--dur),
             border-color var(--dur),background var(--dur);
}
.st-hd .cv svg{width:11px;height:11px;display:block}
.st > summary:hover .cv{
  color:var(--sc,var(--ink));border-color:var(--sc,var(--line-2));
  background:color-mix(in srgb,var(--sc,var(--ink)) 14%,var(--bg-2));
}
.st[open] .cv{transform:rotate(180deg)}
.st > summary:hover{background:color-mix(in srgb,var(--sc,var(--ink)) 9%,var(--surface-2))}
.st > summary b{font-size:13.5px;color:var(--sc,var(--ink))}
.st > summary .s{font-size:var(--fs-read);color:var(--ink-2);line-height:1.65}
.st > summary .tag{
  font-size:10.5px;padding:2px 7px;border-radius:99px;white-space:nowrap;
  color:#e0a340;border:1px solid rgba(224,163,64,.4);
}
.st-g{padding:0 12px 11px}
.st-g h6{margin:10px 0 5px;font-size:var(--fs-label);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.st-g ul{margin:0;padding-left:16px}
.st-g li{font-size:var(--fs-read);line-height:1.75;color:var(--ink-2);margin:4px 0}

/* 英雄頁：卡片沿用裝備格子的視覺重量，但橫向排版好放名字與定位 */
.hero-page .hsec{margin-bottom:22px}
.hero-page .hsec > h2{
  font-size:14px;color:var(--sc);margin:0 0 8px;display:flex;align-items:center;gap:8px;
  padding-bottom:6px;border-bottom:1px solid var(--line);
}
.hero-page .hsec > h2 .n{
  font:11px/1 ui-monospace,monospace;color:var(--ink-3);
  background:var(--surface-2);border-radius:99px;padding:3px 7px;
}
.hulk{
  grid-column:1/-1;font-size:11px;color:var(--ink-3);margin:10px 0 4px;
  display:flex;align-items:center;gap:6px;
}
.hulk b{color:var(--ink-2);font-family:ui-monospace,monospace}
.hulk::after{content:"";flex:1;height:1px;background:var(--line)}
.hsec{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.hsec > h2, .hulk{grid-column:1/-1}
.hc{
  display:flex;align-items:center;gap:9px;padding:7px 9px;cursor:pointer;text-align:left;
  border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:10px;
  background:var(--surface);transition:background var(--dur),transform var(--dur);
}
.hc:hover{background:var(--surface-2);transform:translateY(-1px)}
.hc-i{width:40px;height:40px;border-radius:8px;flex:0 0 auto;object-fit:cover;
  box-shadow:0 0 0 1.5px var(--line-2)}
.hc-ph{width:40px;height:40px;border-radius:8px;flex:0 0 auto;display:grid;
  place-items:center;background:#0c0f15;color:var(--ink-3);font-size:15px}
.hc-b{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.hc-b b{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.hc-r{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.hc-t{
  flex:0 0 auto;font:10px/1 ui-monospace,monospace;color:var(--sc);
  border:1px solid color-mix(in srgb,var(--sc) 45%,var(--line));
  border-radius:99px;padding:3px 6px;
}

/* 英雄面板 */
.hb{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hb span{font-size:11px;border-radius:99px;padding:3px 9px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface-2)}
.hb-a{color:var(--sc)!important;border-color:color-mix(in srgb,var(--sc) 45%,var(--line))!important}
.hb-m{color:#F7E15C!important;border-color:color-mix(in srgb,#F7E15C 40%,var(--line))!important}
.hc-m{flex:0 0 auto;font-size:11px;opacity:.75}
.hby{color:var(--ink-3);font-size:11px;margin-top:2px}
.hdesc{margin:0 0 4px;font-size:var(--fs-read);line-height:1.75;color:var(--ink-2)}
.htab{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.htab th,.htab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.htab th{color:var(--ink-3);font-weight:400;font-size:11px}
.htab .v{text-align:right;font-family:ui-monospace,monospace;color:var(--ink)}
.htab .g{text-align:right;font-family:ui-monospace,monospace;color:var(--ink-3);width:56px}
.hlinks{display:flex;flex-wrap:wrap;gap:6px}
.hlink{
  font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  transition:border-color var(--dur),color var(--dur);
}
.hlink:hover{border-color:var(--accent);color:var(--ink)}
.hlink.s{--sc:var(--accent);color:var(--sc);
  border-color:color-mix(in srgb,var(--sc) 45%,var(--line));
  display:inline-flex;align-items:center;gap:5px}
.hlink.s img{width:15px;height:15px;border-radius:4px}
.hlink.s:hover{border-color:var(--sc)}
.hnote{font-size:var(--fs-sub);line-height:1.6;border-radius:8px;padding:8px 10px;
  margin-top:9px;border:1px solid var(--line)}
.hnote.mod{color:#F7E15C;border-color:color-mix(in srgb,#F7E15C 40%,var(--line));
  background:color-mix(in srgb,#F7E15C 8%,var(--surface))}
/* 技能：跟狀態說明用同一種展開樣式 */
#pbody h5 .cnt{margin-left:6px;font:11px/1 ui-monospace,monospace;color:var(--ink-3);
  background:var(--surface-2);border-radius:99px;padding:3px 7px}
.ha{border-bottom:1px solid var(--line)}
.ha > summary{cursor:pointer;list-style:none;padding:7px 0}
.ha > summary::-webkit-details-marker{display:none}
.ha-hd{display:flex;align-items:center;gap:8px}
.ha-hd img{width:26px;height:26px;border-radius:6px;flex:0 0 auto;
  box-shadow:0 0 0 1px var(--line-2)}
.ha-hd b{font-size:13px;color:var(--ink);flex:1;min-width:0}
.ha-hd kbd{font:10px/1 ui-monospace,monospace;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:4px;padding:3px 5px}
.ha-lv{font:10px/1 ui-monospace,monospace;color:var(--ink-3)}
.ha-m{color:#F7E15C;font-size:12px}
.ha-t{margin:0 0 10px 34px;font-size:var(--fs-sub);line-height:1.7;color:var(--ink-2);
  white-space:pre-wrap;font-family:inherit}
/* 技能升級數值表。面板很窄，所以整張表可以橫向捲動，不讓它撐開版面。 */
.bd-tal{font-size:11px;color:var(--sc);margin:-2px 0 7px}
.hsk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hsk-i{font-size:12px;padding:4px 10px;border-radius:99px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line)}
.hsk-i.off{color:#F7E15C;border-color:color-mix(in srgb,#F7E15C 40%,var(--line))}
.lvt-w{margin:0 0 10px 34px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.lvt{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.lvt th,.lvt td{padding:3px 8px;border-bottom:1px solid var(--line)}
.lvt thead th{color:var(--ink-3);font-weight:400;font-size:10.5px;
  border-bottom:1px solid var(--line-2)}
.lvt thead th:first-child{text-align:left}
.lvt tbody th{text-align:left;font-weight:400;color:var(--ink-2);
  position:sticky;left:0;background:var(--surface)}
.lvt td{text-align:right;font-family:ui-monospace,monospace;color:var(--ink)}
.lvt td:last-child{color:var(--accent)}

/* 技能書的天賦選項 */
.ho{margin:0 0 12px 34px;padding-left:10px;border-left:2px solid var(--line-2)}
.ho-h{font-size:11px;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center}
.ho-h .cnt{margin-left:6px}
.ho-i{display:flex;gap:8px;margin-bottom:9px}
.ho-i > img{width:24px;height:24px;border-radius:6px;flex:0 0 auto;
  box-shadow:0 0 0 1px var(--line-2)}
.ho-i > div{min-width:0;flex:1}
.ho-i b{font-size:12.5px;color:var(--ink);display:block;margin-bottom:3px}
.ho-i .ha-t{margin:0}

/* AI 配裝卡：左側色帶延續套裝加成／狀態說明那套語言 */
.bd{border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:10px;
  background:var(--surface);padding:11px 12px;margin-bottom:10px}
.bd-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bd-h b{font-size:14px;color:var(--sc);flex:1}
.bd-go{
  flex:0 0 auto;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;
  background:color-mix(in srgb,var(--sc) 16%,var(--surface));
  border:1px solid color-mix(in srgb,var(--sc) 50%,var(--line));color:var(--ink);
  transition:background var(--dur),border-color var(--dur);
}
.bd-go:hover{background:color-mix(in srgb,var(--sc) 30%,var(--surface));border-color:var(--sc)}
.bd-key{font-size:var(--fs-sub);color:var(--ink-2);line-height:1.6;margin-bottom:9px}
.bd-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.bd-i{width:38px;height:38px;border-radius:8px;overflow:hidden;flex:0 0 auto;cursor:pointer;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a);
  transition:transform var(--dur)}
.bd-i:hover{transform:translateY(-2px)}
.bd-i img{width:100%;height:100%;object-fit:cover;display:block}
.bd-i .ph{width:100%;height:100%;display:grid;place-items:center;
  font:8px/1 ui-monospace,monospace;color:var(--ink-3)}
/* 分隔線：右邊兩個是不佔格的額外欄位 */
.bd-sep{width:1px;height:30px;background:var(--line-2);margin:0 4px;flex:0 0 auto}
.bd-why{margin-top:9px}
.bd-why > summary{cursor:pointer;font-size:var(--fs-sub);color:var(--ink-3);list-style:none}
.bd-why > summary::-webkit-details-marker{display:none}
.bd-why > summary::before{content:"\25B8 ";color:var(--sc)}
.bd-why[open] > summary::before{content:"\25BE ";}
.bd-why > summary:hover{color:var(--ink-2)}
.bd-why p{margin:7px 0 0;font-size:var(--fs-read);line-height:1.75;color:var(--ink-2)}

/* 用於合成：一個目標一張卡，卡的下半直接列出該配方的全部素材，
   手上這件打勾。這樣「還缺什麼」不必再點一層。 */
.uses{display:flex;flex-direction:column;gap:8px}
.use{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.use-h{
  display:flex;align-items:center;gap:10px;width:100%;padding:6px;
  text-align:left;background:none;border:0;cursor:pointer;
  transition:background var(--dur);
}
.use-h:hover{background:var(--surface-2)}
.use-h img,.use-h .ph{width:34px;height:34px;border-radius:7px;flex:0 0 auto;object-fit:cover;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a)}
.use-h .ph{display:grid;place-items:center;font-size:10px;color:var(--ink-3)}
.use-h .t{min-width:0;flex:1}
.use-h .t b{display:block;font-size:var(--fs-read);font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.use-h .t span{font-size:var(--fs-sub);color:var(--ink-3)}
.use-h .arrow{color:var(--ink-3);font-size:12px;flex:0 0 auto}
.use-m{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:7px 8px;border-top:1px solid var(--line);background:var(--bg-2);
}
.use-m button{
  display:flex;align-items:center;gap:5px;max-width:100%;cursor:pointer;
  padding:4px 9px 4px 4px;border-radius:99px;font-size:var(--fs-sub);
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  transition:border-color var(--dur),color var(--dur),background var(--dur);
}
.use-m button:hover{border-color:var(--line-2);color:var(--ink)}
/* 「手上這件」—— 綠色＋勾，跟格子上的素材標記同一套語言 */
.use-m button.have{
  border-color:var(--mat);color:var(--ink);
  background:color-mix(in srgb,var(--mat) 15%,var(--surface));
}
.use-m button.have::after{content:"✓";color:var(--mat);font-size:10px;flex:0 0 auto}
.use-m img,.use-m .ph{width:20px;height:20px;border-radius:5px;flex:0 0 auto;object-fit:cover;
  background:#0c0f15;box-shadow:0 0 0 1px var(--c2,#39415a)}
.use-m .ph{display:grid;place-items:center;font-size:7px;color:var(--ink-3);overflow:hidden}
.use-m button > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.use-m i{color:var(--ink-3);font-style:normal;font-size:10px;flex:0 0 auto}

/* 順序條：用「一排會走動的圖示」表達序列，
   比兩行「上一件／下一件」更能讓人看出這是個連續的環 */
.seq{display:flex;align-items:flex-end;gap:6px;margin-top:2px}
.seq button{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 3px;border-radius:9px;border:1px solid transparent;background:none;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.seq button:hover{background:var(--surface);border-color:var(--line-2);transform:translateY(-2px)}
.seq .sq-img{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:0 0 auto;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a);opacity:.55;
  transition:opacity var(--dur),transform var(--dur)}
.seq button:hover .sq-img{opacity:1}
.seq .sq-img img{width:100%;height:100%;object-fit:cover;display:block}
.seq .sq-img .ph{width:100%;height:100%;display:grid;place-items:center;
  font:8px/1 ui-monospace,monospace;color:var(--ink-3)}
.seq .sq-n{font-size:10px;line-height:1.3;color:var(--ink-3);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
/* 目前這一件放大、全亮，其餘退到背景 */
.seq .cur .sq-img{width:46px;height:46px;opacity:1;
  box-shadow:0 0 0 2px var(--c2,var(--accent)),0 8px 20px -8px var(--c2,var(--accent))}
.seq .cur .sq-n{color:var(--ink);font-weight:600}
.seq .arw{flex:0 0 auto;color:var(--ink-3);font-size:11px;padding-bottom:18px}

.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.pool button{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
  border-radius:9px;border:1px solid var(--line);background:var(--surface);
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.pool button:hover{background:var(--surface-2);border-color:var(--line-2);transform:translateY(-2px)}
.pool button.cur{border-color:var(--c2,var(--accent));
  box-shadow:0 0 0 1px var(--c2,var(--accent))}
.pool .sq-img{width:36px;height:36px;border-radius:7px;overflow:hidden;
  background:#0c0f15;box-shadow:0 0 0 1.5px var(--c2,#39415a)}
.pool .sq-img img{width:100%;height:100%;object-fit:cover;display:block}
.pool .sq-img .ph{width:100%;height:100%;display:grid;place-items:center;
  font:8px/1 ui-monospace,monospace;color:var(--ink-3)}
.pool .sq-n{font-size:10.5px;line-height:1.3;text-align:center;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.pool button.cur .sq-n{color:var(--ink);font-weight:600}

.seq-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.seq-head .pos{font:11px/1 ui-monospace,monospace;color:var(--ink-2)}
.seq-head .pos b{color:var(--accent)}

.note{font-size:var(--fs-sub);color:var(--ink-3);line-height:1.75}

/* -------- toast / hint */
.hint{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:99px;
  background:rgba(20,24,34,.94);border:1px solid var(--line);backdrop-filter:blur(8px);
  font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);
  transition:opacity .4s,transform .4s;
}
/* 有些元素自己設了 display，會蓋過瀏覽器對 [hidden] 的預設值，所以統一強制 */
[hidden]{display:none!important}
.hint[hidden]{display:none}
.hint.gone{opacity:0;transform:translate(-50%,8px)}
.hint kbd{font:11px/16px ui-monospace,monospace;background:#1c212c;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--ink)}

/* -------- tooltip */
.tip{
  position:fixed;z-index:30;pointer-events:none;padding:6px 10px;border-radius:8px;
  background:rgba(12,15,21,.97);border:1px solid var(--line-2);box-shadow:var(--shadow);
  font-size:12px;max-width:250px;opacity:0;transition:opacity .12s;
}
.tip[data-on="1"]{opacity:1}
.tip b{display:block;font-weight:600;color:var(--ink)}
.tip span{color:var(--ink-3);font-size:11px}

/* -------- 配裝模式
   欄位列釘在格子上方而不是塞進右面板：配裝時「放一件 -> 馬上看到它做什麼」
   要同時發生，右面板留給單件詳細，兩塊地不互搶。 */
.col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.load{
  flex:0 0 auto;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  padding:10px 20px 18px;      /* 下緣多留一點：收合鈕會往上壓約 11px */
}
.lo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lo-slots{display:flex;gap:8px;flex-wrap:wrap}
.lo-slot{
  position:relative;width:52px;height:52px;border-radius:10px;flex:0 0 auto;
  background:var(--surface);border:1px dashed var(--line-2);
  display:grid;place-items:center;color:var(--ink-3);
  font:11px/1 ui-monospace,monospace;
  transition:border-color var(--dur),background var(--dur),transform var(--dur);
}
.lo-slot[data-on="1"]{border-style:solid;border-color:var(--c,var(--line-2));cursor:pointer;
  background:#0c0f15;box-shadow:0 0 0 1px var(--c,transparent) inset}
.lo-slot[data-on="1"]:hover{transform:translateY(-2px)}
.lo-slot img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.lo-slot .x{
  position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;line-height:1;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);
  opacity:0;transition:opacity var(--dur),background var(--dur),color var(--dur);
}
.lo-slot:hover .x,.lo-slot .x:focus-visible{opacity:1}
.lo-slot .x:hover{background:#5b1f28;border-color:#8d3040;color:#fff}
/* 鐵匠複製出來的那一件，左上角掛個標記 —— 整場只有一個名額，值得標出來 */
.lo-slot .sm{
  position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;line-height:1;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 0 0 2px var(--bg-2);
}
.lo-slot .sm.x2{top:auto;bottom:-6px;left:-6px;background:var(--mat);
  font:9px/1 ui-monospace,monospace;width:20px}
.lo-count{font:12px/1 ui-monospace,monospace;color:var(--ink-3)}
/* 額外欄位：虛線 ＋ 分隔線，一眼看出「這兩格不算在 6 格裡」 */
.lo-div{width:1px;align-self:stretch;background:var(--line-2);margin:0 4px;flex:0 0 auto}
.lo-slot.bo{border-style:dashed;border-color:var(--line-2);cursor:pointer}
.lo-slot.bo[data-on="1"]{border-style:solid}
.lo-slot.bo .lb{
  font-size:9px;line-height:1.2;text-align:center;color:var(--ink-3);padding:2px;
}
.lo-slot.bo .src{
  position:absolute;left:-6px;bottom:-6px;width:20px;height:20px;border-radius:5px;
  overflow:hidden;background:#0c0f15;box-shadow:0 0 0 1px var(--line-2);
}
.lo-slot.bo .src img{width:100%;height:100%;object-fit:cover;display:block}
.lo-slot.bo .src .ph{display:none}
.lo-slot.bo .rl{
  position:absolute;bottom:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;line-height:1;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);
  transition:background var(--dur),color var(--dur);
}
.lo-slot.bo .rl:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 挑選中：這格自己會呼吸，配合格子已篩到該類別 */
.lo-slot.bo[data-arm="1"]{
  border-color:var(--accent);border-style:solid;
  animation:armPulse 1.3s ease-in-out infinite;
}
@keyframes armPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,182,72,.42)}
  50%{box-shadow:0 0 0 6px rgba(255,182,72,0)}
}
.lo-hint{font-size:12px;color:var(--ink-3);transition:color var(--dur)}
.lo-hint.warn{color:#e0a340}
.lo-clear{
  height:28px;padding:0 11px;border-radius:8px;font-size:12px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  transition:border-color var(--dur),color var(--dur);
}
.lo-clear:hover{border-color:var(--line-2);color:var(--ink)}
.lo-clear.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink)}
.lo-clear.on:hover{border-color:var(--accent);color:var(--accent)}

/* 面板分頁。只在配裝模式出現，緊貼面板頂端，
   跟工具列的 .seg 用同一種樣式語言，使用者不必再學一種控制項。 */
.p-tabs{
  display:flex;gap:2px;flex:0 0 auto;padding:9px 12px 0;
  background:var(--bg-2);border-bottom:1px solid var(--line);
}
.p-tabs button{
  flex:1;padding:8px 10px;border-radius:8px 8px 0 0;cursor:pointer;
  font-size:12.5px;color:var(--ink-3);background:none;border:1px solid transparent;
  border-bottom:0;transition:color var(--dur),background var(--dur),border-color var(--dur);
}
.p-tabs button:hover:not(:disabled){color:var(--ink)}
.p-tabs button[aria-pressed="true"]{
  color:var(--ink);background:var(--bg-2);border-color:var(--line);
  box-shadow:0 1px 0 var(--bg-2);
}
.p-tabs button:disabled{opacity:.4;cursor:default}



.lo-body{display:flex;gap:22px;flex-wrap:wrap;margin-top:11px}
.lo-sec{min-width:0}
.lo-sec h5{
  margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.lo-stats{display:flex;gap:6px;flex-wrap:wrap;max-width:640px}
.lo-st{
  font-size:var(--fs-read);padding:4px 10px;border-radius:7px;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
}
.lo-st b{color:var(--accent);font-weight:600}
.lo-st.max{border-color:color-mix(in srgb,#e0a340 40%,var(--line))}
/* 條件加成：用不同的邊色跟無條件屬性區隔，避免被誤讀成可以直接相加 */
.lo-st.cond{border-color:color-mix(in srgb,#7fa8ff 38%,var(--line))}
.lo-st.cond b{color:#7fa8ff}
.lo-st.flag{border-color:color-mix(in srgb,var(--mat) 34%,var(--line));color:var(--ink-2)}
.lo-st.max b{color:#e0a340}
.lo-list{display:flex;flex-direction:column;gap:5px;max-width:520px}
.lo-row{display:flex;gap:9px;align-items:flex-start;
  font-size:var(--fs-read);line-height:1.65}
.lo-row .ic{width:22px;height:22px;border-radius:5px;overflow:hidden;flex:0 0 auto;
  background:#0c0f15;box-shadow:0 0 0 1px var(--c,#39415a)}
.lo-row .ic img{width:100%;height:100%;object-fit:cover;display:block}
.lo-row .tx{min-width:0;color:var(--ink-2)}
.lo-row .tx b{color:var(--ink);font-weight:600}
.lo-note{font-size:var(--fs-sub);color:var(--ink-3);margin-top:10px;line-height:1.75}
.lo-setline{font-size:var(--fs-read);color:var(--ink-2);line-height:1.7}
.lo-setline b{color:var(--sc,var(--accent))}

/* -------- responsive */
@media (max-width:1100px){ .drawer{width:176px} }

/* ============================================================ 手機版
   桌機版建立在「同時看得見」上：側欄、格子、面板三欄並存，可以邊比對邊讀。
   手機一次只放得下一個焦點，所以這裡改的不只是寬度，是互動模型本身：
     側欄 -> 抽屜（要時才叫出來）
     面板 -> 底部 sheet（上滑展開、下滑關閉，跟系統手勢一致）
     工具列 -> 只留搜尋與篩選，其餘整組搬進抽屜
   同一份程式碼、同一份資料，只是換一種組合方式。 */
@media (max-width:860px){
  .topbar{gap:9px;padding:0 11px;height:52px}
  .brand span[data-i="sub"]{display:none}
  .brand b{font-size:14px}
  .brand .sv{padding:2px 6px}
  .search{max-width:none;flex:1}
  .spacer{display:none}

  /* 篩選鈕。有篩選在作用時右上角亮一點 ——
     不然使用者只會看到「怎麼只剩 7 件」，卻找不到原因。 */
  .tb-menu{
    position:relative;display:grid;place-items:center;flex:0 0 auto;
    width:38px;height:38px;border-radius:9px;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  }
  .tb-menu svg{width:18px;height:18px;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round}
  .tb-menu .dot{
    position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg-2);
  }

  /* -------- 側欄變抽屜 */
  /* 抽屜浮在被壓暗的畫面上，底色要比桌機那個 --bg-2 亮一階，
     否則跟遮罩後的背景一樣黑，邊界看不出來、會像內容被截掉。 */
  .drawer{
    position:fixed;left:0;top:52px;bottom:0;z-index:19;width:min(84vw,300px);
    background:var(--surface);
    border-right:1px solid var(--line-2);box-shadow:0 0 60px rgba(0,0,0,.8);
    transform:translateX(-100%);transition:transform .24s var(--ease);
  }
  body[data-drawer="1"] .drawer{transform:none}
  .dr-head{
    display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
    padding:10px 11px;border-bottom:1px solid var(--line);
  }
  .dr-head b{font-size:13px;letter-spacing:.04em}
  .dr-x{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-size:17px;color:var(--ink-2);cursor:pointer;
    background:var(--surface);border:1px solid var(--line);
  }
  .dr-tools{display:block;flex:0 0 auto;padding:11px;border-bottom:1px solid var(--line)}
  .tools{flex-direction:column;align-items:stretch;gap:9px}
  .tb-label{margin:0}
  .seg button{flex:1;padding:9px 8px;font-size:13px}
  .pick{width:100%;height:38px}

  /* -------- 觸控目標：一律拉到 40px 以上 */
  .tier{padding:10px 8px;font-size:13.5px}
  .cat-t{width:32px;height:36px;font-size:11px}
  .cat-n{padding:8px 6px;font-size:13px}
  .rail{padding:10px 8px 60px}

  /* -------- 格子 */
  :root{--tile:98px;--icon:54px}
  [data-density="compact"]{--tile:84px;--icon:46px}
  [data-density="dense"]{--tile:60px;--icon:48px}
  .grid{gap:7px;padding:2px 11px 16px}
  .sec-head{padding:0 11px}
  .main{padding-bottom:40vh}
  .hint{display:none}

  /* -------- 配裝列
     摘要在手機上很容易吃掉整個畫面，所以限高自己捲，
     另外給一個收合鈕：挑裝備時一鍵把格子的空間還回來。 */
  .load{padding:9px 11px 20px}
  .lo-body{gap:14px;flex-direction:column}
  .lo-slot{width:46px;height:46px}
  .lo-slot .x{opacity:1}          /* 觸控沒有 hover，移除鈕要一直看得見 */

  /* -------- 詳細面板變底部 sheet
     兩段停靠：預設 62vh 看得到屬性，往上拖到 94vh 看配方。
     往下拖過門檻就關閉 —— 下滑＝返回，不用教。 */
  .panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:17;
    width:auto;height:0;max-height:94vh;
    border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    transition:height .26s var(--ease);
  }
  .panel[data-open="1"]{width:auto;height:var(--sh,62vh);border-left-width:0}
  .panel[data-drag="1"]{transition:none}
  .p-inner{
    width:100%;opacity:0;transform:translateY(14px);
    transition:opacity .2s var(--ease) .04s,transform .26s var(--ease) .04s;
  }
  .panel[data-open="1"] .p-inner{opacity:1;transform:none}

  /* 橫向的抓握條，取代桌機的垂直拖曳邊 */
  .handle{
    left:0;right:0;top:0;bottom:auto;width:auto;height:26px;
    cursor:grab;touch-action:none;
  }
  .handle::before{width:38px;height:4px;margin-top:10px}
  .handle:hover::before,.handle[data-drag="1"]::before{height:4px;width:52px}
  /* sheet 的拖曳握把是絕對定位的，蓋住面板頂端 26px。
     分頁現在是第一個子元素，不推下來的話按鈕上半會變成「拖 sheet」。 */
  .p-tabs{padding:30px 10px 0}
  .p-tabs:not([hidden]) + .p-head{padding-top:14px}
  .p-head{padding:24px 16px 14px}
  .p-body{padding-bottom:40px}
  .p-close{top:20px;right:10px}
  .p-id{top:30px;right:52px}
  body[data-resizing="1"]{cursor:grabbing}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
