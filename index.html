ет войска. Юниты под эффектом умения \"Воодушевление\" получают 600% исцеления.\n\nБонус к защите: 4 ед.\nВремя действия бонуса: 12 сек.\nИсцеление: 20 + (10% сила умений) ед.\n\nПерезарядка: 24 сек."],"icon":"images/heroes/a_A01E.png","lvt":[{"i":2,"v":["4","8","12","16","20"]},{"i":4,"v":["20","30","40","50","60"]}]},{"id":"A01C","kind":"hero","n":["鼓舞","Inspiration","Воодушевление"],"k":"Q","lv":5,"t":["提升指定目標的攻擊力。若目標為英雄，則額外降低該目標的裝備技能冷卻。一般部隊獲得 150% 的攻擊力加成。\n\n攻擊力加成：15 + （12% 技能強度）點\n裝備技能冷卻（英雄）：-15%\n攻擊力加成（部隊）：\n持續時間：15 秒。\n\n冷卻：15 秒。","Increases the attack power of the chosen target. If the target is a hero, it additionally reduces the target's modifier cooldown. Regular units receive 150% of the attack bonus.\n\nAttack bonus: 15 + (12% spell power)\nModifier cooldown (heroes): -15%\nAttack bonus (units): \nDuration: 15 sec.\n\nCooldown: 15 sec.","Повышает силу атаки указанной цели. Если цель является героем, то дополнительно снижает перезарядку модификаторов для цели. Обычные войска получают 150% от бонуса к атаке.\n\nБонус к атаке: 15 + (12% сила умений) ед.\nПерезарядка модификаторов (герои): -15%\nБонус к атаке (войска): \nВремя действия: 15 сек.\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A01C.png","lvt":[{"i":2,"v":["15","30","45","60","75"]},{"i":3,"v":["15","20","25","30","35"]}]},{"id":"A01B","kind":"hero","n":["雷霆一擊","Thunder Clap","Громовой удар"],"k":"W","lv":5,"t":["對英雄周圍的敵人造成傷害並使其減速。此技能的傷害會隨著失去的生命值而提高。\n\n傷害：50 + （50% 技能強度）\n減速強度：-50% 移動速度，-50% 攻擊速度\n減速時間（部隊）：5 秒。\n減速時間（英雄）：3 秒。\n\n冷卻：9 秒。","Deals damage to enemies around the hero and slows them. The ability's damage can increase with missing health.\n\nDamage: 50 + (50% spell power)\nSlow power: -50% movement speed, -50% attack speed\nSlow duration (units): 5 sec.\nSlow duration (heroes): 3 sec.\n\nCooldown: 9 sec.","Наносит урон врагам вокруг героя и замедляет их. Урон умения может увеличиваться от недостающего здоровья.\n\nУрон: 50 + (50% сила умений)\nСила замедления: -50% скорость передвижения, -50% скорость атаки\nВремя замедления (войска): 5 сек.\nВремя замедления (герои): 3 сек.\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A01B.png","lvt":[{"i":2,"v":["50","100","150","200","250"]},{"i":4,"v":["5","5.5","6","6.5","7"]},{"i":5,"v":["3","3.3","3.6","3.9","4.2"]}]},{"id":"A0Y5","kind":"innate","n":["聖物守衛","Reliquary Warden","Страж реликвария"],"k":"","lv":null,"t":["物品中的倍增效果對此英雄產生雙倍效果。","Multipliers in items have a double effect on the hero.","Множители в предметах оказывают на героя двойной эффект."],"icon":"images/heroes/a_A0Y5.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0R6","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量階級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0R6.png","opts":[{"id":"A0RH","n":["挑釁者","Provocateur","Провокатор"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+2 / +1\n+1 / +0\n+0 / +0\n\n使用後迫使附近的敵人攻擊英雄。\n\n被動效果：\n「雷霆一擊」會移除敵人身上的正面效果，並移除英雄身上的負面效果與狀態。\n\n英雄每次受到傷害時回復 1 點生命值。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+1 / +0\n+0 / +0\n\nOn use, forces nearby enemies to attack the hero.\n\nPassive effects:\n\"Thunder Clap\" removes positive effects from enemies and removes negative effects and statuses from the hero.\n\nThe hero restores 1 health each time he takes damage.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+1 / +0\n+0 / +0\n\nПри использовании заставляет ближайших врагов атаковать героя.\n\nПассивный эффекты:\nУмение \"Громовой удар\" удаляет положительные эффекты с врагов и удаляет отрицательные эффекты и статусы на герое.\n\nГерой восстанавливает 1 ед. здоровья каждый раз когда получает урон."],"icon":"images/heroes/a_A0RH.png"},{"id":"A0Y2","n":["國王的祝福","King's Blessing","Благословение короля"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+3 / +1\n+1 / +0\n+3 / +1\n\n英雄每次提升等級時，生命值上限提高 100 點、攻擊力提高 10 點，但同時復活時間增加 1 秒。\n\n英雄獲得點燃抗性、流血抗性以及 +20% 反傷加成。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+3 / +1\n+1 / +0\n+3 / +1\n\nOn level up, the hero's maximum health increases by 100 and attack power by 10, but the resurrection time increases by 1 sec.\n\nThe hero gains Burn resistance, Bleed resistance and a +20% thorns bonus.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+3 / +1\n+1 / +0\n+3 / +1\n\nПри повышении уровня запас здоровья героя повышается на 100 ед., сила атаки на 10 ед., но при этом время воскрешения увеличивается на 1 сек.\n\nГерой получает сопротивление поджогу, сопротивление кровотечению и бонус +20% усиление ответного урона."],"icon":"images/heroes/a_A0Y2.png"}]}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["近戰英雄，可走多種路線。裝備類乘數對他影響特別大。","A melee hero with several viable roles - modifier items affect him unusually strongly.","Герой ближнего боя, обладающий несколькими потенциальными ролями. Предметы-множители оказывают на данного героя двойной эффект."]},{"id":"N01V","n":["蠻族戰士","Barbarian","Варвар"],"attr":"str","unlock":0,"random":true,"builds":[],"skins":[{"id":"Hpb2","on":true,"n":["邪惡聖誕老人","Evil Santa","Злой Санта"]}],"author":null,"icon":"images/heroes/h_N01V.png","proper":"Дархар","st":{"str":null,"str_lv":3.0,"agi":null,"agi_lv":null,"int":null,"int_lv":1.5,"speed":null},"roles":[["戰士","Fighter","рубака"],["坦克","Tank","танк"]],"sc":[["sp","as","armor"],[]],"mod":[],"sp":["A082","A081","A07L","A07Z"],"ab":[{"id":"A082","kind":"hero","n":["求生","Survival","Выживание"],"k":"W","lv":5,"t":["英雄開始回復自身的生命值，但在技能持續期間，其攻擊速度與移動速度會降低。\n\n治療強度：200 + （100% 技能強度）\n攻擊速度與移動速度減緩：-40%\n持續時間：10 秒。\n\n冷卻：28 秒。","The hero begins to restore his own health, but his attack speed and movement speed are reduced for the duration of the ability.\n\nHealing power: 200 + (100% spell power)\nAttack and movement speed slow: -40%\nDuration: 10 sec.\n\nCooldown: 28 sec.","Герой начинает восстанавливать себе здоровье, но на время действия умения его скорость атаки и бега уменьшены.\n\nСила исцеления: 200 + (100% сила умений)\nЗамедление скорости атаки и бега: -40%\nВремя действия: 10 сек.\n\nПерезарядка: 28 сек."],"icon":"images/heroes/a_A082.png","lvt":[{"i":2,"v":["200","300","400","500","600"]}]},{"id":"A081","kind":"hero","n":["野性戰士","Wild Warrior","Дикий воин"],"k":"","lv":5,"t":["擊殺敵人可暫時提升英雄的力量。\n\n力量加成：2 點\n力量加成（技能強度 300 以上）：3 點\n加成時間：5 秒。","Killing enemies temporarily increases the hero's Strength.\n\nStrength bonus: 2\nStrength bonus (300+ spell power): 3\nBonus duration: 5 sec.","Убийства врагов временно повышают силу героя.\n\nБонус к силе: 2 ед.\nБонус к силе (300+ сила умений): 3 ед.\nВремя бонуса: 5 сек."],"icon":"images/heroes/a_A081.png","lvt":[{"i":4,"v":["5","7","9","11","13"]}]},{"id":"A080","kind":"hero","n":["斬擊者","Slasher","Слешер"],"k":"","lv":null,"t":["蠻族戰士的攻擊對非英雄且非建築的普通敵人造成的傷害提高 75%。","The Barbarian's attacks deal 75% more damage to ordinary enemies that are not heroes or buildings.","Атаки варвара наносят на 75% больше урона по обычным противникам, не являющимся героями или строениями."],"icon":"images/heroes/a_A080.png"},{"id":"A07L","kind":"hero","n":["震懾咆哮","Terrifying Roar","Устрашающий рев"],"k":"Q","lv":5,"t":["英雄發出震懾人心的咆哮，降低附近敵人的護甲與攻擊力。\n\n護甲降低：3 點\n攻擊力降低：15%\n持續時間：30 秒（英雄 15 秒）\n技能強度 200 以上：英雄攻擊速度 +75%，持續 8 秒。\n\n冷卻：25 秒。","The hero lets out a terrifying roar that reduces the armour and attack power of nearby enemies.\n\nArmour reduction: 3\nAttack power reduction: 15%\nDuration: 30 sec. (heroes 15 sec.)\nAt 200+ spell power: +75% hero attack speed for 8 sec.\n\nCooldown: 25 sec.","Герой издает устрашающий рев, уменьшающий защиту противников поблизости и их силу атаки.\n\nСнижение защиты: 3 ед.\nСнижение силы атаки: 15%\nВремя действия: 30 сек. (герои 15 сек.)\nПри силе умений 200+: +75% скорость атаки героя на 8 сек.\n\nПерезарядка: 25 сек."],"icon":"images/heroes/a_A07L.png","lvt":[{"i":2,"v":["3","4","5","6","7"]},{"i":3,"v":["15","21","27","33","39"]}]},{"id":"A07Z","kind":"innate","n":["強健體魄","Robust Health","Крепкое здоровье"],"k":"","lv":null,"t":["藥水對英雄的效果提高 30%。","Potions are 30% more effective on the hero.","Зелья действуют на героя на 30% эффективнее."],"icon":"images/heroes/a_A07Z.png"},{"id":"A0KP","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0KP.png","opts":[{"id":"A0ML","n":["猛士","Mighty Champion","Богатырь"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+3 / +1\n+0 / +0\n+0 / +0\n\n技能「求生」每缺少 1% 生命值，就多回復 1% 生命值。\n\n技能「野性戰士」在每次獲得的效果結束後，有 5% 機率保留 1 點力量。累積獲得 100 點力量後，機率降低至 3%。指令「-i」會顯示已獲得的力量。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+3 / +1\n+0 / +0\n+0 / +0\n\nThe \"Survival\" ability restores 1% more health for each 1% of missing health.\n\nThe \"Wild Warrior\" ability has a 5% chance to keep 1 Strength after each gained effect expires. After gaining 100 Strength the chance drops to 3%. The \"-i\" command displays the Strength gained.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+3 / +1\n+0 / +0\n+0 / +0\n\nУмение \"Выживание\" восстанавливает на 1% больше здоровья за каждый недостающий 1% здоровья.\n\nУмение \"Дикий воин\" имеет 5% шанс сохранить 1 ед. силы после истечения каждого полученного эффекта. После получения 100 ед. силы шанс снижается до 3%. Команда \"-i\" отобразит полученную силу."],"icon":"images/heroes/a_A0ML.png"},{"id":"A0MN","n":["弒酋者","Chieftain Slayer","Убийца вождей"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+5 / +2\n+1 / +0\n+1 / +0\n\n技能「震懾咆哮」的作用範圍提升 50%，施放時造成（125% 力量）點傷害。\n\n技能「斬擊者」改為另一種效果——對敵方英雄造成的傷害提高 75%，受到英雄的傷害降低 25%。\n\n擊殺敵方英雄可提升 5 點力量。每擊殺 3 名英雄，力量的累積量便減少 1 點，最低為 1 點。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+5 / +2\n+1 / +0\n+1 / +0\n\nThe area of the \"Terrifying Roar\" ability is increased by 50%, and on use it deals (125% Strength) damage.\n\nThe \"Slasher\" ability gains a different effect - it increases damage dealt to enemy heroes by 75% and reduces damage taken from heroes by 25%.\n\nKills of enemy heroes increase Strength by 5. The Strength gained is reduced by 1 for every 3 hero kills, down to a minimum of 1.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+5 / +2\n+1 / +0\n+1 / +0\n\nОбласть действия умения \"Устрашающий рев\" увеличена на 50%, при применении наносит урон в размере (125% сила) ед.\n\nУмение \"Слешер\" приобретает другой эффект - увеличивает наносимый вражеским героям урон на 75% и уменьшает получаемый урон от героев на 25%.\n\nУбийства вражеских героев повышают силу на 5 ед. Накопление силы уменьшается на 1 ед. за каждые 3 убийства героев до минимума в 1 ед."],"icon":"images/heroes/a_A0MN.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["高","High","высокий"],"d":["獨立性強的近戰英雄，不需要隊友照顧也能撐住。","A self-sufficient melee hero who can hold his own without help.","Самостоятельный герой ближнего боя, способный держаться без посторонней помощи. Получает усиленный эффект от применения зелий."]},{"id":"Nsjs","n":["超重型坦克","Super-Heavy Tank","Сверхтяжёлый танк"],"attr":"str","unlock":0,"random":false,"builds":[],"skins":[],"author":"angelhaosatut","icon":"images/heroes/h_Nsjs.png","proper":"Бейнблейд","st":{"str":38,"str_lv":6.0,"agi":6,"agi_lv":1.0,"int":20,"int_lv":2.200000047683716,"speed":null},"roles":[["戰士","Fighter","рубака"],["坦克","Tank","танк"]],"sc":[["sp","as","dburn"],["burn"]],"mod":[],"sp":["A0XO","A0XS"],"ab":[{"id":"A0XO","kind":"hero","n":["衝擊火箭","Impact Rocket","Ударная ракета"],"k":"Q","lv":5,"t":["向指定區域發射一枚火箭，造成傷害並以 100% 機率暈眩敵人。具有點燃效果。\n\n傷害：80 +（30% 技能強度）\n點燃效果：50% 機率，100% 傷害\n暈眩：3 秒（英雄 2 秒）\n英雄 25 級：每 8 秒一次，攻擊會發射一枚火箭，造成 50% 傷害並暈眩 2 秒（英雄 1 秒）\n\n冷卻：18 秒","Launches a rocket at the target area that deals damage and also stuns enemies with a 100% chance. Has a Burn effect.\n\nDamage: 80 + (30% spell power)\nBurn effect: 50% chance, 100% damage\nStun: 3 sec. (heroes 2 sec.)\nHero level 25: once every 8 sec. an attack fires a rocket with 50% damage and a 2 sec. stun (heroes 1 sec.)\n\nCooldown: 18 sec.","Запускает ракету в указанную область, наносящую урон, а также оглушающую противников с 100% шансом. Имеет эффект поджога.\n\nУрон: 80 + (30% сила умений)\nЭффект поджога: 50% шанс, 100% урона\nОглушение: 3 сек. (герои 2 сек.)\n25 уровень героя: раз в 8 сек. атака выпускает ракету с 50% уроном и оглушением на 2 сек. (герои 1 сек.)\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A0XO.png","lvt":[{"i":2,"v":["80","120","160","200","240"]}]},{"id":"A0XQ","kind":"hero","n":["衝撞","Ram","Таран"],"k":"W","lv":5,"t":["朝指定地點加速衝刺，對路徑上的敵人造成傷害並將其推開。坦克會一路移動到技能指定的地點。\n\n傷害：100 +（100% 力量）\n\n冷卻：20 秒","Accelerates toward the target point, dealing damage to and pushing away enemies in its path. The tank moves to the point specified by the ability.\n\nDamage: 100 + (100% Strength)\n\nCooldown: 20 sec.","Разгоняется в указанную точку, нанося урон и отталкивая врагов на своём пути. Танк движется до указанной умением точки.\n\nУрон: 100 + (100% сила)\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0XQ.png","lvt":[{"i":2,"v":["100","150","200","250","300"]}]},{"id":"A0XT","kind":"hero","n":["燃燒砲塔","Igniting Turrets","Поджигающие турели"],"k":"","lv":5,"t":["砲塔的投射物有機率點燃敵人。\n\n點燃（砲塔投射物）：40% 機率；傷害等於英雄力量的 60%","Turret projectiles can set enemies on fire.\n\nBurn (turret projectiles): 40% chance; damage equals 60% of the hero's Strength","Снаряды турелей могут поджигать противников.\n\nПоджог (снаряды турелей): 40% шанс; урон равен 60% от силы героя"],"icon":"images/heroes/a_A0XT.png","lvt":[{"i":2,"v":["40% шанс; урон равен 60","45% шанс; урон равен 70","50% шанс; урон равен 80","55% шанс; урон равен 90","60% шанс; урон равен 100"]}]},{"id":"A0XS","kind":"hero","n":["砲兵轟擊","Artillery Barrage","Артиллерийский обстрел"],"k":"R","lv":1,"t":["向指定區域發射 3 波砲彈。每一枚砲彈都會造成範圍傷害並點燃敵人。\n\n砲彈傷害：35 +（35% 技能強度）點\n點燃：50% 機率；50% 傷害\n施放距離：無限制\n\n冷卻：90 秒","Fires 3 volleys of projectiles at the target area. Each projectile deals area damage and burns enemies.\n\nProjectile damage: 35 + (35% spell power)\nBurn: 50% chance; 50% damage\nCast range: unlimited\n\nCooldown: 90 sec.","Выстреливает 3 залпа снарядов по указанной области. Каждый снаряд наносит урон по области и поджигает противников.\n\nУрон снаряда: 35 + (35% сила умений) ед.\nПоджог: 50% шанс; 50% урона\nДальность применения: без ограничений\n\nПерезарядка: 90 сек."],"icon":"images/heroes/a_A0XS.png"},{"id":"A0XR","kind":"innate","n":["側翼砲塔","Side Turrets","Боковые турели"],"k":"","lv":null,"t":["坦克上裝設了側翼砲塔，會掃描英雄兩側的區域並向敵人開火。砲塔的射速與其掃描頻率相關聯。每座砲塔的掃描各自獨立進行。\n\n掃描頻率：每 1-2 秒\n砲塔砲彈傷害：（90% 力量）點\n\n「魔法齒輪」道具加成：砲塔攻擊速度 +100%\n\n每達成 100 次擊殺，點燃傷害會額外乘上 2%。層數之間不會互相相乘。","Side turrets are mounted on the tank; they scan the areas to the sides of the hero and fire projectiles at enemies. The turrets' rate of fire is tied to their scanning frequency. Scanning happens separately for each turret.\n\nScanning frequency: every 1-2 sec.\nTurret projectile damage: (90% Strength)\n\n\"Magic Gear\" item bonus: +100% turret attack speed\n\nFor every 100 kills, burn damage is additionally multiplied by 2%. Stacks do not multiply with each other.","На танк установлены боковые турели, сканирующие области по бокам от героя и ведущие огонь снарядами по противникам. Скорострельность турелей привязана к их частоте сканирования. Для каждой турели сканирование происходит отдельно.\n\nЧастота сканирования: каждые 1-2 сек.\nУрон от снарядов турелей: (90% сила) ед.\n\nБонус предмета \"Волшебная шестерёнка\": +100% скорость атаки турелей\n\nЗа каждые 100 убийств урон от поджога дополнительно умножается на 2%. Стаки не перемножают друг друга."],"icon":"images/heroes/a_A0XR.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T3+","T3+","Т3+"],"late":["高","High","высокий"],"d":["結實的遠程英雄，防禦類型為「強化」，側翼砲塔會自動射擊前方敵人，可累積點燃強化。","A sturdy ranged hero with Fortified armour and side turrets that fire on their own, stacking burn amplification.","Крепкий герой дальнего боя, обладающий типом защиты \"Укрепленный\" и имеющий боковые турели, которые самостоятельно обстреливают врагов перед танком. Может накапливать усиление эффекта поджога."]},{"id":"H03I","n":["遠古九頭蛇","Ancient Hydra","Древняя гидра"],"attr":"str","unlock":0,"random":false,"builds":[],"skins":[],"author":"Koshitan","icon":"images/heroes/h_H03I.png","proper":"Кето","st":{"str":31,"str_lv":4.5,"agi":13,"agi_lv":2.0,"int":21,"int_lv":2.0,"speed":320},"roles":[["戰士","Fighter","рубака"]],"sc":[["sp","ddise"],["disease"]],"mod":[],"sp":["A02N","Awrh","A0OM"],"ab":[{"id":"A02N","kind":"hero","n":["瘟疫吐息","Plague Spit","Чумной плевок"],"k":"W","lv":5,"t":["以瘟疫投射物轟擊指定區域，每一發都會造成範圍傷害並施加「疾病」狀態。\n\n投射物傷害：20 +（10% 技能強度）點；50% 機率施加 200% 傷害的疾病\n投射物數量：發射 3 次 - 6/10/14 發\n\n冷卻：15 秒","Strikes the target area with plague projectiles, each of which deals area damage and applies the \"Disease\" status.\n\nProjectile damage: 20 + (10% spell power); 50% chance to apply Disease with 200% damage\nNumber of projectiles: fires 3 times - 6/10/14 projectiles\n\nCooldown: 15 sec.","Поражает указанную область чумными снарядами, каждый из которых наносит урон по области и применяет статус \"болезнь\".\n\nУрон снаряда: 20 + (10% сила умений) ед.; 50% шанс применить болезнь с 200% урона\nКоличество снарядов: выстреливает 3 раза - 6/10/14 снарядов\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A02N.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"Awrh","kind":"hero","n":["尾擊","Tail Strike","Удар хвостом"],"k":"W","lv":5,"t":["對周圍的敵人造成傷害並將其暈眩。當「刺激」效果啟動時，額外對被擊中的目標施加疾病。\n\n傷害：50 +（35% 技能強度）點\n暈眩時間：5 秒（英雄 2 秒）\n若「刺激」效果啟動中：以 50% 機率對敵人施加 200% 傷害的疾病\n\n冷卻：212 秒","Deals damage to surrounding enemies and stuns them. While the \"Stimulation\" effect is active, additionally applies Disease to the struck targets.\n\nDamage: 50 + (35% spell power)\nStun duration: 5 sec. (2 sec. heroes)\nIf the \"Stimulation\" effect is active: enemies are affected by a 50% chance of Disease with 200% damage\n\nCooldown: 212 sec.","Наносит урон врагам вокруг и оглушает их. При активном эффекте \"Стимуляции\" дополнительно применяет болезнь к пораженным целям.\n\nУрон: 50 + (35% сила умений) ед.\nВремя оглушения: 5 сек. (2 сек. герои)\nЕсли активен эффект \"Стимуляции\": к врагам применяется 50% шанс болезни с 200% уроном\n\nПерезарядка: 212 сек."],"icon":"images/heroes/a_Awrh.png","lvt":[{"i":2,"v":["50","100","150","200","250"]}]},{"id":"A03P","kind":"hero","n":["刺激","Stimulation","Стимуляция"],"k":"E","lv":5,"t":["英雄暫時提升自身從「成長」、物品以及自身力量獲得的生命值回復。技能持續期間，疾病造成的傷害也會提升。\n\n生命值回復提升：+75%\n疾病傷害提升：+30%\n持續時間：10 秒\n\n冷卻：20 秒","The hero temporarily increases his health regeneration gained from \"Growth\", from items and from his own Strength. While the ability is active, damage from Disease is also increased.\n\nHealth regeneration increase: +75%\nDisease damage increase: +30%\nDuration: 10 sec.\n\nCooldown: 20 sec.","Герой временно увеличивает свою регенерацию здоровья, полученную от \"Роста\", предметов и от собственной силы. Также во время действия умения урон от болезни увеличен.\n\nУвеличение регенерации здоровья: +75%\nУвеличение урона от болезни: +30%\nВремя действия: 10 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A03P.png","lvt":[{"i":2,"v":["75","90","105","120","135"]},{"i":3,"v":["30","45","60","75","90"]}]},{"id":"A0OM","kind":"hero","n":["多頭怪物","Many-Headed Monster","Многоголовое чудовище"],"k":"","lv":null,"t":["九頭蛇的攻擊會週期性額外產生 3 發彈體，每發打擊一名隨機敵人，造成傷害並施加疾病。\n\n傷害：50 + （25% 技能強度）；100% 疾病機率，100% 傷害\n若「刺激」效果啟動中：冷卻加速 200%\n\n冷卻：10 秒","The hydra's attack periodically creates 3 more projectiles, each of which strikes a random enemy, dealing damage and applying Disease.\n\nDamage: 50 + (25% spell power); 100% Disease chance, 100% damage\nIf the \"Stimulation\" effect is active: cooldown accelerated by 200%\n\nCooldown: 10 sec.","Атака гидры периодически создаёт ещё 3 снаряда, каждый из которых поражает случайного врага, нанося урон и применяя болезнь.\n\nУрон: 50 + (25% сила умений); 100% шанс болезни, 100% урона\nЕсли активен эффект \"Стимуляции\": ускорение перезарядки на 200%\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0OM.png"},{"id":"A0ZO","kind":"innate","n":["雜食","Omnivore","Всеядность"],"k":"D","lv":1,"t":["你可以將屬於植物、食物或生物的物品移動到第二背包（F2）。如此一來第二背包中可以擁有 1 件物品。","You can move an item that is a plant, food or organism into the second inventory (F2). In this way you can have 1 item in the second inventory.","Вы можете переместить во второй инвентарь (F2) предмет, являющийся растением, пищей или организмом. Таким образом можно иметь 1 предмет во втором инвентаре."],"icon":"images/heroes/a_A0ZO.png"},{"id":"A0ZN","kind":"innate","n":["成長","Growth","Рост"],"k":"","lv":null,"t":["九頭蛇每提升一級都會成長，並獲得 +50 生命值上限、+2 生命回復與 +5 攻擊力。","With each level gained, the hydra grows and receives +50 maximum health, +2 health regeneration and +5 attack power.","С каждым повышением уровня гидра будет расти и получать +50 к запасу здоровья, +2 к регенерации здоровья и +5 к силе атаки."],"icon":"images/heroes/a_A0ZN.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T3+","T3+","Т3+"],"late":["高","High","высокий"],"d":["結實的遠程英雄，回復能力優秀，每次升級都有額外加成；滿等之後仍能繼續成長。","A sturdy ranged hero with strong regeneration and extra bonuses per level - and it keeps growing past max level.","Крепкий герой дальнего боя, обладающий хорошими показателями регенерации. Получает дополнительные бонусы за повышение уровня. После получения максимального уровня может продолжать расти."]},{"id":"H00Z","n":["邪惡聖誕老人","Evil Santa","Злой Санта"],"attr":"str","unlock":0,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_H00Z.png","proper":"","st":{"str":21,"str_lv":2.5999999046325684,"agi":11,"agi_lv":1.2999999523162842,"int":20,"int_lv":1.899999976158142,"speed":320},"roles":[["治療","Healing","исцеление"],["坦克","Tank","танк"]],"sc":[["sp","as","armor"],[]],"mod":[],"sp":["A02Y","A02W","A030","A0M5"],"ab":[{"id":"A02Z","kind":"hero","n":["智慧","Wisdom","Мудрость"],"k":"","lv":5,"t":["提高「神聖職責」的層數上限。「恩典」技能可提升目標的攻擊速度，持續 6 秒。「傷口癒合」技能會額外以百分比治療目標。「光之解放」技能對友方英雄回復更多生命值。\n\n「神聖職責」層數上限：+5\n「恩典」強化：+20% 攻擊速度\n「傷口癒合」強化：4% 最大生命值治療\n「光之解放」強化：英雄治療 +5% 最大生命值","Increases the stack limit of \"Holy Duty\". The \"Grace\" ability increases the target's attack speed for 6 sec. The \"Wound Healing\" ability additionally heals targets by a percentage. The \"Release of Light\" ability heals allied heroes for more health.\n\n\"Holy Duty\" stack limit: +5\n\"Grace\" bonus: +20% attack speed\n\"Wound Healing\" bonus: 4% Max HP healing\n\"Release of Light\" bonus: +5% Max HP healing for heroes","Увеличивает лимит стаков \"Святого долга\". Умение \"Благодать\" повышает скорость атаки цели на 6 сек. Умение \"Заживление ран\" дополнительно исцеляет цели в % соотношении. Умение \"Высвобождение света\" исцеляет союзным героям больше здоровья.\n\nЛимит стаков \"Святого долга\": +5\nУсиление \"Благодать\": +20% скорость атаки\nУсиление \"Заживление ран\": 4% Мах HP исцеления\nУсиление \"Высвобождение света\": +5% Мах HP исцеления героев"],"icon":"images/heroes/a_A02Z.png","lvt":[{"i":2,"v":["5","10","15","20","25"]},{"i":3,"v":["20","30","40","50","60"]},{"i":4,"v":["4","6","8","10","12"]},{"i":5,"v":["5","10","15","20","25"]}]},{"id":"A02Y","kind":"hero","n":["傷口癒合","Wound Healing","Заживление ран"],"k":"W","lv":5,"t":["為英雄與附近的友方單位回復生命值。\n\n治療強度：60 + （35% 技能強度）點\n作用範圍：500 點\n\n冷卻：20 秒","Restores health to the hero and nearby friendly units.\n\nHealing power: 60 + (35% spell power)\nArea: 500\n\nCooldown: 20 sec.","Восстанавливает здоровье герою и ближайшим дружественным юнитам.\n\nСила исцеления: 60 + (35% сила умений) ед.\nОбласть действия: 500 ед.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A02Y.png","lvt":[{"i":2,"v":["60","90","120","150","180"]}]},{"id":"A02W","kind":"hero","n":["恩澤","Grace","Благодать"],"k":"Q","lv":5,"t":["立即治療指定的友方單位，或對敵方不死族造成傷害。\n\n治療強度：200 +（75% 技能強度）點\n對不死族的傷害：治療量的 60%；技能強度達 300+ 時，傷害提升至 90%。\n\n冷卻：13 秒","Instantly heals the target friendly unit or deals damage to enemy undead.\n\nHealing power: 200 + (75% spell power)\nDamage to undead: 60% of the healing; at 300+ spell power the damage increases to 90%.\n\nCooldown: 13 sec.","Мгновенно исцеляет указанного дружественного юнита или наносит урон вражеской нежити.\n\nСила исцеления: 200 + (75% сила умений) ед.\nУрон нежити: 60% от исцеления; при силе умений 300+ урон повышается до 90%.\n\nПерезарядка: 13 сек."],"icon":"images/heroes/a_A02W.png","lvt":[{"i":2,"v":["200","300","400","500","600"]}]},{"id":"A02U","kind":"hero","n":["正義之怒","Righteous Fury","Праведный гнев"],"k":"R","lv":null,"t":["消耗所有已累積的「神聖職責」層數，提升聖騎士的護甲、攻擊力與攻擊速度。使用時英雄會失去一半的「神聖職責」層數，加成的層數計算在扣除之前進行。在層數達到上限時使用此技能，會使層數上限提高 1。\n\n攻擊力提升：+30（每層 +12）\n攻擊速度提升：+15%（每層 +5%）\n護甲提升：+10（每層 +3）\n持續時間：25 秒\n\n冷卻：70 秒","Uses all accumulated \"Holy Duty\" stacks and increases the paladin's armour, attack power and attack speed. On use the hero loses half of the \"Holy Duty\" stacks; the stacks are counted for the bonuses before they are deducted. Using the ability at the maximum stack count raises the stack limit by 1.\n\nAttack power increase: +30 (+12 per stack)\nAttack speed increase: +15% (+5% per stack)\nArmour increase: +10 (+3 per stack)\nDuration: 25 sec.\n\nCooldown: 70 sec.","Использует все накопленные стаки \"Святого долга\" и повышает защиту, силу атаки и скорость атаки паладина. При использовании герой теряет половину стаков \"Святого долга\", учёт стаков для начисления бонусов идёт до момента их вычета. При использовании умения при максимальном запасе стаков повышает их лимит на 1.\n\nУвеличение силы атаки: +30 (+12 за каждый стак)\nУвеличение скорости атаки: +15% (+5% за каждый стак)\nУвеличение защиты: +10 (+3 за каждый стак)\nВремя действия: 25 сек.\n\nПерезарядка: 70 сек."],"icon":"images/heroes/a_A02U.png"},{"id":"A030","kind":"innate","n":["神聖職責","Holy Duty","Святой долг"],"k":"","lv":null,"t":["英雄的技能可透過造成的治療累積「神聖職責」層數。這些層數會提升英雄技能的治療強度，並用於發動聖騎士的強力技能。你可以透過指令「-i」查看層數資訊，也會在每次施放英雄技能時顯示。\n\n層數累積：每 350 點治療累積 1 層\n治療強度：每 1 層 +1%。\n初始層數上限：15","The hero's abilities can accumulate \"Holy Duty\" stacks for the healing performed. These stacks increase the healing power of the hero's abilities and are used to unleash the paladin's powerful abilities. You can check the number of stacks with the \"-i\" command, and also every time the hero's abilities are used.\n\nStack gain: 1 stack per 350 healing\nHealing power: +1% per stack.\nStarting stack limit: 15","Умения героя могут накапливать стаки \"святого долга\" за осуществленное исцеление. Данные стаки повышают силу исцеления способностей героя и используются для реализации мощных умений паладина. Информацию о количестве стаков вы сможете узнать через команду \"-i\", а также при каждом применении умений героя.\n\nНакопление стаков: 1 стак за 350 ед. исцеления\nСила исцеления: +1% за 1 стак.\nНачальный лимит стаков: 15"],"icon":"images/heroes/a_A030.png"},{"id":"A0M5","kind":"innate","n":["光之解放","Release of Light","Высвобождение света"],"k":"D","lv":1,"t":["消耗 20 層「神聖職責」。\n\n釋放強大的光之波動，對英雄周圍的敵人造成傷害，並治療聖騎士附近的友方英雄以及英雄自身。不會繼承「神聖職責」技能的效果。\n\n傷害：350 + （125% 技能強度） + （剩餘層數 * 12.5）點\n友方英雄治療：15% 最大生命值","Consumes 20 stacks of \"Holy Duty\".\n\nEmits a powerful wave of light that damages enemies around the hero and heals allied heroes near the paladin as well as the hero himself. Does not inherit the effects of the \"Holy Duty\" ability.\n\nDamage: 350 + (125% spell power) + (remaining stacks * 12.5)\nHealing for allied heroes: 15% Max HP","Расходует 20 стаков \"Святого долга\".\n\nИспускает мощную волну света, наносящую урон врагам вокруг героя и исцеляющую союзных героев рядом с паладином и самого героя. Не наследует эффекты умения \"Святой долг\".\n\nУрон: 350 + (125% сила умений) + (оставшиеся стаки * 12.5) ед.\nИсцеление союзных героев: 15% Мах HP"],"icon":"images/heroes/a_A0M5.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["極高","Top","высший"],"d":["近戰英雄，積極治療隊友可以累積增益。","A melee hero who stacks bonuses by actively healing allies.","Герой, ближнего боя, имеющий накопительные бонусы за активное исцеление союзников."]},{"id":"N017","n":["釀酒師","Brewmaster","Пивовар"],"attr":"str","unlock":0,"random":true,"builds":[],"skins":[{"id":"E00M","on":true,"n":["深淵逃脫者","Escapee from the Abyss","Сбежавший из Бездны"]}],"author":null,"icon":"images/heroes/h_N017.png","proper":"Портос Эрм","st":{"str":null,"str_lv":null,"agi":22,"agi_lv":3.0,"int":18,"int_lv":2.0,"speed":320},"roles":[["坦克","Tank","танк"],["詛咒者","Curser","проклинатель"]],"sc":[["sp","as"],[]],"mod":[],"sp":["A050"],"ab":[{"id":"A054","kind":"hero","n":["挑釁者","Bully","Задира"],"k":"","lv":5,"t":["英雄的攻擊會對周圍敵人造成額外傷害。可能將敵人暈眩。\n\n傷害：40 +（40% 力量）點\n暈眩：25% 機率，1 秒\n若敵人身上有「酒氣」效果：傷害提高 50%，暈眩機率提升至 75%\n\n冷卻：6 秒","The hero's attack is accompanied by additional damage to surrounding enemies. Can stun enemies.\n\nDamage: 40 + (40% Strength)\nStun: 25% chance, 1 sec.\nIf the enemy has the \"Wine Fumes\" effect: 50% more damage, stun chance increased to 75%\n\nCooldown: 6 sec.","Атака героя сопровождается нанесением дополнительного урона врагам вокруг. Может оглушить противников.\n\nУрон: 40 + (40% сила) ед.\nОглушение: 25% шанс, 1 сек.\nЕсли враг имеет эффект \"Винные пары\": на 50% больше урона, шанс оглушения увеличен до 75%\n\nПерезарядка: 6 сек."],"icon":"images/heroes/a_A054.png","lvt":[{"i":2,"v":["40","60","80","100","120"]}]},{"id":"A051","kind":"hero","n":["烈性藥湯","Potent Brew","Ядреный отвар"],"k":"R","lv":1,"t":["英雄提升自身力量，免疫物理傷害，並加快「挑釁者」技能的冷卻速度。\n\n力量提升：永久 +2 點\n「挑釁者」冷卻加速：+100%\n持續時間：12 秒\n\n冷卻：60 秒","The hero increases his Strength, becomes immune to physical damage and speeds up the cooldown of the \"Bully\" ability.\n\nStrength increase: +2 permanently\n\"Bully\" cooldown acceleration: +100%\nDuration: 12 sec.\n\nCooldown: 60 sec.","Герой повышает свою силу, становится невосприимчивым к физическому урону и ускоряет перезарядку умения \"Задира\".\n\nПовышение силы: +2 ед. навсегда\nУскорение перезарядки \"Задиры\": +100%\nВремя действия: 12 сек.\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A051.png"},{"id":"A050","kind":"hero","n":["小酌一杯","Have a Drink","Выпить немного"],"k":"Q","lv":5,"t":["英雄飲下藥酒，立即回復自身生命值。若施放技能當下英雄的生命值低於 35%，釀酒師可獲得 +1 點力量。\n\n治療強度：150 +（100% 技能強度）點\n\n冷卻：20 秒","The hero drinks a brew, instantly restoring his own health. If the hero's health is below 35% at the moment the ability is used, the Brewmaster gains +1 Strength.\n\nHealing power: 150 + (100% spell power)\n\nCooldown: 20 sec.","Герой выпивает отвара, мгновенно восстанавливая себе здоровье. Если в момент применения умения здоровье героя меньше 35%, пивовар получает +1 ед. силы.\n\nСила исцеления: 150 + (100% сила умений) ед.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A050.png","lvt":[{"i":2,"v":["150","225","300","375","450"]}]},{"id":"A04Y","kind":"hero","n":["醉人酒氣","Wine Fumes","Винные пары"],"k":"W","lv":5,"t":["以醉人的酒氣籠罩敵人，降低其移動速度。受影響的敵人攻擊時可能落空。\n\n移動速度降低：30%\n落空機率：20%\n作用範圍：200 點\n持續時間：12 秒（英雄 5 秒）\n\n冷卻：12 秒","Envelops enemies in intoxicating fumes, reducing their movement speed. Affected enemies may miss with their attacks.\n\nMovement speed reduction: 30%\nMiss chance: 20%\nArea: 200\nDuration: 12 sec. (heroes 5 sec.)\n\nCooldown: 12 sec.","Окутывает врагов опьяняющими парами, снижая их скорость передвижения. Пораженные враги могут промахиваться при атаках.\n\nСнижение скорости передвижения: 30%\nШанс на промах: 20%\nОбласть поражения: 200 ед.\nВремя действия: 12 сек. (герои 5 сек.)\n\nПерезарядка: 12 сек."],"icon":"images/heroes/a_A04Y.png","lvt":[{"i":2,"v":["30","35","40","45","50"]},{"i":3,"v":["20","25","30","35","40"]},{"i":4,"v":["200","225","250","275","300"]}]},{"id":"A04N","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，使英雄大幅強化至新的力量等階。","With enough player experience points, you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A04N.png","opts":[{"id":"A0HK","n":["酒癮","Alcohol Dependence","Алкогольная зависимость"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+4 / +1\n+2 / +1\n+2 / +0\n\n將「醉意」的持續時間增加至 8 秒；英雄只有在醉意狀態下才能獲得經驗，經驗獲取量為正常值的 250%。\n\n「挑釁者」在「醉意」效果下造成的傷害提高 50%。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+4 / +1\n+2 / +1\n+2 / +0\n\nIncreases the duration of \"Intoxication\" to 8 sec.; the hero can only gain experience while intoxicated, and experience gain is 250% of the normal amount.\n\n\"Bully\" deals 50% more damage while under \"Intoxication\".","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+4 / +1\n+2 / +1\n+2 / +0\n\nУвеличивает длительность \"Опьянения\" до 8 сек., герой может получать опыт только в состоянии опьянения, получение опыта составляет 250% от нормы.\n\nУмение \"Задира\" наносит на 50% больше урона под действием \"Опьянения\"."],"icon":"images/heroes/a_A0HK.png"},{"id":"A0HM","n":["重度宿醉","Heavy Hangover","Тяжёлое похмелье"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+6 / +2\n+4 / +2\n+2 / +0\n\n「醉意」的正面與負面效果加倍。\n\n「烈性藥湯」啟動時給予更多力量（2 > 3）。\n\n「挑釁者」對敵人的暈眩時間由 1 秒變為 2 秒。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+6 / +2\n+4 / +2\n+2 / +0\n\nThe positive and negative effects of \"Intoxication\" are doubled.\n\n\"Potent Brew\" grants more Strength on activation (2 > 3).\n\n\"Bully\" stuns enemies for 2 sec. instead of 1 sec.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+6 / +2\n+4 / +2\n+2 / +0\n\nПоложительные и отрицательные эффекты \"Опьянения\" удваиваются.\n\nУмение \"Ядреный отвар\" дарует больше силы при активации (2 > 3).\n\nУмение \"Задира\" оглушает противников на 2 сек. вместо 1 сек."],"icon":"images/heroes/a_A0HM.png"}]},{"id":"A04Z","kind":"innate","n":["醉意","Intoxication","Опьянение"],"k":"","lv":null,"t":["「小酌一杯」與「烈性藥湯」會為釀酒師施加「醉意」狀態。在此效果下，英雄的戰鬥效率降低，但受到的傷害也會減少。\n\n醉意持續時間：4 秒\n攻擊速度降低：-20%\n移動速度降低：-20%\n受到傷害降低：20%","The abilities \"Have a Drink\" and \"Potent Brew\" apply the \"Drunkenness\" status to the Brewmaster. Under this effect the hero fights less effectively but takes less damage.\n\nDrunkenness duration: 4 sec.\nAttack speed reduction: -20%\nMovement speed reduction: -20%\nIncoming damage reduction: 20%","Способности \"Выпить немного\" и \"Ядреный отвар\" накладывают на пивовара статус \"Опьянение\". Под действием данного эффекта герой менее эффективно сражается, но получает меньше урона.\n\nДлительность опьянения: 4 сек.\nСнижение скорости атаки: -20%\nСнижение скорости передвижения: -20%\nСнижение получаемого урона: 20%"],"icon":"images/heroes/a_A04Z.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["堅韌的近戰英雄，能削弱敵人，但自己也容易吃到負面效果。","A tough melee hero who weakens enemies but is himself vulnerable to debuffs.","Стойкий герой ближнего боя, способный ослаблять противников, но сам также подвержен негативным эффектам своих умений. Способен накапливать силу."]},{"id":"H00P","n":["鐵匠","Blacksmith","Кузнец"],"attr":"str","unlock":0,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_H00P.png","proper":"Моди","st":{"str":22,"str_lv":null,"agi":19,"agi_lv":2.299999952316284,"int":21,"int_lv":2.299999952316284,"speed":320},"roles":[["戰士","Fighter","рубака"],["輔助","Support","поддержка"]],"sc":[["sp","armor","dburn"],["burn","flam","vuln"]],"mod":[],"sp":["A06K","A00Z","A00Y"],"ab":[{"id":"A011","kind":"hero","n":["山之力","Might of the Mountains","Мощь гор"],"k":"R","lv":null,"t":["為英雄提供強力的防禦強化，持續 60 秒。\n\n護甲加成：10 點\n生命值加成：1000 點\n額外效果：獲得完全的魔法防護與所有負面狀態防護，但易受中毒影響\n\n冷卻：120 秒","Grants the hero a powerful defensive buff for 60 sec.\n\nBonus armour: 10\nBonus health: 1000\nAdditionally: grants full protection from magic and from all negative statuses, vulnerable to poisoning\n\nCooldown: 120 sec.","Даёт мощное защитное усиление герою на 60 сек.\n\nБонусная защита: 10 ед.\nБонусное здоровье: 1000 ед.\nДополнительно: дарует полную защиту от магии и от всех негативных статусов, уязвим к отравлению\n\nПерезарядка: 120 сек."],"icon":"images/heroes/a_A011.png"},{"id":"A06K","kind":"hero","n":["終結打擊","Finishing Blows","Добивающие удары"],"k":"","lv":5,"t":["攻擊生命值低於 50% 的敵人時，可獲得短暫的攻擊力與護甲加成。這兩項加成彼此獨立生效。\n\n攻擊力加成：+3 點\n護甲加成：+1 點\n加成持續時間：5 + （2% 技能強度）秒。\n技能強度 200 以上：100% 機率對敵人施加「易燃」狀態\n\n冷卻：1 秒。","Attacks against enemies with less than 50% health grant a brief bonus to attack power and armour. These bonuses work independently of each other.\n\nAttack bonus: +3\nArmour bonus: +1\nBonus duration: 5 + (2% spell power) sec.\nSpell power 200+: 100% chance to apply the \"Flammable\" status to the enemy\n\nCooldown: 1 sec.","Атаки против противников с запасом здоровья ниже 50% даруют кратковременный бонус к атаке и защите. Данные бонусы действуют независимо друг от друга.\n\nБонус к атаке: +3 ед.\nБонус к защите: +1 ед.\nВремя действия бонуса: 5 + (2% сила умений) сек.\nСила умений 200+: 100% шанс применить на врага статус \"Горючесть\"\n\nПерезарядка: 1 сек."],"icon":"images/heroes/a_A06K.png","lvt":[{"i":2,"v":["3","6","9","12","15"]},{"i":3,"v":["1","2","3","4","5"]}]},{"id":"A00Z","kind":"hero","n":["鐵砧","Anvil","Наковальня"],"k":"W","lv":5,"t":["英雄向地面重擊 3 次，造成範圍傷害並點燃附近的敵人。此技能需要持續引導。\n\n每次打擊的傷害：40 + 20% 技能強度\n每次打擊的點燃：50% 機率，最終傷害為每次打擊傷害的 60%\n\n冷卻：18 秒。","The hero strikes the ground 3 times, dealing area damage and setting nearby enemies on fire. The ability must be channelled.\n\nDamage per strike: 40 + 20% spell power\nBurn per strike: 50% chance, final damage equal to 60% of the damage per strike\n\nCooldown: 18 sec.","Герой бьёт 3 раза по земле, нанося урон по области и поджигая ближайших врагов. Умение требует поддержания.\n\nУрон за удар: 40 + 20% сила умений\nПоджог за удар: 50% шанс, итоговый урон в размере 60% от урона за удар\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A00Z.png","lvt":[{"i":2,"v":["40","60","80","100","120"]},{"i":3,"v":["60","80","100","120","140"]}]},{"id":"A00Y","kind":"hero","n":["風暴之鎚","Storm Hammer","Молот бурь"],"k":"Q","lv":5,"t":["向指定敵人投擲鎚子，造成傷害並使目標短暫暈眩。\n\n傷害：100 + 75% 技能強度\n暈眩（一般部隊）：4 秒\n暈眩（英雄）：1.5 秒\n\n冷卻：11 秒","Hurls a hammer at the target enemy, dealing damage and stunning the target for a short time.\n\nDamage: 100 + 75% spell power\nStun (normal units): 4 sec.\nStun (heroes): 1.5 sec.\n\nCooldown: 11 sec.","Метает молот в указанного противника, нанося урон и оглушая цель на короткое время.\n\nУрон: 100 + 75% сила умений\nОглушение (обычные войска): 4 сек.\nОглушение (герои): 1.5 сек.\n\nПерезарядка: 11 сек."],"icon":"images/heroes/a_A00Y.png","lvt":[{"i":2,"v":["100","200","300","400","500"]},{"i":3,"v":["4","4.5","5","5.5","6"]},{"i":4,"v":["1.5","1.8","2.1","2.4","2.7"]}]},{"id":"A09J","kind":"innate","n":["無雙鐵匠","Peerless Blacksmith","Непревзойденный кузнец"],"k":"Z","lv":1,"t":["你每場遊戲可以將一件「聖物」類別的道具轉變為對應的「完美」類別道具，限 1 次。\n\n你每場遊戲可以複製任意一件「神器」類別的道具，限 1 次。\n\n在升級聖物並複製神器之後，此技能會被移除。","Once per game you can turn an item of the \"Relic\" category into the corresponding item of the \"Perfect\" category.\n\nOnce per game you can duplicate any item of the \"Artifact\" category.\n\nAfter the relic has been upgraded and the artifact duplicated, the ability is removed.","Вы можете 1 раз за игру превратить предмет категории \"Реликвия\" в соответствующий предмет категории \"Совершенный\".\n\nВы можете 1 раз за игру продублировать любой предмет категории \"Артефакт\".\n\nПосле улучшения реликвии и продублирования артефакта умение удаляется."],"icon":"images/heroes/a_A09J.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A013","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量位階。","With enough player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A013.png","opts":[{"id":"A06M","n":["傳說軍械庫","Legendary Arsenal","Легендарный арсенал"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+2 / +1\n+0 / +0\n+1 / +0\n\n「傳說」類別的物品現在可以給予英雄額外的加成。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+0 / +0\n+1 / +0\n\nItems of the \"Legendary\" category can now give the hero additional bonuses.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+0 / +0\n+1 / +0\n\nПредметы категории \"Легендарный\" теперь могут давать герою дополнительные бонусы."],"icon":"images/heroes/a_A06M.png"},{"id":"A0R0","n":["山丘之王的威能","Might of the Mountain King","Мощь горного короля"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+4 / +2\n+0 / +0\n+2 / +0\n\n英雄每 60 秒使自身力量提高 1 點。英雄的復活時間增加 25 秒。\n\n「風暴之鎚」對範圍內造成 50% 傷害，並對目標施加電擊（主要目標 40% 機率，範圍內 20% 機率）。\n\n「群山之力」的加成加倍。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+4 / +2\n+0 / +0\n+2 / +0\n\nThe hero increases his Strength by 1 every 60 sec. The hero's resurrection time is increased by 25 sec.\n\n\"Storm Hammer\" deals 50% of its damage over an area and applies Shock to targets (40% chance on the main target and 20% chance within the area).\n\nThe bonuses of \"Might of the Mountains\" are doubled.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+4 / +2\n+0 / +0\n+2 / +0\n\nГерой увеличивает свою силу на 1 ед. каждые 60 сек. Время воскрешения героя увеличено на 25 сек.\n\nУмение \"Молот бурь\" наносит 50% урона по области и применяет к целям шок (40% шанс по основной цели и 20% шанс по области).\n\nБонусы умения \"Мощь гор\" удвоены."],"icon":"images/heroes/a_A0R0.png"}]}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["高效的戰士，能暈眩單體並造成範圍傷害，還能複製神器。","An effective fighter who stuns single targets, deals area damage, and can duplicate an artifact.","Эффективный боец, способный оглушать единичные цели и наносить урон по области. Может продублировать артефакт и улучшить реликвию, но для каждого действия только 1 раз - выбирайте с умом."]},{"id":"H025","n":["懲戒者","Punisher","Каратель"],"attr":"str","unlock":50000,"random":true,"builds":[],"skins":[{"id":"Harf","on":false,"n":["赤 ce (50% chance for enemies near the target), +15% damage taken, -15% damage dealt, +20% status damage taken\n\"Anathema\" duration: 8 sec.\n\nCooldown: 8 sec.","Наносит урон и накладывает статус \"Анафема\" на цель и врагов поблизости.\n\nУрон: 70 + (30% сила умений) ед.; врагам рядом с целью получают 50% урона\nОбласть действия вокруг цели: 100 ед.\nСтатус \"Анафема\": 100% шанс (50% шанс врагам рядом с целью), +15% получаемый урон, -15% наносимый урон, +20% получаемый урон от статусов\nВремя действия \"Анафемы\": 8 сек.\n\nПерезарядка: 8 сек."],"icon":"images/heroes/a_A0E0.png","lvt":[{"i":2,"v":["70","105","140","175","210"]},{"i":3,"v":["100","150","200","250","300"]},{"i":4,"v":["20","25","30","35","40"]}]},{"id":"A0DZ","kind":"hero","n":["榮耀光輝","Radiance of Glory","Сияние славы"],"k":"R","lv":1,"t":["在自身周圍生成一個大型力場，場內的英雄與友軍攻擊造成的傷害提高，並獲得狀態傷害加成。\n\n攻擊力提升：+50%\n狀態傷害加成：+50%\n\n冷卻：80 秒。","Creates a large field around himself, inside which the hero and his allies deal more damage with attacks and receive a bonus to damage from statuses.\n\nAttack power increase: +50%\nBonus to damage from statuses: +50%\n\nCooldown: 80 sec.","Создает вокруг себя большое поле, внутри которого герой и союзники наносят больше урона от атак и получают бонус к урону от статусов.\n\nУвеличение силы атаки: +50%\nБонус к урону от статусов: +50%\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0DZ.png"},{"id":"A0DY","kind":"hero","n":["淨化","Purge","Очищение"],"k":"W","lv":5,"t":["以光之洪流轟擊指定區域，持續 6 秒。技能作用期間，作用範圍會逐漸擴大。\n\n傷害：20 + （20% 技能強度）點/秒。\n對處於「詛咒審判」效果下敵人的效果：技能每次跳動有 25% 機率對敵人施加點燃，傷害為 200%\n\n冷卻：10 秒。","Strikes the chosen area with a stream of light for 6 sec. The area of effect grows while the ability is active.\n\nDamage: 20 + (20% spell power) per sec.\nEffect against enemies affected by \"Anathema\": each tick of the ability has a 25% chance to apply Burn to the enemy with 200% damage\n\nCooldown: 10 sec.","Поражает указанную область световым потоком в течение 6 сек. Во время действия умения область поражения увеличивается.\n\nУрон: 20 + (20% сила умений) ед./сек.\nЭффект против врагов под действием \"Анафемы\": каждый такт умения 25% шанс применить поджог на врага с 200% урона\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0DY.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"A103","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A103.png","opts":[{"id":"A102","n":["光之護盾","Shield of Light","Щит света"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+4 / +2\n+0 / +0\n+2 / +0\n\n使用後英雄獲得一面護盾，降低受到的傷害，並在每次受到傷害時回復生命值（造成傷害的狀態除外）。\n\n受到傷害降低：20%\n每段傷害回復生命值：4 點\n持續時間：12 秒\n\n冷卻：30 秒","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+4 / +2\n+0 / +0\n+2 / +0\n\nOn use, the hero gains a shield that reduces incoming damage and restores health on every damage tick (except damaging statuses).\n\nIncoming damage reduction: 20%\nHealth restored per damage tick: 4\nDuration: 12 sec.\n\nCooldown: 30 sec.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+4 / +2\n+0 / +0\n+2 / +0\n\nПри использовании герой получает щит, снижающий получаемый урон и восстанавливающий здоровье на каждый такт урона (кроме наносящих урон статусов).\n\nСнижение получаемого урона: 20%\nВосстановление здоровья на такт урона: 4 ед.\nВремя действия: 12 сек.\n\nПерезарядка: 30 сек."],"icon":"images/heroes/a_A102.png"},{"id":"A104","n":["拷問官","Inquisitor","Дознаватель"],"t":["強度等級：T3+\n屬性加成／每級屬性成長加成：\n+5 / +2\n+2 / +0\n+5 / +2\n\n擊殺處於「詛咒審判」效果下的敵人，會依（敵人等級 * 0.5）的公式提高英雄的技能強度。\n\n「詛咒審判」會額外以與「詛咒審判」狀態相同的機率對敵人施加易傷。\n\n只要作用範圍內存在敵方英雄，「淨化」就不會消耗自身的持續時間。","Power rank: T3+\nAttribute bonus / attribute growth per level bonus:\n+5 / +2\n+2 / +0\n+5 / +2\n\nKilling enemies affected by \"Anathema\" increases the hero's spell power by the formula (enemy level * 0.5).\n\n\"Anathema\" additionally applies Vulnerability to enemies with a chance equal to that of the \"Anathema\" status.\n\n\"Purge\" does not consume its own duration while an enemy hero is inside its area.","Ранг силы: Т3+\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+5 / +2\n+2 / +0\n+5 / +2\n\nУбийство врагов под действием \"анафемы\" повышает силу умений героя по формуле (уровень врага * 0.5).\n\nУмение \"Анафема\" дополнительно применяет к врагам уязвимость с шансом, аналогичным статусу \"анафема\".\n\nУмение \"Очищение\" не тратит собственное время действия, пока в области поражения есть вражеский герой."],"icon":"images/heroes/a_A104.png"}]},{"id":"A064","kind":"innate","n":["純血","Pure Blood","Чистокровность"],"k":"","lv":null,"t":["造成傷害的狀態在英雄身上的持續時間減少 50%。","Damaging status effects last 50% less time on the hero.","Эффекты наносящих урон состояний длятся на герое на 50% меньше времени."],"icon":"images/heroes/a_A064.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T2","T2","Т2"],"late":["中","Medium","средний"],"d":["近戰英雄，受到的狀態傷害較低，並具備多種手段。","A melee hero who takes reduced damage from statuses and has many tools.","Герой ближнего боя, получающий меньше вреда от наносящих урон состояний и обладающий множеством активных умений."]},{"id":"N02K","n":["機械戰體","Mechatron","Мехатрон"],"attr":"str","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_N02K.png","proper":"WM v3.36","st":{"str":35,"str_lv":5.0,"agi":10,"agi_lv":1.0,"int":10,"int_lv":1.0,"speed":280},"roles":[["坦克","Tank","танк"],["詛咒者","Curser","проклинатель"]],"sc":[["sp","hp","mp"],["shock"]],"mod":[],"sp":["A0BE","A0BB","A0BA"],"ab":[{"id":"A0BE","kind":"hero","n":["電流衝擊","Shock Current","Ударный ток"],"k":"","lv":5,"t":["英雄的技能會在隨機延遲後額外以閃電打擊敵人。處於電擊狀態下的敵人會受到更多傷害。\n\n電流傷害：20 +（10% 技能強度）點\n對電擊狀態敵人的傷害提升：+100%\n傷害延遲：0.5 - 3 秒","The hero's abilities additionally strike the enemy with lightning after a random delay. Enemies under Shock take more damage.\n\nCurrent damage: 20 + (10% spell power)\nDamage bonus against enemies under Shock: +100%\nDamage delay: 0.5 - 3 sec.","Умения героя дополнительно бьют по врагу молнией после случайной задержки. Враги под действием шока получают больше урона.\n\nУрон от тока: 20 + (10% сила способностей) ед.\nУсиление урона по врагам под действием шока: +100%\nЗадержка урона: 0.5 - 3 сек."],"icon":"images/heroes/a_A0BE.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"A0BB","kind":"hero","n":["失衡","Destabilisation","Дестабилизация"],"k":"Q","lv":5,"t":["機械戰體以電磁脈衝打擊指定區域內的敵人，造成傷害並以高機率施加電擊效果。\n\n傷害：60 +（40% 技能強度）點\n附加效果：75% 機率對敵人施加電擊\n\n冷卻：10 秒","Mekhatron strikes enemies in the target area with an electric impulse, dealing damage to them and applying Shock with a high chance.\n\nDamage: 60 + (40% spell power)\nAdditional effect: 75% chance to apply Shock to the enemy\n\nCooldown: 10 sec.","Мехатрон поражает противников в указанной области электроимпульсом, нанося им урон и накладывая эффект шока с высоким шансом.\n\nУрон: 60 + (40% сила умений) ед.\nДополнительный эффект: 75% шанс наложить на врага шок\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0BB.png","lvt":[{"i":2,"v":["60","90","120","150","180"]}]},{"id":"A0BA","kind":"hero","n":["放電","Discharge","Разряд"],"k":"W","lv":5,"t":["以英雄位置為中心 500 的廣大範圍內，敵人會受到傷害、失去正面效果，並被減速 7 秒（英雄 4 秒）。\n\n傷害：20 +（15% 技能強度）點\n\n冷卻：9 秒","Enemies in a wide 500 area from the hero's position take damage, lose their positive effects and are slowed for 7 sec. (heroes for 4 sec.).\n\nDamage: 20 + (15% spell power)\n\nCooldown: 9 sec.","Враги в обширной области 500 от позиции героя получают урон, лишаются положительных эффектов и замедляются на 7 сек. (герои на 4 сек.).\n\nУрон: 20 + (15% сила умений) ед.\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A0BA.png","lvt":[{"i":2,"v":["20","40","60","80","100"]}]},{"id":"A0B8","kind":"hero","n":["白銀屏障","Argent Barrier","Аргент-барьер"],"k":"R","lv":null,"t":["「War Machine」級的機械戰體自 3.0 版起，配備了名為「白銀屏障」的先進敵火吸收技術。此屏障會完全吸收受到的傷害，隨後釋放累積的能量，將吸收到的傷害分攤給英雄周圍的敵人。並賦予狀態免疫。\n\n持續時間：12 秒\n\n冷卻：55 秒","Mechatrons of the \"War Machine\" class, starting from version 3.0, carry an advanced enemy-fire absorption technology called \"Argent Barrier\". This barrier fully absorbs incoming damage and then disperses the accumulated energy, distributing the absorbed damage among the enemies around the hero. Grants immunity to statuses.\n\nDuration: 12 sec.\n\nCooldown: 55 sec.","Мехатроны класса \"War Machine\", начиная от версии 3.0, имеют передовую технологию поглощения вражеского огня под названием \"Аргент-барьер\". Данный барьер полностью поглощает получаемый урон, а затем рассеивает накопленную энергию, распределяя полученный урон между противниками вокруг героя. Дарует иммунитет к статусам.\n\nВремя действия: 12 сек.\n\nПерезарядка: 55 сек."],"icon":"images/heroes/a_A0B8.png"},{"id":"A0B7","kind":"innate","n":["維修艙","Repair Bay","Ремонтный отсек"],"k":"","lv":null,"t":["若英雄在 4 秒內未受到傷害，機械戰體會開始以每秒 1% 的速度回復自身生命值。當生命值達到 100% 時，此技能會以相同速度回復法力值。\n\n維修艙不會因狀態造成的傷害而停止運作。","If the hero takes no damage for 4 sec., the Mechatron begins to restore its health at a rate of 1% per sec. If health is at 100%, the ability restores mana at the same rate.\n\nThe Repair Bay does not stop working from status damage.","Если герой не получает урона в течение 4 сек., то мехатрон начинает восстанавливать своё здоровье со скоростью 1% в сек. В случае, если запас здоровья равен 100%, умение восстанавливает ману с той же скоростью.\n\nРемонтный отсек не прекращает свою работу от урона от статусов."],"icon":"images/heroes/a_A0B7.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A090","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，使英雄大幅強化至新的力量等階。","With enough player experience points, you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A090.png","opts":[{"id":"A09W","n":["背包擴充","Inventory Expansion","Расширение инвентаря"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +1\n+0 / +0\n+1 / +0\n\n將道具欄位的數量增加至 6 格。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+0 / +0\n+1 / +0\n\nIncreases the number of item slots to 6.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+0 / +0\n+1 / +0\n\nУвеличивает количество слотов для предметов до 6."],"icon":"images/heroes/a_A09W.png"},{"id":"A09Z","n":["低溫電池","Cryogenic Battery","Криогенная батарея"],"t":["強度等級：T3+\n屬性加成／每級屬性成長加成：\n+8 / +3\n+2 / +0\n+6 / +1\n\n當英雄的生命值或法力值低於 40% 時，低溫電池便會啟動——英雄每秒回復 2% 生命值與法力值。效果持續時間為 20 秒，冷卻為 40 秒。\n\n技能「電流衝擊」以 33% 機率對目標施加冰凍。\n\n對處於電擊狀態的目標施加冰凍時，會如同重複冰凍一般觸發傷害，且不會移除該效果。","Power rank: T3+\nAttribute bonus / attribute growth per level bonus:\n+8 / +3\n+2 / +0\n+6 / +1\n\nWhen the hero's health or mana falls below 40%, the cryogenic battery activates - the hero regenerates 2% of health and mana per sec. Duration of the effect - 20 sec., cooldown - 40 sec.\n\nThe \"Shock Current\" ability applies Freeze to targets with a 33% chance.\n\nApplying Freeze to a target under Shock triggers damage as if it were a repeated Freeze, without removing the effect.","Ранг силы: Т3+\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+8 / +3\n+2 / +0\n+6 / +1\n\nПри запасе здоровья или маны героя ниже 40% происходит активация криогенной батареи - герой регенерирует 2% здоровья и маны в сек. Время действия эффекта - 20 сек., перезарядка - 40 сек.\n\nУмение \"Ударный ток\" применяет к целям заморозку с 33% шансом.\n\nПрименение заморозки на цели под действием шока вызывает срабатывание урона как при повторной заморозке, не удаляя при этом эффект."],"icon":"images/heroes/a_A09Z.png"}]},{"id":"A08K","kind":"innate","n":["第二背包","Second Inventory","物品欄"],"k":"","lv":null,"t":["","",""],"icon":"images/heroes/a_A08K.png"}],"tier":["T2","T2","Т2"],"late":["中","Medium","средний"],"d":["背包格數受限，但靠防禦類型獲得極高生存力。","Limited inventory, but extremely durable thanks to his armour type.","Герой, обладающий ограниченным инвентарем, но имеющий очень высокую выживаемость за счёт типа защиты \"Укрепленный\". Способен применять множество ослабляющих эффектов на врагов."]},{"id":"O01M","n":["符文守護者","Rune Guardian","Рунный защитник"],"attr":"str","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_O01M.png","proper":"Марг","st":{"str":35,"str_lv":4.5,"agi":9,"agi_lv":2.0,"int":17,"int_lv":2.0,"speed":280},"roles":[["坦克","Tank","танк"],["輔助","Support","поддержка"]],"sc":[["armor","pen","thorn"],[]],"mod":[],"sp":[],"ab":[{"id":"A0G6","kind":"hero","n":["庇護","Patronage","Покровительство"],"k":"","lv":1,"t":["符文守護者散發一道光環，保護附近的友軍英雄。受保護的英雄所受到的部分傷害會被轉移到符文守護者身上。對自身無效。\n\n友軍英雄的傷害防護：30%\n英雄受到的傷害：光環所擋下傷害的 50%\n\n當啟用「相同英雄」設定時，英雄不會受到傷害，但光環對友軍的效果會減弱兩倍。多個符文守護者的光環不會疊加。","The Rune Defender emits an aura that protects nearby allied heroes. Part of the damage taken by the protected heroes is redirected to the Rune Defender. Does not affect himself.\n\nDamage protection for allied heroes: 30%\nDamage the hero takes: 50% of the damage blocked by the aura\n\nWith the \"Identical heroes\" setting enabled the hero will not take damage, but the aura's effect for allies is weakened twofold. The aura does not stack from several Rune Defenders.","Рунный защитник распространяет ауру, защищающую ближайших союзных героев. Часть урона, полученного защищенными героями, будет перенаправлена в рунного защитника. Не действует на самого себя.\n\nЗащита от урона союзным героям: 30%\nГерой получает урона: 50% от заблокированного аурой урона\n\nПри активированной настройке \"Одинаковые герои\" герой не будет получать урон, но эффект ауры для союзников будет ослаблен два раза. Аура не суммируется от нескольких рунных защитников."],"icon":"images/heroes/a_A0G6.png"},{"id":"A0G2","kind":"hero","n":["不動守衛","Unshakeable Guardian","Непоколебимый страж"],"k":"","lv":5,"t":["英雄有小機率完全格擋所受到的物理傷害。此外，英雄死亡時你有機率不損失力量。\n\n格擋機率：8%\n保留力量的機率：8%","The hero has a small chance to completely block incoming physical damage. You also gain a chance not to lose Strength when the hero dies.\n\nBlock chance: 8%\nChance to keep Strength: 8%","Герой имеет небольшой шанс полностью заблокировать получаемый физический урон. Также вы получаете шанс не потерять силу при смерти героя.\n\nШанс блока: 8%\nШанс сохранения силы: 8%"],"icon":"images/heroes/a_A0G2.png","lvt":[{"i":2,"v":["8","12","16","20","24"]},{"i":3,"v":["8","12","16","20","24"]}]},{"id":"A0G0","kind":"hero","n":["堅韌符文","Rune of Fortitude","Руна стойкости"],"k":"W","lv":5,"t":["英雄清除自身的負面效果，並獲得對一般傷害、狀態、穿透與反傷的防護。\n\n受到的傷害降低：20%\n持續時間：10 秒。\n\n冷卻：20 秒。","The hero is cleansed of negative effects and gains protection from normal damage, from statuses, from penetration and from thorns.\n\nDamage taken reduction: 20%\nDuration: 10 sec.\n\nCooldown: 20 sec.","Герой очищается от негативных эффектов, получает защиту от обычного урона, от статусов, пробития и ответного урона.\n\nСнижение получаемого урона: 20%\nВремя действия: 10 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0G0.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"A0FV","kind":"hero","n":["地震衝擊","Seismic Slam","Сейсмический удар"],"k":"Q","lv":5,"t":["產生多次爆裂，以裂縫的形式自英雄向外擴散，主要朝向英雄面對的方向。\n\n每次爆裂的傷害：30 + （35% 力量）點\n\n冷卻：18 秒。","Creates multiple detonations that spread out from the hero as fissures, primarily in the direction the hero is facing.\n\nDamage of each detonation: 30 + (35% Strength)\n\nCooldown: 18 sec.","Создает множественные подрывы, расходящиеся от героя в виде расселин преимущественно в сторону взгляда героя.\n\nУрон каждого подрыва: 30 + (35% сила) ед.\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A0FV.png","lvt":[{"i":2,"v":["30","45","60","75","90"]}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0FU","kind":"innate","n":["野性符文","Wild Runes","Дикие руны"],"k":"","lv":null,"t":["英雄在 10 秒內復活，但每次復活都會損失 3 點力量。","The hero revives in 10 sec., but loses 3 Strength with each resurrection.","Герой возрождается за 10 сек., но теряет 3 ед. силы при каждом воскрешении."],"icon":"images/heroes/a_A0FU.png"},{"id":"A10I","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗值達到足夠數量時，你可以選擇一項天賦，大幅強化英雄，使其提升至新的力量階級。","With a sufficient amount / +3\n+0 / +0\n+3 / +1\n\nУмение \"Сейсмический удар\" распространяется намного дальше (+100% к длине расходящихся расселин), урон умения снижается на 50%. Создаваемые \"Сейсмическим ударом\" подрывы наносят больше урона при отдалении от начальной точки, максимальный бонус к урону составляет +240% на последних и самых отдаленных подрывах.\n\nУмение \"Дикие руны\" забирает 5 ед. силы после смерти героя."],"icon":"images/heroes/a_A10M.png"}]}],"tier":["T2","T2","Т2"],"late":["高","High","высокий"],"d":["極為堅固的坦克，專門吸收大量傷害；死亡會受到懲罰。","An extremely tough tank built to soak damage, but penalised heavily on death.","Крайне крепкий танк, расчитанный на поглощение большого количества урона. Получает штрафы за смерть и может защищать союзных героев поблизости."]},{"id":"O022","n":["老酋長","Old Chieftain","Старый вождь"],"attr":"str","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_O022.png","proper":"Килрогг","st":{"str":25,"str_lv":3.5999999046325684,"agi":18,"agi_lv":2.0,"int":19,"int_lv":2.0,"speed":null},"roles":[["戰士","Fighter","рубака"],["刺客","Assassin","убийца"]],"sc":[["sp","as","hp"],["vuln"]],"mod":[],"sp":["A0NW","A0NQ"],"ab":[{"id":"A0NX","kind":"hero","n":["吞噬之刃","Absorbing Blade","Поглощающий клинок"],"k":"","lv":5,"t":["擊殺敵人可提升英雄的生命值回復。這些效果可以疊加，但不會延長彼此的持續時間。\n\n回復加成：4 + （被擊殺敵人的等級）點\n加成持續時間：5 秒。","Killing an enemy increases the hero's health regeneration. These effects stack but do not extend each other's duration.\n\nRegeneration bonus: 4 + (level of the killed enemy)\nBonus duration: 5 sec.","Убийство врага повышает регенерацию здоровья героя. Данные эффекты суммируются, но не продлевают действие друг друга.\n\nБонус к регенерации: 4 + (уровень убитого врага) ед.\nДлительность бонуса: 5 сек."],"icon":"images/heroes/a_A0NX.png","lvt":[{"i":2,"v":["4","6","8","10","12"]}]},{"id":"A0NW","kind":"hero","n":["邪能之焰","Fel Flame","Пламя скверны"],"k":"W","lv":5,"t":["毀滅之焰包覆英雄，對周圍的敵人以及英雄自身造成傷害。每次使用後技能傷害都會提升，此累積效果會在英雄死亡後重置。\n\n傷害：18 + （10% 技能強度）點/秒。\n對英雄自身的傷害：技能主要傷害的 80%\n持續時間：10 秒。\n每次使用的傷害加成：+8%\n\n冷卻：18 秒。","The hero is engulfed in ruinous flame that damages both the enemies around him and the hero himself. Each use increases the ability's damage; this stacking effect is reset when the hero dies.\n\nDamage: 18 + (10% spell power) per sec.\nDamage to the hero: 80% of the ability's main damage\nDuration: 10 sec.\nDamage bonus per use: +8%\n\nCooldown: 18 sec.","Героя окутывает губительное пламя, наносящее урон как врагам вокруг, так и самому герою. После применения урон умения повышается, данный накопительный эффект сбрасывается после смерти героя.\n\nУрон: 18 + (10% сила умений) ед./сек.\nУрон по герою: 80% от основного урона умения\nВремя действия: 10 сек.\nБонус к урону за применение: +8%\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A0NW.png","lvt":[{"i":2,"v":["18","26","34","42","50"]},{"i":3,"v":["80","75","70","65","60"]},{"i":5,"v":["8","10","12","14","16"]}]},{"id":"A0NQ","kind":"hero","n":["徒手格鬥","Fistfight","Кулачный бой"],"k":"Q","lv":5,"t":["以近戰方式對目標施以重擊，將其擊退並暈眩數秒。\n\n傷害：125 + 85% 技能強度\n暈眩（一般部隊）：5 秒。\n暈眩（英雄）：1.8 秒。\n\n冷卻：11 秒。","Delivers a powerful melee blow to the target, knocking it back and stunning it for several seconds.\n\nDamage: 125 + 85% spell power\nStun (regular units): 5 sec.\nStun (heroes): 1.8 sec.\n\nCooldown: 11 sec.","Наносит сильный удар цели в ближнем бою, отталкивая её и оглушая на несколько секунд.\n\nУрон: 125 + 85% сила умений\nОглушение (обычные войска): 5 сек.\nОглушение (герои): 1.8 сек.\n\nПерезарядка: 11 сек."],"icon":"images/heroes/a_A0NQ.png","lvt":[{"i":2,"v":["125","250","375","500","625"]},{"i":3,"v":["5","5.6","6.2","6.8","7.4"]},{"i":4,"v":["1.8","2.2","2.6","3","3.4"]}]},{"id":"A0NY","kind":"hero","n":["戰鬥狂熱","Battle Frenzy","Боевое исступление"],"k":"R","lv":1,"t":["英雄暈眩自身周圍大範圍內的敵人，並暫時提升自己的攻擊力、獲得濺射效果，同時每次攻擊都會損失自身的生命值。\n\n暈眩：8 秒\n暈眩（英雄）：4 秒\n攻擊力提升：+80%\n濺射效果：對 400 點範圍內的敵人造成 30% 傷害\n每次攻擊損失的生命值：當前生命值的 4%\n加成持續時間：12 秒\n\n冷卻：80 秒","The hero stuns enemies in a large area around himself, temporarily increasing his attack power, gaining a splash effect and losing health with every attack.\n\nStun: 8 sec.\nStun (heroes): 4 sec.\nAttack increase: +80%\nSplash effect: 30% damage to enemies in a 400 area\nHealth loss per attack: 4% of current health\nBonus duration: 12 sec.\n\nCooldown: 80 sec.","Герой оглушает врагов в большой области вокруг себя, временно увеличивая свою силу атаки, получая сплеш-эффект и теряя свое здоровье с каждой атакой.\n\nОглушение: 8 сек.\nОглушение (герои): 4 сек.\nПовышение атаки: +80%\nСплеш-эффект: 30% урона врагам по области 400 ед.\nПотеря здоровья за атаку: 4% от текущего запаса здоровья\nВремя действия бонусов: 12 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0NY.png"},{"id":"A0NU","kind":"innate","n":["灌注恐懼","Instill Fear","Внушение страха"],"k":"","lv":null,"t":["攻擊英雄的敵人有 10% 機率獲得持續 10 秒的恐懼效果。此效果會降低攻擊速度，並使該單位更容易受到基爾羅格的傷害。\n\n攻擊速度降低：-20%\n敵人受到英雄技能的傷害提升：+30%\n英雄的攻擊對生命值低於 40% 的敵人造成額外傷害：（100% 力量）點；冷卻 1 秒","Enemies attacking the hero have a 10% chance to receive a Fear effect for 10 sec. This effect reduces attack speed and makes the unit more vulnerable to Kilrogg.\n\nAttack speed reduction: -20%\nEnemy takes more damage from the hero's abilities: +30%\nThe hero's attacks deal extra damage to an enemy below 40% health: (100% Strength); cooldown 1 sec.","Враги, атакующие героя, имеют 10% шанс получить эффект страха на 10 сек. Данный эффект уменьшает скорость атаки и делает юнита более уязвимым против Килрогга.\n\nСнижение скорости атаки: -20%\nВраг получает больше урона от умений героя: +30%\nАтаки героя наносят доп. урон врагу с запасом здоровья ниже 40%: (100% сила) ед.; перезарядка 1 сек."],"icon":"images/heroes/a_A0NU.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it
