alt: 20 + (10% spell power)\nInterval: 3 random enemies every 0.75 sec.\n\nCooldown: 22 sec.","Создает аномальное поле, внутри которого случайные противники получают урон. Время действия - 9 сек.\n\nНаносимый урон: 20 + (10% сила умений) ед.\nПериодичность: 3 случайных врага каждые 0.75 сек.\n\nПерезарядка: 22 сек."],"icon":"images/heroes/a_A0IT.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"A04S","kind":"hero","n":["秘法齊射","Arcane Volley","Арканный залп"],"k":"W","lv":5,"t":["以魔法能量團轟擊指定區域，每一團都會造成範圍傷害。\n\n每團能量的傷害：30 +（15% 技能強度）點\n能量團數量：8 個（英雄每 500 點當前法力值 +1）\n\n冷卻：13 秒","Strikes the target area with magical clots, each of which deals area damage.\n\nDamage of each clot: 30 + (15% spell power)\nNumber of clots: 8 (+1 for every 500 of the hero's current mana)\n\nCooldown: 13 sec.","Поражает указанную область магическими сгустками, каждый из которых наносит урон по области.\n\nУрон каждого сгустка: 30 + (15% сила умений) ед.\nКоличество сгустков: 8 ед. (+1 за каждые 500 текущей маны героя)\n\nПерезарядка: 13 сек."],"icon":"images/heroes/a_A04S.png","lvt":[{"i":2,"v":["30","45","60","75","90"]}]},{"id":"A097","kind":"hero","n":["秘法充能","Arcane Charge","Арканный заряд"],"k":"E","lv":5,"t":["向敵人發射一枚秘法投射物，造成傷害並暈眩目標。\n\n傷害：100 +（40% 技能強度）+（英雄當前法力值的 15%）點\n暈眩：100% 機率，1 秒\n\n冷卻：10 秒","Sends an arcane projectile at an enemy, dealing damage and stunning the target.\n\nDamage: 100 + (40% spell power) + (15% of the hero's current mana)\nStun: 100% chance, 1 sec.\n\nCooldown: 10 sec.","Направляет в противника арканый снаряд, наносящий урон и оглушающий цель.\n\nУрон: 100 + (40% сила умений) + (15% от текущей маны героя) ед.\nОглушение: 100% шанс, 1 сек.\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A097.png","lvt":[{"i":2,"v":["100 + (40% сила умений) + (15","150 + (40% сила умений) + (20","200 + (40% сила умений) + (25","250 + (40% сила умений) + (30","300 + (40% сила умений) + (35"]}]},{"id":"A04P","kind":"innate","n":["秘法護盾","Arcane Shield","Арканный щит"],"k":"Z","lv":1,"t":["對指定友軍施加護盾，並逐漸回復其法力值。\n\n一般傷害防護：+15%\n狀態傷害防護：+15%\n法力值回復：每秒 1%\n持續時間：10 秒（目標每一等級 +1 秒）\n\n冷卻：20 秒","Places a shield on the target ally and gradually restores their mana.\n\nProtection from normal damage: +15%\nProtection from status damage: +15%\nMana restoration: 1% per sec.\nDuration: 10 sec. (+1 sec. per level of the target)\n\nCooldown: 20 sec.","Накладывает на указанного союзника щит и постепенно восстанавливает его ману.\n\nЗащита от обычного урона: +15%\nЗащита от урона от статусов: +15%\nВосстановление маны: 1% в сек.\nВремя действия: 10 сек. (+1 сек. за каждый уровень цели)\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A04P.png"},{"id":"A0IV","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0IV.png","opts":[{"id":"A0IX","n":["不穩定力場","Unstable Zone","Нестабильная зона"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+0 / +0\n+2 / +1\n\n將技能「異常力場」可擊中的目標數量從 3 提升至 10。若技能的某次觸發擊中了 10 個目標，力場的作用便會再增加 1 次觸發。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+0 / +0\n+2 / +1\n\nIncreases the number of targets hit by the \"Anomaly Field\" ability from 3 to 10. If a tick of the ability hits 10 targets, 1 more tick is added to the field's duration.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+0 / +0\n+2 / +1\n\nУвеличивает количество поражаемых целей для умения \"Аномальное поле\" с 3 до 10. Если такт умения поражает 10 целей, то к действию поля добавляется ещё 1 такт."],"icon":"images/heroes/a_A0IX.png"},{"id":"A0J1","n":["秘法砲擊","Arcane Artillery","Арканная артиллерия"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +1\n+1 / +0\n+3 / +1\n\n技能「秘法齊射」的施放距離提升 50%，作用範圍提升 30%。同時將該技能的彈體數量提升 100%。\n\n技能「毀滅咒語」會產生更多爆炸，擴散距離增加 50%。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+1 / +0\n+3 / +1\n\nIncreases the cast range of the \"Arcane Volley\" ability by 50% and its area by 30%. Also increases the number of the ability's projectiles by 100%.\n\nThe \"Destructive Spell\" ability creates more explosions and spreads 50% further.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+1 / +0\n+3 / +1\n\nУвеличивает дальность действия умения \"Арканный залп\" на 50% и область поражения на 30%. Также увеличивает количество снарядов умения на 100%.\n\nУмение \"Разрушительное заклинание\" создаёт больше взрывов и распространяется на 50% дальше."],"icon":"images/heroes/a_A0J1.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["低","Low","низкий"],"d":["遠程英雄，主要靠魔法傷害，能給自己或隊友套上秘法護盾。","A ranged hero built on magic damage, able to shield himself or allies.","Герой дальнего боя, чья сила заключается в основном в магическом уроне. Способен применять арканый щит на себя или союзников."]},{"id":"Hamg","n":["拜火者","Fire Worshipper","Огнепоклонник"],"attr":"int","unlock":50000,"random":true,"builds":[{"id":"hamg-flam","c":"#FF5722","talent":"A03G","n":["易燃雙倍燃","Flammable Double Burn","Горючесть: двойной поджог"],"key":["易燃讓持續點燃的跳數從 16 變 32 —— 傷害直接翻倍，這是全遊戲最大的單一點燃倍率","Flammable turns a 16-tick burn into 32 ticks - a straight doubling, the largest single burn multiplier in the game","Горючесть превращает 16 тиков поджога в 32 - урон удваивается"],"why":["程式碼裡點燃是「總傷害切成 16 跳」，而易燃讓跳數變成 32 跳 —— 每跳傷害不變，所以總傷害正好翻倍。這個倍率比任何「+X% 點燃傷害」的裝備都大，而且易燃同時還把點燃的施加機率乘 1.5。所以這套不選人間煉獄，改選火焰浪潮：人間煉獄把點燃改成一次結算，那條路徑的係數固定 1.5、完全吃不到易燃的翻倍，易燃對它只剩機率加成。易燃來源有三個且會互相接力：熔面者（120% 機率、冷卻 15 秒）、熾熱核心與熔岩球（每 5 秒一次）。熾熱核心是這套的關鍵單品，它一件做三件事 —— 施加易燃、自己也點燃、而且給「抵抗點燃」，那個抗性正是零時迷子的觸發條件（零時迷子寫的是「英雄具備對應抗性時狀態傷害 +50%」，程式碼檢查的就是抵抗點燃這個旗標，沒有它零時迷子對點燃完全沒作用）。火焰浪潮還讓烈焰洪流的投射物從 40 顆變 80 顆，等於多一倍的點燃判定次數。實際試算：這套一輪約 25.2 萬傷害，對照現有的瞬燃機率流約 14.5 萬。代價是點燃改回持續傷害，遇到帶點燃免疫的敵人機率會被砍到 1/4，那種場合要換回人間煉獄。","In the code a burn is \"total damage split into 16 ticks\", and Flammable raises that to 32 ticks - per-tick damage is unchanged, so the total exactly doubles. That is a bigger multiplier than any \"+X% burn damage\" item, and Flammable also multiplies the chance to apply burn by 1.5. So this build does not take Hell on Earth: that talent converts burn into a single instant hit whose coefficient is fixed at 1.5 and cannot benefit from the tick doubling at all - Flammable would only give it the chance bonus. Three sources of Flammable relay into each other: Melting Face (120% chance, 15 s cooldown), Molten Core and Lava Orb (every 5 s). Molten Core is the key item: it applies Flammable, burns on its own, and grants Burn Resistance - and that resistance flag is exactly what the Zero Hour construct checks before granting its +50% status damage. Without a resistance item the construct does nothing for burn at all. Wave of Fire also doubles Fire Torrent from 40 projectiles to 80, doubling the number of burn rolls. Measured: about 252k damage per rotation versus about 145k for the existing instant-burn build. The cost is that burn is a damage-over-time again, so burn-immune enemies cut the chance to a quarter - switch back to Hell on Earth for those.","В коде поджог - это «общий урон, разделённый на 16 тиков», а горючесть поднимает счётчик до 32 тиков: урон за тик не меняется, поэтому итог ровно удваивается. Это больший множитель, чем любой предмет на «+X% урона от поджога», и горючесть вдобавок умножает шанс наложения поджога на 1.5. Поэтому здесь берётся «Волна огня», а не «Ад на земле»: у мгновенного поджога коэффициент фиксирован на 1.5 и удвоение тиков ему недоступно. Источники горючести: «Плавящий лик» (120%, 15 сек.), «Раскалённое ядро» и «Лавовый шар» (каждые 5 сек.). «Раскалённое ядро» - ключевой предмет: оно накладывает горючесть, само поджигает и даёт сопротивление поджогу, а именно этот флаг проверяет «Окалиновый конструкт» перед своим +50%. Расчёт: около 252 тыс. за ротацию против примерно 145 тыс. у сборки на мгновенный поджог."],"items":["I00E","sor5","kpin","I067","I086","I06A"],"bonus":{"s1":"oli2","s2":"I0AV"}},{"id":"hamg-flam-horse","c":"#FFA000","talent":"A03G","n":["易燃・必中版","Flammable, High Uptime","Горючесть: высокий аптайм"],"key":["用 400 技能強度換幸運馬蹄鐵，機率倍率從 1.5 拉到 2.25，易燃斷檔時反而更穩","Trades 400 spell power for the Lucky Horseshoe: chance multiplier 1.5 to 2.25, and far steadier when Flammable drops","Меняет 400 силы умений на «Счастливую подкову»: множитель шанса с 1.5 до 2.25"],"why":["機率倍率是相乘的：易燃 ×1.5、幸運馬蹄鐵 ×1.5，兩個一起就是 ×2.25，烈焰旋風的 60% 直接變成必中。上面那套滿易燃時輸出更高（25.2 萬 vs 21.8 萬），但那是假設易燃一直掛著；易燃只有 6 秒，而熔面者冷卻 15 秒、熾熱核心每 5 秒才擲一次 40%，實戰一定會有斷檔。把易燃覆蓋率壓到 50% 重算，兩套變成 16.9 萬 vs 16.8 萬 —— 幾乎打平，而這套的下限高很多，因為馬蹄鐵的 ×1.5 是無條件的。單體 BOSS 戰、或隊上沒有人幫忙鋪狀態的時候選這套；能穩定維持易燃時選上面那套。順帶一提馬蹄鐵也會提高易燃自己的施加機率（施加易燃時同樣吃那個 ×1.5），所以它其實有雙重效果。","Chance multipliers are multiplicative: Flammable x1.5 and Lucky Horseshoe x1.5 give x2.25, which turns Fire Vortex's 60% into a guaranteed application. The build above is stronger with Flammable always up (252k vs 218k), but that assumes perfect uptime. Flammable lasts only 6 s, Melting Face has a 15 s cooldown and Molten Core rolls 40% every 5 s, so gaps are unavoidable. Recomputed at 50% Flammable uptime the two builds land at 169k vs 168k - effectively level, and this one has a far higher floor because the Horseshoe's x1.5 is unconditional. Take this against single bosses or when nobody else is applying statuses; take the build above when you can hold Flammable up. Note the Horseshoe also boosts the chance to apply Flammable itself, so it works on both halves of the chain.","Множители шанса перемножаются: горючесть x1.5 и «Счастливая подкова» x1.5 дают x2.25, и 60% «Огненного вихря» становятся гарантией. Сборка выше сильнее при постоянной горючести (252 тыс. против 218 тыс.), но горючесть длится всего 6 сек. Пересчёт при 50% аптайма: 169 тыс. против 168 тыс. - практически поровну, но здесь нижняя граница намного выше. Подкова также повышает шанс наложить саму горючесть."],"items":["I00E","kpin","I067","I086","I06A","I09G"],"bonus":{"s1":"oli2","s2":"I0AV"}},{"id":"hamg-proc","c":"#FF7043","talent":"A03J","n":["瞬燃機率流","Instant-Burn Proc Rate","Мгновенный поджог: шанс"],"key":["立即點燃讓每次判定都是完整傷害，所以把「機率」拉滿比堆傷害更划算","Instant burn makes every roll a full hit, so raising the chance beats raising the damage","Мгновенный поджог превращает каждую проверку в полный урон, поэтому шанс важнее урона"],"why":["「人間煉獄」把點燃從 16 跳的持續傷害改成一次結算。那條路徑的係數固定在 1.5 加上你的點燃加成，跳數翻倍那一塊完全吃不到，所以易燃對這套只剩下「機率 ×1.5」。既然每次成功判定都是一次完整傷害，把判定次數與機率拉滿就是最划算的方向。烈焰旋風每 0.30 秒放一顆、共 40 顆，等於 40 次獨立判定；把 60% 乘到必中，等於多四成的傷害，比任何一件「+15% 點燃傷害」都強。技能強度是唯一的傷害根源：所有技能都是「基礎 + 技能強度 × 係數」，而點燃總傷害又是那個數字的倍數，所以它同時放大直傷與點燃。星界耳環單件 +800 是全遊戲最高。這套的真正價值不在總量（一輪約 14.5 萬，低於易燃流的 25.2 萬），而在它無視點燃抗性 —— 人間煉獄會跳過「點燃免疫」的判定，對帶抵抗點燃的敵人照樣有完整機率，其他點燃流在那種敵人面前機率只剩 1/4。注意拜火者沒有任何技能吃「裝備技能威力」，那個屬性對它只有道具觸發有用；另外火柱完全不施加點燃，它是純魔法傷害。","Hell on Earth converts burn from a 16-tick damage-over-time into a single instant hit. That path's coefficient is fixed at 1.5 plus your burn bonus and cannot use the tick doubling at all, so Flammable only contributes its x1.5 chance here. Since every successful roll is a full hit, maximising the number of rolls and their chance is the efficient direction. Fire Vortex fires one projectile every 0.30 s for a total of 40 - forty independent rolls - so lifting 60% to a guaranteed application is worth about 40% more damage, more than any single \"+15% burn damage\" item. Spell power is the only real damage source: every ability is base + spell power x ratio, and burn totals are a multiple of that number, so it scales direct damage and burn at once. Astral Earring alone gives +800, the highest in the game. The real value of this build is not raw total (about 145k per rotation, below the Flammable build's 252k) but that it ignores burn resistance: Hell on Earth skips the burn-immunity check entirely, so burn-immune enemies still take the full chance, while every other burn build drops to a quarter chance against them. Note that none of this hero's abilities scale with Modifier power, and that Pillar of Flame applies no burn at all - it is pure magic damage.","«Ад на земле» превращает поджог из урона по времени (16 тиков) в мгновенный удар. Коэффициент этого пути зафиксирован на 1.5 плюс ваш бонус к поджогу, удвоение тиков недоступно, поэтому горючесть даёт здесь только x1.5 к шансу. Раз каждая успешная проверка - полный урон, выгоднее всего наращивать число проверок и шанс. «Огненный вихрь» выпускает снаряд каждые 0.30 сек., всего 40 - сорок независимых проверок. Сила умений - единственный источник урона. Главная ценность сборки не в общем уроне (около 145 тыс. против 252 тыс. у сборки на горючесть), а в том, что «Ад на земле» полностью игнорирует проверку иммунитета к поджогу."],"items":["I00E","sor5","kpin","I067","I0AM","I09G"],"bonus":{"s1":"oli2","s2":"I0AV"}},{"id":"hamg-tanky","c":"#C98A5B","talent":"A03J","n":["瞬燃穩健版","Instant Burn, Durable","Мгновенный поджог: живучесть"],"key":["同樣的機率流骨架，用 400 技能強度換 1000 生命與反傷","The same proc-rate core, trading 400 spell power for 1000 health and reflect","Тот же каркас, но 400 силы умений меняются на 1000 здоровья и отражение"],"why":["拜火者是純輸出法師，被近身就死，而機率流那套完全沒有生存裝。這版把純淨紫水晶（+400 技能強度、沒有其他屬性）換成苦難面具：+1000 生命、+500 法力、+5 全屬性，而且會把受到傷害的 20% 反彈給敵方英雄 —— 那個反彈算的是原始傷害、不受你的減傷影響，也不被對方減免，等於在補生存的同時補了一份被動輸出。代價是一輪總傷害約掉兩成。打高傷 BOSS 或容易被集火的場面用這版；能安全站樁時用機率流。","This hero is a pure caster with no defences - the proc-rate build carries none at all. This version swaps Pure Amethyst (+400 spell power and nothing else) for the Mask of Suffering: +1000 health, +500 mana, +5 to all stats, and it reflects 20% of damage taken back at enemy heroes. That reflect is calculated from the raw incoming damage, so neither your own reduction nor the target's shrinks it - it adds passive damage while adding survivability. The cost is roughly a fifth of a full rotation. Use this against hard-hitting bosses or when you get focused; use the proc-rate build when you can stand still safely.","Огнепоклонник - чистый маг без защиты, а в сборке на шанс её нет совсем. Здесь «Чистый аметист» (+400 силы умений и больше ничего) меняется на «Маску страданий»: +1000 здоровья, +500 маны, +5 ко всем характеристикам и отражение 20% полученного урона во вражеских героев. Отражение считается от исходного урона, поэтому ни ваша защита, ни защита цели его не уменьшают. Цена - около пятой части общего урона за ротацию."],"items":["I00E","I068","kpin","I067","I0AM","I09G"],"bonus":{"s1":"oli2","s2":"I0AV"}}],"skins":[],"author":null,"icon":"images/heroes/h_Hamg.png","proper":"Солар","st":{"str":null,"str_lv":2.299999952316284,"agi":15,"agi_lv":1.2000000476837158,"int":28,"int_lv":3.5,"speed":null},"roles":[["法師","Mage","маг"]],"sc":[["sp","dburn"],["burn","flam"]],"mod":[],"sp":["A03F","AHfs","A02J","A03O"],"ab":[{"id":"A03F","kind":"hero","n":["火山爆破","Volcanic Detonation","Вулканический подрыв"],"k":"E","lv":5,"t":["英雄朝指定方向引發一連串接續的爆破，造成範圍傷害。最後一次爆破造成更高的傷害、更大的作用範圍，並施加點燃效果。\n\n爆破傷害：30 +（12% 技能強度）點\n強化爆破傷害：50 +（20% 技能強度）點\n強化爆破的點燃：75% 機率，200% 傷害\n\n冷卻：14 秒","The hero launches consecutive detonations in the target direction, dealing area damage. The last detonation deals increased damage over an increased area and applies the Burn effect.\n\nDetonation damage: 30 + (12% spell power)\nEmpowered detonation damage: 50 + (20% spell power)\nBurn from the empowered detonation: 75% chance, 200% damage\n\nCooldown: 14 sec.","Герой запускает в указанную сторону последовательные подрывы, наносящие урон по области. Последний подрыв наносит увеличенный урон по увеличенной площади и накладывает эффект поджога.\n\nУрон от подрыва: 30 + (12% сила умений) ед.\nУрон от усиленного подрыва: 50 + (20% сила умений) ед.\nПоджог от усиленного подрыва: 75% шанс, 200% урон\n\nПерезарядка: 14 сек."],"icon":"images/heroes/a_A03F.png","lvt":[{"i":2,"v":["30","45","60","75","90"]},{"i":3,"v":["50","75","100","125","150"]}]},{"id":"AHfs","kind":"hero","n":["火柱","Pillar of Flame","Огненный столб"],"k":"Q","lv":5,"t":["在指定區域引發爆炸，對被波及的敵人造成傷害。爆炸會留下一灘火焰，造成較低的傷害。\n\n爆炸傷害：45 +（20% 技能強度）點/秒\n爆炸持續時間：2.6 秒\n火焰傷害：10 +（5% 技能強度）點/秒\n火焰持續時間：8 秒\n\n冷卻：13 秒","Causes an explosion in the target area, dealing damage to the enemies caught in it. The explosion leaves behind a pool of fire that deals lesser damage.\n\nExplosion damage: 45 + (20% spell power) per sec.\nExplosion duration: 2.6 sec.\nFire pool damage: 10 + (5% spell power) per sec.\nFire pool duration: 8 sec.\n\nCooldown: 13 sec.","Вызывает взрыв в указанной области, наносящий урон застигнутым противником. Взрыв оставляет после себя огненную лужу, наносящую меньший урон.\n\nУрон от взрыва: 45 + (20% сила умений) ед./сек.\nДлительность взрыва: 2.6 сек.\nУрон от лужи: 10 + (5% сила умений) ед./сек.\nДлительность огненной лужи: 8 сек.\n\nПерезарядка: 13 сек."],"icon":"images/heroes/a_AHfs.png","lvt":[{"i":2,"v":["45","70","95","120","145"]},{"i":4,"v":["10","15","20","25","30"]}]},{"id":"A02J","kind":"hero","n":["烈焰洪流","Fire Stream","Огненный поток"],"k":"W","lv":5,"t":["向指定敵人發射一道火焰投射物洪流。每一發投射物在命中時造成傷害，並有少許機率點燃敵人。\n\n投射物傷害：12 +（3% 技能強度）點\n投射物的點燃效果：50% 機率，100% 傷害\n投射物數量：20 發\n\n冷卻：20 秒","Directs a stream of fire projectiles at the target enemy. Each projectile deals damage on impact and has a small chance to set the enemy on fire.\n\nProjectile damage: 12 + (3% spell power)\nProjectile Burn effect: 50% chance, 100% damage\nNumber of projectiles: 20\n\nCooldown: 20 sec.","Направляет в указанного врага поток огненных снарядов. Каждый снаряд наносит урон при столкновении и поджигает врага с небольшим шансом.\n\nУрон от снаряда: 12 + (3% сила умений) ед.\nЭффект поджога от снаряда: 50% шанс, 100% урона\nКоличество снарядов: 20 ед.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A02J.png","lvt":[{"i":2,"v":["12","18","24","30","36"]},{"i":4,"v":["20","25","30","35","40"]}]},{"id":"A03O","kind":"hero","n":["烈焰旋風","Fire Vortex","Огненный вихрь"],"k":"R","lv":1,"t":["在指定位置生成一個無規則移動的火焰旋風。旋風會朝周圍區域射出火焰彈，造成小範圍傷害。此外旋風也會對自身附近的敵人造成額外傷害。旋風與火焰彈都可能點燃敵人。\n\n旋風傷害：30 + （15% 技能強度）點/秒\n火焰彈傷害：60 + （30% 技能強度）點\n旋風與火焰彈的點燃效果：60% 機率，250% 傷害\n技能持續時間：12 秒\n\n冷卻：90 秒","Creates a chaotically moving fire whirl at the target location. The whirl launches fire blasts into the area around it, dealing damage in a small area. The whirl also deals additional damage to enemies next to it. Both the whirl and the blasts can burn enemies.\n\nWhirl damage: 30 + (15% spell power) per sec.\nFire blast damage: 60 + (30% spell power)\nBurn effect from the whirl and blasts: 60% chance, 250% damage\nAbility duration: 12 sec.\n\nCooldown: 90 sec.","Создаёт в указанном месте хаотично движущийся огненный вихрь. Вихрь запускает огненные сгустки по области вокруг себя, наносящие урон по небольшой области. Также вихрь дополнительно наносит урон врагам рядом с собой. Вихрь и сгустки могут поджечь врагов.\n\nУрон вихря: 30 + (15% сила умений) ед./сек.\nУрон от огненных сгустков: 60 + (30% сила умений) ед.\nЭффект поджога от вихря и сгустков: 60% шанс, 250% урон\nВремя действия умения: 12 сек.\n\nПерезарядка: 90 сек."],"icon":"images/heroes/a_A03O.png"},{"id":"A031","kind":"innate","n":["熔面者","Facemelter","Лицеплав"],"k":"Z","lv":1,"t":["對敵人造成傷害並施加易燃效果。\n\n傷害：（200% int）點\n易燃：120% 機率\n\n冷卻：15 秒","Deals damage to enemies and applies the Flammable effect.\n\nDamage: (200% int)\nFlammable: 120% chance\n\nCooldown: 15 sec.","Наносит урон Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T2","T2","Т2"],"late":["低","Low","низкий"],"d":["戰鬥法師，只有攻擊性法術，專精於「點燃」狀態。","A battle mage with purely offensive spells, specialising in the Ignite status.","Боевой маг, обладающий исключительно атакующими заклинаниями. Специализируется на статусе \"поджог\"."]},{"id":"N03S","n":["暴風使者","Stormbringer","Буревестник"],"attr":"int","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_N03S.png","proper":"Моджо Буйный Гром","st":{"str":17,"str_lv":null,"agi":19,"agi_lv":2.0,"int":28,"int_lv":4.0,"speed":null},"roles":[["法師","Mage","маг"]],"sc":[["sp","as"],[]],"mod":[],"sp":["A0HU","A0HT","A0H3","A0H4","A0HC"],"ab":[{"id":"A0HU","kind":"hero","n":["致命閃電","Striking Lightning","Разящая молния"],"k":"","lv":5,"t":["英雄的攻擊會引發分岔的閃電，擊中數名敵人。\n\n傷害：70 +（15% 技能強度）點\n目標數量：3 個\n技能強度 200+：回復 2% MP\n技能強度 400+：閃電最多擊中 4 個目標\n技能強度 600+：回復 2% HP\n技能強度 800+：閃電最多擊中 5 個目標\n\n冷卻：10 秒","The hero's attack calls forth a forking lightning bolt that strikes several enemies.\n\nDamage: 70 + (15% spell power)\nTargets: 3\n200+ spell power: restores 2% MP\n400+ spell power: lightning strikes up to 4 targets\n600+ spell power: restores 2% HP\n800+ spell power: lightning strikes up to 5 targets\n\nCooldown: 10 sec.","Атака героя вызывает разветвленную молнию, поражающую нескольких противников.\n\nУрон: 70 + (15% сила умений) ед.\nКоличество целей: 3 ед.\n200+ сила умений: восстановление 2% MP\n400+ сила умений: молния поражает до 4 целей\n600+ сила умений: восстановление 2% HP\n800+ сила умений: молния поражает до 5 целей\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0HU.png","lvt":[{"i":2,"v":["70","110","150","190","230"]}]},{"id":"A0HT","kind":"hero","n":["吸收法球","Orb of Absorption","Сфера поглощения"],"k":"R","lv":1,"t":["英雄在指定地點生成一個吸收法球，並於 10 秒後爆炸。法球會依據其內部的敵人累積自身的傷害。\n\n初始傷害：200 + （75% 技能強度）點\n傷害累積（每個敵方單位）：每秒 +0.5% 初始傷害\n傷害累積（每個敵方英雄）：每秒 +2.5% 初始傷害\n\n冷卻：60 秒。","The hero creates an absorption sphere at the target location that explodes after 10 sec. The sphere accumulates its damage depending on the enemies inside it.\n\nInitial damage: 200 + (75% spell power)\nDamage accumulation (per enemy unit): +0.5% of the initial damage per sec.\nDamage accumulation (per enemy hero): +2.5% of the initial damage per sec.\n\nCooldown: 60 sec.","Герой создает в указанном месте сферу поглощения, которая взорвется через 10 сек. Сфера накапливает свой урон в зависимости от противников внутри неё.\n\nНачальный урон: 200 + (75% сила умений) ед.\nНакопление урона (каждый вражеский юнит): +0.5% от начального урона в сек.\nНакопление урона (каждый вражеский герой): +2.5% от начального урона в сек.\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A0HT.png"},{"id":"A0H3","kind":"hero","n":["閃電打擊","Lightning Strike","Удар молнии"],"k":"Q","lv":5,"t":["以閃電擊中指定區域，對敵人造成傷害。\n\n傷害：80 +（35% 技能強度）點\n\n冷卻：15 秒","Strikes the target area with lightning, dealing damage to enemies.\n\nDamage: 80 + (35% spell power)\n\nCooldown: 15 sec.","Ударяет молнией по указанной области, нанося урон противникам.\n\nУрон: 80 + (35% сила умений) ед.\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A0H3.png","lvt":[{"i":2,"v":["80","120","160","200","240"]}]},{"id":"A0H4","kind":"hero","n":["連鎖引爆","Chain Detonation","Цепной подрыв"],"k":"W","lv":5,"t":["在近距離引爆指定區域。若爆炸擊中了敵人，就會在更遠的距離產生新的爆炸，而新的爆炸還能再引發下一次爆炸。每一次新的爆炸傷害提高 10%。\n\n爆炸傷害：60 +（18% 技能強度）點\n\n冷卻：22 秒","Detonates the target area at close range. If the explosion hits an enemy, a new explosion appears at a greater distance, which is able to spawn another explosion. Each new explosion deals 10% more damage.\n\nExplosion damage: 60 + (18% spell power)\n\nCooldown: 22 sec.","Подрывает указанную область на ближней дистанции. Если взрыв поразил противника, то появляется новый взрыв на более дальнюю дистанцию, способный породить новый взрыв. Каждый новый взрыв наносит на 10% больше урона.\n\nУрон от взрыва: 60 + (18% сила умений) ед.\n\nПерезарядка: 22 сек."],"icon":"images/heroes/a_A0H4.png","lvt":[{"i":2,"v":["60","90","120","150","180"]}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0HC","kind":"innate","n":["過載","Overload","Перегрузка"],"k":"D","lv":null,"t":["在 8 秒內，暴風使者的攻擊速度提升 75%，並在攻擊時獲得造成範圍傷害的小機率。\n\n觸發機率：30%\n傷害：（150% 智力）+ （20% 技能強度）點\n\n冷卻：28 秒。","For 8 sec. the Stormbringer increases his attack speed by 75% and gains a small chance to deal area damage on attack.\n\nProc chance: 30%\nDamage: (150% INTELLIGENCE) + (20% spell power)\n\nCooldown: 28 sec.","В течение 8 сек. буревестник увеличивает свою скорость атаки на 75% и получает небольшой шанс нанести урон по области при атаке.\n\nШанс срабатывания: 30%\nУрон: (150% РАЗУМ) + (20% сила умений) ед.\n\nПерезарядка: 28 сек."],"icon":"images/heroes/a_A0HC.png"}],"d":["無情的法師，對敵方集群造成巨量傷害，但非常吃法力。","A merciless mage who devastates enemy clusters but is extremely mana-hungry.","Беспощадный маг, наносящий огромный урон против скоплений противника, требовательный к мане герой."]},{"id":"N03R","n":["烈焰領主","Lord of Flame","Лорд пламени"],"attr":"int","unlock":50000,"random":true,"builds":[],"skins":[{"id":"Nfir","on":true,"n":["遠古元素","Ancient Elementa рагов. При силе умений 300+ огненные участки дополнительно замедляют скорость движения врагов на 50%.\n\nПериодический урон: 20 + (8% сила умений) ед./сек.\nПериодичность тактов урона: 0.5 сек.\nЭффект поджога: 15% шанс на каждый такт; 75% урона\nВремя действия: 18 + (2% сила умений) сек.\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A0GX.png","lvt":[{"i":2,"v":["20","30","40","50","60"]}]},{"id":"A01Q","kind":"hero","n":["火焰之靈","Spirit of Fire","Дух огня"],"k":"W","lv":5,"t":["英雄召喚火焰之靈，持續 60 秒。火焰之靈可造成範圍傷害，並擁有數個受技能強度影響的技能。\n\n火焰之靈生命值：450 + 25% 英雄最大生命值 點\n火焰之靈攻擊力：34 + （10% 技能強度）點\n火焰之靈護甲：2 點\n持有物品「扭曲權杖」時：火焰之靈攻擊速度 +30%\n\n冷卻：60 秒","The hero summons a fire spirit for 60 sec. The spirit can deal area damage and has several abilities that scale with spell power.\n\nSpirit health: 450 + 25% of the hero's max HP\nSpirit attack power: 34 + (10% spell power)\nSpirit armour: 2\nWith the item \"Scepter of Distortion\": +30% spirit attack speed\n\nCooldown: 60 sec.","Герой призывает духа огня на 60 сек. Дух может наносить урон по области и имеет несколько умений, зависящих от силы умений.\n\nЗапас здоровья духа: 450 + 25% max HP героя ед.\nСила атаки духа: 34 + (10% сила умений) ед.\nЗащита духа: 2 ед.\nПри наличии предмета \"Скипетр искажения\": +30% скорость атаки духа\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A01Q.png","lvt":[{"i":2,"v":["450","625","800","975","1150"]},{"i":3,"v":["34","48","62","76","90"]},{"i":4,"v":["2","3","4","5","6"]}]},{"id":"A0H1","kind":"hero","n":["隕石","Meteorite","Метеорит"],"k":"R","lv":1,"t":["朝敵人降下一顆隕石，造成巨量的範圍傷害並點燃被命中的目標。\n\n傷害：350 + （125% 技能強度）點\n點燃效果：75% 機率；50% 傷害\n\n冷卻：120 秒","Calls down a meteorite onto enemies, dealing enormous area damage and Burning the targets hit.\n\nDamage: 350 + (125% spell power)\nBurn effect: 75% chance; 50% damage\n\nCooldown: 120 sec.","Обрушивает на противников метеорит, наносящий огромный урон по области и поджигающий пораженные цели.\n\nУрон: 350 + (125% сила умений) ед.\nЭффект поджога: 75% шанс; 50% урона\n\nПерезарядка: 120 сек."],"icon":"images/heroes/a_A0H1.png"},{"id":"A05M","kind":"innate","n":["火焰銘文","Fire Inscriptions","Огненные начертания"],"k":"","lv":null,"t":["英雄死亡後會在自身腳下留下火焰銘文，烈焰領主將於 25 秒後在該處以全滿的生命值與法力值復活。復活時灼燒周圍的敵人，造成大量傷害。\n\n造成傷害：（105% 技能強度）+ （35% 最大法力值）點","After death the hero creates fiery inscriptions beneath himself, on which the Lord of Flame resurrects after 25 sec. with full health and mana. On resurrection he scorches the enemies around him, dealing a large amount of damage.\n\nDamage dealt: (105% spell power) + (35% max mana)","Герой после смерти создает под собой огненные начертания, на месте которых лорд пламени воскреснет через 25 сек. с полным запасом здоровья и маны. При возрождении опаляет врагов вокруг, нанося большое количество урона.\n\nНаносимый урон: (105% сила умений) + (35% макс. запас маны) ед."],"icon":"images/heroes/a_A05M.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A08K","kind":"innate","n":["第二背包","Second Inventory","物品欄"],"k":"","lv":null,"t":["","",""],"icon":"images/heroes/a_A08K.png"}],"d":["強力法師，但只能攜帶 4 件道具。可召喚火靈，另有獨立資源。","A strong mage limited to 4 items. Summons a fire spirit and runs on a separate resource.","Сильный маг, способный носить только 4 предмета. Может призывать на помощь духа огня, имеет отдельную механику воскрешения.\n\nИммунитет к поджогу."]},{"id":"U011","n":["獅鷲守護者","Gryphon Keeper","Грифон Хранитель"],"attr":"int","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_U011.png","proper":"Криз","st":{"s absorbs incoming damage.\n\nDamage blocked per point of mana: 3\nDamage absorption: 50%","Герой защищает себя магическим щитом, частично поглощающим получаемый урон.\n\nЕдиница маны блокирует урона: 3 ед.\nПоглощение урона: 50%"],"icon":"images/heroes/a_A0ES.png","lvt":[{"i":2,"v":["3","4","5","6","2"]}]},{"id":"A0EW","kind":"hero","n":["球狀閃電","Ball Lightning","Шаровые молнии"],"k":"R","lv":1,"t":["球狀閃電開始在英雄身邊接連出現，攻擊英雄周圍的區域。技能持續期間，英雄可自由執行其他命令。\n\n球狀閃電數量：28 顆\n球狀閃電傷害：75 + (8% max MP)\n\n冷卻：70 秒","Ball lightnings begin to appear one after another near the hero, striking the area around him. While the ability is active the hero can freely carry out other orders.\n\nNumber of ball lightnings: 28\nBall lightning damage: 75 + (8% max MP)\n\nCooldown: 70 sec.","Возле героя начинают поочередно появляться шаровые молнии, поражающие область вокруг героя. Во время действия умения герой может свободно выполнять другие приказы.\n\nКоличество шаровых молний: 28 ед.\nУрон шаровых молний: 75 + (8% max MP)\n\nПерезарядка: 70 сек."],"icon":"images/heroes/a_A0EW.png"},{"id":"A107","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量階級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A107.png","opts":[{"id":"A108","n":["絕對屏障","Absolute Barrier","Абсолютный барьер"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n-10 / +0\n+0 / +0\n+15 / +3\n\n技能「魔法護盾」可吸收 100% 傷害。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n-10 / +0\n+0 / +0\n+15 / +3\n\nThe \"Magic Shield\" ability absorbs 100% of damage.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n-10 / +0\n+0 / +0\n+15 / +3\n\nУмение \"Магический щит\" поглощает 100% урона."],"icon":"images/heroes/a_A108.png"},{"id":"A10A","n":["雷霆使者","Herald of Thunder","Вестник грома"],"t":["強度等級：T3+\n屬性加成／每級屬性成長加成：\n+6 / +2\n+3 / +0\n+6 / +2\n\n技能「球狀閃電」撞上英雄時造成的傷害降低 25%，但作用範圍提升 75%，並使敵人暈眩 3 秒（英雄 2 秒）。\n\n技能「球狀閃電」不再有彈體計數——現在每產生一枚彈體便消耗 25 點法力值，技能會持續到英雄的法力值低於 25% 為止。球狀閃電還會以 25% 機率對被擊中的敵人施加電擊。","Power rank: T3+\nAttribute bonus / attribute growth per level bonus:\n+6 / +2\n+3 / +0\n+6 / +2\n\nThe \"Ball Lightning\" ability deals 25% less damage when it collides with a hero, but over a 75% larger area and stunning enemies for 3 sec. (heroes for 2 sec.)\n\nThe \"Ball Lightning\" ability no longer has a projectile counter - each projectile that appears now costs 25 mana, and the ability lasts until the hero's mana level drops below 25%. Ball lightnings also apply Shock to the enemies they hit with a 25% chance.","Ранг силы: Т3+\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+6 / +2\n+3 / +0\n+6 / +2\n\nУмение \"Шаровая молния\" при столкновении с героем наносит на 25% меньше урона, но по увеличенной на 75% области и оглушая противников на 3 сек. (героев на 2 сек.)\n\nУмение \"Шаровые молнии\" больше не имеет счётчика снарядов - каждое появление снаряда теперь расходует 25 ед. маны, умение будет длиться до тех пор, пока уровень маны героя не будет ниже 25%. Шаровые молнии также применяют шок на пораженных врагов с 25% шансом."],"icon":"images/heroes/a_A10A.png"}]},{"id":"A0EZ","kind":"innate","n":["法球回收","Orb Recall","Возврат сферы"],"k":"Z","lv":1,"t":["英雄將風暴法球召回自身，使其加速效果增強 50%。當法球回到獅鷲身邊時會發生爆炸，對周圍敵人造成傷害。\n\n造成傷害：（125% 智力 + 50% 技能強度）點\n若爆炸當下「魔法護盾」技能處於啟動狀態：爆炸傷害依「魔法護盾」技能的每一等級提升 10%\n\n冷卻：5 秒","The hero returns the storm orb to himself, strengthening its acceleration effect by 50%. When the orb reaches the gryphon, an explosion occurs that deals damage to surrounding enemies.\n\nDamage dealt: (125% Intelligence + 50% spell power)\nIf the \"Magic Shield\" ability is active at the moment of the explosion: explosion damage is increased by 10% per level of в"],"k":"R","lv":1,"t":["德魯伊召喚一名森林守衛，持續 60 秒。召喚出的守衛擁有微弱的魔法抗性與減速敵人的光環，並且可以使用「大地重擊」技能。\n\n守衛生命值：800 + 英雄 50% max HP 點\n守衛攻擊力：70 + （20% 技能強度）點\n守衛護甲：5 點\n持有「扭曲權杖」道具時：守衛攻擊速度 +30%\n\n冷卻：100 秒","The druid summons a forest guardian for 60 sec. The summoned guardian has weak magic resistance and an aura that slows enemies, and can also use the \"Ground Slam\" ability.\n\nGuardian health: 800 + 50% of the hero's max HP\nGuardian attack power: 70 + (20% spell power)\nGuardian armour: 5\nWith the item \"Scepter of Distortion\": +30% guardian attack speed\n\nCooldown: 100 sec.","Друид призывает стража лесов на 60 сек. Призванный страж имеет слабую защиту от магии и замедляющую врагов ауру, а также может применять способность \"Удар по земле\".\n\nЗапас здоровья стража: 800 + 50% max HP героя ед.\nСила атаки стража: 70 + (20% сила умений) ед.\nЗащита стража: 5 ед.\nПри наличии предмета \"Скипетр искажения\": +30% скорость атаки стража\n\nПерезарядка: 100 сек."],"icon":"images/heroes/a_A0M6.png"},{"id":"A0MA","kind":"innate","n":["選擇技能","Choose an Ability","Выбрать умение"],"k":"D","lv":null,"t":["在與敵人開戰之前，請務必選擇一項額外技能。","Be sure to choose an additional ability before you start fighting the enemy.","Обязательно выберите дополнительное умение, прежде чем начать борьбу с врагом."],"icon":"images/heroes/a_A0MA.png","opts":[{"id":"A0MB","n":["召喚樹人","Summon Ents","Призвать энтов"],"t":["召喚樹人前來助戰，存在時間為 40 秒。樹人會繼承夜精靈種族的升級。\n\n樹人數量：2 + （每 200 點技能強度 1 隻樹人）","Summons ents to your aid, existing for 40 sec. The ents inherit the Night Elf race upgrades.\n\nNumber of ents: 2 + (1 ent for every 200 spell power)","Призывает на помощь энтов, существующих в течение 40 сек. Энты наследуют улучшения расы ночных эльфов.\n\nКоличество энтов: 2 + (1 энт за каждые 200 силы умений) ед."],"icon":"images/heroes/a_A0MB.png"},{"id":"A0MD","n":["馭風","Mastery of Wind","Подчинение ветра"],"t":["大幅減慢龍捲風的移動速度與造成傷害的速度，龍捲風獲得 +50% 作用範圍加成，並額外使敵人的攻擊速度降低 50%。技能「回復」在持續期間會使目標的攻擊速度提升 75%。","Greatly slows the tornado's move 0UN.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["強力法師，用組合技能打出巨量傷害。","A powerful mage who deals enormous damage through ability combos.","Сильный маг, способный наносить огромный урон комбинированными способностями."]},{"id":"Nalc","n":["宇宙巨龍","Cosmic Dragon","Космический дракон"],"attr":"int","unlock":4000000,"random":true,"builds":[],"skins":[],"author":"SqrilTeef","icon":"images/heroes/h_Nalc.png","proper":"Аурелион Сол","st":{"str":19,"str_lv":2.200000047683716,"agi":16,"agi_lv":2.0,"int":31,"int_lv":4.0,"speed":320},"roles":[["法師","Mage","маг"]],"sc":[["sp","mp"],[]],"mod":[],"sp":["A0VQ"],"ab":[{"id":"A0VS","kind":"hero","n":["烈日吐息","Breath of the Sun","Дыхание солнца"],"k":"Q","lv":5,"t":["英雄開始朝指定方向噴射火焰，對被波及的敵人造成傷害。\n\n傷害：火焰內每顆彈體 8 + （4% 星辰物質）點\n維持的法力消耗：14 點/秒，維持 8 秒後消耗每秒增加 20%\n最大持續時間：無限制\n\n冷卻：20 秒\n\n星辰物質可提升火焰的飛行距離。","The hero begins to emit flame in the chosen direction, damaging enemies caught in it.\n\nDamage: 8 + (4% star matter) per projectile inside the flame\nMana upkeep: 14 per sec., after 8 sec. of upkeep the cost grows by 20% each sec.\nMaximum duration: unlimited\n\nCooldown: 20 sec.\n\nStar matter increases the flight range of the fires.","Герой начинает испускать пламя в указанную сторону, нанося урон застигнутым врагам.\n\nУрон: 8 + (4% звёздная материя) ед. за каждый снаряд внутри пламени\nРасход маны на поддержание: 14 ед./сек., после 8 сек. поддержания расход будет расти на 20% каждую сек.\nМаксимальная длительность: неограничено\n\nПерезарядка: 20 сек.\n\nЗвёздная материя повышает дальность полёта огней."],"icon":"images/heroes/a_A0VS.png","lvt":[{"i":2,"v":["8","12","16","20","24"]},{"i":3,"v":["14","18","22","26","30"]}]},{"id":"A0VT","kind":"hero","n":["宇宙飛行","Cosmic Flight","Космический полёт"],"k":"W","lv":5,"t":["英雄向指定地點衝刺，飛行過程中回復生命值並散布魔法火焰，依「烈日吐息」技能的公式造成 X6 傷害。\n\n治療：每 100 點距離 10 + （5% 星辰物質）點\n施放距離：1000 點\n\n冷卻：15 秒\n\n星辰物質可提升飛行過程中散發的火焰數量。","The hero dashes to the chosen point, restoring health during the flight and spreading magical fires that deal X6 damage by the formula of the \"Breath of the Sun\" ability.\n\nHealing: 10 + (5% star matter) per every 100 units of distance\nCast range: 1000\n\nCooldown: 15 sec.\n\nStar matter increases the number of fires emitted during the flight.","Герой совершает рывок до указанной точки, восстанавливая здоровье во время полёта и распространяя магические огни, наносящие Х6 урон по формуле умения \"Дыхание солнца\".\n\nИсцеление: 10 + (5% звёздная материя) ед. за каждые 100 ед. расстояния\nДальность применения: 1000 ед.\n\nПерезарядка: 15 сек.\n\nЗвёздная материя повышает количество испускаемых огней во время полёта."],"icon":"images/heroes/a_A0VT.png","lvt":[{"i":2,"v":["10","15","20","25","30"]},{"i":3,"v":["1000","1200","1400","1600","1800"]}]},{"id":"A0VP","kind":"hero","n":["奇點","Singularity","Сингулярность"],"k":"E","lv":5,"t":["奧瑞利安·索爾製造一個黑洞，緩慢將敵人拉向其中心，並在作用範圍內造成傷害。生命值在 10% 及以下的敵人受到黑洞 300% 的傷害。\n\n傷害：30 + （15% 星辰物質）點/秒\n持續時間：12 秒\n\n冷卻：25 秒\n\n星辰物質可提升作用範圍與吸引力度。","Aurelion Sol creates a black hole that slowly pulls enemies toward its centre and deals damage within the area. Enemies at 10% health or below take 300% damage from the black hole.\n\nDamage: 30 + (15% star matter) per sec.\nDuration: 12 sec.\n\nCooldown: 25 sec.\n\nStar matter increases the area and the strength of the pull.","Аурелион Сол создает чёрную дыру, которая медленно притягивает врагов к своему центру и наносит урон в зоне поражения. Враги с запасом здоровья 10% и ниже получают 300% урона от чёрной дыры.\n\nУрон: 30 + (15% звёздная материя) ед./сек.\nВремя действия: 12 сек.\n\nПерезарядка: 25 сек.\n\nЗвёздная материя повышает область и силу притяжения."],"icon":"images/heroes/a_A0VP.png","lvt":[{"i":2,"v":["30","45","60","75","90"]}]},{"id":"A0VU","kind":"hero","n":["流星","Falling Star","Падающая звезда"],"k":"R","lv":1,"t":["奧瑞利安．索爾朝指定區域降下一顆星辰，對敵人造成極大傷害並短暫暈眩敵人。\n\n傷害：300 + （100% 星辰物質）點\n暈眩（英雄）：4 秒\n暈眩（單位）：6 秒\n\n冷卻：120 秒\n\n星辰物質會產生衝擊波，對被波及的敵人造成此技能傷害的 10%。衝擊波概略分為「波次」，每產生一個波次需要 125 點星辰物質。","Aurelion Sol calls down a star onto the chosen area, dealing colossal damage to enemies and stunning them for a short time.\n\nDamage: 300 + (100% star matter)\nStun (heroes): 4 sec.\nStun (units): 6 sec.\n\nCooldown: 120 sec.\n\nStar matter creates a shockwave that deals 10% of the ability's damage to the enemies it hits. The shockwave is nominally divided into \"pulses\"; each pulse requires 125 star matter to appear.","Аурелион Сол обрушивает на указанную область звезду, наносящую колоссальный урон врагам и оглушающую противников на небольшое время.\n\nУрон: 300 + (100% звёздная материя) ед.\nОглушение (герои): 4 сек.\nОглушение (юниты): 6 сек.\n\nПерезарядка: 120 сек.\n\nЗвёздная материя создаёт ударную волну, наносящую по 10% от урона умения задетым противникам. Ударная волна условно поделена на \"такты\", для появления каждого такта требуется по 125 ед. звёздной материи."],"icon":"images/heroes/a_A0VU.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0VQ","kind":"innate","n":["宇宙創造者","Cosmic Creator","Вселенский творец"],"k":"Z","lv":1,"t":["被動效果：\n\n英雄的技能會因擁有「星辰物質」而變強。目前的星辰物質數量可透過指令「-i」查詢。\n\n星辰物質累積：以英雄技能擊殺敵人可增加（敵人等級 * 0.20）點星辰物質。擊殺敵方英雄可獲得 8 點星辰物質\n\n啟動時：\n\n英雄暫時獲得「星辰物質」。\n\n星辰物質：100 + （X8 英雄等級） + （140% 技能強度）\n持續時間：4 秒後英雄會逐漸失去額外的星辰物質\n\n冷卻：20 秒","Passive effect:\n\nThe hero's abilities become stronger with \"star matter\". The current amount of star matter can be checked with the \"-i\" command.\n\nStar matter accumulation: killing enemies with the hero's abilities increases star matter by (enemy level * 0.20). Killing an enemy hero grants 8 star matter\n\nOn activation:\n\nThe hero temporarily gains \"star matter\".\n\nStar matter: 100 + (X8 hero level) + (140% spell power)\nDuration: after 4 sec. the hero gradually loses the bonus star matter\n\nCooldown: 20 sec.","Пассивный эффект:\n\nУмения героя становятся сильнее от наличия \"звёздной материи\". Количество текущей звёздной материи можно узнать через команду \"-i\".\n\nНакопление звёздной материи: убийство врагов умениями героя увеличивает звёздную материю на (уровень врага * 0.20) ед. Убийство вражеского героя дарует 8 ед. звёздной материи\n\nПри активации:\n\nГерой временно получает \"звёздную материю\".\n\nЗвёздная материя: 100 + (Х8 уровень героя) + (140% сила умений)\nВремя действия: через 4 сек. герой постепенно утрачивает бонусную звёздную материю\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0VQ.png"}],"tier":["T3+","T3+","Т3+"],"late":["極高","Top","высший"],"d":["強大的遠程法師，擁有自己的累積型資源來強化技能。","A mighty ranged mage with his own accumulating resource that empowers his abilities.","Мощный маг дальнего боя, обладающий собственым накапливающимся ресурсом, который усиливает способности."]},{"id":"H01Y","n":["魔法大師","Magister of Magic","Магистр магии"],"attr":"int","unlock":4000000,"random":true,"builds":[],"skins":[{"id":"Hjai","on":true,"n":["恐懼女主宰","Mistress of Terror","Повелительница Ужаса"]}],"author":null,"icon":"images/heroes/h_H01Y.png","proper":"Айзек Ариман","st":{"str":11,"str_lv":1.2999999523162842,"agi":18,"agi_lv":1.5,"int":34,"int_lv":5. айным противникам в области эффект умения \"Заземление\".\n\nУрон: 50 + (18% сила умений) + (60% разум) ед.\n\nПерезарядка: 42 сек."],"icon":"images/heroes/a_A0PM.png","lvt":[{"i":2,"v":["50","75","100","125","150"]}]},{"id":"A0PO","kind":"hero","n":["接地","Grounding","Заземление"],"k":"E","lv":5,"t":["清除自身的負面效果，並對周圍 600 範圍內的敵人造成傷害。同時移除被命中敵人的所有效果並使其減速。每命中一名敵人都會回復少量生命值。智力達到 200 以上時，此技能造成純粹傷害。\n\n造成傷害：（90% 智力）點\n生命值回復：6 點\n\n冷卻：20 秒","Cleanses negative effects from yourself and deals damage to enemies around you within 600 range. Also removes all effects from the enemies hit and slows them. Restores a small amount of health for each enemy hit. At 200+ Intelligence the ability deals pure damage.\n\nDamage dealt: (90% Intelligence)\nHealth restored: 6\n\nCooldown: 20 sec.","Очищает себя от негативных эффектов и наносит урон противникам вокруг в области 600 ед. Также снимает все эффекты с пораженных противников и замедляет их. Восстанавливает небольшое количество здоровья за каждого пораженного противника. При количестве разума 200+ умение наносит чистый урон.\n\nНаносимый урон: (90% разум) ед.\nВосстановление здоровья: 6 ед.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0PO.png","lvt":[{"i":2,"v":["90","120","150","180","210"]},{"i":3,"v":["6","8","10","12","14"]}]},{"id":"A0PR","kind":"hero","n":["魔法崩塌","Magic Collapse","Магический коллапс"],"k":"R","lv":null,"t":["英雄在 5 秒內逐步提升自身的智力與技能強度，之後再將最大加成維持 6 秒。若你未能在加成結束前施放「額外技能」欄位中的「魔法迸發」，英雄將失去 3 點自身屬性。\n\n智力累積：（5% 技能強度）點/秒\n技能強度累積：（20% 智力）點/秒\n\n冷卻：150 秒\n\n技能持續期間，英雄無法拾取具有「倍增」效果的物品。","Over 5 sec. the hero gradually increases his Intelligence and spell power, then holds the maximum bonus for another 6 sec. If you do not manage to cast \"Magic Discharge\" in the \"Extra Abilities\" section before the bonus ends, the hero loses 3 points of his attributes.\n\nIntelligence gain: (5% spell power) per sec.\nSpell power gain: (20% Intelligence) per sec.\n\nCooldown: 150 sec.\n\nThe hero cannot pick up items with the \"Multiplier\" effect while the ability is active.","В течение 5 сек. герой постепенно увеличивает свой разум и силу умений, а потом поддерживает максимальный бонус ещё 6 сек. Eсли вы не успеете применить \"Выброс магии\" в разделе \"Дополнительные умения\" до конца действия бонуса, герой потеряет 3 ед. своих характеристик.\n\nНакопление разума: (5% сила умений) ед./сек.\nНакопление силы умений: (20% разум) ед./сек.\n\nПерезарядка: 150 сек.\n\nГерой не сможет подбирать предметы с эффектом \"Множитель\" во время действия умения."],"icon":"images/heroes/a_A0PR.png"},{"id":"A0PI","kind":"innate","n":["額外技能","Extra Abilities","Дополнительные умения"],"k":"D","lv":null,"t":["開啟英雄的額外技能列表。","Opens the list of the hero's additional abilities.","Открывает список дополнительных умений героя."],"icon":"images/heroes/a_A0PI.png","opts":[{"id":"A0PH","n":["能量牢籠","Energy Cage","Энергетическая клетка"],"t":["在指定區域創造一座能量牢籠，將敵人囚禁在其中，並阻擋外部單位的通行。持續時間為 10 秒。技能強度 500 以上時，能量牢籠的存在時間會延長 3 秒。","Creates an energy cage in the target area that locks enemies inside and blocks the path of units outside. Duration - 10 sec. At 500+ spell power the energy cage lasts 3 sec. longer.","Создает в указанной области энергетическую клетку, запирающую противников внутри и преграждающую дорогу юнитам снаружи. Время действия - 10 сек. При силе способностей 500+ энергетическая клетка будет существовать на 3 сек. дольше."],"icon":"images/heroes/a_A0PH.png"},{"id":"A0PJ","n":["魔導智慧","Sorcerous Intellect","Чародейский интеллект"],"t":["選定的英雄與魔法大師各自獲得等同於對方 50% 智力的智力加成。持續時間為 15 秒。技能強度 500 以上時，效果的持續時間延長 5 秒。\n\n對敵方英雄施放時，會奪取目標 33% 的智力，並在技能持續期間據為己有。","The selected hero and the Magister each gain an Intelligence bonus equal to 50% of the other's Intelligence. Duration - 15 sec. At 500+ spell power the duration of the effect is extended by 5 sec.\n\nWhen used on an enemy hero, it takes 33% of the target's Intelligence and appropriates it for the duration of the ability.","Выбранный герой и магистр получают бонус к разуму, равный 50% разума от друг друга. Время действия - 15 сек. При силе способностей 500+ время действия эффекта продлевается на 5 сек.\n\nПри применении на вражеского героя отнимает 33% разума цели и присваивает себе на время действия умения."],"icon":"images/heroes/a_A0PJ.png"},{"id":"A0PS","n":["魔力迸發","Magic Discharge","Выброс магии"],"t":["此技能僅在「魔法崩塌」持續期間才能運作。清除「魔法崩塌」已累積的加成，並朝指定方向釋放一道毀滅性的波動。\n\n波動傷害：100 + （50% 技能強度）+ （200% 智力）點","The ability only works while \"Magic Collapse\" is active. Resets the accumulated bonuses of \"Magic Collapse\" and releases a destructive wave in the chosen direction.\n\nWave damage: 100 + (50% spell power) + (200% Intelligence)","Умение работает только во время действия \"Магического коллапса\". Сбрасывает накопленные бонусы \"Магического коллапса\" и выпускает разрушительную волну в указанную сторону.\n\nУрон волны: 100 + (50% сила умений) + (200% разум) ед."],"icon":"images/heroes/a_A0PS.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["最強的戰鬥法師，技能組合複雜而全面。","The strongest battle mage, with complex and comprehensive abilities.","Сильнейший боевой маг, обладающий сложными комплексными умениями."]},{"id":"H01D","n":["元帥","Marshal","Маршал"],"attr":"str","unlock":0,"random":true,"builds":[],"skins":[{"id":"Hlgr","on":true,"n":["血精靈統帥","Blood Elf Warlord","Полководец Эльфов Крови"]},{"id":"Emfr","on":true,"n":["暗夜精靈首領","Night Elf Leader","Предводитель Ночных Эльфов"]}],"author":null,"icon":"images/heroes/h_H01D.png","proper":"Отмар Гаритос","st":{"str":21,"str_lv":2.5,"agi":12,"agi_lv":null,"int":19," hat will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0YJ.png","opts":[{"id":"A0YK","n":["力量法則","Principle of Strength","Принцип силы"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+2 / +1\n+1 / +0\n+0 / +0\n\n技能強度的 500% 會作為額外加成套用至英雄的生命值上限。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+1 / +0\n+0 / +0\n\n500% of spell power is applied as an additional bonus to the hero's maximum health.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+1 / +0\n+0 / +0\n\n500% от силы умений применяется как дополнительный бонус к запасу здоровья героя."],"icon":"images/heroes/a_A0YK.png"},{"id":"A0YM","n":["備用砍刀","Spare Choppa","Запасная чоппа"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+4 / +2\n+2 / +0\n+1 / +0\n\n你可以將斧、鎚或任何其他重型武器移入第二背包（F2）（劍類不算）。如此便可在第二背包中持有 1 件物品。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+4 / +2\n+2 / +0\n+1 / +0\n\nYou can move an item that is an axe, hammer or any other heavy weapon into the second inventory (F2) (swords do not count). This way you can have 1 item in the second inventory.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+4 / +2\n+2 / +0\n+1 / +0\n\nВы можете переместить во второй инвентарь (F2) предмет, являющийся топором, молотом или любым другим тяжелым оружием (мечи не считаются). Таким образом можно иметь 1 предмет во втором инвентаре."],"icon":"images/heroes/a_A0YM.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить
