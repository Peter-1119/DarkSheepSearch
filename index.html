con":"images/heroes/h_Hmkg.png","proper":"Леди Лиадрин","st":{"str":22,"str_lv":null,"agi":19,"agi_lv":2.299999952316284,"int":21,"int_lv":2.299999952316284,"speed":360},"roles":[["戰士","Fighter","рубака"]],"sc":[["sp"],[]],"mod":[],"sp":["A01U","Absk","Amgl","A01W"],"ab":[{"id":"A01U","kind":"hero","n":["猛衝","Dash","Рывок"],"k":"Q","lv":5,"t":["朝指定方向衝刺，碰撞時對敵人造成傷害。敵方英雄受到的傷害提高 100%。當「閃耀護盾」技能效果啟動時，碰撞會在英雄兩側產生兩道力量波，造成 75% 的傷害。\n\n傷害：100 + （40% 技能強度）點\n\n冷卻：10 秒","Dashes in the chosen direction and deals damage to enemies on collision. Enemy heroes take 100% more damage. While the \"Sparkling Shield\" ability is active, the collision creates two force waves on either side of the hero, dealing 75% of the damage.\n\nDamage: 100 + (40% spell power)\n\nCooldown: 10 sec.","Совершает рывок в указанную сторону и наосит урон врагам при столкновении. Вражеские герои получают на 100% больше урона. При активном эффекте умения \"Искрящийся щит\" столкновение создает две силовые волны по бокам от героя, наносящие 75% урона.\n\nУрон: 100 + (40% сила умений) ед.\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A01U.png","lvt":[{"i":2,"v":["100","150","200","250","300"]}]},{"id":"Absk","kind":"hero","n":["反攻","Counteroffensive","Контрнаступление"],"k":"W","lv":5,"t":["英雄以屏障護體，降低所受的傷害。屏障結束後，英雄附近的隨機敵人會受到傷害，英雄本身則獲得暫時的攻擊力與生命回復加成。\n\n屏障降低所受傷害：20%\n屏障持續時間：5 秒\n屏障結束後造成的傷害：對英雄附近 7 名隨機敵人造成 70 + （25% 技能強度）點\n屏障結束後的加成：攻擊力 +20 + （10% 技能強度），生命回復 +4 + （3% 技能強度）點\n加成持續時間：8 秒\n\n冷卻：24 秒","The hero shields herself with a barrier that reduces incoming damage. After the barrier ends, random enemies near the hero take damage, and the hero herself gains a temporary bonus to attack power and health regeneration.\n\nIncoming damage reduction from the barrier: 20%\nBarrier duration: 5 sec.\nDamage after the barrier: 70 + (25% spell power) to 7 random enemies near the hero\nBonus after the barrier: +20 + (10% spell power) attack power, +4 + (3% spell power) health regeneration\nBonus duration: 8 sec.\n\nCooldown: 24 sec.","Герой укрывается барьером, снижающим получаемый урон. После действия барьера случайные враги рядом с героем получают урон, а сам герой получает временный бонус к силе атаки и регенерации здоровья.\n\nСнижение получаемого урона барьером: 20%\nВремя действия барьера: 5 сек.\nНанесение урона после барьера: 70 + (25% сила умений) ед. по 7 случайным врагам рядом с героем\nБонус после барьера: +20 + (10% сила умений) к силе атаки, +4 + (3% сила умений) ед. к регенерации здоровья\nВремя действия бонуса: 8 сек.\n\nПерезарядка: 24 сек."],"icon":"images/heroes/a_Absk.png","lvt":[{"i":2,"v":["20","28","36","44","52"]},{"i":4,"v":["70","105","140","175","210"]},{"i":5,"v":["20 + (10% сила умений) к силе атаки, +4","30 + (10% сила умений) к силе атаки, +6","40 + (10% сила умений) к силе атаки, +8","50 + (10% сила умений) к силе атаки, +10","60 + (10% сила умений) к силе атаки, +12"]}]},{"id":"Amgl","kind":"hero","n":["閃耀護盾","Sparkling Shield","Искрящийся щит"],"k":"","lv":5,"t":["當英雄受到攻擊時，護盾會充滿灼熱之光，週期性對附近的敵人造成傷害。\n\n傷害：16 + （5% 技能強度）點/秒\n效果持續時間：10 秒\n\n效果冷卻：效果結束後 10 秒","When the hero is attacked, the shield fills with searing light that periodically damages nearby enemies.\n\nDamage: 16 + (5% spell power) per sec.\nEffect duration: 10 sec.\n\nEffect cooldown: 10 sec. after the effect ends","Когда герой атакован, наполняет щит обжигающим светом, периодически наносящим урон врагам поблизости.\n\nУрон: 16 + (5% сила умений) ед./сек.\nВремя действия эффекта: 10 сек.\n\nПерезарядка эффекта: 10 сек. после окончания действия"],"icon":"images/heroes/a_Amgl.png","lvt":[{"i":2,"v":["16","24","32","40","48"]}]},{"id":"A01W","kind":"hero","n":["向聖光祈願","Appeal to the Light","Обращение к Свету"],"k":"R","lv":1,"t":["英雄對受到「灼燒印記」影響的敵人造成更多傷害，並在攻擊時有機率引爆敵人身上的印記，觸發生命回復效果並造成範圍傷害。此外，技能持續期間會提高對敵人附加印記的機率。\n\n對帶有印記的敵人造成額外傷害：+25%\n攻擊時引爆印記的機率：33%\n引爆傷害：50 + （25% 技能強度）點\n附加印記機率提升：10% > 25%\n技能持續時間：22 秒\n\n冷卻：","The hero deals more damage to enemies under the effect of \"Searing Mark\" and has a chance on attack to detonate the mark on an enemy, activating a health restoration effect and dealing area damage. While the ability is active it also increases the chance to apply the mark to enemies.\n\nAdditional damage to marked enemies: +25%\nChance to detonate the mark on attack: 33%\nDetonation damage: 50 + (25% spell power)\nMark application chance increase: 10% > 25%\nAbility duration: 22 sec.\n\nCooldown:","Герой начинает наносить больше урона противникам под действием умения \"Опаляющая метка\" и имеет шанс при атаке подорвать метку на враге, активировав эффект восстановления здоровья и нанеся урон по области. Также во время действия умения повышает шанс наложения метки на противников.\n\nДополнительный урон по помеченным врагам: +25%\nШанс подрыва метки при атаке: 33%\nУрон от подрыва: 50 + (25% сила умений) ед.\nУвеличение шанса наложения метки: 10% > 25%\nВремя действия умения: 22 сек.\n\nПерезарядка:"],"icon":"images/heroes/a_A01W.png"},{"id":"A01V","kind":"innate","n":["灼燒印記","Searing Mark","Опаляющая метка"],"k":"","lv":null,"t":["攻擊英雄的敵人有 10% 機率獲得灼燒印記效果，持續 8 秒。此效果會提高該敵人受到英雄傷害的量。若敵人在印記效果下死亡，英雄會回復生命值。\n\n敵人受到英雄的傷害提高：+25%\n帶印記的敵人死亡時回復生命值：（65% 力量）點","Enemies that attack the hero have a 10% chance to receive the searing mark effect for 8 sec. This effect increases the damage that enemy takes from the hero. If the enemy dies while under the mark, the hero restores health.\n\nEnemy takes more damage from the hero: +25%\nHealth restored when a marked enemy dies: (65% Strength)","Враги, атакующие героя, имеют 10% шанс получить эффект опаляющей метки на 8 сек. Данный эффект увеличивает получаемый врагом урон от героя. Если противник погибает под действием метки, то герою восстанавливается здоровье.\n\nВраг получает больше урона от героя: +25%\nВосстановление здоровья при смерти отмеченного врага: (65% сила) ед."],"icon":"images/heroes/a_A01V.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["機動性高的近戰英雄，能衝進戰場中心並承受大量傷害。","A mobile melee hero who charges into the thick of battle and absorbs a lot of damage.","Мобильный герой ближнего боя, способный врываться в гущу боя и выдерживать большое количество урона."]},{"id":"H02L","n":["軍團特使","Legion Legate","Легат Легиона"],"attr":"str","unlock":500000,"random":true,"builds":[],"skins":[{"id":"Hkal","on":true,"n":["統兵官","Polemarch","Полемарх"]},{"id":"Huth","on":true,"n":["幽靈劍士","Spectral Fencer","Призрачный фехтовальщик"]}],"author":null,"icon":"images/heroes/h_H02L.png","proper":"Александрос","st":{"str":27,"str_lv":4.0,"agi":15,"agi_lv":2.0,"int":22,"int_lv":2.5,"speed":320},"roles":[["戰士","Fighter","рубака"],["坦克","Tank","танк"]],"sc":[["sp","as","armor"],["vuln"]],"mod":["A0IJ","A0IG"],"sp":["A0IH","A0IJ","A0IK","A0IG"],"ab":[{"id":"A0IH","kind":"hero","n":["盾擊","Shield Bash","Удар щитом"],"k":"Q","lv":5,"t":["用盾牌撞擊指定目標並造成範圍傷害，將敵人從自身推開。被命中的敵人會短時間減速。\n\n對目標的傷害：100 +（50% 技能強度）點\n對目標附近敵人的傷害：主要傷害公式的 60%\n敵人減速：移動速度 -60%，持續 4 秒\n\n冷卻：12 秒","Strikes the target with a shield and deals area damage, knocking enemies away from the hero. Affected enemies are slowed for a short time.\n\nDamage to the target: 100 + (50% spell power)\nDamage to enemies near the target: 60% of the main damage formula\nEnemy slow: -60% movement speed for 4 sec.\n\nCooldown: 12 sec.","Ударяет указанную цель щитом и наносит урон по области, отбрасывая от себя противников. Пораженные противники замедляются на короткое время.\n\nУрон по цели: 100 + (50% сила умений) ед.\nУрон по врагам рядом с целью: 60% от основной формулы урона\nЗамедление противников: -60% скорость движения на 4 сек.\n\nПерезарядка: 12 сек."],"icon":"images/heroes/a_A0IH.png","lvt":[{"i":2,"v":["100","150","200","250","300"]}]},{"id":"A0IJ","kind":"hero","n":["力量衝擊","Force Shift","Силовой сдвиг"],"k":"W","lv":5,"t":["指定範圍內的敵人受到傷害並被拉向英雄。施放後英雄會獲得暫時的裝備技能威力加成。\n\n傷害：60 +（40% 技能強度）點\n裝備技能威力加成：+15%，持續 6 秒\n\n冷卻：15 秒","Enemies in the target area take damage and are pulled toward the hero. After casting, the hero gains a temporary modifier power bonus.\n\nDamage: 60 + (40% spell power)\nModifier power bonus: +15% for 6 sec.\n\nCooldown: 15 sec.","Враги в указанной области получают урон и притягиваются в сторону героя. После применения герой получает временный бонус к силе модификаторов.\n\nУрон: 60 + (40% сила умений) ед.\nБонус к силе модификаторов: +15% на 6 сек.\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A0IJ.png","lvt":[{"i":2,"v":["60","90","120","150","180"]},{"i":3,"v":["15","20","25","30","35"]}]},{"id":"A0II","kind":"hero","n":["磐石","Rock","Скала"],"k":"","lv":5,"t":["英雄獲得對 0-1 級單位的防護，並對這些單位造成更多傷害。\n\n對 0-1 級單位的防護：+8%\n對 0-1 級單位的傷害：+12%","The hero gains protection from level 0-1 units and deals more damage to those same units.\n\nProtection from level 0-1 units: +8%\nDamage to level 0-1 units: +12%","Герой получает защиту от юнитов 0-1 уровня и наносит этим самым юнитам больше урона.\n\nЗащита от юнитов 0-1 ур.: +8%\nУрон по юнитам 0-1 ур.: +12%"],"icon":"images/heroes/a_A0II.png","lvt":[{"i":2,"v":["8","12","16","20","24"]},{"i":3,"v":["12","18","24","30","36"]}]},{"id":"A0IK","kind":"hero","n":["軍團衛隊","Legion Guard","Гвардия Легиона"],"k":"R","lv":1,"t":["召喚 6 名無敵的弓箭手前來支援，他們會出現在英雄身後，並朝指定方向開始射擊。\n\n箭矢傷害：50 + （20% 技能強度）點。\n每名弓箭手的攻擊速度：在 0.5 秒到 1 秒之間變化。\n弓箭手存活時間：10 + （4% 力量）秒。\n\n冷卻：70 秒。","Summons 6 invulnerable archers to your aid; they appear behind the hero and start firing projectiles in the chosen direction.\n\nProjectile damage: 50 + (20% spell power)\nAttack speed of each archer: varies from 0.5 sec. to 1 sec.\nArcher lifetime: 10 + (4% Strength) sec.\n\nCooldown: 70 sec.","Призывает на помощь 6 неуязвимых лучников, которые появляются позади героя и начинают обстрел снарядами в указанную сторону.\n\nУрон от снаряда: 50 + (20% сила умений) ед.\nСкорость атаки каждого лучника: варьируется от 0.5 сек. до 1 сек.\nВремя жизни лучников: 10 + (4% сила) сек.\n\nПерезарядка: 70 сек."],"icon":"images/heroes/a_A0IK.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0IG","kind":"innate","n":["軍團軍械庫","Legion Arsenal","Арсенал Легиона"],"k":"","lv":null,"t":["英雄可以使用「軍團遺產」套裝的加成。要獲得套裝加成，英雄的物品欄中必須擁有下列道具：\n\n- 「聖物」類別的道具\n- 帝王之劍（扭曲）\n- 雄獅鎧甲（扭曲）\n- 干將（扭曲）\n- 榮譽頭盔（扭曲）\n- 碎界（折射）\n- 庇護者（折射）\n- 帝王鎧甲（神器 lv.4）\n- 泰坦神拳（神器 lv.5）\n- 王國宙斯盾（神器 lv.5）\n\n可透過文字指令「-с5」查看套裝加成。","The hero can use the bonuses of the \"Legion Legacy\" set. To receive the bonuses, the hero's inventory must contain the items from this list:\n\n- items of the \"Relic\" class\n- Emperor's Sword (Distorted)\n- Lion Cuirass (Distorted)\n- Kladenets Sword (Distorted)\n- Helm of Honour (Distorted)\n- Collapse (Refracted)\n- Defender (Refracted)\n- Emperor's Armour (Artifact lvl 4)\n- Titan's Fist (Artifact lvl 5)\n- Aegis of Kings (Artifact lvl 5)\n\nThe set bonuses can be viewed with the text command \"-с5\".","Герой может пользоваться бонусами комплекта \"Наследие Легиона\". Для получения бонусов в инвентаре героя должны находиться предметы из списка:\n\n- предметы категории \"Реликвия\"\n- Меч Императора (Искаженный)\n- Львиный панцирь (Искаженный)\n- Меч-кладенец (Искаженный)\n- Шлем чести (Искаженный)\n- Коллапс (Преломленный)\n- Заступник (Преломленный)\n- Доспехи Императора (Артефакт 4 ур.)\n- Кулак титана (Артефакт 5 ур.)\n- Эгида королей (Артефакт 5 ур.)\n\nБонусы комплекта можно узнать через текстовую команду \"-с5\"."],"icon":"images/heroes/a_A0IG.png"}],"d":["英勇的戰士，能擋下敵軍推進、突入後排並保護隊友。","A valiant warrior who holds back the enemy advance, dives the back line and protects allies.","Доблестный воин, способный сдерживать натиск вражеской армии, прорываться в задние ряды и защищаться от вражеских лучников. Также способен ультимативной способностью превращать свободные точки в постройки Легиона."]},{"id":"Ocbh","n":["莫爾格","Mo'arg","Мо'арг"],"attr":"str","unlock":4000000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_Ocbh.png","proper":"Гард Губитель","st":{"str":34,"str_lv":5.0,"agi":14,"agi_lv":2.0,"int":26,"int_lv":3.5,"speed":320},"roles":[["戰士","Fighter","рубака"],["坦克","Tank","танк"],["法師","Mage","маг"]],"sc":[["sp","as","dburn"],["burn"]],"mod":[],"sp":["A0MR","A01D"],"ab":[{"id":"A0MR","kind":"hero","n":["殲滅噴發","Annihilating Burst","Уничтожающий выброс"],"k":"R","lv":1,"t":["技能會逐漸吸收惡魔之力，並產生一顆火球，當英雄的惡魔之力耗盡時便會發射出去。吸收力量的速度為「力量蓄積」技能累積力量速度的 135%。火球可以點燃敵人。\n\n傷害：175 +（600% 已吸收力量）點\n點燃：50% 機率；50% 傷害\n火球大小（作用範圍）：150 +（80% 已吸收力量）點\n飛行距離：600 +（175% 已吸收力量）點\n\n冷卻：100 秒","The ability gradually absorbs demonic power and creates a fireball that is launched when the hero's demonic power reserve runs out. The absorption rate equals 135% of the power accumulation rate of the \"Power Accumulation\" ability. The ball can burn enemies.\n\nDamage: 175 + (600% absorbed power)\nBurn: 50% chance; 50% damage\nBall size (area): 150 + (80% absorbed power)\nFlight range: 600 + (175% absorbed power)\n\nCooldown: 100 sec.","Умение постепенно поглощает демоническую силу и создает огненный шар который запускается когда запас демонической силы героя иссякнет. Скорость поглощения силы равна 135% скорости накопления силы умением \"Накопление силы\". Шар может поджигать противников.\n\nУрон: 175 + (600% поглощенная сила) ед.\nПоджог: 50% шанс; 50% урона\nРазмер шара (область поражения): 150 + (80% поглощенная сила) ед.\nДальность полёта: 600 + (175% поглощенная сила) ед.\n\nПерезарядка: 100 сек."],"icon":"images/heroes/a_A0MR.png"},{"id":"A0K7","kind":"hero","n":["點燃","Ignite","Поджог"],"k":"W","lv":5,"t":["半徑 400 點內的敵人會被減速並獲得點燃效果。\n\n點燃機率：125%\n點燃傷害：80 +（110% 惡魔之力）點／秒\n攻擊速度減速：20%\n移動速度減速：30%\n減速持續時間（部隊）：6 秒\n減速持續時間（英雄）：3 秒\n\n冷卻：15 秒\n\n額外加成資訊請見指令「-w」。","Enemies within a 400 radius are slowed and receive the Burn effect.\n\nBurn chance: 125%\nBurn damage: 80 + (110% demonic power) per sec.\nAttack speed slow: 20%\nMovement speed slow: 30%\nSlow duration (troops): 6 sec.\nSlow duration (heroes): 3 sec.\n\nCooldown: 15 sec.\n\nInformation about additional bonuses in the \"-w\" command.","Враги в радиусе 400 ед. замедляются и получают эффект поджога.\n\nШанс поджога: 125%\nУрон от поджога: 80 + (110% демоническая сила) ед./сек.\nЗамедление скорости атаки: 20%\nЗамедление скорости передвижения: 30%\nВремя действия замедления (войска): 6 сек.\nВремя действия замедления (герои): 3 сек.\n\nПерезарядка: 15 сек.\n\nИнформация о дополнительных бонусах в команде \"-w\"."],"icon":"images/heroes/a_A0K7.png","lvt":[{"i":3,"v":["80","120","160","200","240"]},{"i":4,"v":["20","25","30","35","40"]},{"i":5,"v":["30","38","46","54","62"]}]},{"id":"A06N","kind":"hero","n":["灼燒法球","Scorching Orb","Выжигающая сфера"],"k":"E","lv":5,"t":["在指定地點創造一顆火焰法球。法球會週期性地對附近隨機一名敵人造成傷害。此外法球還會額外灼燒身邊的敵人，造成 50% 傷害。\n\n傷害：30 +（30% 惡魔之力）點\n傷害觸發間隔：0.4 秒\n持續時間：11 秒\n\n冷卻：30 秒\n\n額外加成資訊請見指令「-е」。","Creates a fire orb at the target point. The orb periodically deals damage to a random nearby enemy. The orb also additionally scorches enemies next to it, dealing 50% damage.\n\nDamage: 30 + (30% demonic power)\nDamage interval: 0.4 sec.\nDuration: 11 sec.\n\nCooldown: 30 sec.\n\nInformation about additional bonuses in the \"-е\" command.","Создаёт огненную сферу в указанной точке. Сфера периодически наносит урон случайному противнику поблизости. Также сфера дополнительно обжигает врагов рядом с собой, нанося 50% урона.\n\nУрон: 30 + (30% демоническая сила) ед.\nПериодичность урона: 0.4 сек.\nВремя действия: 11 сек.\n\nПерезарядка: 30 сек.\n\nИнформация о дополнительных бонусах в команде \"-е\"."],"icon":"images/heroes/a_A06N.png","lvt":[{"i":2,"v":["30","45","60","75","90"]}]},{"id":"A04L","kind":"hero","n":["粉碎打擊","Crushing Blow","Сокрушительный удар"],"k":"Q","lv":5,"t":["對指定目標發動強力一擊，造成範圍傷害並暈眩被擊中的目標。\n\n對目標的傷害：120 +（115% 惡魔之力）點\n對目標周圍敵人的傷害：主傷害公式的 50%\n目標暈眩（部隊）：4 秒\n目標暈眩（英雄）：2 秒\n\n冷卻：18 秒\n\n額外加成資訊請見指令「-q」。","Delivers a powerful blow to the target, dealing area damage and stunning the struck target.\n\nDamage to target: 120 + (115% demonic power)\nDamage to enemies near the target: 50% of the main damage formula\nTarget stun (troops): 4 sec.\nTarget stun (heroes): 2 sec.\n\nCooldown: 18 sec.\n\nInformation about additional bonuses in the \"-q\" command.","Наносит мощный удар по указанной цели, нанося урон по области и оглушая пораженную цель.\n\nУрон по цели: 120 + (115% демоническая сила) ед.\nУрон по врагам рядом с целью: 50% от основной формулы урона\nОглушение цели (войска): 4 сек.\nОглушение цели (герои): 2 сек.\n\nПерезарядка: 18 сек.\n\nИнформация о дополнительных бонусах в команде \"-q\"."],"icon":"images/heroes/a_A04L.png","lvt":[{"i":2,"v":["120","180","240","300","360"]},{"i":4,"v":["4","5","6","7","8"]},{"i":5,"v":["2","2.5","3","3.5","4"]}]},{"id":"A01D","kind":"innate","n":["力量蓄積","Power Accumulation","Накопление силы"],"k":"D","lv":1,"t":["莫爾格開始蓄積「惡魔之力」，這股力量會在使用英雄其他技能時消耗。技能持續期間，英雄會回復自身生命值。\n\n惡魔之力蓄積速度：3 +（20% 智力）+（30% MP regen）點／秒\n惡魔之力上限：40 +（10*英雄等級）+（10% 技能強度）點\n生命值回復：每秒 1%\n技能最長維持時間：30 秒\n\n冷卻：10 秒\n\n額外加成資訊請見指令「-d」。","Mo'arg begins to accumulate \"demonic power\", which is consumed when the hero uses his other abilities. While the ability is active, the hero restores his own health.\n\nDemonic power accumulation rate: 3 + (20% Intelligence) + (30% MP regen) per sec.\nDemonic power limit: 40 + (10*hero level) + (10% spell power)\nHealth restoration: 1% per sec.\nMaximum channel time: 30 sec.\n\nCooldown: 10 sec.\n\nInformation about additional bonuses in the \"-d\" command.","Мо'арг начинает накапливать \"демоническую силу\", которая расходуется при применении других умений героя. Во время действия умения герой восстанавливает своё здоровье.\n\nСкорость накопления демонической силы: 3 + (20% разум) + (30% MP regen) ед./сек.\nЛимит демонической силы: 40 + (10*уровень героя) + (10% сила умений) ед.\nВосстановление здоровья: 1% в сек.\nМаксимальное время поддержания умения: 30 сек.\n\nПерезарядка: 10 сек.\n\nИнформация о дополнительных бонусах в команде \"-d\"."],"icon":"images/heroes/a_A01D.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["強力的近戰英雄，能累積力量來釋放強大技能。","A powerful melee hero who accumulates strength to unleash mighty abilities.","Сильный герой ближнего боя, способный накапливать свою силу для реализации мощных уменийю. Имеет увеличенное время возрождения (60 сек.)."]}],"setDouble":{"I0AJ":2,"I0AL":2,"I052":2},"sets":{"c1":{"n":["英勇","Valor","Доблесть"],"c":"#C87D32","items":["I00M","I01A","I01K","I01S","I048","I049","I04A","I04B","I059","I091","I095","I0AC","I0AJ","I0AK","tmmt"],"b":[{"n":2,"zh":"+6 力量，+10% 點燃傷害","en":"+6 Strength, +10% burn damage","ru":"+6 силы, +10% урона от поджога"},{"n":3,"zh":"反擊傷害效果增強 20%","en":"Return damage effect increased by 20%","ru":"эффект ответного урона усилен на 20%"},{"n":4,"zh":"+12 力量、+6   width: +(localStorage.getItem('ud.pw') || 460),

  q: '',
  sel: null,
  rank: localStorage.getItem('ud.rank') || '',   // '' = 不排行
  mode: localStorage.getItem('ud.mode') || 'browse',        // browse | build

  bonus: JSON.parse(localStorage.getItem('ud.bonus') || '{}'),// 兩個不佔格的額外欄位
};
const STATS = DATA.stats || [];
const STAT = k => STATS.find(s => s.k === k);
const t = k => UI[S.lang][k];
const li = () => LI[S.lang];
const nm = id => ITEMS[id].n[li()] || ITEMS[id].n[0];
const grpName = g => GROUPS[g][S.lang];

/* search index: all three languages + id */
const HAY = {};
for (const id of IDS){
  const it = ITEMS[id];
  HAY[id] = (it.n.join(' ') + ' ' + id + ' ' + (it.a||'') + ' ' +
             (it.s? it.s.join(' '):'') + ' ' +
             it.e.map(e=>e.t.join(' ')).join(' ')).toLowerCase();
}

/* ---------------------------------------------------------------- dom */
const $ = s => document.querySelector(s);
const main = $('#main'), rail = $('#rail'), panel = $('#panel');
const phead = $('#phead'), pbody = $('#pbody'), tip = $('#tip');
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* highlight numbers so values pop without extra chrome */
const num = s => esc(s).replace(/([+-]?\d[\d.,]*%?)/g, '<em>$1</em>');

const thumb = (id, cls) => {
  const it = ITEMS[id];
  return it.img
    ? `<img src="${it.img}" alt="" loading="lazy" decoding="async">`
    : `<div class="ph">${id}</div>`;
};

/* ---------------------------------------------------------------- render: rail */
function renderRail(){
  /* counts follow the search so the rail doubles as a result breakdown */
  const q = S.q.trim().toLowerCase();
  const counts = {}; let total = 0;
  for (const id of IDS){
    if (q && !HAY[id].includes(q)) continue;
    counts[ITEMS[id].g] = (counts[ITEMS[id].g]||0)+1; total++;
  }
  let h = `<h3>${esc(t('tiers'))}</h3>`;
  h += `<button class="tier" data-g="" aria-pressed="${S.tier===null && S.cat===null}">
          <i class="dot" style="background:#7a8398"></i>
          <span class="nm">${esc(t('all'))}</span>
          <span class="ct">${total}</span></button>`;
  /* 「只看主動」是從搜尋建議套上去的，側欄看不到的話，
     使用者只會覺得「怎麼剩 70 件」卻找不到原因 —— 跟套裝一樣要列出來。 */
  if (S.act){
    h += `<button class="tier" data-g="" aria-pressed="true" style="margin-top:4px">
            <i class="dot" style="background:var(--mat)"></i>
            <span class="nm">${esc(t('sgActive'))}</span>
            <span class="ct">${IDS.filter(i => ITEMS[i].act).length}</span></button>`;
  }
  if (S.set){
    const n = IDS.filter(i => setKeysOf(ITEMS[i]).includes(S.set)).length;
    h += `<button class="tier" data-g="" aria-pressed="true" style="margin-top:4px">
            <i class="dot" style="background:var(--accent)"></i>
            <span class="nm">${esc(t('setL'))} -${S.set}</span>
            <span class="ct">${n}</span></button>`;
  }
  (DATA.cats || []).forEach((cat, ci) => {
    const inCat = cat.g.filter(g => counts[g]);
    if (!inCat.length) return;
    const n = inCat.reduce((a, g) => a + counts[g], 0);
    const open = S.fold[ci] !== undefined ? S.fold[ci] : !cat.fold;
    h += `<div class="cat" data-open="${open ? 1 : 0}" data-dim="${cat.fold ? 1 : 0}" data-c="${ci}">
        <div class="cat-h">
          <button class="cat-t" data-tog="${ci}" aria-label="toggle">▼</button>
          <button class="cat-n" data-cat="${ci}" aria-pressed="${S.cat===ci}">
            ${esc(cat[S.lang] || cat.zh)}<span class="c">${n}</span>
          </button>
        </div>
        <div class="cat-b">`;
    inCat.forEach(g => {
      h += `<button class="tier" data-g="${g}" aria-pressed="${S.tier===g}">
              <i class="dot" style="background:${tierColour(g)}"></i>
              <span class="nm">${esc(GROUPS[g][S.lang])}</span>
              <span class="ct">${counts[g]}</span></button>`;
    });
    h += `</div></div>`;
  });
  h += `<h3>${esc(t('legend'))}</h3>
    <div class="legend">
      <div><i style="background:var(--accent)"></i>${esc(t('sel'))}</div>
      <div><i class="fl any">${FLAG_MAT}</i>${esc(t('matAny'))}</div>
      <div><i class="fl mat">${FLAG_MAT}</i>${esc(t('mat'))}</div>
      <div><i class="fl into">↑</i>${esc(t('into'))}</div>
    </div>`;
  const M = DATA.meta || {};
  h += `<h3>${esc(t('dataL'))}</h3>
    <div class="meta">
      <span class="ver">${esc(M.mapVersion || t('verUnknown'))}</span>
      <dl>
        <dt>${esc(t('siteL'))}</dt><dd>${esc(M.siteVersion || '—')}</dd>
        <dt>${esc(t('builtL'))}</dt><dd>${esc(M.builtAt || '—')}</dd>
        ${M.author ? `<dt>${esc(t('authorL'))}</dt><dd>${esc(M.author)}</dd>` : ''}
        <dt>${esc(t('dateL'))}</dt><dd>${esc(M.dataDate || '—')}</dd>
        <dt>${esc(t('cntL'))}</dt><dd>${M.items ?? IDS.length}</dd>
        <dt>${esc(t('icoL'))}</dt><dd>${M.icons ?? ''}</dd>
      </dl>
    </div>`;
  rail.innerHTML = h;
  syncMenuDot();
}
/* a tier's colour = the colour the map itself gives its items */
const TC = {};
function tierColour(g){
  if (TC[g]) return TC[g];
  const tally = {};
  for (const id of IDS) if (ITEMS[id].g === g && ITEMS[id].k)
    tally[ITEMS[id].k] = (tally[ITEMS[id].k]||0)+1;
  const best = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return TC[g] = best ? best[0] : '#7a8398';
}

/* ---------------------------------------------------------------- render: grid */
function visible(){
  const q = S.q.trim().toLowerCase();
  return IDS.filter(id => {
    if (S.tier !== null && ITEMS[id].g !== S.tier) return false;
    if (S.cat !== null && !DATA.cats[S.cat].g.includes(ITEMS[id].g)) return false;
    if (S.set && !setKeysOf(ITEMS[id]).includes(S.set)) return false;
    if (S.act && !ITEMS[id].act) return false;
    if (q && !HAY[id].includes(q)) return false;
    return true;
  });
}

/* 扭曲・儀式・折射本身就是有序的序列，
   照名字排會讓相鄰的裝備跳來跳去，反而看不出順序。
   這裡建一份「循環順序」索引，這三類就照序列排。 */
const SEQORD = (() => {
  const o = {};
  (DATA.cycle || []).forEach((id, n) => { o[id] = n; });
  (DATA.ritual || []).forEach((id, n) => { o[id] = n; });
  (DATA.refract || []).forEach((chain, gi) => {
    (chain[3] || []).forEach((id, n) => { o[id] = gi * 100 + n; });
  });
  return o;
})();
/* 這些分類整組都有順序，標題要標示出來，否則會被誤認成沒排序 */
const SEQ_GROUPS = new Set();
for (const id in SEQORD) if (ITEMS[id]) SEQ_GROUPS.add(ITEMS[id].g);

const LEGION = DATA.legion || {items: [], colour: '#D9455C'};
const SETS = Object.assign({}, DATA.sets || {});
if (DATA.legion) SETS.c5 = {n: [LEGION.zh, LEGION.en, LEGION.ru],
                            c: LEGION.colour, items: LEGION.items,
                            b: LEGION.b || [], only: LEGION.only};
/* 一件裝備可能同時屬於好幾個套裝 —— 三位一體就同時算英勇＋深淵＋風暴。
   c1~c4 寫在道具說明裡（builder 解析成 sk），c5 是另外給的名單。 */
const setKeysOf = it => (it.sk || []).concat(it.legion != null ? ['c5'] : []);
const setColour = k => (SETS[k] || {}).c || '#8b93a7';
/* 少數道具一件算兩件（英勇之錘、風暴之錘、吞噬萬物）—— 套裝件數要照這個算 */
const SETW = DATA.setDouble || {};
const setWeight = id => SETW[id] || 1;
const setName = k => ((SETS[k] || {}).n || [])[li()] || k;

const tileHTML = id => {
  const it = ITEMS[id];
  const ks = setKeysOf(it);
  const tint = ks.length
    ? `;--sc:${setColour(ks[0])}` + (ks.length > 1
        ? `;--sc2:${setColour(ks[1])};--sc3:${setColour(ks[2] || ks[1])}` : '')
    : '';
  return `<button class="tile" data-id="${id}"${
      ks.length ? ` data-set="${ks[0]}"${ks.length > 1 ? ' data-multi="1"' : ''}` : ''}
      style="--c:${it.k||'#39415a'}${tint}">
            <span class="thumb">${thumb(id)}</span>
            <span class="lbl">${esc(nm(id))}</span>
            <span class="flag"></span>
          </button>`;
};

/* 排行檢視：數值變成主角，所以換成橫列 + 長度條，
   而不是只把格子重新排序 —— 網格看不出「差多少」。 */
function renderRank(ids){
  const k = S.rank, meta = STAT(k);
  const rows = ids.filter(i => ITEMS[i].v && ITEMS[i].v[k] != null)
                  .map(i => [i, ITEMS[i].v[k]])
                  .sort((a, b) => b[1] - a[1]);
  if (!rows.length){
    main.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('tryOther'))}</div>`;
    return;
  }
  const max = Math.max(...rows.map(r => Math.abs(r[1]))) || 1;
  const unit = meta.pct ? '%' : '';
  const label = meta[S.lang] || meta.zh;
  let h = `<div class="rank-head">
      <h2>${esc(t('rankBy').replace('%s', label))}</h2>
      <span class="bar"></span>
      <span class="sub">${rows.length}</span>
    </div>
    <div class="rank-note">${esc(t('rankNote'))}</div><div class="rank">`;
  rows.forEach(([id, v], n) => {
    const it = ITEMS[id];
    const w = Math.max(2, Math.abs(v) / max * 100);
    const cls = (v < 0 ? ' neg' : '') + (n < 3 && v > 0 ? ' top' : '');
    h += `<button class="rrow${cls}" data-id="${id}"
            style="--c:${it.k || '#5b6ee1'};--w:${w.toFixed(1)}%">
            <span class="no">${n + 1}</span>
            <span class="ic">${thumb(id)}</span>
            <span class="nm"><b>${esc(nm(id))}</b><span>${esc(it.c[li()])}</span></span>
            <span class="val">${v > 0 ? '+' : ''}${(+v.toFixed(2))}<span class="unit">${unit}</span></span>
          </button>`;
  });
  main.innerHTML = h + '</div>';
  paintRelations();
}

/* 「狀態」模式的整頁內容：關係圖 → 抗性對照 → 系統規則 → 各狀態細節。

const HEROES = DATA.heroes || [];

/* 主屬性用跟屬性排行一致的顏色，讓兩個檢視看起來是同一套語言 */

function unlockLabel(v){

function heroCard(h){

    if (!list.length) continue;
    html += `<section class="hsec" style="--sc:${ATTR_C[a]}">
      <h2>${esc(t('hAttr_' + a))}<span class="n">${list.length}</span></h2>`;

    for (const h of list){

        last = h.unlock;
        html += `<div class="hulk">${esc(t('hkUnlock'))}
                 <b>${esc(unlockLabel(h.unlock))}</b></div>`;
      }
      html += heroCard(h);
    }
    html += '</section>';
  }
  html += `<div class="note">${esc(t('hpNote'))}</div></div>`;
  main.innerHTML = html;
}

/* 這個英雄專屬的推薦配裝。跟「AI 配裝」分頁的通用配裝不同 ——
   這裡的配裝往往綁定特定天賦，換天賦整套邏輯就不成立，所以標出來。 */
function talentName(h, aid, L){
  for (const a of h.ab)
    for (const o of (a.opts || []))
      if (o.id === aid) return o.n[L];
  return '';
}

/* 配裝可能來自「AI 配裝」分頁，也可能來自某個英雄的專屬配裝，兩邊都要找。 */
function findBuild(id){
  const g = (DATA.builds || []).find(x => x.id === id);
  if (g) return g;
  for (const h of HEROES){
    const b = (h.builds || []).find(x => x.id === id);
    if (b) return b;
  }
  return null;
}

function heroBuilds(h, L){
  if (!h.builds || !h.builds.length) return '';
  const pic = i => ITEMS[i] ? `<button class="bd-i" data-goto="${i}"
      style="--c2:${ITEMS[i].k || '#39415a'}"
      title="${esc(nm(i))}　${esc(ITEMS[i].c[L])}">${thumb(i)}</button>` : '';
  return `<h5>${esc(t('hBuilds'))}<span class="cnt">${h.builds.length}</span></h5>
    ${h.builds.map(b => {
      const bs = Object.keys(b.bonus || {}).map(k => b.bonus[k]).filter(x => ITEMS[x]);
      const tal = b.talent ? talentName(h, b.talent, L) : '';
      return `<div class="bd" style="--sc:${b.c}">
        <div class="bd-h"><b>${esc(b.n[L])}</b>
          <button class="bd-go" data-apply="${b.id}">${esc(t('bdApply'))}</button></div>
        ${tal ? `<div class="bd-tal">${esc(t('hNeedTalent'))}${esc(tal)}</div>` : ''}
        <div class="bd-key">${esc(b.key[L])}</div>
        <div class="bd-row">${b.items.map(pic).join('')}
          ${bs.length ? `<span class="bd-sep"></span>${bs.map(pic).join('')}` : ''}</div>
        <details class="bd-why"><summary>${esc(t('bdWhy'))}</summary>
          <p>${esc(b.why[L])}</p></details>
      </div>`;
    }).join('')}`;
}

/* 技能升級數值。地圖的說明本身就是每級一段完整文字，所以這裡不是推算
   成長公式，而是把各級同一行的數值直接排出來 —— 只列會變的那幾行，
   不變的留在上面的說明裡，避免同一件事講兩次。 */
function lvTable(a, L){
  if (!a.lvt || !a.lvt.length) return '';
  const lines = ((a.t && a.t[L]) || '').split('\n');
  const n = a.lvt[0].v.length;
  const head = Array.from({length: n}, (_, i) => `<th>${i + 1}</th>`).join('');
  const rows = a.lvt.map(r => {
    const raw = lines[r.i] || '';
    const lab = raw.split(/[:：]/)[0].trim() || '—';
    return `<tr><th>${esc(lab)}</th>${
      r.v.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="lvt-w"><table class="lvt">
    <thead><tr><th>${esc(t('hLvHead'))}</th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* 技能書（選擇天賦／選擇技能／額外技能）的選項。
   每個英雄能選的天賦都不一樣，所以清單要跟著該英雄的技能書走，不能寫成共用表。 */
function optList(a, L){
  if (!a.opts || !a.opts.length) return '';
  return `<div class="ho">
    <div class="ho-h">${esc(t('hPick'))}<span class="cnt">${a.opts.length}</span></div>
    ${a.opts.map(o => `<div class="ho-i">

      <div><b>${esc(o.n[L])}</b>
        <pre class="ha-t">${esc(o.t[L] || t('hNoText'))}</pre></div>
    </div>`).join('')}</div>`;
}

function renderStatusPage(){

  const chip = k => {

    return `<button class="scz" data-mq="${esc((st.q||[''])[0])}" style="--sc:${st.c}">

function renderGrid(){
  if (S.mode === 'status'){ renderStatusPage(); return; }
  if (S.mode === 'hero'){ renderHeroPage(); return; }
  const ids = visible();
  if (S.rank && STAT(S.rank)){ renderRank(ids); return; }
  if (!ids.length){
    main.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('tryOther'))}</div>`;
    return;
  }
  /* While searching, sections would leave one tile per header and force a lot of
     scrolling for very few hits - so results collapse into one flat, dense grid.
     The tier is still readable from each tile's border colour and the rail counts. */
  if (S.q.trim()){
    ids.sort((a,b)=> ITEMS[a].g - ITEMS[b].g ||
      nm(a).localeCompare(nm(b), S.lang==='ru'?'ru':undefined));
    main.innerHTML = `<section class="sec">
        <div class="sec-head"><h2>${esc(t('results'))}</h2>
          <span class="bar"></span><span class="n">${ids.length}</span></div>
        <div class="grid">${ids.map(tileHTML).join('')}</div></section>`;
    paintRelations();
    return;
  }
  const by = new Map();
  for (const id of ids){ const g = ITEMS[id].g; (by.get(g) || by.set(g,[]).get(g)).push(id); }
  const order = [...by.keys()].sort((a,b)=>a-b);
  let h = '';
  for (const g of order){
    const list = by.get(g);
    list.sort((a, b) => {
      const oa = SEQORD[a], ob = SEQORD[b];
      if (oa != null && ob != null) return oa - ob;   // 兩個都有順序 -> 照順序
      if (oa != null) return -1;                      // 有順序的排前面
      if (ob != null) return 1;
      return nm(a).localeCompare(nm(b), S.lang === 'ru' ? 'ru' : undefined);
    });
    const seqTag = SEQ_GROUPS.has(g)
      ? `<span class="seq-tag">${esc(t('bySeq'))}</span>` : '';
    h += `<section class="sec" data-g="${g}">
            <div class="sec-head">
              <h2 style="color:${tierColour(g)}">${esc(grpName(g))}</h2>
              ${seqTag}
              <span class="bar"></span><span class="n">${list.length}</span>
            </div>
            <div class="grid">`;
    h += list.map(tileHTML).join('');
    h += `</div></section>`;
  }
  main.innerHTML = h;
  paintRelations();
}

/* ---------------------------------------------------------------- 狀態說明
   地圖裡的狀態（點燃／流血／冰凍…）彼此會互相加成，但道具說明只寫「施加點燃」，
   沒人知道那到底是什麼。這裡把玩家提供的圖鑑內容掛到有提到該狀態的裝備上。
   偵測用三語詞幹一起比對，所以介面切到哪個語言結果都一樣；

const CHEV = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"

function statusRows(keys){

/* 狀態關係圖。
   直覺會想畫成節點連線圖，但「易傷」會影響全部 7 個狀態、「電擊」影響 3 個 ——
   14 條線交叉在一起只會變成義大利麵，反而更難懂。
   所以改用「範圍框」表達影響全體（框住誰就影響誰），
   箭頭只留給 1:1 的專屬放大關係，一眼就看得出結構：
     易傷  = 外框，框內全部的中招機率 +50%
     電擊  = 右邊，對三種持續傷害的傷害 +100%
     易燃／虛弱／詛咒 = 各自放大一種持續傷害（1:1 配對）
     冰凍  = 沒有專屬放大器，單獨放 */
function statusMap(){
  const G = DATA.statusGraph || {}, L = li();
  const N = k => STATUS[k] || {};
  const col = k => N(k).c || '#8b93a7';

  /* 節點：圖示 ＋ 名稱。點下去就用該狀態當關鍵字搜尋，

  const mk = k => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5"
