nAttack bonus: 25% splash effect over a 175 area\n\"Rush\" damage against enemy heroes: +40%\nDuration: 20 sec.\n\nCooldown: 35 sec.","Атаки героя приобретают сплеш-эффект. Также усиливает умение \"Порыв\" позволяя наносить больше урона вражеским героям, пока \"Темное усиление\" активно.\n\nБонус к атакам: 25% сплеш-эффект по области 175 ед.\nУрон умения \"Порыв\" против вражеских героев: +40%\nВремя действия: 20 сек.\n\nПерезарядка: 35 сек."],"icon":"images/heroes/a_A0ER.png","lvt":[{"i":2,"v":["25","32","39","46","53"]}]},{"id":"Amgr","kind":"hero","n":["受詛之刃","Cursed Blade","Проклятое лезвие"],"k":"","lv":5,"t":["英雄的攻擊會削弱敵人，降低其造成的傷害並提高其受到的傷害。此效果可以疊加，但不會刷新持續時間。\n\n造成傷害降低：8%\n受到傷害提高：8%\n持續時間：6 秒\n\n冷卻：3.5 秒","The hero's attacks weaken the enemy, reducing the damage it deals and increasing the damage it takes. This effect can stack, but without refreshing the duration.\n\nDealt damage reduction: 8%\nIncoming damage increase: 8%\nDuration: 6 sec.\n\nCooldown: 3.5 sec.","Атаки героя ослабляют противника, снижая его наносимый урон и увеличивая получаемый им урон. Данный эффект может суммироваться, но без обновления времени действия.\n\nСнижение наносимого урона: 8%\nУвеличение получаемого урона: 8%\nВремя действия: 6 сек.\n\nПерезарядка: 3.5 сек."],"icon":"images/heroes/a_Amgr.png","lvt":[{"i":2,"v":["8","11","14","17","20"]},{"i":3,"v":["8","12","16","20","24"]},{"i":4,"v":["6","7.3","8.6","9.9","11.2"]}]},{"id":"A0F4","kind":"hero","n":["靈魂撕裂","Soul Rupture","Разрыв души"],"k":"","lv":null,"t":["英雄造成的擊殺可能生成 3 團黑暗能量，擊中附近的隨機敵人。\n\n能量團的傷害：50 + （75% 技能強度）點。\n冷卻：4 秒。","Kills made by the hero can create 3 dark clusters that strike random nearby enemies.\n\nDamage of a cluster: 50 + (75% spell power)\nCooldown: 4 sec.","Убийства, совершенные героем, могут создать 3 темных сгустка, поражающих случайных врагов поблизости.\n\nУрон от сгустка: 50 + (75% сила умений) ед.\nПерезарядка: 4 сек."],"icon":"images/heroes/a_A0F4.png"},{"id":"AIbk","kind":"innate","n":["躍進","Leap","Скачок"],"k":"D","lv":null,"t":["將英雄傳送一小段距離。\n\n冷卻：30 秒。","Teleports the hero a short distance.\n\nCooldown: 30 sec.","Телепортирует героя на небольшое расстояние.\n\nПерезарядка: 30 сек."],"icon":"images/heroes/a_AIbk.png"},{"id":"A0FB","kind":"innate","n":["額外技能","Extra Abilities","Дополнительные умения"],"k":"","lv":null,"t":["開啟英雄的額外技能列表。","Opens the list of the hero's additional abilities.","Открывает список дополнительных умений героя."],"icon":"images/heroes/a_A0FB.png","opts":[{"id":"A0F5","n":["黑暗信徒 [1/2]","Follower of Darkness [1/2]","Последователь Тьмы [1/2]"],"t":["對敵方英雄造成傷害會給予黑暗主教一系列加成：\n\n每累積 500 點傷害：+1 點攻擊力，+15 HP；下一次強化所需的傷害增加 10 點\n\n1000 點傷害：「受詛之刃」的持續時間 +1.5 秒\n\n2000 點傷害：「衝勁」的傷害段數 +1\n\n4000 點傷害：「黑暗強化」每秒回復 1% HP\n\n6000 點傷害：當敵人身上累積 3 層效果時，「受詛之刃」額外造成 100 +（35% 技能強度）點傷害\n\n8000 點傷害：「衝勁」的傷害段數 +1\n\n11000 點傷害：「黑暗強化」的濺射效果範圍 +25%","Dealing damage to enemy heroes grants the Prelate a series of bonuses:\n\nEvery 500 damage: +1 attack power, +15 HP; +10 to the damage required for the next upgrade\n\n1000 damage: +1.5 sec. to the duration of \"Cursed Blade\"\n\n2000 damage: +1 damage tick to \"Surge\"\n\n4000 damage: \"Dark Empowerment\" restores 1% HP/sec.\n\n6000 damage: \"Cursed Blade\" deals an additional 100 + (35% spell power) damage when 3 effects are stacked on the enemy\n\n8000 damage: +1 damage tick to \"Surge\"\n\n11000 damage: +25% to the splash area of \"Dark Empowerment\"","Нанесение урона вражеским героям дарует Прелату ряд бонусов:\n\nЗа каждые 500 ед. урона: +1 ед. к силе атаки, +15 HP; +10 ед. требуемого урона для следующего усиления\n\n1000 ед. урона: +1.5 сек. к времени действия умения \"Проклятое лезвие\"\n\n2000 ед. урона: +1 такт урона умения \"Порыв\"\n\n4000 ед. урона: умение \"Темное усиление\" восстанавливает 1% НР/сек.\n\n6000 ед. урона: умение \"Проклятое лезвие\" наносит дополнительно 100 + (35% сила умений) ед. урона при накоплении 3 эффектов на враге\n\n8000 ед. урона: +1 такт урона умения \"Порыв\"\n\n11000 ед. урона: +25% к области сплеш-эффекта умения \"Темное усиление\""],"icon":"images/heroes/a_A0F5.png"},{"id":"A0FZ","n":["黑暗信徒 [2/2]","Follower of Darkness [2/2]","Последователь Тьмы [2/2]"],"t":["15000 點傷害：「衝勁」在 5 秒內將受到傷害的防護提高 25%\n\n20000 點傷害：「受詛之刃」的冷卻降低 0.5 秒\n\n27000 點傷害：「衝勁」的傷害段數 +1\n\n35000 點傷害：「靈魂撕裂」可命中 5 個目標\n\n45000 點傷害：「衝勁」的傷害段數 +1\n\n60000 點傷害：「黑暗強化」使裝備技能威力提高 50%\n\n80000 點傷害：「衝勁」的傷害段數 +1","15000 damage: \"Surge\" increases protection from incoming damage by 25% for 5 sec.\n\n20000 damage: the cooldown of \"Cursed Blade\" is reduced by 0.5 sec.\n\n27000 damage: +1 damage tick to \"Surge\"\n\n35000 damage: \"Soul Rupture\" hits 5 targets\n\n45000 damage: +1 damage tick to \"Surge\"\n\n60000 damage: \"Dark Empowerment\" increases modifier power by 50%\n\n80000 damage: +1 damage tick to \"Surge\"","15000 ед. урона: умение \"Порыв\" увеличивает защиту от получаемого урона на 25% в течение 5 сек.\n\n20000 ед. урона: перезарядка умения \"Проклятое лезвие\" снижается на 0.5 сек.\n\n27000 ед. урона: +1 такт урона умения \"Порыв\"\n\n35000 ед. урона: умение \"Разрыв души\" поражает 5 целей\n\n45000 ед. урона: +1 такт урона умения \"Порыв\"\n\n60000 ед. урона: умение \"Темное усиление\" повышает силу модификаторов на 50%\n\n80000 ед. урона: +1 такт урона умения \"Порыв\""],"icon":"images/heroes/a_A0FZ.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["近戰刺客，靠擊殺敵方英雄來增強自己的技能威力。","A melee assassin who grows her ability power by killing enemy heroes.","Убийца ближнего боя, способная наращивать мощь своих умений за счёт убийства вражеских героев."]},{"id":"Npbm","n":["龍戰士","Dragon Warrior","Воин Дракона"],"attr":"agi","unlock":500000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_Npbm.png","proper":"Гонг","st":{"str":null,"str_lv":null,"agi":22,"agi_lv":3.0,"int":18,"int_lv":2.0,"speed":300},"roles":[["戰士","Fighter","рубака"],["刺客","Assassin","убийца"]],"sc":[["sp","dburn"],["burn","flam","curse","weak","vuln"]],"mod":["A08W"],"sp":["A08T","A08M","A08Y","A08W"],"ab":[{"id":"A08T","kind":"hero","n":["火焰法球","Fire Orbs","Огненные сферы"],"k":"Q","lv":5,"t":["3 顆火焰法球開始環繞英雄旋轉，點燃敵人。法球起初只造成 25% 傷害，隨著遠離英雄逐漸提升自身傷害，直到進入軌道為止。\n\n點燃：100% 機率；50 + （25% 技能強度）點傷害\n法球持續時間：6 秒\n\n冷卻：20 秒","3 fire spheres begin to circle around the hero, applying Burn to enemies. The spheres initially deal 25% damage and gradually increase their damage as they move away from the hero, until they reach orbit.\n\nBurn: 100% chance; 50 + (25% spell power) damage\nSphere duration: 6 sec.\n\nCooldown: 20 sec.","Вокруг героя начинают кружиться 3 огненные сферы, поджигающие противников. Сферы изначально наносят 25% урона и по мере отдаления от героя постепенно увеличивают свой урон до выхода на орбиту.\n\nПоджог: 100% шанс; 50 + (25% сила умений) ед. урона\nВремя действия сфер: 6 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A08T.png","lvt":[{"i":2,"v":["50","75","100","125","150"]}]},{"id":"A08M","kind":"hero","n":["輕盈步伐","Light Step","Легкая поступь"],"k":"W","lv":5,"t":["提高英雄的移動速度並開始逐漸回復生命值。移動中的英雄可回復更多生命值。\n\n移動速度加成：15%\n生命值回復：18 + （5% 技能強度）點/秒\n移動中的治療強化：在競技場上每 100 點移動速度使治療 +30%\n持續時間：8 秒\n\n冷卻：17 秒","Increases the hero's movement speed and begins to gradually restore health. While moving, the hero restores more health.\n\nMovement speed bonus: 15%\nHealth restoration: 18 + (5% spell power) per sec.\nHealing bonus while moving: +30% healing per every 100 movement speed on the arena\nDuration: 8 sec.\n\nCooldown: 17 sec.","Повышает скорость бега героя и начинает постепенно восстанавливать здоровье. В движении герой восстанавливает больше здоровья.\n\nБонус к скорости бега: 15%\nВосстановление здоровья: 18 + (5% сила умений) ед./сек.\nУсиление исцеления в движении: +30% исцеления за каждые 100 ед. скорости передвижения по арене\nВремя действия: 8 сек.\n\nПерезарядка: 17 сек."],"icon":"images/heroes/a_A08M.png","lvt":[{"i":2,"v":["15","20","25","30","35"]},{"i":3,"v":["18","27","36","45","54"]}]},{"id":"A08Y","kind":"hero","n":["巨龍吐息","Dragon's Breath","Дыхание дракона"],"k":"","lv":5,"t":["繼承裝備技能的加成。\n\n每第 7 次攻擊會朝被攻擊的敵人方向產生一道點燃的火焰波。\n\n火焰波傷害：40 + （18% 技能強度）點\n火焰波點燃：100% 機率，100% 傷害","Inherits modifier bonuses.\n\nEvery 7th attack creates a burning wave of fire in the direction of the attacked enemy.\n\nWave damage: 40 + (18% spell power)\nWave Burn: 100% chance, 100% damage","Наследует бонусы для модификаторов.\n\nКаждая 7-я атака создает поджигающую волну огня в направлении к атакованному противнику.\n\nУрон от волны: 40 + (18% сила умений) ед.\nПоджог от волны: 100% шанс, 100% урона"],"icon":"images/heroes/a_A08Y.png","lvt":[{"i":4,"v":["40","60","80","100","120"]}]},{"id":"A08V","kind":"hero","n":["無錫手指扣","Wuxi Finger Hold","Пальцевой захват Уси"],"k":"R","lv":1,"t":["對近戰範圍內的敵人施展致命招式，造成大量傷害並同時施加多種狀態。也會波及目標周圍的敵人。\n\n對普通士兵使用：對目標造成 600 +（350% 力量與敏捷）點傷害；其中 30% 的傷害會作用於目標周圍的區域\n狀態施加：200% 機率施加易燃、虛弱、詛咒、易傷；附近的敵人有 30% 機率被施加虛弱\n\n冷卻：80 秒","Performs a deadly technique against an enemy in melee range, dealing a large amount of damage and applying several statuses at once. Also hits enemies near the target.\n\nUse against regular troops: 600 + (350% Strength and Agility) damage to the target; 30% of the damage is dealt in an area around the target\nStatus application: 200% chance to apply Flammable, Weakness, Curse and Vulnerability; nearby enemies are weakened with a 30% chance\n\nCooldown: 80 sec.","Применяет смертоносный приём против врага в ближнем бою, нанося большое количество урона, применяя сразу несколько статусов. Задевает врагов рядом с целью.\n\nПрименение против обычных воинов: 600 + (350% сила и ловкость) ед. урона по цели; 30% урона наносится по области вокруг цели\nПрименение статусов: 200% шанс применить горючесть, слабость, проклятие, уязвимость; враги поблизости ослабляются с 30% шансом\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A08V.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A08W","kind":"innate","n":["烈焰之刃","Flaming Blades","Пламенные клинки"],"k":"","lv":null,"t":["繼承裝備技能的加成。\n\n英雄的攻擊有機會造成額外的範圍傷害，並以較高的機率對敵人施加易燃。\n\n範圍傷害：20 +（40% 力量與敏捷）+（15% 技能強度）點\n「易燃」狀態：以 120% 機率施加於敵人\n\n冷卻：10 秒","Inherits modifier bonuses.\n\nThe hero's attack can deal additional area damage and apply Flammable to enemies with an increased chance.\n\nArea damage: 20 + (40% Strength and Agility) + (15% spell power)\n\"Flammable\" status: applied to enemies with a 120% chance\n\nCooldown: 10 sec.","Наследует бонусы для модификаторов.\n\nАтака героя может нанести дополнительный урон по области и применить горючесть на врагов с завышенным шансом.\n\nУрон по области: 20 + (40% сила и ловкость) + (15% сила умений) ед.\nСтатус \"горючесть\": применяется на врагов с 120% шансом\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A08W.png"}],"tier":["T3","T3","Т3"],"late":["低","Low","низкий"],"d":["結實的近戰英雄，強化路線很多，部分技能有獨立運作方式。","A sturdy melee hero with many upgrade paths; some abilities work independently.","Крепкий герой ближнего боя, который имеет множество путей для усиления - некоторые умения действуют как модификаторы, имеет скалирование по силе и ловкости, накладывает поджоги."]},{"id":"Hmgd","n":["亡者公主","Princess of the Dead","Принцесса мёртвых"],"attr":"agi","unlock":4000000,"random":true,"builds":[],"skins":[],"author":"Koshitan","icon":"images/heroes/h_Hmgd.png","proper":"Ная","st":{"str":17,"str_lv":1.5,"agi":33,"agi_lv":4.0,"int":23,"int_lv":2.5,"speed":320},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","hp","pen","vamp"],["curse"]],"mod":[],"sp":["AOwk","ANbl","A0X7"],"ab":[{"id":"AOwk","kind":"hero","n":["疾行","Swiftness","Стремительность"],"k":"Q","lv":5,"t":["英雄進入隱形並獲得移動速度加成。從隱形中發動的攻擊會對敵人造成額外魔法傷害，並為英雄回復生命值。\n\n隱形攻擊傷害：100 +（400% 穿透）+（40% 技能強度）點\n魔法吸血：33%\n移動速度加成：10%\n持續時間：11 秒\n\n冷卻：11 秒","The hero becomes invisible and gains bonus movement speed. A strike from invisibility deals additional magic damage to the enemy and restores health to the hero.\n\nDamage of the strike from invisibility: 100 + (400% penetration) + (40% spell power)\nMagic lifesteal: 33%\nMovement speed bonus: 10%\nDuration: 11 sec.\n\nCooldown: 11 sec.","Герой становится невидимым и получает бонус к скорости бега. Удар из невидимости нанесёт противнику дополнительный магический урон и восстановит герою здоровье.\n\nУрон удара из невидимости: 100 + (400% пробитие) + (40% сила умений) ед.\nМагический вампиризм: 33%\nБонус к скорости бега: 10%\nВремя действия: 11 сек.\n\nПерезарядка: 11 сек."],"icon":"images/heroes/a_AOwk.png","lvt":[{"i":2,"v":["100","150","200","250","300"]},{"i":4,"v":["10","20","30","40","50"]}]},{"id":"ANbl","kind":"hero","n":["躍進","Leap","Скачок"],"k":"W","lv":5,"t":["將英雄傳送一小段距離。傳送後英雄獲得穿透加成。\n\n施放距離：700 點\n穿透加成：20 +（10% 技能強度）點\n加成持續時間：10 秒\n\n冷卻：16 秒","Teleports the hero a short distance. After teleporting, the hero gains bonus penetration.\n\nCast range: 700\nPenetration bonus: 20 + (10% spell power)\nBonus duration: 10 sec.\n\nCooldown: 16 sec.","Телепортирует героя на небольшое расстояние. После телепортации герой получает бонус к пробитию.\n\nДальность применения: 700 ед.\nБонус к пробитию: 20 + (10% сила умений) ед.\nВремя действия бонуса: 10 сек.\n\nПерезарядка: 16 сек."],"icon":"images/heroes/a_ANbl.png","lvt":[{"i":2,"v":["700","800","900","1000","1100"]},{"i":3,"v":["20","30","40","50","60"]}]},{"id":"A0X6","kind":"hero","n":["亡者詛咒","Curse of the Dead","Проклятие мёртвых"],"k":"","lv":5,"t":["英雄的攻擊會對敵人施加詛咒。被詛咒的目標會受到取決於其生命值的混合傷害。\n\n詛咒傷害（點/秒）：敵人目前生命值的 2%\n詛咒持續時間：5 秒","The hero's attacks apply Curse to enemies. Cursed targets take mixed damage that depends on their health pool.\n\nCurse damage (per sec.): 2% of the enemy's current health\nCurse duration: 5 sec.","Атаки героя накладывают проклятие на противников. Проклятые цели получают смешанный урон, зависящий от их запаса здоровья.\n\nУрон от проклятия (ед./сек.): 2% от текущего запаса здоровья врага\nДлительность проклятия: 5 сек."],"icon":"images/heroes/a_A0X6.png","lvt":[{"i":2,"v":["2","3","4","5","6"]}]},{"id":"A0X7","kind":"hero","n":["致命切割","Deadly Cut","Смертельный разрез"],"k":"R","lv":1,"t":["瞬間移動到指定敵人的身後並造成傷害。擊殺目標時會重置技能與裝備的冷卻。\n\n傷害：200 + （900% 穿透）+ （90% 技能強度）點\n\n冷卻：50 秒。","Instantly teleports behind the target enemy and deals damage. Resets the cooldown of abilities and items when the target is killed.\n\nDamage: 200 + (900% penetration) + (90% spell power)\n\nCooldown: 50 sec.","Мгновенно перемещается за спину к указанному врагу и наносит урон. Сбрасывает перезарядку способностей и предметов при убийстве цели.\n\nУрон: 200 + (900% пробитие) + (90% сила умений) ед.\n\nПерезарядка: 50 сек."],"icon":"images/heroes/a_A0X7.png"},{"id":"A0X9","kind":"innate","n":["適應","Adaptation","Адаптация"],"k":"","lv":null,"t":["造成傷害可為英雄帶來加成：\n\n對任何敵人每造成 100 點傷害：攻擊力 +1 點，穿透 +0.35；下一次強化所需的傷害 +35 點\n\n受到傷害可為英雄帶來加成：\n\n每受到敵人 200 點傷害：生命值上限 +15 點，生命回復 +0.50；下一次強化所需的傷害 +30 點","Dealing damage grants the hero bonuses:\n\nFor every 100 damage dealt to any enemies: +1 attack power, +0.35 penetration; +35 to the damage required for the next upgrade\n\nTaking damage grants the hero bonuses:\n\nFor every 200 damage taken from enemies: +15 maximum health, +0.50 health regeneration; +30 to the damage required for the next upgrade","Нанесение урона дарует герою бонусы:\n\nЗа каждые 100 ед. урона по любым противникам: +1 ед. к силе атаки, +0.35 пробитие; +35 ед. требуемого урона для следующего усиления\n\nПолучение урона дарует герою бонусы:\n\nЗа каждые 200 ед. полученного урона от врагов: +15 ед. запас здоровья, +0.50 регенерация здоровья; +30 ед. требуемого урона для следующего усиления"],"icon":"images/heroes/a_A0X9.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T3+","T3+","Т3+"],"late":["極高","Top","высший"],"d":["強力的近戰單挑者。沒有輔助道具時對群戰無力，但單體極強。","A powerful melee duellist. Helpless against groups without support items, but devastating one-on-one.","Сильный дуэлянт ближнего боя. Без воспомогательных предметов бессильна против групп врагов. Может накапливать силу и выживаемость за активное участие в боях."]},{"id":"E00S","n":["白銀執法官","Silver Lictor","Серебряный ликтор"],"attr":"agi","unlock":4000000,"random":true,"builds":[{"id":"lictor-hybrid","c":"#C0C8D8","n":["五刃門檻・雙修","Five Blades: the 500 Threshold","Пять клинков: порог 500"],"key":["白銀之刃在技能強度 500 時從打 3 個變成打 5 個 —— 一件星界耳環就跨過門檻，其餘全堆攻速","Silver Blades hits 5 targets instead of 3 once spell power reaches 500 - one Astral Earring clears it, the rest goes to attack speed","«Серебряные клинки» бьют по 5 целям вместо 3 при 500 силы умений"],"why":["程式碼裡白銀之刃是這樣寫的：if 技能強度 >= 500 then 取 5 個目標 else 取 3 個。這是全英雄唯一一個硬門檻，跨過去就是 +67% 的目標數，而且沒有任何提示寫在技能說明裡。星界耳環一件 +800 就直接跨過，所以最有效率的做法不是繼續堆技能強度，而是「剛好跨過門檻，剩下六格全給攻速與攻擊力」。律法之字的暴擊是原生的攻擊暴擊（20% 機率、1.7 倍起跳，每殺一個敵方英雄 +0.3，最多疊到 31 級也就是 10.7 倍），所以真正的持續輸出來源是平砍而不是技能。這套攻速 +370%（皮革手套每級 +3%，25 級時就是 +75%），攻擊間隔從 1.5 秒壓到 0.32 秒；追擊開著的 8 秒內攻擊力再 +70%，16 秒冷卻等於一半時間都在加成中。同時技能也沒有廢掉：白銀之刃 280×5、均衡者之眼每跳 210 打 22 跳。災妄之星的 25% 吸血補平砍，技能本身又自帶 10% 吸血（那是寫死在每個技能裡的，不是靠裝備），所以血線很穩。","The code for Silver Blades reads: if spell power >= 500, pick 5 targets, else pick 3. It is the only hard threshold on any hero, it is worth +67% targets, and nothing in the tooltip mentions it. A single Astral Earring (+800) clears it, so the efficient play is not to keep stacking spell power but to clear the threshold once and spend the other six slots on attack speed and attack damage. Letter of the Law's critical strike is a native attack crit (20% chance, 1.7x rising by 0.3 per enemy hero killed, up to 31 levels or 10.7x), so sustained damage comes from auto-attacks, not abilities. This build reaches +370% attack speed (Leather Gloves give 3% per hero level, so +75% at level 25), cutting the attack interval from 1.5 s to 0.32 s; Pursuit adds another +70% attack damage for 8 s on a 16 s cooldown, so half the time it is up. The abilities are still live: Silver Blades 280 x5, Eye of the Equaliser 210 per tick for 22 ticks. Star of Misfortune's 25% lifesteal covers the auto-attacks, and the abilities carry their own hardcoded 10% lifesteal, so sustain is not a problem.","В коде «Серебряных клинков» написано: если сила умений >= 500, выбрать 5 целей, иначе 3. Это единственный жёсткий порог среди всех героев, он даёт +67% целей, и в описании о нём ни слова. Одна «Астральная серьга» (+800) его перекрывает, поэтому выгоднее не наращивать силу умений дальше, а отдать остальные шесть слотов под скорость атаки и урон. Крит «Буквы закона» - это обычный крит от атак (20%, x1.7 с ростом на 0.3 за каждого убитого вражеского героя, до 31 уровня, то есть x10.7). Сборка достигает +370% скорости атаки, интервал падает с 1.5 до 0.32 сек."],"items":["I00E","I0A7","I076","gcel","prvt","grsl"],"bonus":{"s1":"klmm","s2":"I08F"}},{"id":"lictor-crit","c":"#E8B84B","n":["律法之刃・純物理","Letter of the Law: Pure Physical","Буква закона: чистая физика"],"key":["全力堆平砍：0.32 秒一下，追擊期間攻擊力 583，暴擊倍率隨擊殺英雄無上限成長","All-in on auto-attacks: one swing every 0.32 s, 583 attack damage during Pursuit, crit multiplier growing with every hero kill","Ставка на автоатаки: удар каждые 0.32 сек., крит растёт с каждым убитым героем"],"why":["律法之字的暴擊上限是 31 級：1.7 倍起跳、每殺一個敵方英雄 +0.3 倍，全滿是 10.7 倍。指令「-i」可以查目前倍率。這是全遊戲成長幅度最大的被動，而它只吃平砍，所以這套完全放掉技能強度，把六格全給攻速與攻擊力。攻速 +370%（含皮革手套每級 3%），攻擊間隔 0.32 秒；追擊那 8 秒攻擊力 583，冷卻 16 秒等於一半時間都在爆發。深淵之劍的 +20% 對英雄非狀態傷害正好疊在暴擊上，因為那是傷害倍率不是攻擊力。要注意兩件事：一是技能強度歸零後白銀之刃只打 3 個目標、均衡者之眼每跳只有 50，技能等於放棄；二是月光寶劍那 30%×2.5 暴擊跟律法之字是同一種原生暴擊技能，兩個同時掛在身上時遊戲怎麼結算我無法從地圖資料確認，所以這套沒有放它 —— 想試的話它的 +30 攻擊力 +20 敏捷 +125 技能強度本身也不虧。","Letter of the Law's crit caps at 31 levels: 1.7x to start, +0.3x per enemy hero killed, 10.7x at the top. Type \"-i\" to read the current multiplier. It is the largest scaling passive in the game and it only applies to auto-attacks, so this build drops spell power entirely and spends all six slots on attack speed and attack damage. +370% attack speed (including Leather Gloves' 3% per hero level) puts the attack interval at 0.32 s; during Pursuit's 8 seconds attack damage is 583, and with a 16 s cooldown that is half the time. Abyssal Blade's +20% non-status damage against heroes multiplies on top of the crit because it is a damage multiplier, not flat attack damage. Two caveats: with no spell power Silver Blades only hits 3 targets and Eye of the Equaliser drops to 50 per tick, so the abilities are effectively given up; and Moonlight Sword's 30%/2.5x crit is the same native critical-strike ability class as Letter of the Law, and the map data cannot tell me how the engine resolves two of them at once - so it is not included here. Its +30 attack damage, +20 agility and +125 spell power are fine on their own if you want to try it.","Крит «Буквы закона» ограничен 31 уровнем: x1.7 в начале, +0.3 за каждого убитого вражеского героя, максимум x10.7. Команда «-i» показывает текущий множитель. Это самая масштабируемая пассивка в игре, и работает она только с автоатаками. +370% скорости атаки дают интервал 0.32 сек.; во время «Преследования» урон атаки 583. Оговорка: крит «Разящего полумесяца» - тот же класс родной способности, что и «Буква закона», и данные карты не позволяют определить, как движок считает два таких эффекта одновременно."],"items":["I0A7","I076","gcel","prvt","grsl","I047"],"bonus":{"s1":"klmm","s2":"I08F"}},{"id":"lictor-sp","c":"#7E8CE0","n":["均衡者・法傷爆發","Eye of the Equaliser: Burst","Око Уравнителя: взрыв"],"key":["均衡者之眼不隨技能等級成長，只吃技能強度 —— 2150 點時每個敵人 10560 傷害","Eye of the Equaliser does not scale with skill level at all, only with spell power - 10,560 per enemy at 2,150","«Око Уравнителя» не растёт от уровня умения, только от силы умений"],"why":["均衡者之眼在程式碼裡是 50 + 技能強度 × 0.20，每 0.5 秒一跳共 22 跳 —— 注意那個 50 是常數，技能升級完全不影響傷害，只有技能強度會。所以它的實際係數是「技能強度 × 4.4」，是全英雄最高的單一技能係數之一。堆到 2150 技能強度時，範圍 400 內每個敵人吃 10560 傷害，一群 10 隻就是 10 萬。迴旋投擲同時還會燒掉造成傷害 75% 的法力，對會放技能的敵方英雄等於直接封嘴。這套的定位是清場與開團爆發，不是單挑：平砍 DPS 只有 90，被單一大 BOSS 貼身時打不動。另外均衡者之眼有個沒寫在說明裡的條件 —— 它只打「當前生命值高於你」的敵人，所以打小兵時你的血越滿、能打到的目標越少；打 BOSS 則永遠成立。技能自帶的 10% 吸血是每個被打到的目標各算一次，所以在人堆裡放大絕會回一大筆血。","In the code Eye of the Equaliser is 50 + spell power x 0.20, ticking every 0.5 s for 22 ticks - note that the 50 is a constant and skill level does not affect the damage at all, only spell power does. Its effective ratio is therefore spell power x 4.4, one of the highest single-ability ratios on any hero. At 2,150 spell power every enemy within 400 takes 10,560; a pack of ten is 100k. Boomerang Throw also burns mana equal to 75% of the damage dealt, which shuts down casting enemy heroes outright. This build is for clearing and opening fights, not duels: auto-attack DPS is only 90, so a single large boss in melee range is a problem. Eye of the Equaliser also has an undocumented condition - it only hits enemies whose current health is above yours, so against trash the fuller your health bar the fewer targets qualify; against bosses it always holds. The abilities' built-in 10% lifesteal is counted separately per target hit, so casting the ultimate into a crowd returns a large amount of health.","В коде «Око Уравнителя» - это 50 + сила умений x 0.20, тик каждые 0.5 сек., всего 22 тика. Обратите внимание: 50 - константа, уровень умения на урон не влияет вообще, только сила умений. Эффективный коэффициент - сила умений x 4.4. При 2150 силы умений каждый враг в радиусе 400 получает 10 560. «Бумеранг» вдобавок сжигает ману в размере 75% нанесённого урона. У «Ока» есть недокументированное условие: оно бьёт только по врагам, чьё текущее здоровье выше вашего."],"items":["I00E","sor5","kpin","ofro","I007","mnsf"],"bonus":{"s1":"fgun","s2":"I01Q"}},{"id":"lictor-lowhp","c":"#5FA88A","n":["逆境之眼","Eye of Adversity","Око невзгод"],"key":["均衡者之眼只打「血比你高」的敵人，所以這套刻意不堆生命值，改用護甲與吸血活下來","The Eye only hits enemies with more current health than you, so this build deliberately skips health and survives on armour and lifesteal","«Око» бьёт только по врагам с большим запасом здоровья, поэтому здесь нет здоровья - только броня и вампиризм"],"why":["這是全遊戲最反直覺的一條機制：均衡者之眼每一跳都會重新讀你「當前」的生命值，只有生命值高於你的敵人才會被打到。所以堆生命值會直接縮小自己大絕的目標清單 —— 地圖給白銀執法官的建議屬性裡有生命值，但程式碼說的是相反的事。這套照這個規則走：六格裡沒有任何一件純生命裝，改用護甲（+28）與 8% 非狀態傷害減免撐減傷，用災妄之星的 25% 吸血跟技能自帶的 10% 吸血回血。1375 技能強度讓白銀之刃過了 500 門檻打 5 個目標、均衡者之眼每個敵人 7150 傷害，同時 +100% 攻速讓平砍與吸血都有基本量。實戰上這套愈打愈猛：你被打掉的血愈多，均衡者之眼能鎖定的目標就愈多，而目標愈多回血也愈多，等於自帶一條負回饋線。追擊那 +8 護甲（8 秒／16 秒冷卻）在這套的比重也比其他套高，因為沒有生命值墊底時護甲的邊際效益最大。","This is the most counterintuitive mechanic in the game: every tick, Eye of the Equaliser re-reads your current health and only hits enemies above it. Stacking health therefore shrinks your own ultimate's target list - the map lists health among the Lictor's recommended stats, but the code says the opposite. This build follows the code: not one pure health item in the six slots, relying instead on armour (+28) and 8% non-status reduction for mitigation, and on Star of Misfortune's 25% lifesteal plus the abilities' built-in 10% for recovery. 1,375 spell power clears the 500 threshold so Silver Blades hits 5, and Eye of the Equaliser does 7,150 per enemy, while +100% attack speed keeps the auto-attacks and their lifesteal meaningful. In practice the build gets stronger as the fight goes on: the more health you lose, the more targets the Eye can lock onto, and the more targets it hits the more it heals you back - a built-in negative feedback loop. Pursuit's +8 armour (8 s on a 16 s cooldown) matters more here than in any other build, because armour has its highest marginal value when there is no health pool behind it.","Самая контринтуитивная механика в игре: на каждом тике «Око Уравнителя» заново считывает ваше текущее здоровье и бьёт только по врагам выше него. Накопление здоровья сокращает список целей вашего же ультимейта - карта рекомендует ликтору здоровье, но код говорит обратное. Здесь нет ни одного предмета на чистое здоровье: броня (+28) и 8% снижения нестатусного урона, а восстановление - 25% вампиризма «Звезды злосчастья» плюс встроенные 10% у умений. 1375 силы умений перекрывают порог 500."],"items":["I00E","kpin","ofro","I0A8","grsl","I076"],"bonus":{"s1":"lure","s2":"I01Q"}},{"id":"lictor-budget","c":"#9A8FB8","n":["平價過渡","Budget Transition","Бюджетная сборка"],"key":["9600 金就能湊齊，技能強度 625 已經過了 5 目標門檻，中期直接能用","9,600 gold in total, 625 spell power already clears the five-target threshold - usable from mid-game","9600 золота, 625 силы умений уже перекрывают порог пяти целей"],"why":["上面幾套都要一萬五到兩萬三千金，中期根本湊不出來。這套只要 9600 金，而且沒有任何神器與特殊 lv.5 以上的道具，全部都是中期商店買得到的東西。重點還是同一個：純淨紫水晶 400 加上大法師之褲 150 加上能量符文 75 就是 625 技能強度，剛好過白銀之刃的 500 門檻，所以清場能力跟後期配裝是同一個量級（每 6 秒 245×5）。攻速 +80% 再加皮革手套每級 3%，25 級時是 +155%，平砍 0.59 秒一下。寒冰長矛與戰鬥砍刀提供 20 點穿透，中期敵人護甲低，穿透的效益反而比後期高。這套湊齊之後往哪裡走：想走物理就把純淨紫水晶換成埃洛波達之羽、其他慢慢換成攻速裝；想走技能就把攻速裝換成星界耳環與大法師長袍。","The builds above cost 15,000 to 23,000 gold, which is out of reach in the mid-game. This one is 9,600 with no artifacts and nothing above Special lv.4 - everything is available from the mid-game shops. The point is the same: Pure Amethyst 400 plus Archmage Trousers 150 plus Energy Rune 75 is 625 spell power, which clears the 500 threshold for Silver Blades, so clear speed is already in the same class as the late-game builds (245 x5 every 6 s). +80% attack speed plus Leather Gloves' 3% per level is +155% at level 25, an attack every 0.59 s. Frost Spear and Combat Cleaver supply 20 penetration, which is worth more in the mid-game than later because enemy armour is still low. Where to go from here: for the physical route swap Pure Amethyst for Elopoda's Feather and convert the rest to attack speed; for the ability route swap the attack-speed pieces for the Astral Earring and Archmage Robe.","Сборки выше стоят от 15 до 23 тысяч золота - в середине игры это недостижимо. Здесь 9600, без артефактов и без предметов выше «Особый lv.4». Смысл тот же: «Чистый аметист» 400 плюс «Штаны архимага» 150 плюс «Руна энергии» 75 = 625 силы умений, порог в 500 перекрыт, «Серебряные клинки» бьют по пяти целям. +80% скорости атаки плюс 3% за уровень от «Кожаных перчаток» дают +155% на 25 уровне. 20 пробития от «Ледяного копья» и «Боевого тесака» в середине игры полезнее, чем позже."],"items":["sor5","I044","I003","rin1","I006","odef"],"bonus":{"s1":"klmm","s2":"I01Q"}}],"skins":[{"id":"Eill","on":true,"n":["月之女戰士","Moon Warrior","Воительница Луны"]}],"author":null,"icon":"images/heroes/h_E00S.png","proper":"Немезида","st":{"str":19,"str_lv":2.0,"agi":30,"agi_lv":4.0,"int":24,"int_lv":2.5,"speed":300},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","armor","hp","mp","vamp"],[]],"mod":[],"sp":["A0OE","A0OA","A0OF"],"ab":[{"id":"AEbl","kind":"hero","n":["追擊","Pursuit","Преследование"],"k":"W","lv":5,"t":["將英雄傳送一段短距離。傳送後英雄暫時提升自身的護甲與攻擊力。\n\n施放距離：600 點\n攻擊力加成：+30%\n護甲加成：+4\n加成持續時間：8 秒\n\n冷卻：16 秒","Teleports the hero a short distance. After the teleport the hero temporarily increases his armour and attack power.\n\nCast range: 600\nAttack power bonus: +30%\nArmour bonus: +4\nBonus duration: 8 sec.\n\nCooldown: 16 sec.","Телепортирует героя на небольшое расстояние. После телепортации герой временно повышает свою защиту и силу атаки.\n\nДальность применения: 600 ед.\nБонус к силе атаки: +30%\nБонус к защите: +4\nВремя действия бонуса: 8 сек.\n\nПерезарядка: 16 сек."],"icon":"images/heroes/a_AEbl.png","lvt":[{"i":2,"v":["600","650","700","750","800"]},{"i":3,"v":["30","40","50","60","70"]},{"i":4,"v":["4","5","6","7","8"]}]},{"id":"A0OE","kind":"hero","n":["白銀之刃","Silver Blade","Серебряное лезвие"],"k":"","lv":5,"t":["被動技能。英雄的攻擊可能對附近數名敵人造成額外的魔法傷害。\n\n傷害：40 + （20% 技能強度）點\n目標數量：3 個（技能強度 500 以上為 5 個）\n\n冷卻：6 秒","Passive ability. The hero's attacks can deal additional magic damage to several nearby enemies.\n\nDamage: 40 + (20% spell power)\nTargets: 3 (5 at 500 spell power and above)\n\nCooldown: 6 sec.","Пассивное умение. Атаки героя могут наносить дополнительный магический урон нескольким врагам поблизости.\n\nУрон: 40 + (20% сила умений) ед.\nКоличество целей: 3 ед. (при силе умений 500 и выше - 5 ед.)\n\nПерезарядка: 6 сек."],"icon":"images/heroes/a_A0OE.png","lvt":[{"i":2,"v":["40","60","80","100","120"]}]},{"id":"A0OA","kind":"hero","n":["迴旋投擲","Circular Throw","Круговой бросок"],"k":"Q","lv":5,"t":["對英雄周圍的敵人造成傷害。站在執法官極近處的敵人受到的傷害提高 50%。同時以所造成傷害的 75% 燒灼敵人的法力值。\n\n傷害：80 + （40% 技能強度）點\n\n冷卻：13 秒","Deals damage to enemies around the hero. Enemies standing very close to the lictor take 50% more damage. Also drains enemy mana equal to 75% of the damage dealt.\n\nDamage: 80 + (40% spell power)\n\nCooldown: 13 sec.","Наносит урон врагам вокруг героя. Противники, стоящие очень близко к ликтору, получают на 50% больше урона. Также иссушает ману противников в размере 75% от нанесенного урона.\n\nУрон: 80 + (40% сила умений) ед.\n\nПерезарядка: 13 сек."],"icon":"images/heroes/a_A0OA.png","lvt":[{"i":2,"v":["80","120","160","200","240"]}]},{"id":"A0OF","kind":"hero","n":["均衡者之眼","Eye of the Equaliser","Око Уравнителя"],"k":"R","lv":1,"t":["英雄在自身腳下創造一片魔法領域，領域內所有當前生命值高於英雄的敵人都會受到傷害。\n\n每次跳動的傷害：50 + （20% 技能強度）點。\n跳動間隔：0.5 秒。\n持續時間：11 秒。\n\n冷卻：80 秒。","The hero creates a magic field beneath itself; inside it, all enemies with a current health pool larger than the hero's take damage.\n\nDamage per tick: 50 + (20% spell power)\nTick interval: 0.5 sec.\nDuration: 11 sec.\n\nCooldown: 80 sec.","Герой создает под собой магическое поле, внутри которого все противники, имеющие текущий запас здоровья больше, чем у героя, получают урон.\n\nУрон за такт: 50 + (20% сила умений) ед.\nПериодичность тактов: 0.5 сек.\nВремя действия: 11 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0OF.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0OB","kind":"innate","n":["律法之字","Letter of the Law","Буква закона"],"k":"","lv":null,"t":["白銀執法官的技能具有吸血效果，並有 20% 機率造成致命一擊（170% 傷害）。擊殺敵方英雄可提升暴擊傷害。指令「-i」可顯示技能當前的暴擊傷害。\n\n技能吸血：10%\n擊殺英雄時的暴擊傷害提升：+30%","The Silver Lictor has lifesteal from its abilities and a 20% chance to deal a critical strike (170% damage). Kills of enemy heroes increase the critical damage. The \"-i\" command shows the ability's current critical damage.\n\nAbility lifesteal: 10%\nCritical damage increase per hero kill: +30%","Серебряный ликтор обладает вампиризмом от своих умений и имеет 20% шанс нанести критический удар (170% урона). Убийства вражеских героев повышаеют крит. урон. Команда \"-i\" отображает текущий крит. урон умения.\n\nВампиризм умений: 10%\nУсиление крит. урона при убийстве героя: +30%"],"icon":"images/heroes/a_A0OB.png"},{"id":"A0OD","kind":"innate","n":["（律法之字・暴擊）","(Letter of the Law, crit)","(буква закона, крит)"],"k":"","lv":31,"t":["","",""],"icon":"images/heroes/a_A0OD.png"}],"d":["制裁與律法的化身。最強的近戰英雄之一，能把攻速拉到極限。","The embodiment of retribution and law - one of the strongest melee heroes, able to reach extreme attack speed.","Воплощение неотвратимости возмездия и закона. Сильнейший герой ближнего боя, способный разогнать свою мощь на убийствах героев. Также имеет собственный вампиризм от умений."]},{"id":"H01E","n":["主教","Bishop","Епископ"],"attr":"int","unlock":0,"random":true,"builds":[],"skins":[{"id":"Efur","on":true,"n":["至高教宗","Supreme Pontiff","Верховный понтифик"]}],"author":null,"icon":"images/heroes/h_H01E.png","proper":"Альнадар","st":{"str":16,"str_lv":1.2999999523162842,"agi":15,"agi_lv":1.2000000476837158,"int":22,"int_lv":3.0,"speed":320},"roles":[["治療","Healing","исцеление"],["法師","Mage","маг"]],"sc":[["sp"],[]],"mod":[],"sp":["A065","A068","A067","A066"],"ab":[{"id":"A065","kind":"hero","n":["天堂意志","Will of Heaven","Воля Небес"],"k":"R","lv":1,"t":["英雄標記一片區域，2 秒後將有強大的光流落下，對敵人造成傷害並治療友軍。對建築與機械無效。\n\n\n對敵人的傷害：200 + （100% 技能強度）點\n治療友軍：150 + （75% 技能強度）點\n\n冷卻：60 秒","The hero marks an area where, after 2 sec., a powerful stream of light strikes, dealing damage to enemies and healing allies. Does not affect buildings and mechanical units.\n\n\nDamage to enemies: 200 + (100% spell power)\nHealing to allies: 150 + (75% spell power)\n\nCooldown: 60 sec.","Герой отмечает область, в которую через 2 сек. ударит мощный поток света, наносящий урон противникам и исцеляющий союзников. Не действует на строения и механизмы.\n\n\nУрон противникам: 200 + (100% сила умений) ед.\nИсцеление союзников: 150 + (75% сила умений) ед.\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A065.png"},{"id":"A068","kind":"hero","n":["致盲","Blind","Ослепление"],"k":"E","lv":5,"t":["指定範圍內的敵人受到傷害，並且開始在攻擊時失手。對建築與機械無效。\n\n傷害：30 +（15% 技能強度）點\n失手機率：20%\n效果持續時間：20 秒（英雄 10 秒）\n\n冷卻：25 秒","Enemies in the target area take damage and begin to miss with their attacks. Does not affect buildings and mechanical units.\n\nDamage: 30 + (15% spell power)\nMiss chance: 20%\nEffect duration: 20 sec. (heroes 10 sec.)\n\nCooldown: 25 sec.","Противники в указанной области получают урон и начинают промахиваться при атаках. Не действует на строения и механизмы.\n\nУрон: 30 + (15% сила умений) ед.\nШанс на промах: 20%\nДлительность эффекта: 20 сек. (герои 10 сек.)\n\nПерезарядка: 25 сек."],"icon":"images/heroes/a_A068.png","lvt":[{"i":2,"v":["30","45","60","75","90"]},{"i":3,"v":["20","27","34","41","48"]}]},{"id":"A067","kind":"hero","n":["神聖之焰","Holy Flame","Святое пламя"],"k":"Q","lv":5,"t":["指定的敵方戰士會被火焰包圍，每秒受到傷害。同時失去施放法術的能力，並且造成的傷害降低。\n\n傷害：14 +（6% 技能強度）點/秒\n目標造成傷害的降低：12%\n持續時間：16 秒（英雄 8 秒）\n\n冷卻：22 秒","The target enemy warrior is engulfed in flames that deal damage every second. It also loses the ability to cast spells and deals less damage.\n\nDamage: 14 + (6% spell power) per sec.\nTarget's damage reduction: 12%\nDuration: 16 sec. (heroes 8 sec.)\n\nCooldown: 22 sec.","Указанный воин противника окутывается пламенем, ежесекундно наносящим урон. При этом он теряет возможность применять заклинания и наносит меньше урона.\n\nУрон: 14 + (6% сила умений) ед./сек.\nСнижение наносимого урона у цели: 12%\nВремя действия: 16 сек. (герои 8 сек.)\n\nПерезарядка: 22 сек."],"icon":"images/heroes/a_A067.png","lvt":[{"i":2,"v":["14","21","28","35","42"]},{"i":3,"v":["12","16","20","24","28"]}]},{"id":"A066","kind":"hero","n":["天堂之光","Light of Heaven","Свет небес"],"k":"W","lv":5,"t":["指定範圍內出現閃耀的光芒，治療友軍並對敵人造成傷害。對建築與機械無效。\n\n對敵人的傷害：12 +（8% 技能強度）點/秒\n對友軍的治療：12 +（8% 技能強度）點/秒\n效果持續時間：9 秒\n\n冷卻：31 秒","Flashes of light appear in the target area, healing allies and dealing damage to enemies. Does not affect buildings and mechanical units.\n\nDamage to enemies: 12 + (8% spell power) per sec.\nHealing to allies: 12 + (8% spell power) per sec.\nEffect duration: 9 sec.\n\nCooldown: 31 sec.","В указанной области появляются вспышки света, исцеляющие союзников и наносящие урон врагам. Не действует на строения и механизмы.\n\nУрон врагам: 12 + (8% сила умений) ед./сек.\nИсцеление союзников: 12 + (8% сила умений) ед./сек.\nДлительность эффекта: 9 сек.\n\nПерезарядка: 31 сек."],"icon":"images/heroes/a_A066.png","lvt":[{"i":2,"v":["12","18","24","30","36"]},{"i":3,"v":["12","18","24","30","36"]}]},{"id":"A0JI","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，使英雄大幅強化至新的力量等階。","With enough player experience points, you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0JI.png","opts":[{"id":"A0JK","n":["宗教裁判","Inquisition","Инквизиция"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+1 / +0\n+1 / +1\n\n英雄技能造成的傷害提高 25%，但會以 100% 機率轉為點燃效果。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+1 / +0\n+1 / +1\n\nDamage from the hero's abilities is increased by 25%, but it becomes a Burn effect with a 100% chance.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+1 / +0\n+1 / +1\n\nУрон от умений героя увеличен на 25%, но становится эффектом поджога с 100% шансом."],"icon":"images/heroes/a_A0JK.png"},{"id":"A0LX","n":["天啟之意","Will from Above","Воля свыше"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +0\n+1 / +0\n+4 / +2\n\n技能「天堂意志」對敵人造成的傷害提高 100%，回復的生命值提高 100%，並在爆炸時施加「致盲」效果。\n\n技能「神聖之焰」以 100% 機率對目標施加易傷、虛弱與易燃效果。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +0\n+1 / +0\n+4 / +2\n\nThe \"Will of Heaven\" ability deals 100% more damage to enemies and heals 100% more health, and also applies the \"Blind\" effect on explosion.\n\nThe \"Holy Flame\" ability applies Vulnerability, Weakness and Flammable to the target with a 100% chance.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +0\n+1 / +0\n+4 / +2\n\nУмение \"Воля Небес\" наносит на 100% больше урона врагам и исцеляет на 100% больше здоровья, а также применяет эффект \"Ослепления\" при взрыве.\n\nУмение \"Святое пламя\" применяет эффекты уязвимости, слабости и горючести к цели с 100% шансом."],"icon":"images/heroes/a_A0LX.png"}]},{"id":"A063","kind":"innate","n":["治療光環","Healing Aura","Аура исцеления"],"k":"","lv":null,"t":["每秒回復附近友軍 1% 的生命值。光環作用範圍為 400。對英雄本身無效。","Restores 1% health to nearby allies every second. The aura area is 400. Does not affect the hero himself.","Ежесекундно восстаналивает здоровье ближайших союзников на 1%. Область действия ауры - 400. Не действует на самого героя."],"icon":"images/heroes/a_A063.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["遠程英雄，具備範圍治療，並能削弱敵方部隊。","A ranged hero with area healing who can weaken enemy formations.","Герой дальнего боя, обладающий исцелением по области. Может ослаблять вражеские отряды."]},{"id":"Ekee","n":["占星師","Astromancer","Астромант"],"attr":"int","unlock":0,"random":false,"builds":[],"skins":[],"author":"Koshitan","icon":"images/heroes/h_Ekee.png","proper":"Тенка","st":{"str":14,"str_lv":1.5,"agi":19,"agi_lv":2.5,"int":39,"int_lv":5.0,"speed":null},"roles":[["法師","Mage","маг"]],"sc":[["sp","as","armor","mp","thorn"],[]],"mod":[],"sp":["A0KU","A0L0","A0CT"],"ab":[{"id":"A0KU","kind":"hero","n":["虛空充能","Void Charge","Пустотный заряд"],"k":"Q","lv":5,"t":["朝指定方向發射一顆黑暗能量球。能量球會對附近的敵人造成週期性傷害。可透過「虛空引爆」引爆能量球。\n\n週期性傷害：40 + （15% 技能強度） + （10% 當前法力值）點/秒。\n\n冷卻：14 秒。","Launches a sphere of dark energy in the chosen direction. The sphere deals periodic damage to nearby enemies. The sphere can be detonated with \"Void Detonation\".\n\nPeriodic damage: 40 + (15% spell power) + (10% current mana) per sec.\n\nCooldown: 14 sec.","Запускает шар тёмной энергии в указанную сторону. Шар наносит периодический урон врагам поблизости. Шар можно подорвать через \"Пустотный подрыв\".\n\nПериодический урон: 40 + (15% сила умений) + (10% текущий запас маны) ед./сек.\n\nПерезарядка: 14 сек."],"icon":"images/heroes/a_A0KU.png","lvt":[{"i":2,"v":["40","60","80","100","120"]},{"i":4,"v":["14","13","12","11","10"]}]},{"id":"A0KV","kind":"hero","n":["銀河","Milky Way","Млечный путь"],"k":"W","lv":5,"t":["產生一道能量屏障，將敵人從自身推開。敵人首次撞上屏障時可能會被暈眩。\n\n首次撞擊的暈眩：100% 機率，3 秒。\n屏障持續時間：6 秒。\n\n冷卻：20 秒。","Creates an energy barrier that pushes enemies away from you. Enemies can be stunned if they collide with the barrier for the first time.\n\nStun on first collision: 100% chance, 3 sec.\nBarrier duration: 6 sec.\n\nCooldown: 20 sec.","Создаёт энергетический барьер, отталкивающий от себя противников. Противники могут получить оглушение, если впервые столкнутся с барьером.\n\nОглушение при первом столкновении: 100% шанс, 3 сек.\nВремя действия барьера: 6 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0KV.png","lvt":[{"i":3,"v":["6","7","8","9","10"]}]},{"id":"A0KY","kind":"hero","n":["空間傳送門","Spatial Portal","Пространственный портал"],"k":"E","lv":5,"t":["在英雄所在位置與指定地點之間建立傳送門。傳送門雙向運作，可讓你的部隊與友軍部隊通過。單位傳送之後會獲得強化，並在強化時間結束前無法再次傳送。建立傳送門時，英雄獲得 2 秒的傳送免疫。\n\n單位強化：+25% 攻擊速度與移動速度，受到負面狀態的機率降低 30%，50% 反傷防護，+25% 對英雄防護\n強化持續時間：20 秒。\n施放距離：無限制\n持續時間：10 秒。\n\n冷卻：30 秒。","Creates a portal from the hero's position to the chosen point. The portal works in both directions and lets your units and allied units through. After teleporting, units gain a buff and cannot teleport again until the buff expires. On creation the hero gains immunity to teleportation for 2 sec.\n\nUnit buff: +25% attack speed and movement speed, 30% lower chance to receive a negative status, 50% protection from thorns, +25% protection from heroes\nBuff duration: 20 sec.\nCast range: unlimited\nDuration: 10 sec.\n\nCooldown: 30 sec.","Создаёт портал от позиции героя к указанной точке. Портал работает в обе стороны и пропускает ваши войска и войска союзников. После перемещения юниты получают усиление и запрет на повторную телепортацию до истечения времени усиления. При создании герой получает иммунитет к телепортации на 2 сек.\n\nУсиление юнитов: +25% скорость атаки и бега, на 30% слабее шанс получить негативный статус, 50% защита от ответного урона, +25% защита от героев\nВремя действия усиления: 20 сек.\nДальность применения: неограничено\nВремя действия: 10 сек.\n\nПерезарядка: 30 сек."],"icon":"images/heroes/a_A0KY.png","lvt":[{"i":5,"v":["10","20","30","40","50"]}]},{"id":"A0L0","kind":"hero","n":["乳光","Opalescence","Опалесценция"],"k":"R","lv":1,"t":["將星辰分解成大量光團，對作用範圍內的敵人造成傷害。每次傷害跳動都會吸收英雄的法力值以造成更高的傷害。\n\n傷害：30 + （5% 技能強度）點。\n每次跳動的額外傷害：英雄當前法力值的 3%，造成傷害後消耗當前法力值的 1.5%\n跳動間隔：0.15 秒。\n持續時間：10 秒。\n\n冷卻：80 秒。","Splits a star into many clusters of light that deal damage to enemies in the area. Each damage tick absorbs the hero's mana to deal increased damage.\n\nDamage: 30 + (5% spell power)\nExtra damage per tick: 3% of the hero's current mana; after the damage is dealt, 1.5% of current mana is consumed\nTick interval: 0.15 sec.\nDuration: 10 sec.\n\nCooldown: 80 sec.","Расщепляет звезду на множество сгустков света, наносящих урон противникам в области действия. Каждый такт урона поглощает ману героя для нанесения увеличенного урона.\n\nУрон: 30 + (5% сила умений) ед.\nДоп. урон за такт: 3% от текущей маны героя, после нанесения урона тратится 1.5% от текущей маны\nПериодичность тактов: 0.15 сек.\nВремя действия: 10 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0L0.png"},{"id":"A0CT","kind":"innate","n":["虛空引爆","Void Detonation","Пустотный подрыв"],"k":"Z","lv":1,"t":["引爆生效中的「虛空充能」，造成範圍傷害。內圈範圍造成全額傷害，外圈範圍造成 50% 傷害。\n\n全額傷害：50% 英雄當前法力值 + 100% 技能強度\n內圈範圍：225 點\n外圈範圍：450 點\n\n冷卻：10 秒。","Detonates the active \"Void Charge\", dealing area damage. The inner area takes full damage, the outer area takes 50% damage.\n\nFull damage: 50% of the hero's current mana + 100% spell power\nInner area: 225\nOuter area: 450\n\nCooldown: 10 sec.","Подрывает действующий \"пустотный заряд\", нанося урон по области. По внутренней области наносится полный урон, по внешней области наносится 50% урона.\n\nПолный урон: 50% от текущего запаса маны героя + 100% сила умений\nВнутренняя область: 225 ед.\nВнешняя область: 450 ед.\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0CT.png"},{"id":"A0YT","kind":"innate","n":["知識傳承","Inherited Knowledge","Унаследование знаний"],"k":"D","lv":1,"t":["繼承所選敵方英雄的一項技能。\n\n使用「-clear skill」指令可以重新選擇敵方英雄。","Inherits an ability of the chosen enemy hero.\n\nWith the \"-clear skill\" command you can re-select the enemy hero.","Наследует умение выбранного вражеского героя.\n\nС помощью команды \"-clear skill\" вы можете перевыбрать вражеского героя."],"icon":"images/heroes/a_A0YT.png"},{"id":"A0BQ","kind":"innate","n":["耀目法光","Brilliance Aura","耀目法光"],"k":"","lv":null,"t":["英雄以及地圖上你所有的部隊與友軍獲得 1% 法力值回復。","The hero and all your units and allies on the map gain 1% mana regeneration.","Герой и все ваши войска и союзники на карте получают 1% регенерации маны."],"icon":"images/heroes/a_A0BQ.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтож k":"","lv":null,"t":["英雄的技能有小機率對敵人施加「魅惑」狀態。魅惑會受到敵人身上詛咒抗性的影響。\n\n魅惑施加機率：40%\n魅惑持續時間：5 秒\n魅惑效果：女術士的技能對帶有「魅惑」狀態的敵人造成傷害時，會移除該狀態，並使技能傷害提高 50%","The hero's abilities have a small chance to apply the \"Charm\" status to enemies. Charm is subject to enemies' curse resistance.\n\nCharm application chance: 40%\nCharm duration: 5 sec.\nCharm effect: when the Sorceress's abilities damage an enemy with the \"Charm\" status, the status is removed and the ability deals 50% more damage","Способности героя с небольшим шансом накладывают на противников статус \"Чары\". Чары подвержены сопротивлению проклятиям на врагах.\n\nШанс наложения чар: 40%\nДлительность чар: 5 сек.\nЭффект чар: нанесение урона умениями чародейки по врагам, имеющих статус \"чар\", снимает данный статус и наносит на 50% больше урона от умений"],"icon":"images/heroes/a_A025.png"},{"id":"A0JA","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗值達到足夠數量時，你可以選擇一項天賦，大幅強化英雄，使其提升至新的力量階級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0JA.png","opts":[{"id":"A0JC","n":["魔力充盈","Magical Abundance","Магическое изобилие"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+0 / +0\n+1 / +0\n+2 / +1\n\n當法力值在 80% 以上時，女術士的技能造成的傷害提高 75%。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+0 / +0\n+1 / +0\n+2 / +1\n\nThe Sorceress's abilities deal 75% more damage while her mana is at 80% or above.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+0 / +0\n+1 / +0\n+2 / +1\n\nУмения чародейки наносят на 75% больше урона при запасе маны 80% и выше."],"icon":"images/heroes/a_A0JC.png"},{"id":"A0JM","n":["神化","Apotheosis","Апофеоз"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+1 / +0\n+2 / +1\n+4 / +1\n\n技能「不穩定充能」會擊中目標附近的 3 名敵 ила исцеления уменьшается на 15%.\n\nИсцеление: 200 + (75% сила умений) ед.\nКоличество целей: 8 ед.\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A0XP.png","lvt":[{"i":2,"v":["200","300","400","500","600"]}]},{"id":"A085","kind":"hero","n":["魔力潮汐","Surge of Magic","Прилив магии"],"k":"W","lv":5,"t":["暫時提升指定英雄的技能強度。效果結束後，技能的目標會永久獲得少量技能強度。\n\n技能強度加成：100 點\n技能強度永久增加：5 點\n持續時間：0 秒\n\n冷卻：25 秒","Temporarily increases the target hero's spell power. When the effect ends, the target of the ability permanently gains a small amount of spell power.\n\nSpell power bonus: 100\nPermanent spell power gain: 5\nDuration: 0 sec.\n\nCooldown: 25 sec.","Временно увеличивает силу способностей указанному герою. По окончании действия цель умения навсегда получает небольшое количество силы умений.\n\nБонус к силе способностей: 100 ед.\nПрибавка силы умений: 5 ед.\nВремя действия: 0 сек.\n\nПерезарядка: 25 сек."],"icon":"images/heroes/a_A085.png","lvt":[{"i":2,"v":["100","150","200","250","300"]},{"i":3,"v":["5","7","9","11","13"]}]},{"id":"A088","kind":"hero","n":["物競天擇","Natural Selection","Естественный отбор"],"k":"","lv":null,"t":["使用技能時，英雄會額外對自身周圍 800 範圍內的 5 名隨機敵人造成傷害。\n\n造成的傷害：30 + （30% 技能強度）點","When using abilities, the hero additionally deals damage to 5 random enemies within an area of 800 around himself.\n\nDamage dealt: 30 + (30% spell power)","При использовании умений герой дополнительно наносит урон 5 случайным врагам в области 800 вокруг себя.\n\nНаносимый урон: 30 + (30% сила умений) ед."],"icon":"images/heroes/a_A088.png"},{"id":"A084","kind":"innate","n":["多重射擊","Multishot","Мультишот"],"k":"","lv":null,"t":["英雄最多可攻擊 4 個目標。","The hero can attack up to 4 targets.","Герой может атаковать до 4 целей."],"icon":"images/heroes/a_A084.png"},{"id":"A0YO","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，使英雄大幅強化至新的力量等階。","With enough player experience points, you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0YO.png","opts":[{"id":"A0YP","n":["自然的擁抱","Nature's Embrace","Объятия природы"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+1 / +0\n+1 / +1\n\n「治療之波」在其作用期間，若將目標治療至滿血則獲得 +1 次彈跳。被治療至滿血的目標可獲得 +25 點生命值上限。\n\n「力量潮汐」失去永久提升技能強度的能力，但給予的臨時技能強度提高 50%。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+1 / +0\n+1 / +1\n\nWhile active, \"Healing Wave\" gains +1 bounce if it heals a target to full health. Targets healed to full health gain +25 maximum health.\n\n\"Surge of Power\" loses the ability to permanently increase spell power, but grants 50% more temporary spell power.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+1 / +0\n+1 / +1\n\nУмение \"Целительная волна\" во время своего действия получает +1 к отскоку если исцеляет цель до полного запаса здоровья. Исцеленные до полного запаса здоровья цели получают +25 к запасу здоровья.\n\nУмение \"Прилив сил\" лишается возможности навсегда повышать силу умений, но дарует на 50% больше временной силы умений."],"icon":"images/heroes/a_A0YP.png"},{"id":"A0YR","n":["蔓生","Overgrowth","Разрастание"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+3 / +1\n+2 / +0\n+6 / +3\n\n「物競天擇」初始命中 3 個目標。每當「物競天擇」命中所有目標時，可命中的目標數量便增加 1 個；若技能命中的目標數比目前上限少 1 個，則不套用此效果。若技能命中的目標數少了 2 個（或更多），累積效果將被重置。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+3 / +1\n+2 / +0\n+6 / +3\n\n\"Natural Selection\" initially hits 3 targets. Each time \"Natural Selection\" hits all of its targets, the number of targets it hits increases by 1. This effect does not apply if the ability hit 1 target fewer than its current limit. If the ability hit 2 targets fewer (or more), the accumulated effect is reset.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+3 / +1\n+2 / +0\n+6 / +3\n\nУмение \"Естественный отбор\" изначально поражает 3 цели. Каждый раз, когда \"Естественный отбор\" поражает все цели, количество поражаемых целей увеличивается на 1 ед., данный эффект не применяется, если умение поразило на 1 цель меньше своего текущего предела. Если умение поразило на 2 цели меньше (и больше), то накопительный эффект сбрасывается."],"icon":"images/heroes/a_A0YR.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["戰鬥力偏低，但能治療隊友並提升隊友的技能強度。","Low combat potential, but heals allies and raises their spell power.","Герой с низким боевым потенциалом, способный исцелять союзников и повышать силу умений героям."]},{"id":"E00A","n":["死靈法師","Necromancer","Некромаг"],"attr":"int","unlock":0,"random":true,"builds":[],"skins":[{"id":"Hdgo","on":true,"n":["墮落先知","Fallen Prophet","Падший пророк"]},{"id":"Hpal","on":false,"n":["高階死靈法師","High Necromancer","Высший некромант"]}],"author":null,"icon":"images/heroes/h_E00A.png","proper":"Мельхиор","st":{"str":16,"str_lv":2.0,"agi":22,"agi_lv":1.399999976158142,"int":20,"int_lv":2.799999952316284,"speed":320},"roles":[["召喚師","Summoner","призыватель"]],"sc":[["sp","as","armor","hp","mp"],[]],"mod":[],"sp":["A09V","A09M","A09N"],"ab":[{"id":"A09V","kind":"hero","n":["強化","Fortification","Укрепление"],"k":"E","lv":5,"t":["強化下一次使用的「召喚亡者」或「創造法師」技能。\n\n存活時間加成：15 秒（骷髏法師為 125% 效果）\n攻擊力加成：8 點（骷髏法師為 150% 效果）\n生命值加成：100 點（骷髏法師為 150% 效果）\n每 100 點技能強度的效果：存活時間 +5 秒、攻擊力 +5、生命值 +50 點\n\n冷卻：25 秒","Empowers the next use of the \"Raise Dead\" or \"Create Mage\" ability.\n\nLifetime bonus: 15 sec. (125% effect for the skeleton mage)\nAttack power bonus: 8 (150% effect for the skeleton mage)\nHealth bonus: 100 (150% effect for the skeleton mage)\nEffect per every 100 spell power: +5 sec. lifetime, +5 attack, +50 health\n\nCooldown: 25 sec.","Усиливает следующее использование умения \"Призыв мёртвых\" или умения \"Создать мага\".\n\nБонус к времени жизни: 15 сек. (125% эффект для скелета-мага)\nБонус к силе атаки: 8 ед. (150% эффект для скелета-мага)\nБонус к запасу здоровья: 100 ед. (150% эффект для скелета-мага)\nЭффект за каждые 100 силы умений: +5 сек. время жизни, +5 атаки, +50 ед. здоровья\n\nПерезарядка: 25 сек."],"icon":"images/heroes/a_A09V.png","lvt":[{"i":2,"v":["15","20","25","30","35"]},{"i":3,"v":["8","11","14","17","20"]},{"i":4,"v":["100","150","200","250","300"]}]},{"id":"A09R","kind":"hero","n":["狂亂","Frenzy","Исступление"],"k":"W","lv":5,"t":["清除骷髏身上的負面效果，並給予其攻擊速度加成，持續 10 秒。\n\n攻擊速度加成：40%\n\n冷卻：28 秒","Cleanses skeletons of negative effects and grants them an attack speed bonus for 10 sec.\n\nAttack speed bonus: 40%\n\nCooldown: 28 sec.","Очищает скелетов от негативных эффектов и дарует им бонус к скорости атаки на 10 сек.\n\nБонус к скорости атаки: 40%\n\nПерезарядка: 28 сек."],"icon":"images/heroes/a_A09R.png","lvt":[{"i":2,"v":["40","55","70","85","100"]}]},{"id":"A09M","kind":"hero","n":["召喚亡者","Raise Dead","Призыв мертвых"],"k":"Q","lv":5,"t":["英雄召喚一隊骷髏。\n\n骷髏數量：4（每 100 點技能強度 +1）個\n骷髏生命值：125 + （10% 英雄生命值）點\n骷髏攻擊力：9 + （30% 智力）點\n骷髏護甲：2 點\n骷髏存活時間：40 秒\n\n冷卻：15 秒","The hero summons a squad of skeletons.\n\nNumber of skeletons: 4 (+1 per every 100 spell power)\nSkeleton health: 125 + (10% of the hero's health)\nSkeleton attack power: 9 + (30% Intelligence)\nSkeleton armour: 2\nSkeleton lifetime: 40 sec.\n\nCooldown: 15 sec.","Герой призывает отряд скелетов.\n\nКоличество скелетов: 4 (+1 за каждые 100 силы умений) ед.\nЗапас здоровья скелетов: 125 + (10% запас здоровья героя) ед.\nСила атаки скелетов: 9 + (30% разум) ед.\nЗащита скелетов: 2 ед.\nВремя жизни скелетов: 40 сек.\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A09M.png","lvt":[{"i":3,"v":["125","175","225","275","325"]},{"i":4,"v":["9","12","15","18","21"]},{"i":5,"v":["2","3","4","5","6"]}]},{"id":"A09N","kind":"hero","n":["創造法師","Create Mage","Создать мага"],"k":"R","lv":1,"t":["英雄召喚一名骷髏法師，牠能夠召喚骷髏、引爆骷髏並燒盡敵人的法力值。\n\n骷髏法師生命值：英雄 max HP 的 100%\n骷髏攻擊力：英雄智力的 125%\n骷髏護甲：5 點\n骷髏存活時間：60 秒\n\n冷卻：70 秒","The hero summons a skeleton mage capable of summoning skeletons, detonating skeletons and burning enemies' mana.\n\nSkeleton mage health: 100% of the hero's max HP\nSkeleton attack power: 125% of the hero's Intelligence\nSkeleton armour: 5\nSkeleton lifetime: 60 sec.\n\nCooldown: 70 sec.","Герой призывает скелета-мага, способного призывать скелетов, подрывать скелетов и сжигать ману врагов.\n\nЗапас здоровья скелета-мага: 100% от max HP героя\nСила атаки скелета: 125% от разума героя\nЗащита скелета: 5 ед.\nВремя жизни скелета: 60 сек.\n\nПерезарядка: 70 сек."],"icon":"images/heroes/a_A09N.png"},{"id":"A0MK","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量階級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0MK.png","opts":[{"id":"A0Q4","n":["永恆侍奉","Eternal Service","Вечная служба"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+1 / +0\n+1 / +1\n\n創造一個區域，在其範圍內骷髏死亡時會召喚出新的骷髏。骷髏繼承技能「召喚亡者」（或其同類技能）的屬性。不會復活骷髏法師。\n\n復活骷髏的存在時間：15 + （1% 技能強度）秒\n骷髏召喚的冷卻：0.1 秒\n技能持續時間：20 秒\n\n冷卻：60 秒。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+1 / +0\n+1 / +1\n\nCreates a zone inside which the death of a skeleton summons a new skeleton. The skeletons inherit the attributes of the \"Raise Dead\" ability (or its equivalents). Does not revive skeleton mages.\n\nLifetime of the raised skeletons: 15 + (1% spell power) sec.\nCooldown of the skeleton summon: 0.1 sec.\nDuration of the ability: 20 sec.\n\nCooldown: 60 sec.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+1 / +0\n+1 / +1\n\nСоздаёт зону, внутри которой гибель скелета призывает нового скелета. Скелеты наследуют характеристики от умения \"Призвать мертвых\" (или его аналогов). Не возрождает скелетов-магов.\n\nВремя жизни восставших скелетов: 15 + (1% сила умений) сек.\nПерезарядка призыва скелетов: 0.1 сек.\nВремя действия способности: 20 сек.\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A0Q4.png"},{"id":"A0Q6","n":["亡者軍團","Legions of the Dead","Легионы мертвых"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +0\n+2 / +0\n+3 / +2\n\n英雄（或骷髏法師）每召喚一隻骷髏，技能強度便提升 0.10 點。\n\n技能「創造法師」每 400 點技能強度可額外召喚骷髏法師。\n\n技能「死亡契約」額外以 20% 機率對擊殺者敵人施加詛咒。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +0\n+2 / +0\n+3 / +2\n\nSpell power is increased by 0.10 for every skeleton summoned by the hero (or by a skeleton mage).\n\nThe \"Create Mage\" ability can summon additional skeleton mages for every 400 spell power.\n\nThe \"Death Pact\" ability additionally applies Curse to the killer enemies with a 20% chance.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +0\n+2 / +0\n+3 / +2\n\nСила умений повышается на 0.10 ед. за каждый призвыв героем (или скелетом-магом) скелета.\n\nУмение \"Создать мага\" может призывать дополнительных скелетов-магов за каждые 400 ед. силы умений.\n\nУмение \"Пакт смерти\" дополнительно применяет проклятие к врагам-убийцам с 20% шансом."],"icon":"images/heroes/a_A0Q6.png"}]},{"id":"A0O1","kind":"innate","n":["死亡契約","Death Pact","Пакт смерти"],"k":"","lv":null,"t":["英雄所控制的骷髏死亡時會回復 0.5% 的生命值與法力值，並有 50% 機率對擊殺它的敵人造成相當於英雄智力 100% 的傷害。","The death of skeletons controlled by the
