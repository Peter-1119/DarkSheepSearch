угих статусов на 50%"]]}},"statusRules":[{"n":["狀態傷害的增減","Status damage scaling","Изменение урона от статусов"],"lines":[["狀態傷害的增減機制與「攻擊與技能」分開計算。","Status damage scaling works separately from attacks and abilities.","Механизм изменения урона от статусов работает раздельно от атак и умений."],["所有「狀態傷害加成」與「狀態防護」會加總成單一乘數：減傷不能超過 80%，但超出的部分可以抵銷攻擊方的傷害加成。","All status damage bonuses and status protections combine into a single multiplier: damage reduction cannot exceed 80%, but any excess can offset the attacker's damage bonuses.","Все бонусы к урону и защите от статусов суммируются в единый множитель: снижение урона не может превышать 80%, но избыток может перекрыть бонусы к урону у атакующей цели."]]},{"n":["抗性","Resistances","Сопротивления"],"lines":[["fire resist（火焰抗性）—— 點燃與易燃的機率降低 75%","fire resist - burn and flammable chance lowered by 75%","fire resist - сопротивление поджогу и горючести, шанс ослаблен на 75%"],["cold resist（冰凍抗性）—— 冰凍機率降低 75%","cold resist - freeze chance lowered by 75%","cold resist - сопротивление заморозке, шанс ослаблен на 75%"],["bleed resist（流血抗性）—— 流血機率降低 75%","bleed resist - bleed chance lowered by 75%","bleed resist - сопротивление кровотечению, шанс ослаблен на 75%"],["curse resist（詛咒抗性）—— 易傷、虛弱、詛咒的機率降低 75%","curse resist - vulnerability, weakness and curse chance lowered by 75%","curse resist - сопротивление проклятиям, шанс получить уязвимость, слабость и проклятие ослаблены на 75%"],["plague（瘟疫狀態）—— 賦予疾病免疫；任何造成的傷害有 20% 機率施加疾病，該疾病造成所受傷害的 175%","plague - grants immunity to disease; any damage dealt has a 20% chance to apply disease dealing 175% of that damage","plague - состояние «Чумной», дарует иммунитет к болезни; любой наносимый урон с шансом 20% накладывает болезнь, наносящую 175% от нанесённого урона"]]}],"statusGraph":{"_說明":["狀態之間的相互關係，從各狀態的『與其他狀態的交互』整理出來，供關係圖使用。","chance = 提高「中招機率」；damage = 提高「受到的傷害」；每筆為 [來源, 目標, 百分比]。","resist = 各種抗性擋哪些狀態（機率 -75%，plague 為免疫）。"],"chance":[["vulnerable","burn",50],["vulnerable","flammable",50],["vulnerable","bleed",50],["vulnerable","disease",50],["vulnerable","freeze",50],["vulnerable","weakness",50],["vulnerable","curse",50],["flammable","burn",50]],"damage":[["shock","burn",100],["shock","bleed",100],["shock","disease",100],["flammable","burn",50],["weakness","bleed",50],["curse","disease",50]],"resist":[["fire resist",["burn","flammable"],-75],["cold resist",["freeze"],-75],["bleed resist",["bleed"],-75],["curse resist",["vulnerable","weakness","curse"],-75],["plague",["disease"],null]]},"builds":[{"id":"flash","c":"#FF7043","n":["易燃引信","Flashpoint","Точка воспламенения"],"key":["點燃是唯一沒壞的狀態加成，而易燃讓點燃總傷害直接翻倍","Burn is the only status bonus that actually works, and Flammable doubles its total damage","Поджог - единственный рабочий бонус к статусам, а горючесть удваивает его суммарный урон"],"why":["三件事疊在一起。第一，「流血傷害／疾病傷害 +X%」因為地圖把加成寫錯變數而失效，只有「點燃傷害 +X%」正常，這套把它堆到 +80%。第二，易燃讓點燃跳數從 16 變 32，總傷害直接翻倍（遊戲說明寫 +50%，程式碼實際是 +100%）。第三，熾熱核心與熔岩球都是在同一次觸發裡「先易燃、後點燃」，順序天生正確，兩件一起等於易燃幾乎全時段掛著。紅寶石權杖再把「點燃判定失敗」轉成 35% 機率的易燃，失手也在為下一次鋪路。裝甲護手是高頻引信（每 4 秒 75%），而且它的傷害吃滿裝備技能威力。","Three things stack. First, the \"+X% bleed/disease damage\" stats are wired to the wrong variable in the map and do nothing - only \"+X% burn damage\" works, and this build stacks it to +80%. Second, Flammable raises burn from 16 ticks to 32, doubling total damage (the in-game text says +50%; the code does +100%). Third, Molten Core and Lava Orb both apply Flammable and then Burn within the same proc, so the ordering is right for free and running both keeps Flammable up almost permanently. The Ruby Sceptre turns a failed burn roll into a 35% chance of Flammable, so even a miss sets up the next hit. Armored Gauntlet is the high-frequency igniter (75% every 4 s) and its damage scales fully with modifier power.","Складываются три вещи. Во-первых, «+X% урона от кровотечения/болезни» записаны не в ту переменную и не работают - действует только «+X% урона от поджога», здесь его +80%. Во-вторых, горючесть поднимает число тиков поджога с 16 до 32, удваивая суммарный урон (в описании +50%, в коде +100%). В-третьих, «Раскалённое ядро» и «Лавовый шар» в одном срабатывании накладывают сначала горючесть, потом поджог - двух предметов хватает, чтобы горючесть висела почти постоянно."],"items":["I06A","I067","I04G","silk","I01M","I0AJ"],"bonus":{"s1":"oli2","s2":"I0AV"}},{"id":"bleedflag","c":"#E05C7A","n":["血旗","Bleed as a Flag","Кровотечение как метка"],"key":["流血的傷害加成是壞的 —— 所以不要用它當傷害，要用它當「條件」","Bleed's damage bonus is broken - so don't use bleed for damage, use it as a condition","Бонус к урону от кровотечения не работает - используйте кровотечение как условие, а не как урон"],"why":["出發點是一個反直覺的結論：既然「流血傷害 +X%」失效，堆流血傷害就是浪費格子。但流血本身仍會正常掛上，所以它可以當成免費的狀態旗標。血之護腕就是為此存在的 —— 目標處於流血時，它的攻擊傷害提升 150%，而那是非狀態傷害，走另一條管線，完全不受 bug 影響。災妄之星每 3 秒 100% 上流血、失重毒刺 80%、巫師之災依目標法力比例施加，旗標幾乎永遠亮著。虛弱同理：它讓流血傷害 +50% 是走「抗性」那一側，沒壞；黑暗手套則對被你虛弱的目標直接打出 100% 敏捷。整套攻速 +77%、吸血 25%，續戰能力也夠。","This starts from a counter-intuitive conclusion: since \"+X% bleed damage\" is broken, stacking bleed damage wastes slots. But bleed still *applies* normally, so it works as a free status flag. Blood Bracer exists for exactly this - while the target bleeds its attacks deal +150%, and that is non-status damage on a different pipeline, untouched by the bug. Star of Calamity applies bleed at 100% every 3 s, Weightless Sting at 80%, and Wizard's Bane scales its chance off the target's mana, so the flag is almost always lit. Weakness works the same way: its +50% bleed damage goes through the resistance side and is not broken, and Dark Gloves deal 100% of Agility to anything you have Weakened. With +77% attack speed and 25% lifesteal the build also sustains.","Идея контринтуитивная: раз «+X% урона от кровотечения» не работает, набирать его бессмысленно. Но само кровотечение накладывается нормально, значит его можно использовать как метку. «Кровавый наруч» именно для этого: пока цель кровоточит, его атаки бьют на +150%, а это урон не от статусов - другой конвейер, баг его не затрагивает. «Звезда бедствия» даёт 100% кровотечения каждые 3 сек., «Невесомое жало» - 80%."],"items":["I085","grsl","I092","I044","infs","hlst"],"bonus":{"s1":"vddl","s2":"I05Z"}},{"id":"pierce","c":"#9BB3C9","n":["穿透直擊","Straight Through","Пробитие насквозь"],"key":["穿透是獨立一包傷害，完全不經過減傷係數 —— 對高減傷的目標無視一切","Penetration is a separate damage packet that never touches the reduction coefficient","Пробитие - отдельный пакет урона, который вообще не проходит через коэффициент защиты"],"why":["受傷結算會把雙方所有百分比加減成一個係數再乘一次，但穿透是在那之後「另外打一包」，所以不吃任何減傷、也不吃任何加成。對付堆滿減傷（上限 80%）的目標，這是唯一穩定的解。這套穿透合計 110 點，是全遊戲能堆到的極限之一。冰凍會讓目標受到的穿透 ×1.5，若目標是英雄而你又帶著復仇之手可到 ×2.0 —— 等效 220 點，每次攻擊都吃得到。寒冷之刃每 2 秒 50% 上冰凍負責維持，附魔之爪直接無視冰凍抗性。耶夢加得之戒的 -50% 攻擊速度看起來很重，但穿透是每次命中都結算的固定值，配合冰凍的倍率仍然划算；真的受不了可以換成毀滅之錘以外的攻速件。","Damage resolution folds every percentage from both sides into one coefficient and multiplies once - but Penetration is dealt afterwards as its own packet, so no reduction and no bonus touches it. Against a target stacked to the 80% reduction cap this is the only reliable answer. The build totals 110 Penetration, close to the ceiling. Freeze multiplies incoming Penetration by 1.5, and against a hero while you carry the Hand of Vengeance it reaches x2.0 - an effective 220 on every attack. Frost Blade keeps Freeze up (50% every 2 s) and Enchanted Claw ignores freeze resistance outright. Ring of Jormungandr's -50% attack speed looks brutal, but Penetration is a flat amount settled on every hit, so the freeze multiplier still pays for it.","При расчёте урона все проценты обеих сторон складываются в один коэффициент, но пробитие наносится после этого отдельным пакетом - его не трогают ни снижения, ни бонусы. Против цели у потолка в 80% снижения это единственный надёжный ответ. В сборке 110 пробития; заморозка умножает его на 1.5, а против героя с «Рукой возмездия» - до x2.0, то есть эффективные 220 при каждой атаке."],"items":["I01P","ankh","fgfh","I00R","I07G","pnvu"],"bonus":{"s1":"gvsm","s2":"I01S"}},{"id":"alpha","c":"#54C6EC","n":["開場斬首","Alpha Strike","Первый удар"],"key":["把三個「條件式」倍率疊在同一個瞬間：滿血 + 冰凍的第一下","Stack three conditional multipliers on the same instant: a full-health, frozen target's first hit","Три условных множителя в один момент: первый удар по замороженной цели на полном здоровье"],"why":["這套的數值表看起來很普通，因為力量全部藏在「條件加成」裡，不會顯示在總計。銀器對生命值 75% 以上的敵人給 +100% 非狀態傷害 —— 而且目標冰凍時門檻放寬到 50%，等於冰凍把有效窗口整整拉大一倍。附魔之爪對冰凍目標再 +20%，碎界對近戰 +15%，均衡者讓近戰英雄對近戰目標 +50%。因為地圖是加法制，這些全部相加：對一個冰凍的滿血近戰目標約 +185%，也就是 2.85 倍。爆裂之刃的 30% 機率雙倍傷害是這套唯一真正的乘法，期望值再 ×1.3。適合開場秒殺關鍵目標，不適合長時間纏鬥。","The stat sheet looks unremarkable because all the power sits in conditional bonuses that never show in the totals. Silverware grants +100% non-status damage against enemies above 75% health - and while the target is Frozen that threshold drops to 50%, effectively doubling the window. Enchanted Claw adds +20% against frozen targets, Collapse +15% versus melee, and Equaliser gives a melee hero +50% against melee targets. Because the map adds rather than multiplies, these all sum: roughly +185% against a frozen, full-health melee target, i.e. 2.85x. Explosive Blade's 30% chance of double damage is the one genuine multiplier, worth another x1.3 on average. Built to delete a key target on the opening burst, not to grind.","Таблица характеристик выглядит скромно, потому что вся сила спрятана в условных бонусах. «Серебро» даёт +100% урона не от статусов по врагам выше 75% здоровья, а при заморозке порог падает до 50%. «Зачарованный коготь» добавляет +20% по замороженным, «Коллапс» +15% по ближнему бою, «Уравнитель» - +50% ближнему герою против ближних целей. Всё складывается: около +185% по замороженной цели на полном здоровье."],"items":["hlst","I00A","I07G","I00R","skul","rej3"],"bonus":{"s1":"gvsm","s2":"I06Z"}},{"id":"static","c":"#F7E15C","n":["電擊壓制","Static Lock","Электрический захват"],"key":["電擊一次做三件事：狀態傷害 +100%、目標受傷 +20%、目標輸出 −30%","Shock does three things at once: +100% status damage, +20% damage taken, -30% damage dealt","Шок делает три вещи сразу: +100% урона от статусов, +20% получаемого, -30% наносимого"],"why":["大部分人只知道電擊放大狀態傷害，但原始碼裡 ShockUnit 一共動了六個欄位：四種狀態抗性各 −1.00（狀態傷害 +100%），還有目標的非狀態減傷 −0.20、造成傷害 −0.30。換句話說，掛上電擊等於同時讓對方更痛、更脆、更弱，而且全遊戲沒有任何一件裝備提供電擊抗性。雷霆之刃每 2 秒一次是全遊戲最高頻的電擊來源，風暴之錘再加 25% 機率（並算兩件風暴套裝），雷霆之主每 7 秒打 9 個目標把電擊鋪滿場面。碎界則把每一次電擊變成 125% 力量的魔法傷害，沒有冷卻。額外欄位的能量符文把電擊從 4 秒延長到 5 秒。注意：對英雄的電擊機率會砍半。","Most players only know Shock amplifies status damage, but ShockUnit touches six fields: all four status resistances at -1.00 (so +100% status damage), plus the target's non-status protection at -0.20 and its damage dealt at -0.30. Applying Shock makes the target hurt more, take more, and deal less at once - and no item in the game grants shock resistance. Thunder Blade fires every 2 s (the highest frequency in the game), Storm Hammer adds +25% chance and counts as two Storm set pieces, and Lord of Thunder hits 9 targets every 7 s to blanket a wave. Collapse turns every shock into 125% of your Strength as magic damage with no cooldown. Energy Rune in the bonus slot extends Shock from 4 s to 5 s. Note that shock chance is halved against heroes.","Обычно помнят только про усиление статусов, но ShockUnit меняет шесть полей: четыре сопротивления статусам по -1.00 (+100% урона), а также защиту цели не от статусов -0.20 и наносимый ею урон -0.30. И сопротивления шоку не даёт ни один предмет. «Клинок грома» срабатывает каждые 2 сек., «Штормовой молот» добавляет +25% шанса, «Коллапс» превращает каждый шок в 125% силы магическим уроном без перезарядки."],"items":["I0AM","I0AL","I096","rej3","anfg","I01M"],"bonus":{"s1":"oli2","s2":"I01Q"}},{"id":"drain","c":"#B48CE0","n":["雙重削弱","Double Debuff","Двойное ослабление"],"key":["電擊和詛咒各扣目標 20% 非狀態減傷，兩個一起 = 全隊對它的傷害 +40%","Shock and Curse each cut 20% of the target's non-status protection - together that is +40% for the whole team","Шок и проклятие снимают по 20% защиты цели - вместе это +40% урона от всей команды"],"why":["這是一套輔助向的配裝，自己的輸出不高，但能讓整隊的傷害都變高。關鍵在原始碼裡的兩行：ShockUnit 和 CurseUnit 都會把目標的 key4（非狀態減傷）扣 0.20。因為地圖是加法制，兩個一起掛就是 −0.40，等於那個目標受到的所有普攻與技能傷害 +40%，而且是對所有人生效，不只對你。再加上電擊讓它的輸出 −30%，坦克也更好活。詛咒法杖是主動、100% 範圍施加，不像詛咒者之弩需要裝備技能威力達 100% 才會補詛咒；撕裂末日每 2 秒 100% 上易傷，把所有狀態的施加機率再拉高 50%。腐化之冠負責範圍 300 的持續詛咒與疾病，補滿覆蓋率。","A support-shaped build: your own damage is modest, but everyone else's goes up. The key is two lines in the source - both ShockUnit and CurseUnit subtract 0.20 from the target's key4 (non-status protection). Since the map adds rather than multiplies, running both means -0.40, i.e. that target takes +40% from *all* attacks and abilities, for the whole team and not just you. Shock also cuts its damage output by 30%, which keeps your front line alive. Curse Staff is an active with a flat 100% area application, so unlike Curser's Crossbow it needs no modifier-power threshold. Doom's Tear applies Vulnerability at 100% every 2 s, raising every status chance by another 50%. Crown of Corruption covers a 300 radius with rolling curse and disease.","Сборка поддержки: собственный урон умеренный, но команда бьёт сильнее. Ключ - две строки в коде: ShockUnit и CurseUnit снимают по 0.20 с key4 цели (защита не от статусов). Сложение даёт -0.40, то есть цель получает +40% от всех атак и умений - от всей команды. Шок ещё и режет её урон на 30%."],"items":["I0AM","I07C","prvt","I09Y","I0AL","I0AB"],"bonus":{"s1":"oli2","s2":"I01L"}},{"id":"thorn","c":"#57D98A","n":["反傷風暴","Thornstorm","Шипованный шторм"],"key":["反傷是獨立管線，不吃減傷；易傷再讓它 ×1.5","Thorns is its own pipeline, untouched by reduction; Vulnerability multiplies it by 1.5","Шипы - отдельный конвейер; уязвимость умножает их на 1.5"],"why":["反傷完全不經過受傷結算的那個係數，所以對方堆多少減傷都沒用。公式是「反傷值 ×（1 + 反傷加成）」，這套實測 215 × 1.95 ≈ 419。接著易傷再乘 1.5 —— 那不是狀態機率的那一行，而是同一段說明裡常被漏看的另一行：身上有易傷的單位，受到的反傷 ×1.5。合計每次被攻擊回敬約 629。撕裂末日是這套的心臟：每 2 秒 100% 施加易傷，覆蓋率幾乎全時段。反傷完全不需要普攻、瞄準或走位，被打就會回擊，站著不動也在輸出。生命值 1225、護甲 41 讓它站得住。（若你有鐵匠做得出完美的復仇之盾，把英勇腰帶換掉可再多 +75% 反傷加成。）","Thorns never passes through the damage-reduction coefficient, so however much reduction the enemy stacks is irrelevant. The formula is thorns x (1 + thorns bonus); this build measures 215 x 1.95 = 419. Vulnerability then multiplies by 1.5 - not the status-chance line everyone quotes, but the other line in the same tooltip: a Vulnerable unit takes 1.5x thorns. That is roughly 629 returned per incoming hit. Doom's Tear is the heart of the build: Vulnerability at a flat 100% every 2 s, so uptime is nearly total. Thorns needs no attacks, aim or positioning - standing still is still damage, and 1225 health with 41 armour keeps you standing. (If you have a Blacksmith to craft the Perfected Shield of Vengeance, swapping out the Valour Belt adds another +75% thorns bonus.)","Ответный урон не проходит через коэффициент снижения, поэтому защита противника не важна. Формула: шипы x (1 + бонус); здесь 215 x 1.95 = 419. Уязвимость умножает ещё на 1.5 - это не строка про шанс статусов, а другая строка того же описания. Итого около 629 за каждый входящий удар. «Слеза рока» накладывает уязвимость каждые 2 сек. со 100% шансом."],"items":["I081","pnvl","I029","fwss","prvt","I00M"],"bonus":{"s1":"vddl","s2":"I01S"}},{"id":"arcane","c":"#7FD4C1","n":["雙層魔法","Two-Layer Arcana","Двухслойная магия"],"key":["全地圖唯一真正相乘的兩個數值：技能強度在括號內，裝備技能威力乘在括號外","The only genuinely multiplicative pair in the map: spell power inside the bracket, modifier power outside","Единственная по-настоящему умножающаяся пара: сила умений внутри скобок, сила модификаторов снаружи"],"why":["地圖裡幾乎所有百分比都是加法，唯一的例外就是這兩個。技能的傷害公式長這樣：（基礎值 + 技能強度 × 該技能係數）×（1 + 裝備技能威力 × 0.33）—— 技能強度加進括號裡，裝備技能威力乘在括號外，所以兩者會互相放大。這套把兩邊都推到極限：技能強度 +1760、裝備技能威力 +220%，技能倍率 1.726。星界耳環單件就 +800 技能強度，是全遊戲最高（但「耳環」類只能帶 1 件）；幽魂匕首單件 +100% 裝備技能威力，也是最高。大法師權杖除了 +200 技能強度與 +25% 威力，本身還每 0.75 秒對 700 範圍內隨機敵人打 125 點 —— 那是掛在道具上的原版技能，由引擎執行，所以在觸發器程式碼裡看不到。注意技能只吃 33% 的裝備技能威力（裝備觸發才吃滿），但因為乘在整個括號外面，對高技能強度的角色收益極大。","Almost every percentage in the map adds; these two are the exception. A skill's damage is (base + spell power x that skill's ratio) x (1 + modifier power x 0.33) - spell power goes inside the bracket, modifier power multiplies the whole thing, so they amplify each other. This build pushes both to the limit: +1760 spell power and +220% modifier power, for a x1.726 skill multiplier. Astral Earring alone gives +800 spell power, the highest in the game (though only one Earring may be carried); Wraith Dagger alone gives +100% modifier power, also the highest. Beyond its +200 spell power and +25% modifier power, the Archmage Staff also fires 125 damage at a random enemy within 700 range every 0.75 s - that is a stock Warcraft ability attached to the item and run by the engine, which is why it never appears in the trigger code. Skills only take 33% of modifier power (item procs take all of it), but because it multiplies the entire bracket the payoff on a high-spell-power hero is enormous.","Почти все проценты в карте складываются; эти два - исключение. Урон умения считается как (база + сила умений x коэффициент умения) x (1 + сила модификаторов x 0.33). Сборка доводит обе величины до предела: +1760 силы умений и +220% силы модификаторов, множитель умений x1.726. «Астральная серьга» одна даёт +800 силы умений - максимум в игре. «Посох архимага» вдобавок бьёт на 125 каждые 0.75 сек. по случайному врагу в радиусе 700 - это стандартное умение движка, поэтому его нет в коде триггеров."],"items":["I00E","sor5","kpin","fgrd","I017","I01M"],"bonus":{"s1":"oli2","s2":"I01L"}}],"heroes":[{"id":"N02E","n":["儀式師","Ritualist","Ритуалист"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[{"id":"Ntin","on":true,"n":["深淵戰士","Warrior of the Deep","Воитель глубин"]}],"author":null,"icon":"images/heroes/h_N02E.png","proper":"Мегера","st":{"str":18,"str_lv":1.5,"agi":23,"agi_lv":2.799999952316284,"int":16,"int_lv":2.0,"speed":null},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","hp","dbleed"],["bleed","freeze","curse"]],"mod":[],"sp":["A0AM","A0AK","A0AH","A0DW"],"ab":[{"id":"A0AM","kind":"hero","n":["海之靈","Sea Spirit","Морской дух"],"k":"W","lv":5,"t":["向指定敵人降下一隻海之靈，造成傷害並跳往鄰近的目標。海之靈造成傷害時會為英雄回復生命值，每次彈跳都會在技能持續期間提升自身的傷害。\n\n傷害：40 +（25% 技能強度）點\n治療：造成傷害的 40%\n每次彈跳的傷害提升：+10%\n最大目標數量：8\n「切口」效果：處於「切口」狀態的敵人會被優先選為目標，並以 100% 機率獲得「冰凍」狀態\n\n冷卻：20 秒","Sends a sea spirit at the target enemy that deals damage and jumps to nearby targets. When the spirit deals damage it restores health to the hero, and with each bounce it increases its own damage for the duration of the ability.\n\nDamage: 40 + (25% spell power)\nHealing: 40% of the damage dealt\nDamage increase per bounce: +10%\nMaximum targets: 8\n\"Incision\" effect: enemies under the \"Incision\" status are prioritised and receive the \"Freeze\" status with 100% chance\n\nCooldown: 20 sec.","Насылает на указанного врага морского духа, наносящего урон и переходящего на соседние цели. Дух при нанесении урона восстанавливает герою здоровье, а при каждом отскоке повышает свой урон на время действия умения.\n\nУрон: 40 + (25% сила умений) ед.\nИсцеление: 40% от нанесенного урона\nУвеличение урона при каждом отскоке: +10%\nМаксимальное количество целей: 8\nЭффект \"Надреза\": враги под статусом \"Надрез\" имеют приоритет и получают статус \"Заморозка\" с 100% шансом\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0AM.png","lvt":[{"i":2,"v":["40","60","80","100","120"]},{"i":5,"v":["8","9","10","11","12"]}]},{"id":"A0AK","kind":"hero","n":["懲戒之刃","Punishing Blade","Карающее лезвие"],"k":"Q","lv":5,"t":["對指定目標與其附近的敵人造成傷害。可能附加流血。處於「切口」效果下的敵人會受到強化的流血。\n\n傷害：60 +（20% 技能強度）點\n流血效果：75% 機率，150% 傷害\n「切口」下的流血效果：100% 機率，225% 傷害\n\n冷卻：9 秒","Deals damage to the target and to nearby enemies. Can apply Bleed. Enemies under \"Incision\" receive an empowered Bleed.\n\nDamage: 60 + (20% spell power)\nBleed effect: 75% chance, 150% damage\nBleed effect under \"Incision\": 100% chance, 225% damage\n\nCooldown: 9 sec.","Наносит урон указанной цели и врагам поблизости. Может наложить кровотечение. Враги под действием \"Надреза\" получают усиленное кровотечение.\n\nУрон: 60 + (20% сила умений) ед.\nЭффект кровотечения: 75% шанс, 150% урона\nЭффект кровотечения под \"Надрезом\": 100% шанс, 225% урона\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A0AK.png","lvt":[{"i":2,"v":["60","90","120","150","180"]}]},{"id":"A0AH","kind":"hero","n":["深淵恐懼","Terror of the Deep","Ужас глубин"],"k":"R","lv":1,"t":["英雄瞬間移動至指定地點，並造成範圍傷害。此技能會摧毀作用範圍內的觸手，同時為英雄回復生命值。\n\n傷害：100 + （150% 敏捷）+ （50% 技能強度）點\n觸手回復的生命值：每個觸手 10%\n「切口」效果：受擊目標受到的傷害提高 50%，並以 100% 機率獲得詛咒\n\n冷卻：60 秒。","The hero instantly teleports to the target location, dealing damage in an area. The ability destroys tentacles within its area of effect, restoring health to the hero in the process.\n\nDamage: 100 + (150% Agility) + (50% spell power)\nHealth restored from tentacles: 10% per tentacle\n\"Incision\" effect: affected targets take 50% more damage and receive Curse with 100% chance\n\nCooldown: 60 sec.","Герой мгновенно перемещается в указанное место, нанося урон по области. Умение уничтожает щупальца в области своего действия, восстанавливая при этом герою здоровье.\n\nУрон: 100 + (150% ловкость) + (50% сила умений) ед.\nВосстановление здоровья за щупальца: 10% за каждое щупальце\nЭффект от \"Надреза\": пораженные цели получают на 50% больше урона и получают проклятие с 100% шансом\n\nПерезарядка: 60 сек."],"icon":"images/heroes/a_A0AH.png"},{"id":"A0AF","kind":"hero","n":["觸手","Tentacles","Щупальца"],"k":"","lv":5,"t":["擊殺敵人時有小機率生成觸手，攻擊附近的敵人。\n\n觸手出現機率：20%\n觸手生命值：100 +（10% 英雄最大生命值）\n觸手攻擊力：10 +（30% 英雄敏捷）\n觸手存活時間：40 秒\n擊殺處於「切口」效果下的敵人：觸手的出現機率、生命值、攻擊力與存活時間 +50%","Kills of enemies have a small chance to create tentacles that attack nearby enemies.\n\nTentacle spawn chance: 20%\nTentacle health: 100 + (10% hero max HP)\nTentacle attack power: 10 + (30% hero Agility)\nTentacle lifetime: 40 sec.\nKilling an enemy under \"Incision\": +50% to the tentacle's spawn chance, health, attack power and lifetime","Убийства противников с небольшим шансом создают щупальца, атакующие врагов поблизости.\n\nШанс появления щупальца: 20%\nЗапас здоровья щупальца: 100 + (10% max HP героя)\nСила атаки щупальца: 10 + (30% ловкость героя)\nВремя жизни щупальца: 40 сек.\nУбийство врага под действием \"Надреза\": +50% усиление шанса появления, к здоровью, силе атаки и времени жизни щупальца"],"icon":"images/heroes/a_A0AF.png","lvt":[{"i":3,"v":["100","200","300","400","500"]},{"i":4,"v":["10","20","30","40","50"]}]},{"id":"A0DW","kind":"innate","n":["切口","Incision","Надрез"],"k":"D","lv":1,"t":["對指定目標與其附近的敵人造成少量傷害。所有被命中的目標會獲得「切口」狀態，此狀態會強化儀式師其他技能的效果。\n\n傷害：（50% 敏捷）+（25% 技能強度）點\n「切口」持續時間：10 秒\n\n冷卻：5 秒","Deals a small amount of damage to the target and to nearby enemies. All affected targets receive the \"Incision\" status, which empowers the effects of the Ritualist's other abilities.\n\nDamage: (50% Agility) + (25% spell power)\n\"Incision\" duration: 10 sec.\n\nCooldown: 5 sec.","Наносит небольшой урон указанной цели и врагам поблизости. Все пораженные цели получают статус \"Надрез\", который будет усиливать эффект других умений ритуалиста.\n\nУрон: (50% ловкость) + (25% сила умений) ед.\nВремя действия \"Надреза\": 10 сек.\n\nПерезарядка: 5 сек."],"icon":"images/heroes/a_A0DW.png"},{"id":"A09L","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A09L.png","opts":[{"id":"A0A8","n":["古神的贈禮","Gifts of the Old Gods","Дары Старых Богов"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+2 / +1\n+0 / +0\n\n擊殺處於「切口」效果下的敵人，以獲得「儀式」類別的物品。\n\n所需擊殺數：8 (+2)\n可獲得的物品數量：11\n\n指令「-i」會顯示擊殺進度。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+2 / +1\n+0 / +0\n\nKill enemies affected by \"Incision\" to obtain items of the \"Ritual\" category.\n\nKills required: 8 (+2)\nItems available to obtain: 11\n\nThe \"-i\" command displays the kill progress.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+2 / +1\n+0 / +0\n\nУбивайте врагов под действием \"Надреза\", чтобы получать предметы категории \"Ритуальный\".\n\nТребуется убийств: 8 (+2)\nДоступно предметов для получения: 11\n\nКоманда \"-i\" отобразит прогресс по убийствам."],"icon":"images/heroes/a_A0A8.png"},{"id":"A0U1","n":["黑水之刃","Blade of Dark Waters","Лезвие тёмных вод"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +0\n+3 / +2\n+1 / +0\n\n「切口」會額外以 100% 機率對敵人施加「虛弱」狀態。\n\n為「懲戒之刃」的傷害加上 100% 敏捷。\n\n擊殺處於「切口」效果下的敵方英雄，可使英雄的力量與敏捷提高 1 點。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +0\n+3 / +2\n+1 / +0\n\n\"Incision\" additionally applies the \"Weakness\" status to enemies with 100% chance.\n\nAdds 100% of Agility to the damage of \"Punishing Blade\".\n\nKilling enemy heroes affected by \"Incision\" increases the hero's Strength and Agility by 1.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +0\n+3 / +2\n+1 / +0\n\nУмение \"Надрез\" дополнительно применяет к врагам статус \"Слабость\" с 100% шансом.\n\nДобавляет 100% ловкости к урону умения \"Карающее лезвие\".\n\nУбийство вражеских героев под действием \"Надреза\" повышает силу и ловкость героя на 1 ед."],"icon":"images/heroes/a_A0U1.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["低","Low","низкий"],"d":["近戰刺客，需要按順序連續施放技能才能發揮。","A melee assassin who needs her abilities cast in the right order to perform.","Убийца ближнего боя, требующая последовательного применения способностей для эффективной игры."]},{"id":"Nbrn","n":["女武神","Valkyrie","Валькирия"],"attr":"agi","unlock":0,"random":false,"builds":[],"skins":[],"author":"ivanlipskiy008","icon":"images/heroes/h_Nbrn.png","proper":"Артемис","st":{"str":12,"str_lv":1.2999999523162842,"agi":24,"agi_lv":4.0,"int":20,"int_lv":null,"speed":null},"roles":[["刺客","Assassin","убийца"]],"sc":[["armor"],["vuln"]],"mod":[],"sp":[],"ab":[{"id":"A07H","kind":"hero","n":["貫穿之光","Piercing Light","Пронзающий свет"],"k":"Q","lv":5,"t":["重置「星光閃耀」的冷卻，並強化下一次「閃耀」，移除其範圍傷害，但大幅提升單體傷害。\n\n「星光閃耀」的懲罰：不造成範圍傷害\n單體傷害提升：+60%\n附加條件：處於「易傷」效果下的目標會受到「星光閃耀」的純粹傷害\n\n冷卻：3 秒","Refreshes the \"Starlight Flare\" ability and empowers the next pulse of the \"flare\", removing its area damage but greatly increasing its single-target damage.\n\n\"Starlight Flare\" penalty: deals no area damage\nSingle-target damage increase: +60%\nAdditional condition: a target under Vulnerability takes pure damage from \"Starlight Flare\"\n\nCooldown: 3 sec.","Перезаряжает умение \"Звёздный блик\" и усиливает следующий такт \"блика\", удаляя урон по области, но значительно усиливая урон по одиночной цели.\n\nШтраф для \"Звёздного блика\": не наносит урон по области\nУвеличение урона по одиночной цели: +60%\nДополнительное условие: цель под действием \"уязвимости\" получит чистый урон от \"Звёздного блика\"\n\nПерезарядка: 3 сек."],"icon":"images/heroes/a_A07H.png","lvt":[{"i":3,"v":["60","90","120","150","180"]}]},{"id":"A0BD","kind":"hero","n":["散射之光","Scattered Light","Рассеянный свет"],"k":"Q","lv":5,"t":["重置「星光閃耀」的冷卻，並強化下一次「閃耀」，降低對主要目標的傷害並提升範圍傷害。\n\n「星光閃耀」的懲罰：主要目標受到與範圍傷害相同的傷害\n範圍傷害提升：+30%\n作用範圍提升：+15%\n額外範圍效果：20% 機率對敵人施加「易傷」狀態\n\n冷卻：3 秒","Refreshes the \"Starlight Flare\" ability and empowers the next pulse of the \"flare\", reducing the damage to the primary target and increasing the area damage.\n\n\"Starlight Flare\" penalty: the primary target takes damage equal to the area damage\nArea damage increase: +30%\nArea increase: +15%\nAdditional area effect: 20% chance to apply the Vulnerability status to enemies\n\nCooldown: 3 sec.","Перезаряжает умение \"Звёздный блик\" и усиливает следующий такт \"блика\", снижая урон по основной цели и усиливая урон по области.\n\nШтраф для \"Звёздного блика\": основная цель получает урон, равный урону по области\nУвеличение урона по области: +30%\nУвеличение области действия: +15%\nДополнительный эффект по области: 20% шанс применить на врагов статус \"уязвимость\"\n\nПерезарядка: 3 сек."],"icon":"images/heroes/a_A0BD.png","lvt":[{"i":3,"v":["30","45","60","75","90"]},{"i":4,"v":["15","20","25","30","35"]},{"i":5,"v":["20","40","60","80","100"]}]},{"id":"A0AB","kind":"hero","n":["星光閃耀","Starglint","Звёздный блик"],"k":"","lv":5,"t":["女武神的攻擊會對目標與目標周圍的敵人造成額外物理傷害。若此技能擊殺目標，英雄有 50% 機率使自身敏捷提升 1 點。\n\n傷害：對目標（120% 敏捷）點；附近的敵人受到 50% 的傷害\n\n冷卻：5 秒","The Valkyrie's attack deals additional physical damage to the target and to enemies around the target. If the ability kills the target, the hero has a 50% chance to increase her Agility by 1.\n\nDamage: (120% Agility) to the target; 50% of the damage is dealt to nearby enemies\n\nCooldown: 5 sec.","Атака валькирии наносит дополнительный физический урон цели и врагам вокруг цели. Если умение убивает цель, герой с шансом 50% повышает свою ловкость на 1 ед.\n\nУрон: (120% ловкость) ед. цели; 50% урона наносится врагам поблизости\n\nПерезарядка: 5 сек."],"icon":"images/heroes/a_A0AB.png","lvt":[{"i":2,"v":["120","160","200","240","280"]}]},{"id":"A0AL","kind":"hero","n":["流星","Falling Star","Падающая звезда"],"k":"","lv":null,"t":["「星光閃耀」技能有機率召喚一顆流星，造成額外的範圍傷害並永久降低被擊中敵人的護甲。\n\n一般星光閃耀：50% 機率，星光閃耀傷害的 75%，範圍 250 點，護甲降低 2 點\n處於「貫穿之光」效果下：100% 機率，星光閃耀傷害的 50%，範圍 150 點，護甲降低 5 點\n處於「散射之光」效果下：50% 機率，星光閃耀傷害的 75%，範圍等同於提升後的星光閃耀範圍，護甲降低 2 點","The \"Star Glimmer\" ability has a chance to call down a falling star that deals additional area damage and permanently reduces the armour of the enemies hit.\n\nNormal Star Glimmer: 50% chance, 75% of Star Glimmer damage, 250 area, 2 armour reduction\nUnder \"Piercing Light\": 100% chance, 50% of Star Glimmer damage, 150 area, 5 armour reduction\nUnder \"Scattered Light\": 50% chance, 75% of Star Glimmer damage, area equal to the increased Star Glimmer area, 2 armour reduction","Умение \"Звёздный блик\" может с шансом вызвать падающую звезду, наносящую дополнительный урон по области и навсегда снижающую защиту пораженных врагов.\n\nОбычный звёздный блик: 50% шанс, 75% от урона звёздного блика, область 250 ед., снижение защиты на 2 ед.\nПод эффектом \"Пронзающего света\": 100% шанс, 50% от урона звёздного блика, область 150 ед., снижение защиты на 5 ед.\nПод эффектом \"Рассеянного света\": 50% шанс, 75% от урона звёздного блика, область равна увеличенной области звёздного блика, снижение защиты на 2 ед."],"icon":"images/heroes/a_A0AL.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A064","kind":"innate","n":["純血","Pure Blood","Чистокровность"],"k":"","lv":null,"t":["造成傷害的狀態在英雄身上的持續時間減少 50%。","Damaging status effects last 50% less time on the hero.","Эффекты наносящих урон состояний длятся на герое на 50% меньше времени."],"icon":"images/heroes/a_A064.png"}],"tier":["T3+","T3+","Т3+"],"late":["極高","Top","высший"],"d":["遠程英雄，能對單體與集群穩定輸出魔法傷害，並可持續累積敏捷。","A ranged hero with steady magic damage against both \n\nAn enemy hero under the mark who is killed by the Huntress grants 2 times more bonus from \"Barbed Arrows\".","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+4 / +2\n+1 / +0\n\nУмение \"Метка охотника\" действует на 75% эффективнее, но требует на 50% больше маны. Также \"Метка охотника\" дополнительно поражает врагов рядом с целью, накладывая на них базовую неусиленную версию метки.\n\nВражеский герой под действием метки, убитый охотницей, дарует в 2 раза больше бонусов от умения \"Зазубренные стрелы\"."],"icon":"images/heroes/a_A0RS.png"}]}],"tier":["T1","T1","Т1"],"late":["高","High","высокий"],"d":["遠程英雄，擅長消滅單一目標，可短時間大幅提高攻擊速度。","A ranged hero who excels at deleting single targets and can briefly spike her attack speed.","Герой дальнего боя, способная эффективно уничтожать одиночные цели. Может на короткое время стрелять срау по нескольким целям."]},{"id":"N01P","n":["幽魂之狼","Spirit Wolf","Призрачный волк"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_N01P.png","proper":"Фенрир","st":{"str":16,"str_lv":2.200000047683716,"agi":19,"agi_lv":2.5,"int":14,"int_lv":1.5,"speed":400},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","dbleed"],["bleed"]],"mod":[],"sp":["A08P","A08A"],"ab":[{"id":"A08P","kind":"hero","n":["吞噬","Devour","Пожирание"],"k":"Q","lv":5,"t":["英雄可以吞食 0-1 等級的敵人來治療自身，並為「深度創傷」技能取得額外充能。對更強大的目標使用此技能時，狼會造成傷害並取得較少的額外充能。\n\n治療強度：100 + （75% 技能強度）點\n對強大敵人的傷害：75 + （60% 技能強度）點\n額外充能：1\n吞食目標時的額外充能：3\n\n冷卻：15 秒。","The hero can devour an enemy of level 0-1 to heal himself and gain bonus charges for the \"Deep Wounds\" ability. When the ability is used against stronger targets, the wolf deals damage and gains fewer bonus charges.\n\nHealing power: 100 + (75% spell power)\nDamage against strong enemies: 75 + (60% spell power)\nBonus charges: 1\nBonus charges when the target is devoured: 3\n\nCooldown: 15 sec.","Герой может съесть противника 0-1 уровня для исцеления ":["20","25","30","35","40"]}]},{"id":"A03A","kind":"hero","n":["開膛","Eviscerate","Потрошение"],"k":"E","lv":5,"t":["英雄開始瘋狂攻擊指定的敵人。技能持續期間無法對英雄下達命令，目標則會被暈眩。每一次攻擊都有小機率附加流血。\n\n總傷害：200 +（100% 技能強度）點\n每次攻擊的流血：20% 機率，100% 傷害\n持續時間：3 秒\n\n冷卻：18 秒","The hero begins to attack the target enemy furiously. While the ability is active the hero cannot be given orders, and the target is stunned. Each hit has a small chance to apply Bleed.\n\nTotal damage: 200 + (100% spell power)\nBleed from each hit: 20% chance, 100% damage\nDuration: 3 sec.\n\nCooldown: 18 sec.","Герой начинает неистово атаковать указанного врага. Во время действия умения герою нельзя будет отдать приказ, а цель будет оглушена. Каждый удар может с небольшим шансом наложить кровотечение.\n\nСуммарный урон: 200 + (100% сила умений) ед.\nКровотечение от каждого удара: 20% шанс, 100% урона\nВремя действия: 3 сек.\n\nПерезарядка: 18 сек."],"icon":"images/heroes/a_A03A.png","lvt":[{"i":2,"v":["200","350","500","650","800"]}]},{"id":"A03C","kind":"hero","n":["致命性","Lethality","Смертоносность"],"k":"","lv":null,"t":["英雄的攻擊對生命值 50% 以上的敵人可能造成提高的物理傷害。可對目標施加流血。\n\n額外傷害：25 + （10% 技能強度）+ （25% 敏捷）點\n流血效果：100% 機率，150% 傷害\n\n效果冷卻：0.5 秒","The hero's attack can deal increased physical damage against an enemy at 50% health or above. Can apply Bleed to the target.\n\nBonus damage: 25 + (10% spell power) + (25% Agility)\nBleed effect: 100% chance, 150% damage\n\nEffect cooldown: 0.5 sec.","Атака героя может нанести увеличенный физический урон против противника с уровнем здоровья 50% и выше. Может применить кровотечение к цели.\n\nБонусный урон: 25 + (10% сила умений) + (25% ловкость) ед.\nЭффект кровотечения: 100% шанс, 150% урон\n\nПерезарядка эффекта: 0.5 сек."],"icon":"images/heroes/a_A03C.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0I2","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量階級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0I2.png","opts":[{"id":"A0I5","n":["屠夫","Butcher","Мясник"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+2 / +1\n+0 / +0\n\n在技能「開膛」持續期間，英雄獲得 50% 傷害減免，每擊殺一名敵人便使技能「開膛」的總傷害提升 2.5 點。\n\n指令「-i」會顯示計入技能等級與技能強度後的「開膛」傷害。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+2 / +1\n+0 / +0\n\nWhile the \"Eviscerate\" ability is active the hero gains 50% protection from damage, and each enemy kill increases the total damage of the \"Eviscerate\" ability by 2.5.\n\nThe \"-i\" command displays the damage of \"Eviscerate\" taking the ability level and spell power into account.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+2 / +1\n+0 / +0\n\nВо время действия умения \"Потрошение\" герой получает 50% защиты от урона, каждое убийство противника повышает общий урон умения \"Потрошение\" на 2.5 ед.\n\nКоманда \"-i\" отобразит урон \"Потрошения\" с учетом уровня умения и силы умений."],"icon":"images/heroes/a_A0I5.png"},{"id":"A0I7","n":["毀滅者之刃","Blades of the Destroyer","Клинки губителя"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+3 / +1\n+4 / +2\n+1 / +0\n\n英雄獲得「瘟疫」狀態。\n\n技能「致命性」不再施加流血，改為以 100% 機率施加「疾病」狀態，且傷害更高（350% 傷害，取代流血的 150%）。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+3 / +1\n+4 / +2\n+1 / +0\n\nThe hero gains the \"Plagued\" state.\n\nThe \"Lethality\" ability now applies the \"Disease\" status instead of Bleed, with a 100% chance and higher damage (350% damage instead of the 150% from Bleed).","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+3 / +1\n+4 / +2\n+1 / +0\n\nГерой получает состояние \"Чумной\".\n\nУмение \"Смертоносность\" вместо кровотечения теперь накладывает статус \"Болезнь\" с 100% шансом и более высоким уроном (350% урона вместо 150% от кровотечения)."],"icon":"images/heroes/a_A0I7.png"}]},{"id":"A038","kind":"innate","n":["撤離","Withdrawal","Отход"],"k":"Z","lv":1,"t":["英雄進入隱形狀態並開始回復生命值。\n\n生命值回復：每秒 3%\n持續時間：10 秒\n\n冷卻：20 秒","The hero becomes invisible and begins to regenerate health.\n\nHealth regeneration: 3% per sec.\nDuration: 10 sec.\n\nCooldown: 20 sec.","Герой становится невидимым и начинает регенерировать здоровье.\n\nРегенерация здоровья: 3% в сек.\nВремя действия: 10 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A038.png"}],"tier":["T1","T1","Т1"],"late":["高","High","высокий"],"d":["危險的近戰英雄，對單一目標效率極高；學習高階天賦後更強。","A dangerous melee hero, highly effective against single targets and stronger with advanced talents.","Опасный герой ближнего боя, эффективный против одиночных целей. При изучении талантов более высокого ранга способен накапливать наносимый урон."]},{"id":"Edem","n":["惡魔獵手","Demon Hunter","Охотник на демонов"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[{"id":"Eevi","on":true,"n":["黑曜石獵手","Obsidian Hunter","Обсидиановый охотник"]},{"id":"Emns","on":false,"n":["赤紅刺客","Scarlet Assassin","Алая убийца"]}],"author":null,"icon":"images/heroes/h_Edem.png","proper":"Бельджар","st":{"str":null,"str_lv":2.0,"agi":null,"agi_lv":2.4000000953674316,"int":null,"int_lv":1.5,"speed":null},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","armor","dburn"],["burn"]],"mod":["A04T"],"sp":["A04X"],"ab":[{"id":"A04X","kind":"hero","n":["燃燒之刃","Burning Blades","Горящие клинки"],"k":"Q","lv":5,"t":["獲得強化，期間攻擊會造成額外的範圍傷害，並有小機率點燃敵人。\n\n範圍傷害：20 +（8% 技能強度）點\n點燃效果：20% 機率，60% 傷害\n持續時間：12 秒\n\n冷卻：20 秒","Gains an empowerment during which attacks deal additional area damage and Burn enemies with a small chance.\n\nArea damage: 20 + (8% spell power)\nBurn effect: 20% chance, 60% damage\nDuration: 12 sec.\n\nCooldown: 20 sec.","Получает усиление, во время которого атаки наносят дополнительный урон по области и поджигают врагов с небольшим шансом.\n\nУрон по области: 20 + (8% сила умений) ед.\nЭффект поджога: 20% шанс, 60% урона\nВремя действия: 12 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A04X.png","lvt":[{"i":2,"v":["20","30","40","50","60"]},{"i":3,"v":["60","70","80","90","100"]}]},{"id":"A04V","kind":"hero","n":["致命一擊","Deadly Strike","Смертельный удар"],"k":"","lv":5,"t":["英雄的攻擊有機率造成提高的傷害。\n\n機率：20%\n傷害：150%","The hero's attacks have a chance to deal increased damage.\n\nChance: 20%\nDamage: 150%","Атаки героя имеют шанс нанести увеличенный урон.\n\nШанс: 20%\nУрон: 150%"],"icon":"images/heroes/a_A04V.png","lvt":[{"i":3,"v":["150","200","250","300","350"]}]},{"id":"A04T","kind":"hero","n":["著魔","Obsession","Одержимость"],"k":"R","lv":1,"t":["英雄暫時獲得敏捷加成與強力的魔法抗性。\n\n敏捷加成：+100%\n魔法抗性：70%\n持續時間：20 秒\n\n冷卻：80 秒","The hero temporarily gains an Agility bonus and strong magic resistance.\n\nAgility bonus: +100%\nMagic resistance: 70%\nDuration: 20 sec.\n\nCooldown: 80 sec.","Герой временно обретает бонус к ловкости и сильную защиту от магии.\n\nБонус к ловкости: +100%\nЗащита от магии: 70%\nВремя действия: 20 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A04T.png"},{"id":"A04O","kind":"hero","n":["幻象","Illusion","Иллюзия"],"k":"W","lv":5,"t":["英雄創造 2 個幻象分身。\n\n分身造成傷害：30%\n分身受到傷害：180%\n持續時間：30 秒\n\n冷卻：30 秒","The hero creates 2 illusory duplicates.\n\nDuplicates deal damage: 30%\nDuplicates take damage: 180%\nDuration: 30 sec.\n\nCooldown: 30 sec.","Герой создает 2 иллюзорных двойников.\n\nДвойники наносят урон:30%\nДвойники получают урон:180%\nВремя действия:30 сек.\n\nПерезарядка:30 сек."],"icon":"images/heroes/a_A04O.png","lvt":[{"i":2,"v":["30","40","50","60","70"]},{"i":3,"v":["180","170","160","150","140"]}]},{"id":"A04W","kind":"innate","n":["貪得無厭","Insatiability","Ненасытность"],"k":"","lv":null,"t":["每次擊殺會為英雄回復 1% 的已失去生命值。","Kills restore 1% of the hero's missing health.","Убийства восстанавливают герою по 1% от недостающего здоровья."],"icon":"images/heroes/a_A04W.png"},{"id":"A0RV","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的力量位階。","With enough player experience points you can choose a talent that will significantly strengthen the hero up to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0RV.png","opts":[{"id":"A0RX","n":["虛空之刃","Void Blades","Пустотные клинки"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+1 / +1\n+1 / +0\n\n技能「燃燒之刃」失去點燃效果。擊殺敵人可使技能「燃燒之刃」的作用範圍提升 1 點。累積 200 次擊殺後，累積效果減弱為 0.5 點。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+1 / +1\n+1 / +0\n\nThe \"Burning Blades\" ability loses its Burn effect. Killing enemies increases the area of the \"Burning Blades\" ability by 1. After 200 kills the accumulation weakens to 0.5.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+1 / +1\n+1 / +0\n\nУмение \"Горящие клинки\" утрачивает эффект поджога. Убийства врагов повышают область поражения умения \"Горящие клинки\" на 1 ед. После 200 убийств накопительный эффект ослабляется до 0.5 ед."],"icon":"images/heroes/a_A0RX.png"},{"id":"A0YG","n":["精湛劍術","Masterful Fencing","Искусное фехтование"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+2 / +1\n+3 / +1\n+1 / +0\n\n英雄獲得 15% 攻擊閃避與 -20% 裝備技能冷卻。\n\n技能「燃燒之刃」現在會額外以 30% 機率對敵人施加易傷。\n\n技能「著魔」在持續期間會將閃避提升至 30%，額外降低 20% 裝備技能冷卻，並增加 +40% 裝備技能威力。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+2 / +1\n+3 / +1\n+1 / +0\n\nThe hero gains 15% evasion from attacks and -20% modifier cooldown.\n\nThe \"Burning Blades\" ability now additionally applies Vulnerability to enemies with a 30% chance.\n\nWhile the \"Obsession\" ability is active it raises evasion to 30%, additionally reduces modifier cooldown by 20% and adds +40% modifier power.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+2 / +1\n+3 / +1\n+1 / +0\n\nГерой получает 15% уклонение от атак и -20% перезарядки модификаторов.\n\nУмение \"Горящие клинки\" теперь дополнительно применяет к врагам уязвимость с 30% шансом.\n\nУмение \"Одержимость\" во время своего действия усиливает уклонение до 30%, дополнительно снижает перезарядку модификаторов на 20% и добавляет +40% к силе модификаторов."],"icon":"images/heroes/a_A0YG.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T1","T1","Т1"],"late":["高","High","высокий"],"d":["容易上手的近戰刺客。","A melee assassin that is easy to learn.","Простой в освоении убийца ближнего боя."]},{"id":"O015","n":["暗影獵手","Shadow Hunter","Ловец теней"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_O015.png","proper":"Масакри","st":{"str":null,"str_lv":null,"agi":22,"agi_lv":2.5,"int":19,"int_lv":1.7999999523162842,"speed":null},"roles":[["刺客","Assassin","убийца"],["召喚師","Summoner","призыватель"]],"sc":[["sp","as","hp","mp","pen"],["vuln"]],"mod":[],"sp":["A0B0"],"ab":[{"id":"A0B4","kind":"hero","n":["最後迴響","Last Echo","Последнее эхо"],"k":"","lv":5,"t":["延長英雄所創造之暗影的存活時間，並提升其攻擊速度。不會強化英雄的暗影分身。\n\n存活時間延長：+30%\n攻擊速度提升：10%","Extends the lifetime of the shadows created by the hero and increases their attack speed. Does not empower the hero's shadow clone.\n\nLifetime extension: +30%\nAttack speed increase: 10%","Продлевает жизнь создаваемых героем теней и повышает их скорость атаки. Не усиливает теневого клона героя.\n\nПродление жизни: +30%\nПовышение скорости атаки: 10%"],"icon":"images/heroes/a_A0B4.png","lvt":[{"i":2,"v":["30","45","60","75","90"]},{"i":3,"v":["10","20","30","40","50"]}]},{"id":"A0B3","kind":"hero","n":["精神強化","Spirit Empowerment","Усиление духа"],"k":"W","lv":5,"t":["提升英雄的攻擊速度與移動速度，並在使用期間逐漸消耗法力值。技能持續期間，創造暗影的機率也會提升。持續時間 - 10 秒。\n\n移動速度提升：20%\n攻擊速度提升：40%\n暗影創造機率提升：+5%\n法力消耗：7 點／秒\n\n冷卻：22 秒","Increases the hero's attack speed and movement speed, and gradually consumes mana while in use. The chance to create a shadow is also increased while the ability is active. Duration - 10 sec.\n\nMovement speed increase: 20%\nAttack speed increase: 40%\nShadow creation chance increase: +5%\nMana cost: 7 per sec.\n\nCooldown: 22 sec.","Повышает скорость атаки и передвижения героя и постепенно потребляет ману за применение. Также во время действия умения повышается шанс создать тень. Время действия - 10 сек.\n\nУвеличение скорости передвижения: 20%\nУвеличение скорости атаки: 40%\nУвеличение шанса создания теней: +5%\nПотребление маны: 7 ед./сек.\n\nПерезарядка: 22 сек."],"icon":"images/heroes/a_A0B3.png","lvt":[{"i":2,"v":["20","25","30","35","40"]},{"i":3,"v":["40","55","70","85","100"]},{"i":4,"v":["5","7","9","11","13"]},{"i":5,"v":["7","8","9","10","11"]}]},{"id":"A0B2","kind":"hero","n":["暗影分身","Shadow Clone","Теневой клон"],"k":"R","lv":1,"t":["英雄形成自身的暗影，其與本體幾乎完全相同。暗影無敵，繼承英雄的等級與屬性，並可使用英雄的基礎技能。暗影不會繼承英雄的裝備，但可以繼承來自裝備與其他技能的屬性加成。\n\n暗影存在時間：25 秒。\n\n冷卻：80 秒。","The hero forms his own shadow, which is practically identical to its master. The shadow is invulnerable, inherits the hero's level and attributes and can use the hero's basic abilities. The shadow does not inherit the hero's items, but it can inherit bonus attributes from items and other abilities.\n\nShadow lifetime: 25 sec.\n\nCooldown: 80 sec.","Герой формирует собственную тень, которая имеет практически полную идентичность со своим хозяином. Тень неуязвима, наследует уровень и характеристики героя и может использовать базовые способности героя. Тень не наследует предметы героя, но может унаследовать бонусные характеристики от предметов и прочих умений.\n\nВремя жизни тени: 25 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0B2.png"},{"id":"A0B0","kind":"hero","n":["暗影法球","Orb of Shadows","Сфера теней"],"k":"Q","lv":5,"t":["在指定地點創造一顆法球，對附近隨機的敵人造成傷害。對建築無效。可獲得雙倍的穿透效果。\n\n傷害：12 +（7% 技能強度）點\n傷害觸發間隔：每 0.25 秒\n法球存在時間：7 秒\n\n冷卻：9 秒","Creates an orb at the target point that deals damage to random nearby enemies. Does not affect buildings. Inherits a doubled effect from penetration.\n\nDamage: 12 + (7% spell power)\nDamage interval: every 0.25 sec.\nOrb lifetime: 7 sec.\n\nCooldown: 9 sec.","Создает в указанной точке сферу, наносящую урон случайным противникам поблизости. Не действует против строений. Наследует двойной эффект от пробития.\n\nУрон: 12 + (7% сила умений) ед.\nПериодичность урона: каждые 0.25 сек.\nВремя жизни сферы: 7 сек.\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A0B0.png","lvt":[{"i":2,"v":["12","18","24","30","36"]}]},{"id":"A0OJ","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0OJ.png","opts":[{"id":"A0ON","n":["暗影汲取","Shadow Absorption","Поглощение теней"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+2 / +1\n+2 / +0\n\n暗影消失時會為英雄各回復 2% 生命值與法力值，並使暗影法球的傷害提升 0.5 點。法球傷害加成的進度可透過指令「-i」查看。\n\n技能「暗影分身」遵循相同的條件，但會回復英雄 10% 生命值與法力值，並使法球傷害提升 2.5 點。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+2 / +1\n+2 / +0\n\nThe disappearance of shadows restores 2% of health and mana to the hero and increases the damage of the Orb of Shadows by 0.5. The progress of the orb's damage bonus can be tracked with the \"-i\" command.\n\nThe \"Shadow Clone\" ability follows the same conditions, but restores 10% of the hero's health and mana and increases the orb's damage by 2.5.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+2 / +1\n+2 / +0\n\nИсчезновение теней восстанавливает герою по 2% здоровья и маны и повышает урон сферы теней на 0.5 ед. Прогресс бонуса к урону сферы можно отслеживать через команду \"-i\".\n\nУмение \"Теневой клон\" следует аналогичным условиям, но восстанавливает 10% здоровья и маны героя и повышает урон сферы на 2.5 ед."],"icon":"images/heroes/a_A0ON.png"},{"id":"A091","n":["邪祟暗影","Sinister Shadows","Зловещие тени"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+4 / +1\n+6 / +2\n+4 / +1\n\n當生命值與法力值皆高於 50% 時，召喚暗影會消耗英雄 1% 生命值與法力值，但會創造出擁有 +100% 造成傷害加成的邪祟暗影。每次召喚邪祟暗影都會使它們的傷害加成提升 1%，傷害加成的進度可透過指令「-i」查看。當生命值或法力值低於 50% 時，將只會召喚出普通的暗影。\n\n技能「暗影分身」遵循相同的條件，但會吸取英雄 5% 生命值與法力值，並使邪祟暗影的傷害加成提升 +5%。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+4 / +1\n+6 / +2\n+4 / +1\n\nWhile both health and mana are above 50%, summoning a shadow takes 1% of the hero's health and mana but creates a sinister shadow with a +100% bonus to the damage it deals. Each summon of a sinister shadow raises their damage bonus by 1%; the progress of the damage bonus can be tracked with the \"-i\" command. While health or mana is below 50%, ordinary shadows are summoned instead.\n\nThe \"Shadow Clone\" ability follows the same conditions, but absorbs 5% of the hero's health and mana and grants +5% to the damage bonus of sinister shadows.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+4 / +1\n+6 / +2\n+4 / +1\n\nПри запасе здоровья и маны выше 50% призыв тени отнимает у героя 1% здоровья и маны, но создаёт зловещую тень, имеющую бонус +100% к наносимому урону. Каждый призыв зловещей тени повышает их бонус к урону на 1%, прогресс бонуса к урону можно отслеживать через команду \"-i\". При запасе здоровья или маны ниже 50% будут призываться обычные тени.\n\nУмение \"Теневой клон\" следует аналогичным условиям, но поглощает 5% здоровья и маны героя и дарует +5% к бонусу урона зловещих теней."],"icon":"images/heroes/a_A091.png"}]},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0ZM","kind":"innate","n":["暗影庇護者","Patron of Shadows","Покровитель теней"],"k":"Z","lv":1,"t":["由英雄或暗影完成的擊殺，有機率創造出被殺敵人的暗影，為英雄而戰。\n\n啟動技能可在創造無敵暗影與可受傷暗影兩種模式之間切換。\n\n暗影出現機率：30%\n暗影存在時間：10 秒／7.5 秒\n暗影特性：無敵／75% 生命值上限","Kills made by the hero or by his shadows can create shadows of the slain enemies that fight on the hero's side.\n\nActivating the ability toggles between creating invulnerable and vulnerable shadows.\n\nShadow appearance chance: 30%\nShadow lifetime: 10 sec./7.5 sec.\nShadow characteristics: invulnerability/75% health pool","Убийства, совершенные героем или тенями, могут создавать тени убитых врагов, сражающихся на стороне героя.\n\nАктивация умения переключает режимы между созданием неуязвимых и уязвимых теней.\n\nШанс появления тени: 30%\nВремя существования тени: 10 сек./7.5 сек.\nХарактеристики тени: неуязвимость/75% запас здоровья"],"icon":"images/heroes/a_A0ZM.png"}],"tier":["T1","T1","Т1"],"late":["中","Medium","средний"],"d":["能把傷害集中在單一目標，並製造巫毒娃娃快速處理敵人。","Concentrates damage on single targets and creates voodoo dolls to delete enemies quickly.","Герой, способный концентрировать урон на единичных целях. Может создавать вуду-куклы для быстрого убийства врагов."]},{"id":"H00N","n":["神射手","Sharpshooter","Застрельщик"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[{"id":"H040","on":true,"n":["黑暗神射手","Dark Sharpshooter","Тёмный застрельщик"]},{"id":"Otch","on":true,"n":["鼠人","Ratling","Ратлинг"]},{"id":"H01I","on":true,"n":["復生陸戰隊員","Risen Marine","Восставший десантник"]}],"author":null,"icon":"images/heroes/h_H00N.png","proper":"Хеминг Эрнестуэй","st":{"str":14,"str_lv":1.5,"agi":21,"agi_lv":2.700000047683716,"int":16,"int_lv":2.0,"speed":320},"roles":[["刺客","Assassin","убийца"]],"sc":[["dburn"],["burn"]],"mod":[],"sp":[],"ab":[{"id":"A01A","kind":"hero","n":["給他們點顏色！","Give Them Hell!","Зададим им перцу!"],"k":"","lv":5,"t":["英雄每第 5 次攻擊會對敵人造成額外的魔法傷害。\n\n傷害：30 + （X4 狩獵點數）點","Every 5th attack of the hero deals additional magic damage to the enemy.\n\nDamage: 30 + (X4 hunt points)","Каждая 5-я атака героя наносит дополнительный магический урон противнику.\n\nУрон: 30 + (Х4 очки охоты) ед."],"icon":"images/heroes/a_A01A.png","lvt":[{"i":2,"v":["30","60","90","120","150"]}]},{"id":"A019","kind":"hero","n":["霰彈","Grapeshot","Картечь"],"k":"W","lv":5,"t":["英雄的攻擊開始波及主要目標附近的敵人（範圍 200）。主要目標同樣會受到本技能的傷害。\n\n傷害：10 + （X1.25 狩獵點數）點\n持續時間：16 秒\n\n冷卻：26 秒","The hero's attacks begin to hit enemies near the main target (area 200). The main target also takes damage from the ability.\n\nDamage: 10 + (X1.25 hunt points)\nDuration: 16 sec.\n\nCooldown: 26 sec.","Атаки героя начинают поражать противников рядом с основной целью (область 200). Основная цель также получает урон от умения.\n\nУрон: 10 + (Х1.25 очки охоты) ед.\nВремя действия: 16 сек.\n\nПерезарядка: 26 сек."],"icon":"images/heroes/a_A019.png","lvt":[{"i":2,"v":["10","20","30","40","50"]}]},{"id":"A018","kind":"hero","n":["加速","Acceleration","Разгон"],"k":"","lv":null,"t":["在靜止狀態下連續攻擊會造成額外傷害。若英雄開始移動，加成便會重置。\n\n每次跳動的加成成長：+10 點\n最大加成：100 + （X5 狩獵點數）點","Consecutive attacks made while standing still deal additional damage. The bonus is reset if the hero starts moving.\n\nBonus growth per tick: +10\nMaximum bonus: 100 + (X5 hunt points)","Последовательные атаки в неподвижном состоянии наносят дополнительный урон. Бонус сбрасывается если герой начинает движение.\n\nПрирост бонуса за такт: +10 ед.\nМаксимальный бонус: 100 + (Х5 очки охоты) ед."],"icon":"images/heroes/a_A018.png"},{"id":"A017","kind":"hero","n":["燃燒彈","Incendiary Shell","Зажигательный снаряд"],"k":"Q","lv":5,"t":["射出爆炸性彈藥，對範圍造成傷害，並以提高的機率點燃敵人。\n\n傷害：60 + （X5 狩獵點數）點\n點燃：125% 機率，100% 傷害\n\n冷卻：16 秒","Fires an explosive projectile that deals area damage and applies Burn to enemies with an increased chance.\n\nDamage: 60 + (X5 hunt points)\nBurn: 125% chance, 100% damage\n\nCooldown: 16 sec.","Выстреливает взрывным снарядом, наносящим урон по области и поджигающим врагов с завышенным шансом.\n\nУрон: 60 + (Х5 очки охоты) ед.\nПоджог: 125% шанс, 100% урона\n\nПерезарядка: 16 сек."],"icon":"images/heroes/a_A017.png","lvt":[{"i":2,"v":["60","90","120","150","180"]}]},{"id":"A0HR","kind":"innate","n":["怪物獵人","Monster Hunter","Охотник на монстров"],"k":"","lv":null,"t":["擊殺敵人可讓英雄獲得狩獵點數。每次獲得加成後，擊殺的需求都會提高。指令「-i」會顯示已累積的狩獵點數。\n\n擊殺獲得的狩獵經驗（部隊）：10 * （敵人等級）^1.5\n擊殺獲得的狩獵經驗（英雄）：25 * （英雄等級）^1.5\n獲得狩獵點數所需的狩獵經驗：25 (+75)\n\n每層加成：攻擊力 +1，狩獵點數 +1","The hero can gain hunt points for killing enemies. After each bonus gained, the kill requirements grow. The \"-i\" command displays the accumulated hunt points.\n\nHunt experience gained for kills (troops): 10 * (enemy level)^1.5\nHunt experience gained for kills (heroes): 25 * (hero level)^1.5\nHunt experience required to gain hunt points: 25 (+75)\n\nBonus per stack: +1 attack power, +1 hunt point","За убийства врагов герой может получить очки охоты. После каждого получения бонуса требования к убийствам растут. Команда \"-i\" отображает накопленные очки охоты.\n\nПолучение опыта охоты за убийства (войска): 10 * (уровень врага)^1.5\nПолучение опыта охоты за убийства (герои): 25 * (уровень героя )^1.5\nТребутся опыта охоты для получения очков охоты: 25 (+75)\n\nБонус за стак: +1 к силе атаки, +1 к очкам охоты"],"icon":"images/heroes/a_A0HR.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"},{"id":"A0HJ","kind":"innate","n":["選擇天賦","Choose a Talent","Выбрать талант"],"k":"D","lv":null,"t":["當玩家的經驗點數足夠時，你可以選擇一項天賦，將英雄大幅強化至新的強度等級。","With a sufficient amount of player experience points you can choose a talent that will significantly strengthen the hero to a new power rank.","При должном количестве очков опыта игрока вы можете выбрать талант, который значительно усилит героя до нового ранга силы."],"icon":"images/heroes/a_A0HJ.png","opts":[{"id":"A0HN","n":["狙擊手","Sniper","Снайпер"],"t":["強度等級：T2\n屬性加成／每級屬性成長加成：\n+1 / +0\n+1 / +1\n+1 / +0\n\n英雄的攻擊距離提升 200 點。\n\n技能「燃燒彈」(Q)（或其同類技能）的施放距離提升 300 點，作用範圍提升 50%。\n\n技能「加速」累積加成的速度加快 2 倍。","Power rank: T2\nAttribute bonus / attribute growth per level bonus:\n+1 / +0\n+1 / +1\n+1 / +0\n\nIncreases the hero's attack range by 200.\n\nIncreases the cast range of the \"Incendiary Shell\" (Q) ability (or its equivalents) by 300 and its area by 50%.\n\nThe \"Acceleration\" ability accumulates its bonus 2 times faster.","Ранг силы: Т2\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+1 / +0\n+1 / +1\n+1 / +0\n\nПовышает дальность атаки героя на 200 ед.\n\nПовышает дальность действия умения \"Зажигательный снаряд\" (Q) (или его аналогов) на 300 ед. и область поражения на 50%.\n\nУмение \"Разгон\" накапливает свой бонус в 2 раза быстрее."],"icon":"images/heroes/a_A0HN.png"},{"id":"A0J3","n":["霰彈槍","Shotgun","Дробовик"],"t":["強度等級：T3\n屬性加成／每級屬性成長加成：\n+12 / +3\n-5 / -0.7\n-1 / -0.5\n\n英雄的主屬性變更為「力量」。\n\n攻擊距離降低至 250 點，英雄的攻擊帶有永久的「霰彈」效果，其作用範圍縮減為 160 點、傷害為（50% 力量）點；「霰彈」技能本身在啟動時會將作用範圍提升至 240 點，並將自身的傷害數值加到基礎數值上。","Power rank: T3\nAttribute bonus / attribute growth per level bonus:\n+12 / +3\n-5 / -0.7\n-1 / -0.5\n\nThe hero's primary attribute becomes \"Strength\".\n\nAttack range is reduced to 250, and the hero's attacks carry a permanent \"Grapeshot\" effect with a reduced area of 160 and damage of (50% Strength); the \"Grapeshot\" ability itself, when activated, increases the area to 240 and adds its own damage value to the base value.","Ранг силы: Т3\nБонус к характеристикам/бонус к приросту характеристик за уровень:\n+12 / +3\n-5 / -0.7\n-1 / -0.5\n\nОсновная характеристика героя становится \"Сила\".\n\nДальность атаки уменьшается до 250 ед., атаки героя имеют постоянный эффект \"Картечи\" с уменьшенной областью в 160 ед. и уроном в (50% сила) ед., само умение \"Картечь\" при активации увеличивает область поражения до 240 ед. и добавляет свое значение урона к основному значению."],"icon":"images/heroes/a_A0J3.png"}]}],"tier":["T1","T1","Т1"],"late":["高","High","высокий"],"d":["高效的射手，擊殺高危目標可以額外累積自身威力。","An effective shooter that gains extra power from killing high-value targets.","Эффективный стрелок, способный дополнительно наращивать свою мощь за убийства особо опасных целей. Не наследует бонусы от параметра \"сила умений\"."]},{"id":"N00Z","n":["美杜莎","Medusa","Медуза"],"attr":"agi","unlock":0,"random":true,"builds":[],"skins":[{"id":"Etyr","on":true,"n":["海之獵手","Sea Hunter","Морской охотник"]}],"author":null,"icon":"images/heroes/h_N00Z.png","proper":"Агистродонна","st":{"str":1  непрерывный урон врагам вокруг, постепенно увеличивая область поражения. Снижает получаемый урон во время действия умения.\n\nУрон в секунду: 75 + (30% сила умений) + (300% пробитие) ед.\nВремя действия: 8 сек.\nОбласть поражения: 200 >>> 500\nЗащита от урона: +40%\n\nПерезарядка: 100 сек."],"icon":"images/heroes/a_A0GS.png"},{"id":"A0GR","kind":"hero","n":["戰鬥藝術","Art of Combat","Искусство боя"],"k":"","lv":5,"t":["以攻擊擊殺敵人可為英雄帶來暫時的敏捷，以英雄技能擊殺敵人則可提升技能強度。\n\n擊殺獲得的額外敏捷：+2 點\n敏捷加成持續時間：5 秒\n以技能擊殺提升的技能強度：+8 點\n技能強度加成持續時間：10 秒","Killing enemies with attacks grants the hero temporary Agility, and killing enemies with the hero's abilities increases spell power.\n\nBonus Agility per kill: +2\nAgility bonus duration: 5 sec.\nSpell power increase per kill with abilities: +8\nSpell power bonus duration: 10 sec.","Убийство врагов атаками дарует герою временную ловкость, а убийство врагов умениями героя повышает силу умений.\n\nБонусная ловкость за убийство: +2 ед.\nВремя бонуса к ловкости: 5 сек.\nУвеличение силы умений за убийство умениями: +8 ед.\nВремя бонуса к силе умений: 10 сек."],"icon":"images/heroes/a_A0GR.png","lvt":[{"i":2,"v":["2","3","4","5","6"]}]},{"id":"A0GP","kind":"hero","n":["切割","Lacerations","Разрезы"],"k":"Q","lv":5,"t":["英雄快速攻擊敵人並返回原本的位置。對同一名敵人的重複攻擊造成的傷害較低。\n\n每次攻擊傷害：40 + （20% 技能強度） + （400% 穿透）點\n目標數量：6 個\n\n冷卻：12 秒","The hero rapidly attacks enemies and returns to the starting position. Repeated strikes on the same enemy deal less damage.\n\nDamage per strike: 40 + (20% spell power) + (400% penetration)\nTargets: 6\n\nCooldown: 12 sec.","Герой быстро атакует противников и возвращается на исходную позицию. Повторные удары по тому же противнику наносят меньше урона.\n\nУрон за удар: 40 + (20% сила умений) + (400% пробитие) ед.\nКоличество целей: 6 ед.\n\nПерезарядка: 12 сек."],"icon":"images/heroes/a_A0GP.png","lvt":[{"i":2,"v":["40","60","80","100","120"]},{"i":3,"v":["6","7","8","9","10"]}]},{"id":"A0CW","kind":"innate","n":["選擇技能","Choose an Ability","Выбрать умение"],"k":"D","lv":null,"t":["在與敵人開戰之前，請務必選擇一項額外技能。","Be sure to choose an additional ability before you start fighting the enemy.","Обязательно выберите дополнительное умение, прежде чем начать борьбу с врагом."],"icon":"images/heroes/a_A0CW.png","opts":[{"id":"A0CV","n":["貪婪之刃","Insatiable Blade","Ненасытный клинок"],"t":["擊殺敵方英雄可使英雄等級提升 1 級。達到最高等級後，這類擊殺將改為提高 25 點技能強度。","Killing enemy heroes increases the hero's level by 1. Upon reaching maximum level, such kills increase spell power by 25 instead.","Убийства вражеских героев повышают уровень героя на 1. При достижении максимального уровня данные убийства будут повышать силу умений на 25 ед."],"icon":"images/heroes/a_A0CV.png"},{"id":"A0D0","n":["無情幻影","Relentless Phantom","Неумолимый фантом"],"t":["若「切割」在其作用期間擊殺敵人，或造成暴擊傷害（在「專注」啟動時），則攻擊次數提高 1 次。擊殺敵方英雄可使「穿透」提高 2.5 點。","\"Lacerations\" increases its number of strikes by 1 if it kills an enemy during its duration or deals critical damage (while \"Concentration\" is active). Killing enemy heroes increases \"penetration\" by 2.5.","Умение \"Разрезы\" повышает количество ударов на 1, если убивает противника во время своего действия или наносит критический урон (при активном умении \"Концентрация\"). Убийства вражеских героев повышают показатель \"пробитие\" на 2.5 ед."],"icon":"images/heroes/a_A0D0.png"},{"id":"A0DM","n":["師範","Sensei","Сенсей"],"t":["若擊殺敵人是在「專注」作用期間完成的，「戰鬥藝術」將給予英雄雙倍效果。擊殺敵方英雄可使「專注」的魔法傷害倍率提高 0.25。可透過指令「-i」查看累積進度。","\"Art of Combat\" grants the hero a doubled effect if the enemy kills were made while \"Concentration\" was active. Killing enemy heroes increases the magic damage multiplier of \"Concentration\" by 0.25. The accumulated progress can be checked with the \"-i\" command.","Умение \"Искусство боя\" дарует герою двойной эффект, если убийства врагов были совершены во время действия умения \"Концентрация\". Убийства вражеских героев повышают множитель магического урона умения \"Концентрация\" на 0.25. Прогресс накопления можно узнать через обычные войска): 3.6 сек.\nОглушение (герои): 1.2 сек.\nСила умений 250+: навсегда снижает защиту пораженных врагов на 3 ед.\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0JS.png","lvt":[{"i":2,"v":["70","110","150","190","230"]},{"i":4,"v":["3.6","4.0","4.4","4.8","5.2"]},{"i":5,"v":["1.2","1.4","1.6","1.8","2.0"]}]},{"id":"A0JU","kind":"hero","n":["群星隕落","Starfall","Звездопад"],"k":"R","lv":1,"t":["女祭司標記指定區域，區域內每次觸發時會有 3 名隨機敵人受到墜落之星的傷害。每顆星會使敵人受到「月光閃爍」技能的傷害提高 5%。\n\n星辰傷害：30 + （10% 技能強度） + （50% 敏捷）點\n觸發間隔：0.4 秒\n持續時間：16 秒\n\n冷卻：80 秒","The priestess marks the target area; each tick 3 random enemies inside it take damage from falling stars. Each star increases the damage the enemy takes from the \"Moon Glimmer\" ability by 5%.\n\nStar damage: 30 + (10% spell power) + (50% Agility)\nTick interval: 0.4 sec.\nDuration: 16 sec.\n\nCooldown: 80 sec.","Жрица отмечает указанную область, внутри которой каждый такт 3 случайных противника будут получать урон от падающих звезд. Каждая звезда повышает получаемый врагом урон от умения \"Лунный блик\" на 5%.\n\nУрон от звезд: 30 + (10% сила умений) + (50% ловкость) ед.\nПериодичность тактов: 0.4 сек.\nВремя действия: 16 сек.\n\nПерезарядка: 80 сек."],"icon":"images/heroes/a_A0JU.png"},{"id":"A0JQ","kind":"hero","n":["精準射擊光環","Aura of True Shot","Аура меткого выстрела"],"k":"W","lv":5,"t":["女祭司在 12 秒內提升自身的攻擊速度與移動速度，並散發一道光環（範圍 400），提高友方部隊的攻擊力。\n\n移動速度提升：10%\n攻擊速度提升：20%\n攻擊力提升（光環）：20%\n\n冷卻：26 秒","For 12 sec. the priestess increases her attack and movement speed, and also emits an aura (area 400) that increases the attack power of allied troops.\n\nMovement speed increase: 10%\nAttack speed increase: 20%\nAttack power increase (aura): 20%\n\nCooldown: 26 sec.","Жрица на 12 сек. ускоряет свою скорость атаки и бега, а также распространяет ауру (область 400), увеличивающую силу атаки союзных войск.\n\nУвеличение скорости передвижения: 10%\nУвеличение скорости атаки: 20%\nУвеличение силы атаки (аура): 20%\n\nПерезарядка: 26 сек."],"i н быть жив.\n\nУрон: 110 + (40% сила умений) ед./сек.\nВремя действия: 8 сек.\n\nПерезарядка: 70 сек."],"icon":"images/heroes/a_A0PB.png"},{"id":"A0PA","kind":"hero","n":["死亡臨在","Presence of Death","Присутствие смерти"],"k":"","lv":5,"t":["散發一道光環，降低英雄附近敵人的護甲。\n\n護甲降低：3 點\n作用範圍：200 點","Emits an aura that reduces the armour of enemies near the hero.\n\nArmour reduction: 3\nArea: 200","Распространяет ауру, снижающую защиту противников рядом с героем.\n\nСнижение защиты: 3 ед.\nОбласть действия: 200 ед."],"icon":"images/heroes/a_A0PA.png","lvt":[{"i":2,"v":["3","5","7","9","11"]}]},{"id":"A0P7","kind":"hero","n":["撕裂","Rupture","Разрыв"],"k":"Q","lv":5,"t":["擊中指定的敵人以及其附近的敵人，造成傷害並施加流血。\n\n主要傷害：30 + （15% 技能強度）點\n流血：125% 機率，400% 傷害\n\n冷卻：4 秒","Strikes the chosen enemy and enemies near it, dealing damage and applying Bleed.\n\nMain damage: 30 + (15% spell power)\nBleed: 125% chance, 400% damage\n\nCooldown: 4 sec.","Поражает указанного врага и противников рядом с ним, нанося урон и накладывая кровотечение.\n\nОсновной урон: 30 + (15% сила умений) ед.\nКровотечение: 125% шанс, 400% урона\n\nПерезарядка: 4 сек."],"icon":"images/heroes/a_A0P7.png","lvt":[{"i":2,"v":["30","45","60","75","90"]}]},{"id":"A0P9","kind":"innate","n":["永恆飢餓","Eternal Hunger","Вечный голод"],"k":"","lv":5,"t":["攻擊、技能與流血效果具有 10% 吸血。\n\n任務：擊殺 100 名敵人。完成任務後，吸血效果將提升至 15%。\n\n使用指令「-i」可追蹤進度。","Attacks, abilities and Bleed effects have 10% lifesteal.\n\nQuest: Kill 100 enemies. After completing the quest, the lifesteal effect is increased to 15%.\n\nUse the \"-i\" command to track progress.","Атаки, умения и эффекты кровотечения обладают 10% вампиризма.\n\nЗадание: Убейте 100 противников. После выполнения задания эффект вампиризма будет усилен до 15%.\n\nИспользуйте команду \"-i\" для отслеживания прогресса."],"icon":"images/heroes/a_A0P9.png"},{"id":"A0PE","kind":"innate","n":["無可避免的終局","Inevitable End","Неизбежный финал"],"k":"","lv":4,"t":["任務：擊殺一名敵方英雄。完成任務後，「撕裂」技能將無視流血抗性。","Quest: Kill an enemy hero. After completing the quest, the \"Rupture\" ability will ignore Bleed resistance.","Задание: Убейте вражеского героя. После выполнения задания умение \"Разрыв\" начнёт игнорировать сопротивление кровотечению."],"icon":"images/heroes/a_A0PE.png"},{"id":"A0P6","kind":"innate","n":["（吸血・死亡使者）","(Lifesteal, Herald of Death)","(вампиризм, вестник смерти)"],"k":"","lv":4,"t":["","",""],"icon":"images/heroes/a_A0P6.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"tier":["T2","T2","Т2"],"late":["中","Medium","средний"],"d":["近戰英雄，普攻、技能與流血效果都能吸血，並有多種減益。","A melee hero with lifesteal from attacks, abilities and bleed, plus several debuffs.","Герой ближнего боя, обладающий вампиризмом от атак, умений и эффектов кровотечения. Имеет ряд задач, выполняя которые герой может получить дополнительные усиления."]},{"id":"N05T","n":["狂徒","Cutthroat","Головорез"],"attr":"agi","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_N05T.png","proper":"Чейз","st":{"str":19,"str_lv":2.0,"agi":24,"agi_lv":3.0,"int":16,"int_lv":1.5,"speed":360},"roles":[["刺客","Assassin","убийца"]],"sc":[["sp","as","armor","thorn","vamp"],[]],"mod":[],"sp":["A0T5","A0T2","A0J2"],"ab":[{"id":"A0T5","kind":"hero","n":["致殘投擲","Maiming Throw","Увечащий бросок"],"k":"Q","lv":5,"t":["向指定的敵人投擲斧頭，造成傷害並降低目標的護甲、攻擊速度與移動速度。\n\n傷害：50 + （65% 技能強度）點\n護甲降低：2 點\n攻擊速度降低：15%\n移動速度降低：30%\n持續時間：25 秒（英雄 10 秒）\n\n冷卻：10 秒。","Throws an axe at the chosen enemy, dealing damage and reducing the target's armour, attack speed and movement speed.\n\nDamage: 50 + (65% spell power)\nArmour reduction: 2\nAttack speed reduction: 15%\nMovement speed reduction: 30%\nDuration: 25 sec. (heroes 10 sec.)\n\nCooldown: 10 sec.","Бросает топор в указанного противника, нанося урон и снижая защиту, скорость атаки и бега цели.\n\nУрон: 50 + (65% сила умений) ед.\nСнижение защиты: 2 ед.\nСнижение скорости атаки: 15%\nСнижение скорости передвижения: 30%\nВремя действия: 25 сек. (герои 10 сек.)\n\nПерезарядка: 10 сек."],"icon":"images/heroes/a_A0T5.png","lvt":[{"i":2,"v":["50","80","110","140","170"]},{"i":3,"v":["2","3","4","5","6"]},{"i":4,"v":["15","20","25","30","35"]},{"i":5,"v":["30","40","50","60","70"]}]},{"id":"A0T4","kind":"hero","n":["狩獵季","Hunting Season","Сезон охоты"],"k":"","lv":null,"t":["連續擊殺會為英雄帶來加成。加成會依序觸發，在最後一項加成之後計數會重置，擊殺累積從零重新開始。\n\n擊殺 6 名敵人：回復 8% 生命值\n擊殺 12 名敵人：攻擊力 +1 點\n擊殺 18 名敵人：敏捷 +1 點","A series of kills grants the hero bonuses. The bonuses trigger in order; after the last bonus the counter resets and kill accumulation starts from zero.\n\nKill 6 enemies: restores 8% health\nKill 12 enemies: +1 attack power\nKill 18 enemies: +1 Agility","Серия убийств дарует герою бонусы. Бонусы срабатывают последовательно, после последнего бонуса счетчик сбрасывается и накопление убийств начинается с нуля.\n\nУбить 6 противников: восстановление 8% здоровья\nУбить 12 противников: +1 ед. к силе атаки\nУбить 18 противников: +1 ед. к ловкости"],"icon":"images/heroes/a_A0T4.png"},{"id":"A0T2","kind":"hero","n":["侵略者","Aggressor","Агрессор"],"k":"W","lv":5,"t":["被動效果：\n\n英雄對近戰敵人造成反傷。\n\n反傷：12 + （5% 技能強度）點\n\n啟動時：\n\n提高此技能的反傷，並使攻擊獲得吸血效果。\n\n反傷提升：+60%\n吸血效果：26%\n持續時間：6 秒。\n\n冷卻：19 秒。","Passive effect:\n\nThe hero deals thorns damage to melee enemies.\n\nThorns: 12 + (5% spell power)\n\nOn activation:\n\nIncreases the thorns damage of the ability and grants lifesteal from attacks.\n\nThorns increase: +60%\nLifesteal: 26%\nDuration: 6 sec.\n\nCooldown: 19 sec.","Пассивный эффект:\n\nГерой наносит ответный урон врагам ближнего боя.\n\nОтветный урон: 12 + (5% сила умений) ед.\n\nПри активации:\n\nУвеличивает ответный урон от умения, а также получает эффект вампиримза от атак.\n\nУвеличение ответного урона: +60%\nЭффект вампиризма: 26%\nВремя действия: 6 сек.\n\nПерезарядка: 19 сек."],"icon":"images/heroes/a_A0T2.png","lvt":[{"i":4,"v":["12","18","24","30","36"]},{"i":10,"v":["60","90","120","150","180"]},{"i":11,"v":["26","32","38","44","50"]}]},{"id":"A0J2","kind":"hero","n":["失控之怒","Uncontrollable Rage","Неконтролируемая ярость"],"k":"","lv":5,"t":["英雄會週期性陷入狂怒，期間攻擊速度以及對非英雄敵人的傷害都會提升。狂怒期間，狂徒受到的傷害也會提高。\n\n攻擊速度加成：30%\n對非英雄的傷害加成：20%\n受到的傷害：15%\n持續時間：6 秒。\n\n冷卻：8 秒。","Periodically the hero falls into a fit of rage, during which his attack speed and his damage against non-hero enemies are increased. During these fits the damage taken by the Cutthroat is also increased.\n\nAttack speed bonus: 30%\nDamage bonus against non-heroes: 20%\nDamage taken: 15%\nDuration: 6 sec.\n\nCooldown: 8 sec.","Периодически герой впадает в приступы ярости, во время которых увеличивается скорость атаки и урон по врагам, не являющихся героями. Во время приступов увеличивается получаемый головорезом урон.\n\nБонус к скорости атаки: 30%\nБонус к урону не-героям: 20%\nПолучаемый урон: 15%\nДлительность: 6 сек.\n\nПерезарядка: 8 сек."],"icon":"images/heroes/a_A0J2.png","lvt":[{"i":2,"v":["30","40","50","60","70"]},{"i":3,"v":["20","30","40","50","60"]},{"i":4,"v":["15","20","25","30","35"]}]},{"id":"A0T1","kind":"innate","n":["捕獵者","Trapper","Ловчий"],"k":"D","lv":null,"t":["英雄以網捕捉敵人，使其無法移動。受「捕獵者」影響的敵人受到英雄的傷害提高。效果不可疊加。\n\n對被捕捉目標的額外傷害：+25%\n持續時間：9 秒\n持續時間（英雄）：4 秒\n\n冷卻：20 秒","The hero catches an enemy in a net, depriving it of the ability to move. Enemies affected by \"Trapper\" take more damage from the hero. The effect does not stack.\n\nBonus damage to the caught target: +25%\nDuration: 9 sec.\nDuration (heroes): 4 sec.\n\nCooldown: 20 sec.","Герой ловит противника в сеть, лишая его возможности передвигаться. Враги под действием \"Ловчего\" получают больше урона от героя. Эффект не суммируется.\n\nДополнительный урон по пойманной цели: +25%\nВремя действия: 9 сек.\nВремя действия (герои): 4 сек.\n\nПерезарядка: 20 сек."],"icon":"images/heroes/a_A0T1.png"},{"id":"A03V","kind":"innate","n":["轉移／移除據點","Transfer or Remove Point","Передать/удалить точку"],"k":"F","lv":1,"t":["選擇自己的據點或建築，將其轉移給其他玩家，或在不損失地基的情況下摧毀它。可從任意距離施放。","Select your own point or building to transfer it to another player or to destroy it without losing the foundation. Can be cast from any distance.","Выберите свою точку или строение, чтобы передать это другому игроку или уничтожить без потери фундамента. Можно применить с любого расстояния."],"icon":"images/heroes/a_A03V.png"}],"d":["著魔的刺客，攻擊與移動速度都很高，能累積力量。","An obsessed assassin with high attack and movement speed who builds up power.","Одержимый убийца, обладающий высокой скоростью атаки и передвижения. Способен накапливать силу атаки и ловкость. Не имеет геройской защиты."]},{"id":"H024","n":["盜賊","Rogue","Разбойник"],"attr":"agi","unlock":50000,"random":true,"builds":[],"skins":[],"author":null,"icon":"images/heroes/h_H024.png","proper":"Соловей","st":{"str":11,"str_lv":1.2999999523162842,"agi":26,"agi_lv":3.5,"int":15,"int_lv":1.5,"speed":350},"roles":[["斂財","Earner","добытчик"],["詛咒者","Curser","проклинатель"],["刺客","Assassin","убийца"]],"sc":[["sp","armor"],[]],"mod":[],"sp":["A0DV"],"ab":[{"id":"A08G","kind":"hero","n":["戰利品箱","Lootbox","Lootbox"],"k":"R","lv":1,"t":["盜賊打開一個裝著未知驚喜的小盒子。\n\n可以獲得的道具：\n- 「特殊（lv.4）」(40%)\n- 「儀式」(25%)\n- 隨機節慶類別的道具 (15%)\n- 「扭曲」(10%)\n- 「特殊（lv.5）」(10%)\n\n戰利品箱價格：750 金幣\n\n冷卻：120 秒。","The rogue opens a small box with an unknown surprise.\n\nYou can obtain items:\n- \"Special (lvl 4)\" (40%)\n- \"Ritual\" (25%)\n- An item of a random holiday category (15%)\n- \"Distorted\" (10%)\n- \"Special (lvl 5)\" (10%)\n\nLootbox cost: 750 gold\n\nCooldown: 120 sec.","Разбойник открывает коробочку с неизвестным сюрпризом.\n\nМожно получить предметы:\n- \"Особый 4 ур.\" (40%)\n- \"Ритуальный\" (25%)\n- Предмет случайной праздничной категории (15%)\n- \"Искаженный\" (10%)\n- \"Особый 5 ур.\" (10%)\n\nСтоимость лутбокса: 750 золота\n\nПерезарядка: 120 сек."],"icon":"images/heroes/a_A08G.png"},{"id":"A0DV","kind":"hero","n":["卑劣一擊","Dirty Strike","Подлый удар"],"k":"Q","lv":5,"t":["以近戰方式對敵人造成傷害。敵人每有 1% 生命值，此技能的傷害就提高 2%。敵人每缺少 1% 生命值，盜賊就有 1% 機率獲得金幣。\n\n傷害：60 + （30% 技能強度）點\n成功打擊時奪得的金幣：10 + （5% 技能強度）點\n\n冷卻：9 秒。","Deals damage to an enemy in melee. For each 1% of the enemy's health, the ability's damage grows by 2%. For each 1% of the enemy's missing health, the Rogue has a 1% chance to gain gold.\n\nDamage: 60 + (30% spell power)\nGold gained on a successful strike: 10 + (5% spell power)\n\nCooldown: 9 sec.","Наносит урон врагу в ближнем бою. За каждый 1% здоровья противника урон умения растет на 2%. За каждый отсутствующий 1% здоровья врага разбойник имеет 1% шанс получить золото.\n\nУрон: 60 + (30% сила умений) ед.\nДобыча золота при успешном ударе: 10 + (5% сила умений) ед.\n\nПерезарядка: 9 сек."],"icon":"images/heroes/a_A0DV.png","lvt":[{"i":2,"v":["60","90","120","150","180"]},{"i":3,"v":["10","15","20","25","30"]}]},{"id":"A0DU","kind":"hero","n":["酸液炸彈","Acid Bomb","Кислотная бомба"],"k":"W","lv":5,"t":["向敵人投擲酸液炸彈，對範圍內的敵人造成傷害並降低其護甲。造成持續傷害。持續時間 - 15 秒（英雄 7 秒）\n\n持續傷害：12 點/秒\n護甲降低：3 (+1) 點\n\n冷卻：15 秒","Throws an acid bomb at an enemy, striking enemies in an area and reducing their armour. Deals periodic damage. Duration - 15 sec. (heroes 7 sec.)\n\nPeriodic damage: 12 per sec.\nArmour reduction: 3 (+1)\n\nCooldown: 15 sec.","Бросает кислотную бомбу в противника, поражая врагов по области и снижая их защиту. Наносит периодический урон. Время действия - 15 сек. (герои 7 сек.)\n\nПериодический урон: 12 ед./сек.\nСнижение защиты: 3 (+1) ед.\n\nПерезарядка: 15 сек."],"icon":"images/heroes/a_A0DU.png","lvt":[{"i":2,"v":["12","18","24","30","36"]}]},{"id":"A0DR","kind":"hero","n":["強化護盾","Reinforced Shield","Укрепленный щит"],"k":"",
